name: DABBIR Protected Live Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'vercel.json'
      - 'vercel-ignore-if-unaffected.sh'
      - 'scripts/vercel-build-gate.mjs'
      - 'api/**'
      - 'index.html'
      - 'team.html'
      - 'supabase/migrations/*dabbir*'
      - 'db/dabbir*.sql'
      - 'test/dabbir-protected-live-smoke.mjs'
      - 'test/dabbir-protected-live-smoke-oidc.test.mjs'
      - '.github/workflows/dabbir-protected-live-smoke.yml'

permissions:
  contents: read
  id-token: write

jobs:
  protected-live-smoke:
    name: Protected production iPhone smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PROTECTED_QA_ORIGIN: https://dabbir-nd56cm4j5v-3619s-projects.vercel.app
      EXPECTED_PRODUCTION_SHA: ${{ github.sha }}
      PROTECTED_QA_RELEASE_WAIT_MS: '240000'
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: prj_HCTFdQo8Vc7FvZRdJ37H7KFYwpUq
      VERCEL_TEAM_ID: team_pwfKq8jHuyW1XFVSZirAJiId
      PROTECTED_QA_REPORT_PATH: dabbir-protected-live-smoke-report.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Prepare protected automation access
        id: bypass
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'generated=false' >> "$GITHUB_OUTPUT"
            echo 'method=automation_bypass' >> "$GITHUB_OUTPUT"
            echo 'AUTOMATION_BYPASS_READY_FROM_EXISTING_SECRET'
            exit 0
          fi

          if [ -n "${VERCEL_TOKEN:-}" ]; then
            endpoint="https://api.vercel.com/v1/projects/${VERCEL_PROJECT_ID}/protection-bypass?teamId=${VERCEL_TEAM_ID}"
            project_endpoint="https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_TEAM_ID}"

            project_json="$(curl --fail-with-body --silent --show-error \
              "$project_endpoint" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}")"
            mapfile -t stale_secrets < <(printf '%s' "$project_json" | jq -r '.protectionBypass // {} | to_entries[] | select(.value.scope == "automation-bypass" and (.value.isEnvVar // false) == false and .value.note == "DABBIR protected live smoke temporary") | .key')
            cleaned=0
            for old_secret in "${stale_secrets[@]:-}"; do
              [[ "$old_secret" =~ ^[A-Za-z0-9]{32}$ ]] || continue
              echo "::add-mask::$old_secret"
              revoke_payload="$(jq -nc --arg secret "$old_secret" '{revoke:{secret:$secret,regenerate:false}}')"
              if curl --fail-with-body --silent --show-error \
                -X PATCH "$endpoint" \
                -H "Authorization: Bearer ${VERCEL_TOKEN}" \
                -H 'Content-Type: application/json' \
                --data "$revoke_payload" \
                >/dev/null; then
                cleaned=$((cleaned + 1))
              fi
            done
            echo "STALE_AUTOMATION_BYPASSES_CLEANED=$cleaned"

            response="$(curl --fail-with-body --silent --show-error \
              -X PATCH "$endpoint" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data '{"generate":{"note":"DABBIR protected live smoke temporary"}}')"
            secret="$(printf '%s' "$response" | jq -r '.protectionBypass | to_entries | map(select(.value.scope == "automation-bypass" and .value.note == "DABBIR protected live smoke temporary")) | sort_by(.value.createdAt // 0) | last | .key // empty')"
            if [[ ! "$secret" =~ ^[A-Za-z0-9]{32}$ ]]; then
              echo 'ready=false' >> "$GITHUB_OUTPUT"
              echo 'generated=false' >> "$GITHUB_OUTPUT"
              echo 'method=none' >> "$GITHUB_OUTPUT"
              echo 'BLOCKED_VERCEL_BYPASS_GENERATION_FAILED'
              exit 2
            fi
            echo "::add-mask::$secret"
            echo "VERCEL_AUTOMATION_BYPASS_SECRET=$secret" >> "$GITHUB_ENV"
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'generated=true' >> "$GITHUB_OUTPUT"
            echo 'method=automation_bypass' >> "$GITHUB_OUTPUT"
            echo 'AUTOMATION_BYPASS_TEMPORARILY_GENERATED'
            exit 0
          fi

          oidc_response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}")"
          oidc_token="$(printf '%s' "$oidc_response" | jq -r '.value // empty')"
          if [ -n "$oidc_token" ]; then
            echo "::add-mask::$oidc_token"
            probe_body="$(mktemp)"
            probe_status="$(curl --silent --show-error --output "$probe_body" --write-out '%{http_code}' \
              -H "x-vercel-trusted-oidc-idp-token: ${oidc_token}" \
              -H 'accept: text/html' \
              "$PROTECTED_QA_ORIGIN/")"
            if [ "$probe_status" = '200' ] && grep -qi 'DABBIR' "$probe_body"; then
              echo "VERCEL_TRUSTED_OIDC_TOKEN=$oidc_token" >> "$GITHUB_ENV"
              echo 'ready=true' >> "$GITHUB_OUTPUT"
              echo 'generated=false' >> "$GITHUB_OUTPUT"
              echo 'method=trusted_oidc' >> "$GITHUB_OUTPUT"
              echo 'TRUSTED_GITHUB_OIDC_READY'
              exit 0
            fi
            echo "TRUSTED_GITHUB_OIDC_REJECTED_HTTP_${probe_status}"
          fi

          echo 'ready=false' >> "$GITHUB_OUTPUT"
          echo 'generated=false' >> "$GITHUB_OUTPUT"
          echo 'method=none' >> "$GITHUB_OUTPUT"
          echo 'BLOCKED_VERCEL_AUTOMATION_ACCESS_NOT_CONFIGURED'
          echo '## DABBIR Protected Live Smoke' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '**State:** BLOCKED_VERCEL_AUTOMATION_ACCESS_NOT_CONFIGURED' >> "$GITHUB_STEP_SUMMARY"
          echo 'No existing bypass, Vercel API token, or accepted GitHub Trusted OIDC source is available. Production remains protected and the browser journey did not run.' >> "$GITHUB_STEP_SUMMARY"
          exit 2
      - name: Install WebKit journey runner
        if: steps.bypass.outputs.ready == 'true'
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps webkit
      - name: Run protected production smoke
        if: steps.bypass.outputs.ready == 'true'
        run: node test/dabbir-protected-live-smoke.mjs
      - name: Publish protected smoke summary
        if: ${{ always() && steps.bypass.outputs.ready == 'true' }}
        shell: bash
        run: |
          if [ -f dabbir-protected-live-smoke-report.json ]; then
            echo '## DABBIR Protected Live Smoke' >> "$GITHUB_STEP_SUMMARY"
            echo "**Expected SHA:** $EXPECTED_PRODUCTION_SHA" >> "$GITHUB_STEP_SUMMARY"
            echo "**Access method:** ${{ steps.bypass.outputs.method }}" >> "$GITHUB_STEP_SUMMARY"
            echo "**Verdict:** $(jq -r '.verdict' dabbir-protected-live-smoke-report.json)" >> "$GITHUB_STEP_SUMMARY"
            echo "**Verified production SHA:** $(jq -r '.verified_production_sha // "UNVERIFIED"' dabbir-protected-live-smoke-report.json)" >> "$GITHUB_STEP_SUMMARY"
            echo "**Verified deployment ID:** $(jq -r '.verified_deployment_id // "UNAVAILABLE"' dabbir-protected-live-smoke-report.json)" >> "$GITHUB_STEP_SUMMARY"
            echo '| Step | Status | Duration ms | Detail |' >> "$GITHUB_STEP_SUMMARY"
            echo '|---|---:|---:|---|' >> "$GITHUB_STEP_SUMMARY"
            jq -r '.steps[] | "| \(.name) | \(.status) | \(.duration_ms // 0) | \((.detail // "") | gsub("\\|"; "\\|")) |"' dabbir-protected-live-smoke-report.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload protected smoke evidence
        if: ${{ always() && steps.bypass.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: dabbir-protected-live-smoke-evidence
          path: |
            dabbir-protected-live-smoke-report.json
            dabbir-protected-live-smoke.png
          if-no-files-found: warn
          retention-days: 7
      - name: Revoke temporary automation bypass
        if: ${{ always() && steps.bypass.outputs.generated == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.vercel.com/v1/projects/${VERCEL_PROJECT_ID}/protection-bypass?teamId=${VERCEL_TEAM_ID}"
          payload="$(jq -nc --arg secret "$VERCEL_AUTOMATION_BYPASS_SECRET" '{revoke:{secret:$secret,regenerate:false}}')"
          curl --fail-with-body --silent --show-error \
            -X PATCH "$endpoint" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            >/dev/null
          echo 'AUTOMATION_BYPASS_REVOKED'
