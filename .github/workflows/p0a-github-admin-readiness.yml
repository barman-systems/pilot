name: DABBIR P0-A GitHub Admin Readiness

on:
  push:
    branches:
      - audit/p0a-agent-runtime-hardening-v1
    paths:
      - .github/workflows/p0a-github-admin-readiness.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  AUDIT_BRANCH: audit/p0a-agent-runtime-hardening-v1
  EVIDENCE_ROOT: evidence/p0a/1796df7fa7eab418157ecc7531313f0af0e73ebf/pilot

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_ADMIN_TOKEN: ${{ secrets.DABBIR_GITHUB_ADMIN_TOKEN }}
    steps:
      - name: Inspect GitHub admin security controls without mutation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          if [ -z "${GH_ADMIN_TOKEN:-}" ]; then
            jq -n '{state:"BLOCKED_EXTERNAL",admin_token_present:false,mutation_performed:false}' > "$RUNNER_TEMP/evidence/github-admin-readiness.json"
            exit 0
          fi
          echo "::add-mask::$GH_ADMIN_TOKEN"

          call() {
            local name="$1" url="$2"
            local raw="$RUNNER_TEMP/${name}.raw.json"
            local http
            http="$(curl -sS -o "$raw" -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_ADMIN_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' "$url")"
            echo "$http" > "$RUNNER_TEMP/${name}.status"
          }

          call oidc "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/oidc/customization/sub"
          call production "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments/Production"
          call protection "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/main/protection"

          ROOT="$RUNNER_TEMP" OUT="$RUNNER_TEMP/evidence" python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['ROOT']); out=pathlib.Path(os.environ['OUT'])
          def load(name):
              status=int((root/f'{name}.status').read_text())
              try: body=json.loads((root/f'{name}.raw.json').read_text())
              except Exception: body={}
              return status,body
          oidc_s,oidc=load('oidc'); env_s,env=load('production'); prot_s,prot=load('protection')
          def err(body):
              if not isinstance(body,dict): return None
              return body.get('message') or (body.get('error') or {}).get('message') if isinstance(body.get('error'),dict) else body.get('message')
          oidc_safe={'http_status':oidc_s,'state':'PASS' if oidc_s==200 else 'BLOCKED_EXTERNAL','use_default':oidc.get('use_default') if oidc_s==200 else None,'include_claim_keys':oidc.get('include_claim_keys') if oidc_s==200 else None,'use_immutable_subject':oidc.get('use_immutable_subject') if oidc_s==200 else None,'error':None if oidc_s==200 else err(oidc)}
          env_safe={'http_status':env_s,'state':'PASS' if env_s==200 else 'BLOCKED_EXTERNAL','name':env.get('name') if env_s==200 else 'Production','protection_rules':env.get('protection_rules') if env_s==200 else None,'deployment_branch_policy':env.get('deployment_branch_policy') if env_s==200 else None,'error':None if env_s==200 else err(env)}
          prot_safe={'http_status':prot_s,'state':'PASS' if prot_s==200 else 'BLOCKED_EXTERNAL','required_status_checks':(prot.get('required_status_checks') or {}).get('contexts') if prot_s==200 else None,'enforce_admins':(prot.get('enforce_admins') or {}).get('enabled') if prot_s==200 else None,'required_linear_history':(prot.get('required_linear_history') or {}).get('enabled') if prot_s==200 else None,'error':None if prot_s==200 else err(prot)}
          (out/'github-oidc-customization.json').write_text(json.dumps(oidc_safe,indent=2,sort_keys=True)+'\n')
          (out/'github-production-environment-admin.json').write_text(json.dumps(env_safe,indent=2,sort_keys=True)+'\n')
          (out/'github-main-protection-admin.json').write_text(json.dumps(prot_safe,indent=2,sort_keys=True)+'\n')
          overall='PASS' if all(x['state']=='PASS' for x in (oidc_safe,env_safe,prot_safe)) else 'BLOCKED_EXTERNAL'
          (out/'github-admin-readiness.json').write_text(json.dumps({'state':overall,'admin_token_present':True,'oidc_read':oidc_safe['state'],'environment_read':env_safe['state'],'branch_protection_read':prot_safe['state'],'mutation_performed':False},indent=2,sort_keys=True)+'\n')
          PY
          rm -f "$RUNNER_TEMP/"*.raw.json "$RUNNER_TEMP/"*.status

      - name: Upload admin readiness evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pilot-p0a-github-admin-readiness
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 30

  persist:
    needs: inspect
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.AUDIT_BRANCH }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pilot-p0a-github-admin-readiness
          path: ${{ runner.temp }}/evidence
      - name: Persist sanitized readiness evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT"
          cp -f "$RUNNER_TEMP/evidence/"*.json "$EVIDENCE_ROOT/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$EVIDENCE_ROOT"
          if ! git diff --cached --quiet; then
            git commit -m 'evidence(p0a): record GitHub admin security readiness [skip ci]'
            git push origin "HEAD:$AUDIT_BRANCH"
          fi
