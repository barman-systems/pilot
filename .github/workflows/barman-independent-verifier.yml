name: BARMAN Independent Verifier

on:
  workflow_dispatch:

# Frozen from push/schedule automation by owner directive on 2026-09-15.
permissions:
  contents: read
  actions: read
  pull-requests: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Run manual independent verifier
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/barman-independent-verifier.mjs
