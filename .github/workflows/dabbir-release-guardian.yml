name: DABBIR Release Guardian

on:
  workflow_run:
    workflows:
      - DABBIR CI
      - DABBIR Mobile CI
      - DABBIR Protected Live Smoke
      - DABBIR AI Full Customer Journey
      - DABBIR Auth Production Guard
      - DABBIR Main Lineage Guard
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: dabbir-release-guardian-main
  cancel-in-progress: false

jobs:
  revert-failed-main:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      contains(fromJSON('["failure","timed_out","cancelled","action_required","startup_failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
      FAILED_WORKFLOW: ${{ github.event.workflow_run.name }}
      FAILED_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 20

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Prove this is a new regression against a green baseline
        id: baseline
        run: node scripts/dabbir-release-guardian-baseline.mjs

      - name: Stop destructive rollback for a pre-existing or unproven failure
        if: steps.baseline.outputs.eligible != 'true'
        run: |
          echo "BASELINE_FAILURE_SKIP_ROLLBACK: ${{ steps.baseline.outputs.reason }}"
          echo "Previous distinct run: ${{ steps.baseline.outputs.baseline_run_id }} / ${{ steps.baseline.outputs.baseline_conclusion }}"

      - name: Fail closed with a governed revert PR if the failing head is still current
        if: steps.baseline.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          current_sha="$(git rev-parse origin/main)"
          if [ "$current_sha" != "$FAILED_SHA" ]; then
            echo "Guardian observed $FAILED_SHA failure, but main is already $current_sha; no stale rollback attempted."
            exit 0
          fi

          subject="$(git show -s --format=%s "$FAILED_SHA")"
          if [[ "$subject" == revert\(guardian\):* ]]; then
            echo "Guardian revert itself failed validation; refusing an automatic re-revert loop."
            exit 1
          fi

          short_sha="${FAILED_SHA:0:12}"
          branch="guardian/revert-${short_sha}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Governed revert branch $branch already exists; duplicate rollback suppressed."
            exit 0
          fi

          git config user.name 'dabbir-release-guardian'
          git config user.email 'dabbir-release-guardian@users.noreply.github.com'
          git switch -c "$branch"

          parent_count="$(git rev-list --parents -n 1 "$FAILED_SHA" | awk '{print NF-1}')"
          if [ "$parent_count" -gt 1 ]; then
            git revert -m 1 --no-edit "$FAILED_SHA"
          else
            git revert --no-edit "$FAILED_SHA"
          fi

          git commit --amend -m "revert(guardian): ${FAILED_WORKFLOW} ${FAILED_CONCLUSION} on ${FAILED_SHA}"
          git push origin HEAD:"$branch"

          body=$(cat <<EOF
          DABBIR Release Guardian detected a NEW regression after a green baseline and prepared a governed rollback candidate.

          Failed workflow: ${FAILED_WORKFLOW}
          Failed conclusion: ${FAILED_CONCLUSION}
          Failed SHA: ${FAILED_SHA}
          Green baseline run: ${{ steps.baseline.outputs.baseline_run_id }}
          Green baseline SHA: ${{ steps.baseline.outputs.baseline_sha }}
          Rollback branch: ${branch}

          Safety contract:
          - rollback requires a previously green distinct baseline
          - direct main push: forbidden
          - branch protection: preserved
          - required checks: must pass
          - rollback merge: only through pull request
          - re-revert loop: blocked
          EOF
          )

          pr_url=$(gh pr create \
            --base main \
            --head "$branch" \
            --title "revert(guardian): ${FAILED_WORKFLOW} regression on ${short_sha}" \
            --body "$body")
          echo "Governed rollback PR created: $pr_url"

          # Enable auto-merge only if repository policy supports it. This never bypasses
          # required reviews/checks; otherwise the PR remains open and fail-closed.
          gh pr merge "$pr_url" --auto --squash || echo "Auto-merge unavailable; rollback PR remains governed and open."
