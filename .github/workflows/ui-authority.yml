name: DABBIR UI Authority
on:
  pull_request:
    paths:
      - 'design/**'
      - 'public/dabbir-*.css'
      - 'public/dabbir-ui-*.js'
      - 'api/*ui.js'
      - 'api/app*.js'
      - 'api/public-car-wash.js'
      - 'index.html'
      - 'booking.html'
      - 'team.html'
      - 'mobile/**'
      - 'config/ui-design-debt.json'
      - 'config/ui-authority-registry.json'
      - 'scripts/check-ui-authority.mjs'
      - 'scripts/*design*.mjs'
      - 'test/ui-authority*.mjs'
      - 'test/booking-location-behavior.test.mjs'
      - '.github/workflows/ui-authority.yml'
permissions:
  contents: read
jobs:
  ui-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: node scripts/check-ui-design-drift.mjs
      - run: node --test test/ui-authority-consolidation.test.mjs test/ui-authority-v2.test.mjs test/booking-location-behavior.test.mjs test/i18n-contract.test.mjs
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Compare real served CSS and verify booking and sender identities
        env:
          UI_AUTHORITY_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node test/ui-authority-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-authority-${{ github.event.pull_request.head.sha }}
          path: ui-authority-evidence/
          retention-days: 14
