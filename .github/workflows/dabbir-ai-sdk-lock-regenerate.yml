name: Temporary DABBIR AI SDK Lock Regeneration

on:
  push:
    branches:
      - fix/ai-sdk-v6-direct-provider-compat-20260907

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Regenerate lockfile for AI SDK v6-compatible adapter
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean locked install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile and remove temporary workflow
        shell: bash
        run: |
          git config user.name "dabbir-lockfile-bot"
          git config user.email "dabbir-lockfile-bot@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/dabbir-ai-sdk-lock-regenerate.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(ai): regenerate compatible AI SDK v6 lockfile"
          git push origin HEAD:fix/ai-sdk-v6-direct-provider-compat-20260907
