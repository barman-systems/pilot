name: DABBIR AWS UAE Foundation Bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dabbir-aws-uae-foundation-bootstrap.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: dabbir-aws-uae-foundation-bootstrap
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      AWS_REGION: me-central-1
      ROLE_ARN: arn:aws:iam::388699644093:role/DabbirGithubDeployRole
      ROLE_NAME: DabbirGithubDeployRole
      STACK_NAME: dabbir-managed-foundation
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: dabbir-foundation-${{ github.run_id }}

      - name: Complete bootstrap read permissions
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/dabbir-bootstrap-read-policy.json <<'JSON'
          {
            "Version":"2012-10-17",
            "Statement":[{
              "Effect":"Allow",
              "Action":[
                "rds:Describe*",
                "cloudformation:Describe*",
                "cloudformation:Get*",
                "cloudformation:List*",
                "ec2:Describe*",
                "ecs:Describe*",
                "ecs:List*",
                "ecr:Describe*",
                "ecr:Get*",
                "logs:Describe*",
                "secretsmanager:DescribeSecret",
                "secretsmanager:ListSecrets",
                "iam:Get*",
                "iam:List*",
                "elasticloadbalancing:Describe*",
                "application-autoscaling:Describe*",
                "s3:Get*",
                "s3:List*"
              ],
              "Resource":"*"
            }]
          }
          JSON
          aws iam put-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name DabbirBootstrapReadAccess \
            --policy-document file:///tmp/dabbir-bootstrap-read-policy.json

      - name: Verify identity and select AWS UAE PostgreSQL engine
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          aws ec2 describe-availability-zones --region "$AWS_REGION" --query 'AvailabilityZones[?State==`available`].ZoneName' --output json
          versions="$(aws rds describe-db-engine-versions \
            --region "$AWS_REGION" \
            --engine postgres \
            --query 'DBEngineVersions[].EngineVersion' \
            --output text)"
          latest="$(printf '%s\n' $versions | tr '\t' '\n' | awk '/^17\./' | sort -V | tail -1)"
          test -n "$latest"
          echo "Selected PostgreSQL engine: $latest"
          echo "DB_ENGINE_VERSION=$latest" >> "$GITHUB_ENV"

      - name: Validate CloudFormation template
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation validate-template --region "$AWS_REGION" --template-body file://infra/aws-uae/dabbir-managed-foundation.yml >/tmp/template.json
          jq -e '.Parameters' /tmp/template.json >/dev/null

      - name: Recover safely from an earlier rolled-back bootstrap
        shell: bash
        run: |
          set -euo pipefail
          status="$(aws cloudformation describe-stacks --region "$AWS_REGION" --stack-name "$STACK_NAME" --query 'Stacks[0].StackStatus' --output text 2>/dev/null || true)"
          if [ "$status" != 'ROLLBACK_COMPLETE' ]; then
            echo "No rollback cleanup required (status=${status:-absent})."
            exit 0
          fi

          echo 'Cleaning retained empty bootstrap resources from the failed stack.'
          mapfile -t repos < <(aws cloudformation list-stack-resources --region "$AWS_REGION" --stack-name "$STACK_NAME" --query 'StackResourceSummaries[?ResourceType==`AWS::ECR::Repository`].PhysicalResourceId' --output text | tr '\t' '\n' | sed '/^None$/d;/^$/d')
          for repo in "${repos[@]}"; do
            aws ecr delete-repository --region "$AWS_REGION" --repository-name "$repo" --force >/dev/null 2>&1 || true
          done

          mapfile -t log_groups < <(aws cloudformation list-stack-resources --region "$AWS_REGION" --stack-name "$STACK_NAME" --query 'StackResourceSummaries[?ResourceType==`AWS::Logs::LogGroup`].PhysicalResourceId' --output text | tr '\t' '\n' | sed '/^None$/d;/^$/d')
          for group in "${log_groups[@]}"; do
            aws logs delete-log-group --region "$AWS_REGION" --log-group-name "$group" >/dev/null 2>&1 || true
          done

          mapfile -t buckets < <(aws cloudformation list-stack-resources --region "$AWS_REGION" --stack-name "$STACK_NAME" --query 'StackResourceSummaries[?ResourceType==`AWS::S3::Bucket`].PhysicalResourceId' --output text | tr '\t' '\n' | sed '/^None$/d;/^$/d')
          for bucket in "${buckets[@]}"; do
            aws s3 rm "s3://$bucket" --recursive >/dev/null 2>&1 || true
            aws s3api delete-bucket --region "$AWS_REGION" --bucket "$bucket" >/dev/null 2>&1 || true
          done

          aws cloudformation delete-stack --region "$AWS_REGION" --stack-name "$STACK_NAME"
          aws cloudformation wait stack-delete-complete --region "$AWS_REGION" --stack-name "$STACK_NAME"
          echo 'Rollback stack removed. Waiting to avoid a repeat ECS control-plane throttle.'
          sleep 35

      - name: Deploy managed foundation
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --region "$AWS_REGION" \
            --stack-name "$STACK_NAME" \
            --template-file infra/aws-uae/dabbir-managed-foundation.yml \
            --parameter-overrides \
              EnvironmentName=dabbir-prod \
              DatabaseInstanceClass=db.t4g.small \
              DatabaseEngineVersion="$DB_ENGINE_VERSION" \
              MultiAZ=false \
            --no-fail-on-empty-changeset \
            --tags App=DABBIR Environment=production ManagedBy=GitHubOIDC Region=me-central-1

      - name: Capture deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].{Status:StackStatus,Outputs:Outputs}' \
            --output json | tee /tmp/dabbir-foundation-evidence.json
          jq -e '.Status == "CREATE_COMPLETE" or .Status == "UPDATE_COMPLETE"' /tmp/dabbir-foundation-evidence.json >/dev/null
