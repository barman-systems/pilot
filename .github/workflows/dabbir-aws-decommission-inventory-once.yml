name: DABBIR AWS Decommission Inventory Once

on:
  pull_request:
    paths:
      - '.github/workflows/dabbir-aws-decommission-inventory-once.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/dabbir-aws-decommission-inventory-once.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: dabbir-aws-decommission-inventory-once
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prove inventory workflow is non-destructive on PR
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'pull_request' || exit 0
          file='.github/workflows/dabbir-aws-decommission-inventory-once.yml'
          ! grep -Eq 'aws[[:space:]]+(cloudformation[[:space:]]+delete-stack|rds[[:space:]]+delete-|s3(api)?[[:space:]].*delete-|secretsmanager[[:space:]]+delete-secret|backup[[:space:]]+delete-|ecr[[:space:]]+delete-|logs[[:space:]]+delete-|iam[[:space:]]+delete-)' "$file"

  inventory:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    env:
      AWS_REGION: me-central-1
      EXPECTED_ACCOUNT: '388699644093'
      ROLE_ARN: arn:aws:iam::388699644093:role/DabbirGithubDeployRole
      ROLE_NAME: DabbirGithubDeployRole
      EVIDENCE_DIR: dabbir-aws-decommission-inventory
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Assert exact main execution context
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Configure AWS credentials using existing DABBIR OIDC authority
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: dabbir-decommission-inventory-${{ github.run_id }}

      - name: Capture value-free live inventory and deletion-authority matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR" /tmp/dabbir-aws-inventory
          chmod 700 /tmp/dabbir-aws-inventory

          account="$(aws sts get-caller-identity --query Account --output text)"
          test "$account" = "$EXPECTED_ACCOUNT"
          aws sts get-caller-identity --query '{Account:Account,Arn:Arn}' --output json > "$EVIDENCE_DIR/caller-identity.json"

          aws cloudformation describe-stacks --region "$AWS_REGION" --output json \
            | jq '[.Stacks[] | select(.StackName | startswith("dabbir-")) | {StackName,StackStatus,CreationTime,LastUpdatedTime,Tags:(.Tags // [])}]' \
            > "$EVIDENCE_DIR/dabbir-stacks.json"

          printf '[]\n' > "$EVIDENCE_DIR/stack-resources.json"
          while IFS= read -r stack; do
            test -n "$stack" || continue
            aws cloudformation list-stack-resources --region "$AWS_REGION" --stack-name "$stack" --output json \
              | jq --arg stack "$stack" '[.StackResourceSummaries[] | {StackName:$stack,LogicalResourceId,PhysicalResourceId,ResourceType,ResourceStatus}]' \
              > /tmp/dabbir-aws-inventory/one-stack.json
            jq -s 'add' "$EVIDENCE_DIR/stack-resources.json" /tmp/dabbir-aws-inventory/one-stack.json > /tmp/dabbir-aws-inventory/all-stack-resources.json
            mv /tmp/dabbir-aws-inventory/all-stack-resources.json "$EVIDENCE_DIR/stack-resources.json"
          done < <(jq -r '.[].StackName' "$EVIDENCE_DIR/dabbir-stacks.json")

          aws rds describe-db-instances --region "$AWS_REGION" --output json \
            | jq '[.DBInstances[] | select((.DBInstanceIdentifier // "") | test("dabbir";"i")) | {DBInstanceIdentifier,DBInstanceArn,DBInstanceStatus,DeletionProtection,BackupRetentionPeriod}]' \
            > "$EVIDENCE_DIR/rds-instances.json" || printf '[]\n' > "$EVIDENCE_DIR/rds-instances.json"

          aws rds describe-db-snapshots --region "$AWS_REGION" --snapshot-type manual --output json \
            | jq '[.DBSnapshots[] | select(((.DBInstanceIdentifier // "") | test("dabbir";"i")) or ((.DBSnapshotIdentifier // "") | test("dabbir";"i"))) | {DBSnapshotIdentifier,DBSnapshotArn,DBInstanceIdentifier,Status,SnapshotCreateTime}]' \
            > "$EVIDENCE_DIR/rds-manual-snapshots.json" || printf '[]\n' > "$EVIDENCE_DIR/rds-manual-snapshots.json"

          printf '[]\n' > "$EVIDENCE_DIR/s3-buckets.json"
          while IFS= read -r bucket; do
            test -n "$bucket" || continue
            versioning="$(aws s3api get-bucket-versioning --bucket "$bucket" --query 'Status' --output text 2>/dev/null || printf 'UNKNOWN')"
            version_status=0
            versions='null'
            delete_markers='null'
            raw="$(aws s3api list-object-versions --bucket "$bucket" --output json 2>/dev/null)" || version_status=$?
            if [ "$version_status" = '0' ]; then
              versions="$(printf '%s' "$raw" | jq '[.Versions[]?] | length')"
              delete_markers="$(printf '%s' "$raw" | jq '[.DeleteMarkers[]?] | length')"
            fi
            jq --arg bucket "$bucket" --arg versioning "$versioning" --argjson list_versions_status "$version_status" \
              --argjson versions "$versions" --argjson delete_markers "$delete_markers" \
              '. + [{bucket:$bucket,versioning:$versioning,list_versions_status:$list_versions_status,versions:$versions,delete_markers:$delete_markers}]' \
              "$EVIDENCE_DIR/s3-buckets.json" > /tmp/dabbir-aws-inventory/s3.json
            mv /tmp/dabbir-aws-inventory/s3.json "$EVIDENCE_DIR/s3-buckets.json"
          done < <(jq -r '.[] | select(.ResourceType == "AWS::S3::Bucket") | .PhysicalResourceId' "$EVIDENCE_DIR/stack-resources.json" | sort -u)

          printf '[]\n' > "$EVIDENCE_DIR/backup-vaults.json"
          aws backup list-backup-vaults --region "$AWS_REGION" --output json > /tmp/dabbir-aws-inventory/vaults.json 2>/dev/null || printf '{"BackupVaultList":[]}\n' > /tmp/dabbir-aws-inventory/vaults.json
          while IFS= read -r vault; do
            test -n "$vault" || continue
            case "${vault,,}" in *dabbir*) ;; *) continue ;; esac
            rp_status=0
            raw="$(aws backup list-recovery-points-by-backup-vault --region "$AWS_REGION" --backup-vault-name "$vault" --output json 2>/dev/null)" || rp_status=$?
            count='null'
            if [ "$rp_status" = '0' ]; then count="$(printf '%s' "$raw" | jq '[.RecoveryPoints[]?] | length')"; fi
            jq --arg vault "$vault" --argjson recovery_point_list_status "$rp_status" --argjson recovery_points "$count" \
              '. + [{vault:$vault,recovery_point_list_status:$recovery_point_list_status,recovery_points:$recovery_points}]' \
              "$EVIDENCE_DIR/backup-vaults.json" > /tmp/dabbir-aws-inventory/vault-one.json
            mv /tmp/dabbir-aws-inventory/vault-one.json "$EVIDENCE_DIR/backup-vaults.json"
          done < <(jq -r '.BackupVaultList[]?.BackupVaultName' /tmp/dabbir-aws-inventory/vaults.json)

          aws secretsmanager list-secrets --region "$AWS_REGION" --include-planned-deletion --output json \
            | jq '[.SecretList[] | select((.Name // "") | test("dabbir";"i")) | {Name,ARN,DeletedDate,LastChangedDate}]' \
            > "$EVIDENCE_DIR/secrets-metadata.json" || printf '[]\n' > "$EVIDENCE_DIR/secrets-metadata.json"

          aws ecr describe-repositories --region "$AWS_REGION" --output json \
            | jq '[.repositories[] | select((.repositoryName // "") | test("dabbir";"i")) | {repositoryName,repositoryArn,createdAt}]' \
            > "$EVIDENCE_DIR/ecr-repositories.json" || printf '[]\n' > "$EVIDENCE_DIR/ecr-repositories.json"

          aws logs describe-log-groups --region "$AWS_REGION" --output json \
            | jq '[.logGroups[] | select((.logGroupName // "") | test("dabbir";"i")) | {logGroupName,arn,storedBytes,retentionInDays}]' \
            > "$EVIDENCE_DIR/log-groups.json" || printf '[]\n' > "$EVIDENCE_DIR/log-groups.json"

          aws iam get-role --role-name "$ROLE_NAME" --output json \
            | jq '{Role:{RoleName:.Role.RoleName,Arn:.Role.Arn,MaxSessionDuration:.Role.MaxSessionDuration,PermissionsBoundary:(.Role.PermissionsBoundary // null),AssumeRolePolicyDocument:.Role.AssumeRolePolicyDocument}}' \
            > "$EVIDENCE_DIR/deploy-role.json"

          aws iam list-role-policies --role-name "$ROLE_NAME" --output json > /tmp/dabbir-aws-inventory/inline-names.json
          printf '[]\n' > /tmp/dabbir-aws-inventory/actions.json
          while IFS= read -r policy; do
            test -n "$policy" || continue
            aws iam get-role-policy --role-name "$ROLE_NAME" --policy-name "$policy" --output json \
              | jq --arg policy "$policy" '[.PolicyDocument.Statement[]? | select((.Effect // "") == "Allow") | (.Action // []) as $a | ($a | if type=="array" then . else [.] end)[] | {policy:$policy,action:.}]' \
              > /tmp/dabbir-aws-inventory/policy-actions.json
            jq -s 'add' /tmp/dabbir-aws-inventory/actions.json /tmp/dabbir-aws-inventory/policy-actions.json > /tmp/dabbir-aws-inventory/actions-next.json
            mv /tmp/dabbir-aws-inventory/actions-next.json /tmp/dabbir-aws-inventory/actions.json
          done < <(jq -r '.PolicyNames[]?' /tmp/dabbir-aws-inventory/inline-names.json)
          jq 'sort_by(.policy,.action)' /tmp/dabbir-aws-inventory/actions.json > "$EVIDENCE_DIR/allowed-inline-actions.json"

          python3 - <<'PY'
          import json, fnmatch
          rows=json.load(open('dabbir-aws-decommission-inventory/allowed-inline-actions.json'))
          patterns=[str(x['action']).lower() for x in rows]
          required=[
            'cloudformation:DeleteStack',
            's3:ListBucketVersions','s3:DeleteObject','s3:DeleteObjectVersion','s3:DeleteBucket',
            'rds:ModifyDBInstance','rds:DeleteDBInstance','rds:DeleteDBSnapshot',
            'secretsmanager:DeleteSecret',
            'backup:ListRecoveryPointsByBackupVault','backup:DeleteRecoveryPoint','backup:DeleteBackupVault',
            'ecr:DeleteRepository','logs:DeleteLogGroup',
            'iam:DeleteRolePolicy','iam:DeleteRole','iam:ListOpenIDConnectProviders','iam:GetOpenIDConnectProvider','iam:DeleteOpenIDConnectProvider'
          ]
          def allowed(action):
            a=action.lower()
            return any(fnmatch.fnmatchcase(a,p) for p in patterns)
          out={a:allowed(a) for a in required}
          json.dump(out,open('dabbir-aws-decommission-inventory/deletion-authority-matrix.json','w'),indent=2,sort_keys=True)
          PY

          jq -n \
            --arg sha "$GITHUB_SHA" \
            --arg region "$AWS_REGION" \
            --arg account "$account" \
            --argjson stacks "$(jq 'length' "$EVIDENCE_DIR/dabbir-stacks.json")" \
            --argjson stack_resources "$(jq 'length' "$EVIDENCE_DIR/stack-resources.json")" \
            --argjson rds "$(jq 'length' "$EVIDENCE_DIR/rds-instances.json")" \
            --argjson snapshots "$(jq 'length' "$EVIDENCE_DIR/rds-manual-snapshots.json")" \
            --argjson s3 "$(jq 'length' "$EVIDENCE_DIR/s3-buckets.json")" \
            --argjson secrets "$(jq 'length' "$EVIDENCE_DIR/secrets-metadata.json")" \
            --argjson ecr "$(jq 'length' "$EVIDENCE_DIR/ecr-repositories.json")" \
            --argjson logs "$(jq 'length' "$EVIDENCE_DIR/log-groups.json")" \
            '{repo_exact_sha:$sha,region:$region,account:$account,dabbir_stacks:$stacks,stack_resources:$stack_resources,rds_instances:$rds,rds_manual_snapshots:$snapshots,s3_buckets:$s3,secrets_metadata:$secrets,ecr_repositories:$ecr,log_groups:$logs,credential_values_read:false,mutation_performed:false}' \
            > "$EVIDENCE_DIR/summary.json"

          rm -rf /tmp/dabbir-aws-inventory

      - name: Upload immutable inventory artifact
        uses: actions/upload-artifact@v4
        with:
          name: dabbir-aws-decommission-inventory-${{ github.sha }}
          path: dabbir-aws-decommission-inventory/
          if-no-files-found: error
          retention-days: 90
