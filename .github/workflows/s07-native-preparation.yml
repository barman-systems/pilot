name: S07 synthetic native recovery preparation
on:
  push:
    branches: [test/s07-native-preparation-20260913]
    paths: ['scripts/dabbir-s07-recovery-executor.mjs', 'test/fixtures/s07-native-recovery.mjs', '.github/workflows/s07-native-preparation.yml']
permissions:
  contents: read
jobs:
  synthetic-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare disposable local PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql postgresql-client
          PG_BIN=$(pg_config --bindir)
          echo "S07_PG_BIN=$PG_BIN" >> "$GITHUB_ENV"
          "$PG_BIN/initdb" -D "$RUNNER_TEMP/s07-pg" -U s07_runner --auth=trust
          "$PG_BIN/pg_ctl" -D "$RUNNER_TEMP/s07-pg" -l "$RUNNER_TEMP/s07-pg.log" -o "-h 127.0.0.1 -p 55437 -k $RUNNER_TEMP" -w start || { cat "$RUNNER_TEMP/s07-pg.log"; exit 1; }
      - name: Exercise exact executor with synthetic rows
        run: node --test test/fixtures/s07-native-recovery.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: s07-native-preparation-evidence
          path: test-results/s07-native
          if-no-files-found: error
      - name: Stop disposable PostgreSQL
        if: always()
        run: |
          if [ -n "$S07_PG_BIN" ]; then "$S07_PG_BIN/pg_ctl" -D "$RUNNER_TEMP/s07-pg" -m immediate stop || true; fi
