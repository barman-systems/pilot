name: One-time DABBIR translation source patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-translation-source-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-time-dabbir-translation-source-patch
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Integrate authenticated translation verification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('test/ai-full-customer-journey-v2.mjs')
          s = p.read_text()
          marker = "  await step('25_mobile_webkit_owner_journey', browserJourney);"
          step_name = "24b_authenticated_translation_fallback"
          addition = r'''  await step('24b_authenticated_translation_fallback', async () => {
            const original = 'مرحبا، المنتج متوفر اليوم';
            const result = await ownerSession.request('/api/translate', {
              method: 'POST',
              body: {
                business_id: businessId,
                targetLanguage: 'en',
                messages: [{ id: 'qa-translation', text: original }],
              },
            });
            const translated = String(result.json?.translations?.[0]?.text || '').trim();
            assert(result.ok && result.json?.ok, `TRANSLATION_FAILED_${result.status}:${small(result.text)}`);
            assert(result.json?.service === 'dabbir-translation', 'TRANSLATION_SERVICE_IDENTITY_WRONG');
            assert(result.json?.original_preserved === true, 'TRANSLATION_ORIGINAL_PRESERVATION_MISSING');
            assert(translated && translated !== original && /[A-Za-z]/.test(translated), 'TRANSLATION_OUTPUT_INVALID');
            return {
              status: result.status,
              detail: `Authenticated translation succeeded via ${result.json?.model || 'unknown-model'}${result.json?.fallback_used ? ' fallback' : ''}.`,
            };
          });

          await step('25_mobile_webkit_owner_journey', browserJourney);'''

          if step_name not in s:
              if s.count(marker) != 1:
                  raise SystemExit('unexpected translation insertion marker state')
              p.write_text(s.replace(marker, addition))
          PY
      - name: Commit source and remove one-time patch
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/one-time-translation-source-patch.yml
          git diff --check
          git config user.name 'barman-systems-bot'
          git config user.email 'barman-systems-bot@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'test: verify authenticated DABBIR translation in full journey'
          git pull --rebase origin main
          git push origin HEAD:main
