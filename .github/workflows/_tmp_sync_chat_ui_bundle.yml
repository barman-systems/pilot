name: Temporary UI bundle sync

on:
  push:
    branches:
      - fix/web-chat-composer-authority-p0

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/web-chat-composer-authority-p0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: node scripts/build-dabbir-ui-bundles.mjs
      - name: Commit generated bundle
        run: |
          if git diff --quiet -- public/dabbir-ui-critical.js public/dabbir-ui-deferred.js public/privacy.html public/terms.html public/support.html; then
            echo "No generated drift"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/dabbir-ui-critical.js public/dabbir-ui-deferred.js public/privacy.html public/terms.html public/support.html
          git commit -m "build(ui): sync generated bundles"
          git push origin HEAD:fix/web-chat-composer-authority-p0
