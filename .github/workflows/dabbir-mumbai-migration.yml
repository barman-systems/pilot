name: DABBIR Sydney to Mumbai Migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dabbir-mumbai-migration.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: dabbir-mumbai-migration
  cancel-in-progress: false

jobs:
  final-delta-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SUPABASE_URL: https://spohjzrsymsmzsseygtw.supabase.co
      TARGET_SUPABASE_URL: https://fphpoysqdsceniwduxjq.supabase.co
      BROKER_SLUG: dabbir-migration-oidc-broker
      OIDC_AUDIENCE: dabbir-mumbai-migration

    steps:
      - name: Sync final private delta and verify zero drift
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y jq postgresql-client >/dev/null

          oidc_json="$(curl -fsS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          OIDC_TOKEN="$(jq -r '.value // empty' <<<"$oidc_json")"
          test -n "$OIDC_TOKEN" || exit 20
          echo "::add-mask::$OIDC_TOKEN"

          broker_call(){ curl -fsS -X POST -H "Authorization: Bearer ${OIDC_TOKEN}" -H 'Content-Type: application/json' "$1/functions/v1/${BROKER_SLUG}"; }
          SOURCE_BROKER="$(broker_call "$SOURCE_SUPABASE_URL")"
          TARGET_BROKER="$(broker_call "$TARGET_SUPABASE_URL")"
          [[ "$(jq -r '.ok // false' <<<"$SOURCE_BROKER")" == true ]] || { echo 'ERROR: source broker denied'; exit 21; }
          [[ "$(jq -r '.ok // false' <<<"$TARGET_BROKER")" == true ]] || { echo 'ERROR: target broker denied'; exit 22; }

          shost="$(jq -r '.credential.db_host // empty' <<<"$SOURCE_BROKER")"
          suser="$(jq -r '.credential.db_user // empty' <<<"$SOURCE_BROKER")"
          spass="$(jq -r '.credential.db_password // empty' <<<"$SOURCE_BROKER")"
          thost="$(jq -r '.credential.db_host // empty' <<<"$TARGET_BROKER")"
          tuser="$(jq -r '.credential.db_user // empty' <<<"$TARGET_BROKER")"
          tpass="$(jq -r '.credential.db_password // empty' <<<"$TARGET_BROKER")"
          SOURCE_SERVICE_ROLE_KEY="$(jq -r '.service_role_key // empty' <<<"$SOURCE_BROKER")"
          TARGET_SERVICE_ROLE_KEY="$(jq -r '.service_role_key // empty' <<<"$TARGET_BROKER")"
          for x in "$shost" "$suser" "$spass" "$thost" "$tuser" "$tpass" "$SOURCE_SERVICE_ROLE_KEY" "$TARGET_SERVICE_ROLE_KEY"; do
            test -n "$x" || { echo 'ERROR: migration credential missing'; exit 23; }
            echo "::add-mask::$x"
          done

          enc(){ python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "$1"; }
          SOURCE_DATABASE_URL="postgresql://${suser}:$(enc "$spass")@${shost}:5432/postgres?sslmode=require"
          TARGET_DATABASE_URL="postgresql://${tuser}:$(enc "$tpass")@${thost}:5432/postgres?sslmode=require"
          echo "::add-mask::$SOURCE_DATABASE_URL"
          echo "::add-mask::$TARGET_DATABASE_URL"

          scalar(){ psql "$1" -X -A -t -q -v ON_ERROR_STOP=1 -c "$2" | tr -d '\r\n'; }
          ledger_cutoff="$(scalar "$TARGET_DATABASE_URL" "select max(recorded_at)::text from dabbir_private.dabbir_customer_number_ledger")"
          journal_cutoff="$(scalar "$TARGET_DATABASE_URL" "select max(occurred_at)::text from dabbir_private.recovery_change_journal")"
          test -n "$ledger_cutoff" && test -n "$journal_cutoff"
          echo "Target private cutoffs captured."

          psql "$SOURCE_DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "\copy (select user_id,customer_no,allocated_at,recorded_at from dabbir_private.dabbir_customer_number_ledger where recorded_at > timestamptz '$ledger_cutoff' order by recorded_at,user_id) to '$RUNNER_TEMP/ledger.csv' csv header"
          psql "$SOURCE_DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "\copy (select id,business_ids,user_ids,customer_ids,table_name,operation,row_key,before_data,after_data,txid,actor_user_id,occurred_at,event_hash from dabbir_private.recovery_change_journal where occurred_at > timestamptz '$journal_cutoff' order by occurred_at,id) to '$RUNNER_TEMP/journal.csv' csv header"

          ledger_delta=$(( $(wc -l < "$RUNNER_TEMP/ledger.csv") - 1 ))
          journal_delta=$(( $(wc -l < "$RUNNER_TEMP/journal.csv") - 1 ))
          echo "Delta export: ledger=$ledger_delta journal=$journal_delta"

          cat > "$RUNNER_TEMP/import-delta.sql" <<SQL
          create temp table migration_ledger_delta (like dabbir_private.dabbir_customer_number_ledger including defaults);
          \copy migration_ledger_delta(user_id,customer_no,allocated_at,recorded_at) from '$RUNNER_TEMP/ledger.csv' csv header
          insert into dabbir_private.dabbir_customer_number_ledger(user_id,customer_no,allocated_at,recorded_at)
          select user_id,customer_no,allocated_at,recorded_at from migration_ledger_delta
          on conflict (user_id) do nothing;

          create temp table migration_journal_delta (like dabbir_private.recovery_change_journal including defaults);
          \copy migration_journal_delta(id,business_ids,user_ids,customer_ids,table_name,operation,row_key,before_data,after_data,txid,actor_user_id,occurred_at,event_hash) from '$RUNNER_TEMP/journal.csv' csv header
          insert into dabbir_private.recovery_change_journal(id,business_ids,user_ids,customer_ids,table_name,operation,row_key,before_data,after_data,txid,actor_user_id,occurred_at,event_hash)
          select id,business_ids,user_ids,customer_ids,table_name,operation,row_key,before_data,after_data,txid,actor_user_id,occurred_at,event_hash from migration_journal_delta
          on conflict (id) do nothing;
          SQL
          psql "$TARGET_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/import-delta.sql"

          cat > "$RUNNER_TEMP/fingerprint.sql" <<'SQL'
          create or replace function pg_temp.dabbir_table_fingerprints()
          returns table(k text, fp text)
          language plpgsql as $$
          declare r record; v text;
          begin
            for r in
              select table_schema,table_name
              from information_schema.tables
              where table_type='BASE TABLE'
                and (table_schema='dabbir_private' or (table_schema='public' and (table_name like 'dabbir%' or table_name='account_access_state')))
                and not (table_schema='dabbir_private' and table_name like 'executive\_%' escape '\')
              order by table_schema,table_name
            loop
              execute format('select count(*)::text||''|''||md5(coalesce(string_agg(j,E''\\n'' order by j),'''')) from (select to_jsonb(t)::text j from %I.%I t) q',r.table_schema,r.table_name) into v;
              k:=r.table_schema||'.'||r.table_name; fp:=v; return next;
            end loop;
          end $$;
          select * from pg_temp.dabbir_table_fingerprints() order by k;
          SQL

          psql "$SOURCE_DATABASE_URL" -X -A -t -q -F '|' -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/fingerprint.sql" > "$RUNNER_TEMP/source.fp"
          psql "$TARGET_DATABASE_URL" -X -A -t -q -F '|' -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/fingerprint.sql" > "$RUNNER_TEMP/target.fp"
          source_tables="$(grep -c . "$RUNNER_TEMP/source.fp")"
          target_tables="$(grep -c . "$RUNNER_TEMP/target.fp")"
          [[ "$source_tables" == 123 && "$target_tables" == 123 ]] || { echo "ERROR: DABBIR table baseline source=$source_tables target=$target_tables"; exit 30; }
          if ! diff -u "$RUNNER_TEMP/source.fp" "$RUNNER_TEMP/target.fp" > "$RUNNER_TEMP/drift.diff"; then
            echo 'ERROR: DABBIR zero-drift verification failed:'
            sed -n '1,80p' "$RUNNER_TEMP/drift.diff"
            exit 31
          fi
          echo 'PASS: all 123 DABBIR tables match exactly.'

          compare(){ local label="$1" sql="$2" s t; s="$(scalar "$SOURCE_DATABASE_URL" "$sql")"; t="$(scalar "$TARGET_DATABASE_URL" "$sql")"; echo "$label source=$s target=$t"; [[ "$s" == "$t" ]] || exit 32; }
          compare 'Auth users' "select count(*) from auth.users where id in (select user_id from public.dabbir_user_accounts)"
          compare 'Auth identities' "select count(*) from auth.identities where user_id in (select user_id from public.dabbir_user_accounts)"
          compare 'Auth MFA' "select count(*) from auth.mfa_factors where user_id in (select user_id from public.dabbir_user_accounts)"
          compare 'Auth FK count' "select count(*) from pg_constraint con join pg_class c on c.oid=con.conrelid join pg_namespace n on n.oid=c.relnamespace where con.contype='f' and con.confrelid='auth.users'::regclass and (n.nspname='dabbir_private' or (n.nspname='public' and (c.relname like 'dabbir%' or c.relname='account_access_state')))"

          curl -fsS "$SOURCE_SUPABASE_URL/storage/v1/object/dabbir-owner-live/owner-truth-v3.html" -H "apikey: $SOURCE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SOURCE_SERVICE_ROLE_KEY" -o "$RUNNER_TEMP/source-object.bin"
          curl -fsS "$TARGET_SUPABASE_URL/storage/v1/object/dabbir-owner-live/owner-truth-v3.html" -H "apikey: $TARGET_SERVICE_ROLE_KEY" -H "Authorization: Bearer $TARGET_SERVICE_ROLE_KEY" -o "$RUNNER_TEMP/target-object.bin"
          [[ "$(sha256sum "$RUNNER_TEMP/source-object.bin" | cut -d' ' -f1)" == "$(sha256sum "$RUNNER_TEMP/target-object.bin" | cut -d' ' -f1)" ]] || { echo 'ERROR: Storage SHA-256 mismatch'; exit 33; }

          echo "PASS DABBIR_MUMBAI_FINAL_DELTA_SYNC tables=123 ledger_delta=$ledger_delta journal_delta=$journal_delta storage=verified"
          echo 'Vercel production was NOT changed.'
