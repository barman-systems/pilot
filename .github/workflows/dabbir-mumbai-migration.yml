name: DABBIR Sydney to Mumbai Migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dabbir-mumbai-migration.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: dabbir-mumbai-migration
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_SUPABASE_URL: https://spohjzrsymsmzsseygtw.supabase.co
      TARGET_SUPABASE_URL: https://fphpoysqdsceniwduxjq.supabase.co
      TARGET_SUPABASE_REF: fphpoysqdsceniwduxjq
      TARGET_PUBLISHABLE_KEY: sb_publishable_gVq1bg_2DCnG-QFd6UAE9Q_Gx4w5JD3
      BROKER_SLUG: dabbir-migration-oidc-broker
      OIDC_AUDIENCE: dabbir-mumbai-migration
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: prj_HCTFdQo8Vc7FvZRdJ37H7KFYwpUq
      VERCEL_TEAM_ID: team_pwfKq8jHuyW1XFVSZirAJiId
      PRODUCTION_HOST: dabbir.bmalman.com

    steps:
      - name: Verify, build Mumbai preview, and promote
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo 'BLOCKED: VERCEL_TOKEN_NOT_CONFIGURED'; exit 10; }
          echo "::add-mask::$VERCEL_TOKEN"
          sudo apt-get update >/dev/null
          sudo apt-get install -y jq postgresql-client >/dev/null

          oidc_json="$(curl -fsS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          OIDC_TOKEN="$(jq -r '.value // empty' <<<"$oidc_json")"
          test -n "$OIDC_TOKEN" || exit 20
          echo "::add-mask::$OIDC_TOKEN"

          broker_call(){ curl -fsS -X POST -H "Authorization: Bearer ${OIDC_TOKEN}" -H 'Content-Type: application/json' "$1/functions/v1/${BROKER_SLUG}"; }
          SOURCE_BROKER="$(broker_call "$SOURCE_SUPABASE_URL")"
          TARGET_BROKER="$(broker_call "$TARGET_SUPABASE_URL")"
          [[ "$(jq -r '.ok // false' <<<"$SOURCE_BROKER")" == true ]] || { echo 'ERROR: source broker denied'; exit 21; }
          [[ "$(jq -r '.ok // false' <<<"$TARGET_BROKER")" == true ]] || { echo 'ERROR: target broker denied'; exit 22; }

          shost="$(jq -r '.credential.db_host // empty' <<<"$SOURCE_BROKER")"; suser="$(jq -r '.credential.db_user // empty' <<<"$SOURCE_BROKER")"; spass="$(jq -r '.credential.db_password // empty' <<<"$SOURCE_BROKER")"
          thost="$(jq -r '.credential.db_host // empty' <<<"$TARGET_BROKER")"; tuser="$(jq -r '.credential.db_user // empty' <<<"$TARGET_BROKER")"; tpass="$(jq -r '.credential.db_password // empty' <<<"$TARGET_BROKER")"
          SOURCE_SERVICE_ROLE_KEY="$(jq -r '.service_role_key // empty' <<<"$SOURCE_BROKER")"
          TARGET_SERVICE_ROLE_KEY="$(jq -r '.service_role_key // empty' <<<"$TARGET_BROKER")"
          for x in "$shost" "$suser" "$spass" "$thost" "$tuser" "$tpass" "$SOURCE_SERVICE_ROLE_KEY" "$TARGET_SERVICE_ROLE_KEY"; do
            test -n "$x" || { echo 'ERROR: migration credential missing'; exit 23; }
            echo "::add-mask::$x"
          done

          enc(){ python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "$1"; }
          SOURCE_DATABASE_URL="postgresql://${suser}:$(enc "$spass")@${shost}:5432/postgres?sslmode=require"
          TARGET_DATABASE_URL="postgresql://${tuser}:$(enc "$tpass")@${thost}:5432/postgres?sslmode=require"
          echo "::add-mask::$SOURCE_DATABASE_URL"; echo "::add-mask::$TARGET_DATABASE_URL"
          scalar(){ psql "$1" -X -A -t -q -v ON_ERROR_STOP=1 -c "$2" | tr -d '\r\n'; }

          cat > "$RUNNER_TEMP/fingerprint.sql" <<'SQL'
          create or replace function pg_temp.dabbir_table_fingerprints()
          returns table(k text, fp text)
          language plpgsql as $$
          declare r record; v text;
          begin
            for r in
              select table_schema,table_name from information_schema.tables
              where table_type='BASE TABLE'
                and (table_schema='dabbir_private' or (table_schema='public' and (table_name like 'dabbir%' or table_name='account_access_state')))
                and not (table_schema='dabbir_private' and table_name like 'executive\_%' escape '\')
              order by table_schema,table_name
            loop
              execute format('select count(*)::text||''|''||md5(coalesce(string_agg(j,E''\\n'' order by j),'''')) from (select to_jsonb(t)::text j from %I.%I t) q',r.table_schema,r.table_name) into v;
              k:=r.table_schema||'.'||r.table_name; fp:=v; return next;
            end loop;
          end $$;
          select * from pg_temp.dabbir_table_fingerprints() order by k;
          SQL

          zero_drift(){
            psql "$SOURCE_DATABASE_URL" -X -A -t -q -F '|' -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/fingerprint.sql" > "$RUNNER_TEMP/source.fp"
            psql "$TARGET_DATABASE_URL" -X -A -t -q -F '|' -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/fingerprint.sql" > "$RUNNER_TEMP/target.fp"
            [[ "$(grep -c . "$RUNNER_TEMP/source.fp")" == 123 && "$(grep -c . "$RUNNER_TEMP/target.fp")" == 123 ]] || return 1
            diff -q "$RUNNER_TEMP/source.fp" "$RUNNER_TEMP/target.fp" >/dev/null
          }
          zero_drift || { echo 'ERROR: drift detected before Vercel changes'; exit 30; }
          echo 'PASS: pre-cutover 123-table zero-drift check.'

          compare(){ local label="$1" sql="$2" s t; s="$(scalar "$SOURCE_DATABASE_URL" "$sql")"; t="$(scalar "$TARGET_DATABASE_URL" "$sql")"; echo "$label source=$s target=$t"; [[ "$s" == "$t" ]] || exit 31; }
          compare 'Auth users' "select count(*) from auth.users where id in (select user_id from public.dabbir_user_accounts)"
          compare 'Auth identities' "select count(*) from auth.identities where user_id in (select user_id from public.dabbir_user_accounts)"
          compare 'Auth MFA' "select count(*) from auth.mfa_factors where user_id in (select user_id from public.dabbir_user_accounts)"
          compare 'Auth FK count' "select count(*) from pg_constraint con join pg_class c on c.oid=con.conrelid join pg_namespace n on n.oid=c.relnamespace where con.contype='f' and con.confrelid='auth.users'::regclass and (n.nspname='dabbir_private' or (n.nspname='public' and (c.relname like 'dabbir%' or c.relname='account_access_state')))"

          curl -fsS "$SOURCE_SUPABASE_URL/storage/v1/object/dabbir-owner-live/owner-truth-v3.html" -H "apikey: $SOURCE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SOURCE_SERVICE_ROLE_KEY" -o "$RUNNER_TEMP/source-object.bin"
          curl -fsS "$TARGET_SUPABASE_URL/storage/v1/object/dabbir-owner-live/owner-truth-v3.html" -H "apikey: $TARGET_SERVICE_ROLE_KEY" -H "Authorization: Bearer $TARGET_SERVICE_ROLE_KEY" -o "$RUNNER_TEMP/target-object.bin"
          [[ "$(sha256sum "$RUNNER_TEMP/source-object.bin" | cut -d' ' -f1)" == "$(sha256sum "$RUNNER_TEMP/target-object.bin" | cut -d' ' -f1)" ]] || { echo 'ERROR: Storage SHA-256 mismatch'; exit 32; }
          echo 'PASS: Auth + Storage verified.'

          alias_json="$(curl -fsS "https://api.vercel.com/v4/aliases/${PRODUCTION_HOST}?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_TEAM_ID}" -H "Authorization: Bearer ${VERCEL_TOKEN}")"
          PREVIOUS_DEPLOYMENT="$(jq -r '.deploymentId // .deployment.id // empty' <<<"$alias_json")"
          test -n "$PREVIOUS_DEPLOYMENT" || { echo 'ERROR: production alias unresolved'; exit 40; }
          echo "Rollback deployment captured: $PREVIOUS_DEPLOYMENT"

          env_json="$(curl -fsS "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?decrypt=true&teamId=${VERCEL_TEAM_ID}" -H "Authorization: Bearer ${VERCEL_TOKEN}")"
          while IFS= read -r value; do test -z "$value" || echo "::add-mask::$value"; done < <(jq -r '.envs[] | select(.key=="SUPABASE_URL" or .key=="SUPABASE_AUTH_URL" or .key=="SUPABASE_PUBLISHABLE_KEY" or .key=="SUPABASE_SERVICE_ROLE_KEY" or .key=="DABBIR_OWNER_BROKER_URL") | .value // empty' <<<"$env_json")
          jq '[.envs[] | select(.key=="SUPABASE_URL" or .key=="SUPABASE_AUTH_URL" or .key=="SUPABASE_PUBLISHABLE_KEY" or .key=="SUPABASE_SERVICE_ROLE_KEY" or .key=="DABBIR_OWNER_BROKER_URL") | {id,key,value,type,target,gitBranch,customEnvironmentIds,comment}]' <<<"$env_json" > "$RUNNER_TEMP/original-env.json"
          jq '[.[].id]' "$RUNNER_TEMP/original-env.json" > "$RUNNER_TEMP/original-ids.json"

          ENV_CHANGED=0; PROMOTED=0
          restore_env(){
            [[ "$ENV_CHANGED" == 1 ]] || return 0
            current_env="$(curl -sS "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?decrypt=false&teamId=${VERCEL_TEAM_ID}" -H "Authorization: Bearer ${VERCEL_TOKEN}")"
            jq -r --slurpfile orig "$RUNNER_TEMP/original-ids.json" '.envs[] | select(.key=="SUPABASE_URL" or .key=="SUPABASE_AUTH_URL" or .key=="SUPABASE_PUBLISHABLE_KEY" or .key=="SUPABASE_SERVICE_ROLE_KEY" or .key=="DABBIR_OWNER_BROKER_URL") | . as $e | select(($orig[0] | index($e.id)) == null) | $e.id' <<<"$current_env" > "$RUNNER_TEMP/new-env-ids.txt"
            while IFS= read -r id; do
              [[ -n "$id" ]] || continue
              curl -sS -X DELETE "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/env/${id}?teamId=${VERCEL_TEAM_ID}" -H "Authorization: Bearer ${VERCEL_TOKEN}" >/dev/null || true
            done < "$RUNNER_TEMP/new-env-ids.txt"
            while IFS= read -r entry; do
              id="$(jq -r '.id' <<<"$entry")"
              body="$(jq 'del(.id) | with_entries(select(.value != null))' <<<"$entry")"
              curl -sS -X PATCH "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/env/${id}?teamId=${VERCEL_TEAM_ID}" -H "Authorization: Bearer ${VERCEL_TOKEN}" -H 'Content-Type: application/json' --data-binary "$body" >/dev/null || true
            done < <(jq -c '.[]' "$RUNNER_TEMP/original-env.json")
          }
          rollback(){
            code=$?; trap - ERR; set +e
            echo "ROLLBACK: Mumbai cutover aborted (exit=$code)."
            if [[ "$PROMOTED" == 1 ]]; then
              curl -sS -X POST "https://api.vercel.com/v1/projects/${VERCEL_PROJECT_ID}/rollback/${PREVIOUS_DEPLOYMENT}?teamId=${VERCEL_TEAM_ID}&description=DABBIR%20Mumbai%20cutover%20rollback" -H "Authorization: Bearer ${VERCEL_TOKEN}" >/dev/null || true
            fi
            restore_env
            exit "$code"
          }
          trap rollback ERR

          OWNER_BROKER_URL="${TARGET_SUPABASE_URL}/functions/v1/dabbir-owner-broker"
          jq -n --arg url "$TARGET_SUPABASE_URL" --arg pub "$TARGET_PUBLISHABLE_KEY" --arg srv "$TARGET_SERVICE_ROLE_KEY" --arg broker "$OWNER_BROKER_URL" '[
            {key:"SUPABASE_URL",value:$url,type:"plain",target:["production","preview"]},
            {key:"SUPABASE_AUTH_URL",value:$url,type:"plain",target:["production","preview"]},
            {key:"SUPABASE_PUBLISHABLE_KEY",value:$pub,type:"plain",target:["production","preview"]},
            {key:"SUPABASE_SERVICE_ROLE_KEY",value:$srv,type:"encrypted",target:["production","preview"]},
            {key:"DABBIR_OWNER_BROKER_URL",value:$broker,type:"plain",target:["production","preview"]}
          ]' > "$RUNNER_TEMP/mumbai-env.json"
          env_http="$(curl -sS -o "$RUNNER_TEMP/env-write.json" -w '%{http_code}' -X POST "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?upsert=true&teamId=${VERCEL_TEAM_ID}" -H "Authorization: Bearer ${VERCEL_TOKEN}" -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/mumbai-env.json")"
          [[ "$env_http" =~ ^2 ]] || { echo "ERROR: Vercel env update status=$env_http"; exit 42; }
          ENV_CHANGED=1

          verify_env="$(curl -fsS "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?decrypt=true&teamId=${VERCEL_TEAM_ID}" -H "Authorization: Bearer ${VERCEL_TOKEN}")"
          prod_url="$(jq -r '[.envs[] | select(.key=="SUPABASE_URL" and ((.target // []) | index("production")))][0].value // empty' <<<"$verify_env")"
          preview_url="$(jq -r '[.envs[] | select(.key=="SUPABASE_URL" and ((.target // []) | index("preview")))][0].value // empty' <<<"$verify_env")"
          [[ "$prod_url" == "$TARGET_SUPABASE_URL" && "$preview_url" == "$TARGET_SUPABASE_URL" ]] || { echo 'ERROR: Mumbai env binding failed'; exit 43; }
          echo 'PASS: Mumbai environment bound to preview + production.'

          deploy_body="$(jq -nc --arg project "$VERCEL_PROJECT_ID" '{name:"dabbir",project:$project,withLatestCommit:true,gitSource:{type:"github",org:"barman-systems",repo:"pilot",ref:"main"},projectSettings:{commandForIgnoringBuildStep:"exit 1"}}')"
          deploy_http="$(curl -sS -o "$RUNNER_TEMP/deploy.json" -w '%{http_code}' -X POST "https://api.vercel.com/v13/deployments?forceNew=1&teamId=${VERCEL_TEAM_ID}" -H "Authorization: Bearer ${VERCEL_TOKEN}" -H 'Content-Type: application/json' --data-binary "$deploy_body")"
          [[ "$deploy_http" =~ ^2 ]] || { echo "ERROR: preview deployment create status=$deploy_http"; jq -r '.error.code // .code // empty' "$RUNNER_TEMP/deploy.json"; exit 50; }
          NEW_DEPLOYMENT="$(jq -r '.id // empty' "$RUNNER_TEMP/deploy.json")"; NEW_URL="$(jq -r '.url // empty' "$RUNNER_TEMP/deploy.json")"
          test -n "$NEW_DEPLOYMENT" && test -n "$NEW_URL" || exit 51
          echo "Mumbai preview deployment: $NEW_DEPLOYMENT"

          ready=0
          for _ in $(seq 1 120); do
            d="$(curl -fsS "https://api.vercel.com/v13/deployments/${NEW_DEPLOYMENT}?teamId=${VERCEL_TEAM_ID}" -H "Authorization: Bearer ${VERCEL_TOKEN}")"
            state="$(jq -r '.readyState // .status // empty' <<<"$d")"
            case "$state" in READY) ready=1; break ;; ERROR|CANCELED) echo "ERROR: preview state=$state"; jq -r '.errorCode // .errorMessage // .errorLink // empty' <<<"$d"; exit 52 ;; esac
            sleep 5
          done
          [[ "$ready" == 1 ]] || { echo 'ERROR: preview readiness timeout'; exit 53; }

          preview_status="$(curl -sS -o "$RUNNER_TEMP/preview-cap.json" -w '%{http_code}' "https://${NEW_URL}/api/qa-capability")"
          [[ "$preview_status" == 200 ]] || { echo "ERROR: preview capability status=$preview_status"; exit 54; }
          jq -e --arg ref "$TARGET_SUPABASE_REF" '.ok==true and .supabase_project_ref==$ref and .server_admin_configured==true and .calendar_storage_configured==true' "$RUNNER_TEMP/preview-cap.json" >/dev/null || { echo 'ERROR: preview is not using Mumbai'; exit 55; }
          echo 'PASS: preview runtime confirmed Mumbai.'

          zero_drift || { echo 'ERROR: source changed during preview build; promotion blocked'; exit 56; }
          echo 'PASS: final 123-table zero-drift check immediately before promote.'

          promote_http="$(curl -sS -o "$RUNNER_TEMP/promote.json" -w '%{http_code}' -X POST "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/promote/${NEW_DEPLOYMENT}?teamId=${VERCEL_TEAM_ID}" -H "Authorization: Bearer ${VERCEL_TOKEN}" -H 'Content-Type: application/json' --data '{}')"
          [[ "$promote_http" == 200 || "$promote_http" == 201 || "$promote_http" == 202 ]] || { echo "ERROR: promote status=$promote_http"; exit 60; }
          PROMOTED=1

          alias_ok=0
          for _ in $(seq 1 60); do
            a="$(curl -fsS "https://api.vercel.com/v4/aliases/${PRODUCTION_HOST}?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_TEAM_ID}" -H "Authorization: Bearer ${VERCEL_TOKEN}")"
            current="$(jq -r '.deploymentId // .deployment.id // empty' <<<"$a")"
            [[ "$current" == "$NEW_DEPLOYMENT" ]] && { alias_ok=1; break; }
            sleep 2
          done
          [[ "$alias_ok" == 1 ]] || { echo 'ERROR: production alias did not promote'; exit 61; }

          prod_status="$(curl -sS -o "$RUNNER_TEMP/prod-cap.json" -w '%{http_code}' "https://${PRODUCTION_HOST}/api/qa-capability")"
          [[ "$prod_status" == 200 ]] || { echo "ERROR: production capability status=$prod_status"; exit 62; }
          jq -e --arg ref "$TARGET_SUPABASE_REF" '.ok==true and .supabase_project_ref==$ref and .server_admin_configured==true and .calendar_storage_configured==true' "$RUNNER_TEMP/prod-cap.json" >/dev/null || { echo 'ERROR: production runtime is not using Mumbai'; exit 63; }
          session_status="$(curl -sS -o "$RUNNER_TEMP/session.json" -w '%{http_code}' "https://${PRODUCTION_HOST}/api/auth/session")"
          [[ "$session_status" == 200 ]] && jq -e '.authenticated==false' "$RUNNER_TEMP/session.json" >/dev/null || { echo 'ERROR: production auth smoke failed'; exit 64; }
          admin_status="$(curl -sS -o "$RUNNER_TEMP/admin.json" -w '%{http_code}' "https://${PRODUCTION_HOST}/api/platform-customers?action=overview")"
          [[ "$admin_status" == 401 ]] || { echo "ERROR: production admin fail-closed status=$admin_status"; exit 65; }

          trap - ERR
          echo "PASS DABBIR_MUMBAI_CUTOVER deployment=$NEW_DEPLOYMENT tables=123 auth=56 storage=verified preview=passed production=passed rollback_source=$PREVIOUS_DEPLOYMENT"
          echo 'Sydney remains online only as rollback source; it was not paused or deleted.'
