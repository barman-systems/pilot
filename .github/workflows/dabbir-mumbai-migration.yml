name: DABBIR Sydney to Mumbai Migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dabbir-mumbai-migration.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: dabbir-mumbai-migration
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SUPABASE_URL: https://spohjzrsymsmzsseygtw.supabase.co
      TARGET_SUPABASE_URL: https://fphpoysqdsceniwduxjq.supabase.co
      TARGET_PUBLISHABLE_KEY: sb_publishable_gVq1bg_2DCnG-QFd6UAE9Q_Gx4w5JD3
      BROKER_SLUG: dabbir-migration-oidc-broker
      OIDC_AUDIENCE: dabbir-mumbai-migration
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: prj_HCTFdQo8Vc7FvZRdJ37H7KFYwpUq
      VERCEL_TEAM_ID: team_pwfKq8jHuyW1XFVSZirAJiId
      PRODUCTION_ORIGIN: https://dabbir-nd56cm4j5v-3619s-projects.vercel.app

    steps:
      - name: Cut over DABBIR to Mumbai with rollback
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo 'BLOCKED: VERCEL_TOKEN_NOT_CONFIGURED'; exit 10; }
          echo "::add-mask::$VERCEL_TOKEN"
          sudo apt-get update >/dev/null
          sudo apt-get install -y jq postgresql-client >/dev/null

          oidc_json="$(curl -fsS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          OIDC_TOKEN="$(jq -r '.value // empty' <<<"$oidc_json")"
          test -n "$OIDC_TOKEN" || exit 20
          echo "::add-mask::$OIDC_TOKEN"
          broker_call(){ curl -fsS -X POST -H "Authorization: Bearer ${OIDC_TOKEN}" -H 'Content-Type: application/json' "$1/functions/v1/${BROKER_SLUG}"; }
          SOURCE_BROKER="$(broker_call "$SOURCE_SUPABASE_URL")"
          TARGET_BROKER="$(broker_call "$TARGET_SUPABASE_URL")"
          [[ "$(jq -r '.ok // false' <<<"$SOURCE_BROKER")" == true ]] || exit 21
          [[ "$(jq -r '.ok // false' <<<"$TARGET_BROKER")" == true ]] || exit 22

          shost="$(jq -r '.credential.db_host' <<<"$SOURCE_BROKER")"; suser="$(jq -r '.credential.db_user' <<<"$SOURCE_BROKER")"; spass="$(jq -r '.credential.db_password' <<<"$SOURCE_BROKER")"
          thost="$(jq -r '.credential.db_host' <<<"$TARGET_BROKER")"; tuser="$(jq -r '.credential.db_user' <<<"$TARGET_BROKER")"; tpass="$(jq -r '.credential.db_password' <<<"$TARGET_BROKER")"
          TARGET_SERVICE_ROLE_KEY="$(jq -r '.service_role_key // empty' <<<"$TARGET_BROKER")"
          for x in "$spass" "$tpass" "$TARGET_SERVICE_ROLE_KEY"; do test -n "$x" || exit 23; echo "::add-mask::$x"; done
          enc(){ python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "$1"; }
          SOURCE_DATABASE_URL="postgresql://${suser}:$(enc "$spass")@${shost}:5432/postgres?sslmode=require"
          TARGET_DATABASE_URL="postgresql://${tuser}:$(enc "$tpass")@${thost}:5432/postgres?sslmode=require"
          echo "::add-mask::$SOURCE_DATABASE_URL"; echo "::add-mask::$TARGET_DATABASE_URL"

          cat > "$RUNNER_TEMP/fingerprint.sql" <<'SQL'
          create or replace function pg_temp.dabbir_table_fingerprints()
          returns table(k text, fp text)
          language plpgsql as $$
          declare r record; v text;
          begin
            for r in
              select table_schema,table_name from information_schema.tables
              where table_type='BASE TABLE'
                and (table_schema='dabbir_private' or (table_schema='public' and (table_name like 'dabbir%' or table_name='account_access_state')))
                and not (table_schema='dabbir_private' and table_name like 'executive\_%' escape '\')
              order by table_schema,table_name
            loop
              execute format('select count(*)::text||''|''||md5(coalesce(string_agg(j,E''\\n'' order by j),'''')) from (select to_jsonb(t)::text j from %I.%I t) q',r.table_schema,r.table_name) into v;
              k:=r.table_schema||'.'||r.table_name; fp:=v; return next;
            end loop;
          end $$;
          select * from pg_temp.dabbir_table_fingerprints() order by k;
          SQL
          psql "$SOURCE_DATABASE_URL" -X -A -t -q -F '|' -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/fingerprint.sql" > "$RUNNER_TEMP/source.fp"
          psql "$TARGET_DATABASE_URL" -X -A -t -q -F '|' -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/fingerprint.sql" > "$RUNNER_TEMP/target.fp"
          test "$(grep -c . "$RUNNER_TEMP/source.fp")" = 123 || { echo 'ERROR source table baseline changed'; exit 30; }
          diff -u "$RUNNER_TEMP/source.fp" "$RUNNER_TEMP/target.fp" >/dev/null || { echo 'ERROR Mumbai data drift detected; cutover aborted'; exit 31; }

          scalar(){ psql "$1" -X -A -t -v ON_ERROR_STOP=1 -c "$2" | tr -d '[:space:]'; }
          compare(){ local n="$1" q="$2" s t; s="$(scalar "$SOURCE_DATABASE_URL" "$q")"; t="$(scalar "$TARGET_DATABASE_URL" "$q")"; echo "$n source=$s target=$t"; [[ "$s" == "$t" ]] || exit 32; }
          compare 'Auth users' "select count(*) from auth.users where id in (select user_id from public.dabbir_user_accounts);"
          compare 'Auth identities' "select count(*) from auth.identities where user_id in (select user_id from public.dabbir_user_accounts);"
          compare 'Auth MFA' "select count(*) from auth.mfa_factors where user_id in (select user_id from public.dabbir_user_accounts);"
          compare 'Auth FK count' "select count(*) from pg_constraint con join pg_class c on c.oid=con.conrelid join pg_namespace n on n.oid=c.relnamespace where con.contype='f' and con.confrelid='auth.users'::regclass and (n.nspname='dabbir_private' or (n.nspname='public' and (c.relname like 'dabbir%' or c.relname='account_access_state')));"
          compare 'Storage buckets' "select count(*) from storage.buckets where id like 'dabbir-%';"
          compare 'Storage objects' "select count(*) from storage.objects where bucket_id like 'dabbir-%';"
          compare 'Storage policy fingerprint' "select md5(coalesce(string_agg(x,E'\\n' order by x),'')) from (select concat_ws('|',tablename,policyname,permissive,cmd,array_to_string(roles,','),coalesce(qual,''),coalesce(with_check,'')) x from pg_policies where schemaname='storage' and (policyname ilike 'dabbir%' or coalesce(qual,'') ilike '%dabbir%' or coalesce(with_check,'') ilike '%dabbir%')) q;"
          [[ "$(scalar "$TARGET_DATABASE_URL" 'select count(*) from auth.users')" == 56 ]] || exit 33
          [[ "$(scalar "$TARGET_DATABASE_URL" "select count(*) from storage.buckets where id like 'dabbir-%'")" == 2 ]] || exit 34
          [[ "$(scalar "$TARGET_DATABASE_URL" "select count(*) from storage.objects where bucket_id like 'dabbir-%'")" == 1 ]] || exit 35
          echo 'PASS: zero-drift preflight complete.'

          project_json="$(curl -fsS "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_TEAM_ID}" -H "Authorization: Bearer ${VERCEL_TOKEN}")"
          PREVIOUS_DEPLOYMENT="$(jq -r '.latestDeployments[0].id // .latestDeployment.id // empty' <<<"$project_json")"
          test -n "$PREVIOUS_DEPLOYMENT" || { echo 'ERROR: previous Vercel production deployment not found'; exit 40; }
          echo "Rollback deployment captured: $PREVIOUS_DEPLOYMENT"

          env_json="$(curl -fsS "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?decrypt=true&teamId=${VERCEL_TEAM_ID}" -H "Authorization: Bearer ${VERCEL_TOKEN}")"
          for key in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY; do
            count="$(jq --arg k "$key" '[.envs[] | select(.key==$k and ((.target // []) | index("production")))] | length' <<<"$env_json")"
            (( count >= 1 )) || { echo "ERROR: production env missing $key"; exit 41; }
          done
          while IFS= read -r value; do test -z "$value" || echo "::add-mask::$value"; done < <(jq -r '.envs[] | select(.key|startswith("SUPABASE_")) | .value // empty' <<<"$env_json")

          jq '[.envs[] | select((.target // []) | index("production")) | select(.key=="SUPABASE_URL" or .key=="SUPABASE_AUTH_URL" or .key=="SUPABASE_PUBLISHABLE_KEY" or .key=="SUPABASE_SERVICE_ROLE_KEY") | {key,value,type,target}]' <<<"$env_json" > "$RUNNER_TEMP/rollback-env.json"
          auth_url_present="$(jq '[.envs[] | select(.key=="SUPABASE_AUTH_URL" and ((.target // []) | index("production")))] | length > 0' <<<"$env_json")"
          jq -n --arg url "$TARGET_SUPABASE_URL" --arg pub "$TARGET_PUBLISHABLE_KEY" --arg srv "$TARGET_SERVICE_ROLE_KEY" --argjson auth "$auth_url_present" '
            [
              {key:"SUPABASE_URL",value:$url,type:"plain",target:["production"]},
              {key:"SUPABASE_PUBLISHABLE_KEY",value:$pub,type:"plain",target:["production"]},
              {key:"SUPABASE_SERVICE_ROLE_KEY",value:$srv,type:"encrypted",target:["production"]}
            ] + (if $auth then [{key:"SUPABASE_AUTH_URL",value:$url,type:"plain",target:["production"]}] else [] end)
          ' > "$RUNNER_TEMP/mumbai-env.json"

          ENV_CHANGED=0
          rollback(){
            code=$?
            trap - ERR
            set +e
            echo "ROLLBACK: restoring Vercel environment and deployment because cutover failed (exit=$code)."
            if [[ "$ENV_CHANGED" == 1 ]]; then
              curl -fsS -X POST "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?upsert=true&teamId=${VERCEL_TEAM_ID}" \
                -H "Authorization: Bearer ${VERCEL_TOKEN}" -H 'Content-Type: application/json' \
                --data-binary @"$RUNNER_TEMP/rollback-env.json" >/dev/null
            fi
            if [[ -n "${PREVIOUS_DEPLOYMENT:-}" ]]; then
              curl -fsS -X POST "https://api.vercel.com/v1/projects/${VERCEL_PROJECT_ID}/rollback/${PREVIOUS_DEPLOYMENT}?teamId=${VERCEL_TEAM_ID}&description=DABBIR%20Mumbai%20cutover%20rollback" \
                -H "Authorization: Bearer ${VERCEL_TOKEN}" >/dev/null || true
            fi
            exit "$code"
          }
          trap rollback ERR

          curl -fsS -X POST "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?upsert=true&teamId=${VERCEL_TEAM_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" -H 'Content-Type: application/json' \
            --data-binary @"$RUNNER_TEMP/mumbai-env.json" >/dev/null
          ENV_CHANGED=1
          echo 'PASS: Vercel production Supabase environment updated to Mumbai.'

          deploy_body="$(jq -nc --arg name dabbir --arg project "$VERCEL_PROJECT_ID" --arg deployment "$PREVIOUS_DEPLOYMENT" '{name:$name,project:$project,deploymentId:$deployment,target:"production"}')"
          deploy_json="$(curl -fsS -X POST "https://api.vercel.com/v13/deployments?teamId=${VERCEL_TEAM_ID}" -H "Authorization: Bearer ${VERCEL_TOKEN}" -H 'Content-Type: application/json' --data-binary "$deploy_body")"
          NEW_DEPLOYMENT="$(jq -r '.id // empty' <<<"$deploy_json")"
          NEW_URL="$(jq -r '.url // empty' <<<"$deploy_json")"
          test -n "$NEW_DEPLOYMENT" || { echo 'ERROR: Vercel deployment was not created'; exit 50; }
          echo "New deployment: $NEW_DEPLOYMENT"

          ready=0
          for _ in $(seq 1 120); do
            d="$(curl -fsS "https://api.vercel.com/v13/deployments/${NEW_DEPLOYMENT}?teamId=${VERCEL_TEAM_ID}" -H "Authorization: Bearer ${VERCEL_TOKEN}")"
            state="$(jq -r '.readyState // .status // empty' <<<"$d")"
            case "$state" in
              READY) ready=1; break ;;
              ERROR|CANCELED) echo "ERROR: deployment state=$state"; exit 51 ;;
            esac
            sleep 5
          done
          [[ "$ready" == 1 ]] || { echo 'ERROR: deployment readiness timeout'; exit 52; }
          echo "PASS: Vercel deployment READY https://${NEW_URL}"

          sleep 8
          status="$(curl -sS -o "$RUNNER_TEMP/session.json" -w '%{http_code}' "${PRODUCTION_ORIGIN}/api/auth/session")"
          [[ "$status" == 200 ]] || { echo "ERROR: auth session smoke status=$status"; exit 60; }
          jq -e '.authenticated == false' "$RUNNER_TEMP/session.json" >/dev/null

          status="$(curl -sS -o "$RUNNER_TEMP/capability.json" -w '%{http_code}' "${PRODUCTION_ORIGIN}/api/qa-capability")"
          [[ "$status" == 200 ]] || { echo "ERROR: capability smoke status=$status"; exit 61; }
          jq -e '.ok == true and .server_admin_configured == true and .calendar_storage_configured == true' "$RUNNER_TEMP/capability.json" >/dev/null

          status="$(curl -sS -o "$RUNNER_TEMP/admin.json" -w '%{http_code}' "${PRODUCTION_ORIGIN}/api/platform-customers?action=overview")"
          [[ "$status" == 401 ]] || { echo "ERROR: admin fail-closed smoke status=$status"; exit 62; }
          jq -e '.error == "AUTH_REQUIRED"' "$RUNNER_TEMP/admin.json" >/dev/null

          trap - ERR
          echo 'PASS DABBIR_MUMBAI_CUTOVER database=verified auth=56 storage=verified vercel=production smoke=passed rollback=armed'
          echo 'Sydney remains online as rollback source; it was not paused or deleted.'
