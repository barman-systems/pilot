name: DABBIR Sydney to Mumbai Migration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dabbir-mumbai-migration.yml
      - infra/falconcloud-dubai/migrate-managed-supabase.sh

permissions:
  contents: read
  id-token: write

concurrency:
  group: dabbir-mumbai-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SUPABASE_URL: https://spohjzrsymsmzsseygtw.supabase.co
      TARGET_SUPABASE_URL: https://fphpoysqdsceniwduxjq.supabase.co
      BROKER_SLUG: dabbir-migration-oidc-broker
      OIDC_AUDIENCE: dabbir-mumbai-migration

    steps:
      - name: Checkout authoritative DABBIR source
        uses: actions/checkout@v4

      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates jq python3
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/psql --version
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Migrate DABBIR database Auth and Storage
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/17/bin:$PATH"

          oidc_json="$(curl --silent --show-error --fail-with-body --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          OIDC_TOKEN="$(jq -r '.value // empty' <<<"$oidc_json")"
          [[ -n "$OIDC_TOKEN" ]] || { echo 'ERROR: GitHub OIDC token was not issued.' >&2; exit 20; }
          echo "::add-mask::$OIDC_TOKEN"

          broker_call() {
            local base="$1"
            curl --silent --show-error --fail-with-body --request POST --header "Authorization: Bearer ${OIDC_TOKEN}" --header 'Content-Type: application/json' "${base}/functions/v1/${BROKER_SLUG}"
          }

          SOURCE_BROKER="$(broker_call "$SOURCE_SUPABASE_URL")"
          TARGET_BROKER="$(broker_call "$TARGET_SUPABASE_URL")"
          [[ "$(jq -r '.ok // false' <<<"$SOURCE_BROKER")" == 'true' ]] || { echo 'ERROR: Sydney broker rejected workflow.' >&2; exit 21; }
          [[ "$(jq -r '.ok // false' <<<"$TARGET_BROKER")" == 'true' ]] || { echo 'ERROR: Mumbai broker rejected workflow.' >&2; exit 22; }

          SOURCE_HOST="$(jq -r '.credential.db_host // empty' <<<"$SOURCE_BROKER")"
          SOURCE_USER="$(jq -r '.credential.db_user // empty' <<<"$SOURCE_BROKER")"
          SOURCE_PASS="$(jq -r '.credential.db_password // empty' <<<"$SOURCE_BROKER")"
          TARGET_HOST="$(jq -r '.credential.db_host // empty' <<<"$TARGET_BROKER")"
          TARGET_USER="$(jq -r '.credential.db_user // empty' <<<"$TARGET_BROKER")"
          TARGET_PASS="$(jq -r '.credential.db_password // empty' <<<"$TARGET_BROKER")"
          SOURCE_SERVICE_ROLE_KEY="$(jq -r '.service_role_key // empty' <<<"$SOURCE_BROKER")"
          TARGET_SERVICE_ROLE_KEY="$(jq -r '.service_role_key // empty' <<<"$TARGET_BROKER")"

          for value in "$SOURCE_HOST" "$SOURCE_USER" "$SOURCE_PASS" "$TARGET_HOST" "$TARGET_USER" "$TARGET_PASS" "$SOURCE_SERVICE_ROLE_KEY" "$TARGET_SERVICE_ROLE_KEY"; do
            [[ -n "$value" ]] || { echo 'ERROR: Broker returned incomplete credentials.' >&2; exit 23; }
          done

          echo "::add-mask::$SOURCE_PASS"
          echo "::add-mask::$TARGET_PASS"
          echo "::add-mask::$SOURCE_SERVICE_ROLE_KEY"
          echo "::add-mask::$TARGET_SERVICE_ROLE_KEY"

          urlencode() { python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$1"; }
          SOURCE_DATABASE_URL="postgresql://${SOURCE_USER}:$(urlencode "$SOURCE_PASS")@${SOURCE_HOST}:5432/postgres?sslmode=require"
          TARGET_DATABASE_URL="postgresql://${TARGET_USER}:$(urlencode "$TARGET_PASS")@${TARGET_HOST}:5432/postgres?sslmode=require"
          echo "::add-mask::$SOURCE_DATABASE_URL"
          echo "::add-mask::$TARGET_DATABASE_URL"
          export SOURCE_DATABASE_URL TARGET_DATABASE_URL SOURCE_SERVICE_ROLE_KEY TARGET_SERVICE_ROLE_KEY SOURCE_SUPABASE_URL TARGET_SUPABASE_URL

          source_role="$(psql "$SOURCE_DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c 'select current_user' | tr -d '[:space:]')"
          target_role="$(psql "$TARGET_DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c 'select current_user' | tr -d '[:space:]')"
          [[ "$source_role" == 'dabbir_mumbai_migrator_src' ]] || { echo "ERROR: unexpected Sydney role: $source_role" >&2; exit 24; }
          [[ "$target_role" == 'dabbir_mumbai_migrator_dst' ]] || { echo "ERROR: unexpected Mumbai role: $target_role" >&2; exit 25; }
          echo 'PASS: OIDC database access verified.'

          target_existing="$(psql "$TARGET_DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select count(*) from information_schema.tables where table_schema='dabbir_private' or (table_schema='public' and (table_name like 'dabbir%' or table_name='account_access_state'))" | tr -d '[:space:]')"
          [[ "$target_existing" == '0' ]] || { echo "ERROR: Mumbai already contains $target_existing DABBIR tables." >&2; exit 26; }

          target_auth_users="$(psql "$TARGET_DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c 'select count(*) from auth.users' | tr -d '[:space:]')"
          [[ "$target_auth_users" == '0' ]] || { echo 'ERROR: Mumbai Auth is not empty.' >&2; exit 27; }

          auth_triggers="$(psql "$TARGET_DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select count(*) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='auth' and c.relname in ('users','identities','mfa_factors') and not t.tgisinternal" | tr -d '[:space:]')"
          [[ "$auth_triggers" == '0' ]] || { echo 'ERROR: custom Auth triggers exist on Mumbai.' >&2; exit 28; }

          stage_ok="$(psql "$TARGET_DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select (has_table_privilege(current_user,'public.migration_auth_users_stage','INSERT') and has_table_privilege(current_user,'public.migration_auth_users_stage','TRUNCATE') and has_table_privilege(current_user,'public.migration_auth_identities_stage','INSERT') and has_table_privilege(current_user,'public.migration_auth_mfa_factors_stage','INSERT') and has_function_privilege(current_user,'public.migration_commit_auth_stage_v1()','EXECUTE'))::int" | tr -d '[:space:]')"
          [[ "$stage_ok" == '1' ]] || { echo 'ERROR: Mumbai Auth staging permissions are incomplete.' >&2; exit 29; }

          DUMP_DIR="$RUNNER_TEMP/dabbir-migration" bash infra/falconcloud-dubai/migrate-managed-supabase.sh
          bash infra/falconcloud-dubai/migrate-storage.sh

          src_users="$(psql "$SOURCE_DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select count(*) from auth.users where id in (select user_id from public.dabbir_user_accounts)" | tr -d '[:space:]')"
          dst_users="$(psql "$TARGET_DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c 'select count(*) from auth.users' | tr -d '[:space:]')"
          src_tables="$(psql "$SOURCE_DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select count(*) from information_schema.tables where table_type='BASE TABLE' and (table_schema='dabbir_private' or (table_schema='public' and (table_name like 'dabbir%' or table_name='account_access_state')))" | tr -d '[:space:]')"
          dst_tables="$(psql "$TARGET_DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select count(*) from information_schema.tables where table_type='BASE TABLE' and (table_schema='dabbir_private' or (table_schema='public' and (table_name like 'dabbir%' or table_name='account_access_state')))" | tr -d '[:space:]')"
          src_objects="$(psql "$SOURCE_DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select count(*) from storage.objects where bucket_id like 'dabbir-%'" | tr -d '[:space:]')"
          dst_objects="$(psql "$TARGET_DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select count(*) from storage.objects where bucket_id like 'dabbir-%'" | tr -d '[:space:]')"

          [[ "$src_users" == "$dst_users" && "$src_tables" == "$dst_tables" && "$src_objects" == "$dst_objects" ]] || { echo 'ERROR: final count verification failed.' >&2; exit 30; }
          echo "PASS DABBIR_MUMBAI_DATABASE_AUTH_STORAGE users=$dst_users tables=$dst_tables storage_objects=$dst_objects"
          echo 'Production Vercel endpoint was NOT changed by this workflow.'
