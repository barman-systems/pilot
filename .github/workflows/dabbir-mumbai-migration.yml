name: DABBIR Sydney to Mumbai Migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dabbir-mumbai-migration.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: dabbir-mumbai-migration
  cancel-in-progress: false

jobs:
  cleanup-diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_SUPABASE_URL: https://fphpoysqdsceniwduxjq.supabase.co
      TARGET_PUBLISHABLE_KEY: sb_publishable_gVq1bg_2DCnG-QFd6UAE9Q_Gx4w5JD3
      BROKER_SLUG: dabbir-migration-oidc-broker
      OIDC_AUDIENCE: dabbir-mumbai-migration
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: prj_HCTFdQo8Vc7FvZRdJ37H7KFYwpUq
      VERCEL_TEAM_ID: team_pwfKq8jHuyW1XFVSZirAJiId
      EXPECTED_PRODUCTION_DEPLOYMENT: dpl_DznyZWkcRnMZo7GZRhvUjek2CWrK

    steps:
      - name: Clean failed cutover state and diagnose deployment API
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || exit 10
          echo "::add-mask::$VERCEL_TOKEN"

          oidc_json="$(curl -fsS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          OIDC_TOKEN="$(jq -r '.value // empty' <<<"$oidc_json")"
          test -n "$OIDC_TOKEN" || exit 20
          echo "::add-mask::$OIDC_TOKEN"
          target_broker="$(curl -fsS -X POST -H "Authorization: Bearer ${OIDC_TOKEN}" -H 'Content-Type: application/json' "$TARGET_SUPABASE_URL/functions/v1/${BROKER_SLUG}")"
          [[ "$(jq -r '.ok // false' <<<"$target_broker")" == true ]] || exit 21
          TARGET_SERVICE_ROLE_KEY="$(jq -r '.service_role_key // empty' <<<"$target_broker")"
          test -n "$TARGET_SERVICE_ROLE_KEY" || exit 22
          echo "::add-mask::$TARGET_SERVICE_ROLE_KEY"

          env_json="$(curl -fsS "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?decrypt=true&teamId=${VERCEL_TEAM_ID}" -H "Authorization: Bearer ${VERCEL_TOKEN}")"
          while IFS= read -r value; do test -z "$value" || echo "::add-mask::$value"; done < <(jq -r '.envs[] | select(.key|startswith("SUPABASE_")) | .value // empty' <<<"$env_json")

          jq -r --arg url "$TARGET_SUPABASE_URL" --arg pub "$TARGET_PUBLISHABLE_KEY" --arg srv "$TARGET_SERVICE_ROLE_KEY" '
            .envs[]
            | select((.target // []) | index("production"))
            | select((.key=="SUPABASE_URL" and .value==$url) or (.key=="SUPABASE_PUBLISHABLE_KEY" and .value==$pub) or (.key=="SUPABASE_SERVICE_ROLE_KEY" and .value==$srv))
            | [.id,.key] | @tsv
          ' <<<"$env_json" > "$RUNNER_TEMP/remove.tsv"

          while IFS=$'\t' read -r id key; do
            [[ -n "$id" ]] || continue
            curl -fsS -X DELETE "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/env/${id}?teamId=${VERCEL_TEAM_ID}" -H "Authorization: Bearer ${VERCEL_TOKEN}" >/dev/null
            echo "Removed failed-cutover env: $key"
          done < "$RUNNER_TEMP/remove.tsv"

          verify_env="$(curl -fsS "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?decrypt=true&teamId=${VERCEL_TEAM_ID}" -H "Authorization: Bearer ${VERCEL_TOKEN}")"
          leftovers="$(jq --arg url "$TARGET_SUPABASE_URL" --arg pub "$TARGET_PUBLISHABLE_KEY" --arg srv "$TARGET_SERVICE_ROLE_KEY" '[.envs[] | select((.target // []) | index("production")) | select((.key=="SUPABASE_URL" and .value==$url) or (.key=="SUPABASE_PUBLISHABLE_KEY" and .value==$pub) or (.key=="SUPABASE_SERVICE_ROLE_KEY" and .value==$srv))] | length' <<<"$verify_env")"
          [[ "$leftovers" == 0 ]] || { echo 'ERROR: failed-cutover Mumbai env still present'; exit 30; }
          echo 'PASS: failed-cutover Vercel env cleaned.'

          project_json="$(curl -fsS "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_TEAM_ID}" -H "Authorization: Bearer ${VERCEL_TOKEN}")"
          current_prod="$(jq -r '.latestDeployments[0].id // .latestDeployment.id // empty' <<<"$project_json")"
          [[ "$current_prod" == "$EXPECTED_PRODUCTION_DEPLOYMENT" ]] || { echo "ERROR: production deployment changed unexpectedly: $current_prod"; exit 31; }
          echo 'PASS: production deployment remained unchanged.'

          body="$(jq -nc --arg project "$VERCEL_PROJECT_ID" '{name:"dabbir",project:$project,gitSource:{type:"github",org:"barman-systems",repo:"pilot",ref:"main"}}')"
          http="$(curl -sS -o "$RUNNER_TEMP/deploy.json" -w '%{http_code}' -X POST "https://api.vercel.com/v13/deployments?forceNew=1&teamId=${VERCEL_TEAM_ID}" -H "Authorization: Bearer ${VERCEL_TOKEN}" -H 'Content-Type: application/json' --data-binary "$body")"
          if [[ "$http" =~ ^2 ]]; then
            id="$(jq -r '.id // empty' "$RUNNER_TEMP/deploy.json")"
            echo "DIAG: preview deployment API works id=$id status=$http"
          else
            code="$(jq -r '.error.code // .code // "UNKNOWN"' "$RUNNER_TEMP/deploy.json" 2>/dev/null || echo UNKNOWN)"
            message="$(jq -r '.error.message // .message // "no message"' "$RUNNER_TEMP/deploy.json" 2>/dev/null || echo 'no message')"
            echo "DIAG: deployment API status=$http code=$code message=$message"
          fi
          echo 'PASS DABBIR_FAILED_CUTOVER_CLEANED'
