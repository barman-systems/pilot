name: DABBIR Sydney to Mumbai Migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dabbir-mumbai-migration.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: dabbir-mumbai-migration
  cancel-in-progress: false

jobs:
  stripe-sandbox-secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SUPABASE_URL: https://spohjzrsymsmzsseygtw.supabase.co
      TARGET_SUPABASE_URL: https://fphpoysqdsceniwduxjq.supabase.co
      BROKER_SLUG: dabbir-migration-oidc-broker
      OIDC_AUDIENCE: dabbir-mumbai-migration
    steps:
      - name: Migrate DABBIR Stripe sandbox secrets to Mumbai Vault
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y jq postgresql-client >/dev/null

          oidc_json="$(curl -fsS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          OIDC_TOKEN="$(jq -r '.value // empty' <<<"$oidc_json")"
          test -n "$OIDC_TOKEN" || { echo 'ERROR: OIDC token missing'; exit 20; }
          echo "::add-mask::$OIDC_TOKEN"

          broker_call(){ curl -fsS -X POST -H "Authorization: Bearer ${OIDC_TOKEN}" -H 'Content-Type: application/json' "$1/functions/v1/${BROKER_SLUG}"; }
          SOURCE_BROKER="$(broker_call "$SOURCE_SUPABASE_URL")"
          TARGET_BROKER="$(broker_call "$TARGET_SUPABASE_URL")"
          [[ "$(jq -r '.ok // false' <<<"$SOURCE_BROKER")" == true ]] || { echo 'ERROR: source broker denied'; exit 21; }
          [[ "$(jq -r '.ok // false' <<<"$TARGET_BROKER")" == true ]] || { echo 'ERROR: target broker denied'; exit 22; }

          STRIPE_SECRET_KEY="$(jq -r '.stripe_sandbox_secret_key // empty' <<<"$SOURCE_BROKER")"
          STRIPE_WEBHOOK_SECRET="$(jq -r '.stripe_webhook_secret // empty' <<<"$SOURCE_BROKER")"
          [[ "$STRIPE_SECRET_KEY" == sk_test_* ]] || { echo 'ERROR: source sandbox key unavailable or not test-mode'; exit 23; }
          [[ "$STRIPE_WEBHOOK_SECRET" == whsec_* ]] || { echo 'ERROR: source webhook signing secret unavailable'; exit 24; }
          echo "::add-mask::$STRIPE_SECRET_KEY"
          echo "::add-mask::$STRIPE_WEBHOOK_SECRET"

          thost="$(jq -r '.credential.db_host // empty' <<<"$TARGET_BROKER")"
          tuser="$(jq -r '.credential.db_user // empty' <<<"$TARGET_BROKER")"
          tpass="$(jq -r '.credential.db_password // empty' <<<"$TARGET_BROKER")"
          for x in "$thost" "$tuser" "$tpass"; do test -n "$x" || { echo 'ERROR: target DB credential missing'; exit 25; }; echo "::add-mask::$x"; done
          enc(){ python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "$1"; }
          TARGET_DATABASE_URL="postgresql://${tuser}:$(enc "$tpass")@${thost}:5432/postgres?sslmode=require"
          echo "::add-mask::$TARGET_DATABASE_URL"

          cat > "$RUNNER_TEMP/migrate-stripe-sandbox.sql" <<'SQL'
          select public.dabbir_migrate_stripe_sandbox_secrets_v1(:'stripe_key', :'webhook_key');
          SQL
          result="$(psql "$TARGET_DATABASE_URL" -X -A -t -q -v ON_ERROR_STOP=1 -v stripe_key="$STRIPE_SECRET_KEY" -v webhook_key="$STRIPE_WEBHOOK_SECRET" -f "$RUNNER_TEMP/migrate-stripe-sandbox.sql" | tr -d '\r\n')"
          [[ "$result" == t ]] || { echo 'ERROR: Mumbai Vault secret migration did not confirm'; exit 30; }

          verify="$(psql "$TARGET_DATABASE_URL" -X -A -t -q -v ON_ERROR_STOP=1 -c "select (secret_key like 'sk_test_%') and (webhook_secret like 'whsec_%') from public.dabbir_stripe_sandbox_runtime_secrets_v1();" | tr -d '\r\n')"
          [[ "$verify" == t ]] || { echo 'ERROR: Mumbai Vault runtime secret verification failed'; exit 31; }

          count="$(psql "$TARGET_DATABASE_URL" -X -A -t -q -v ON_ERROR_STOP=1 -c "select count(*) from vault.secrets where name in ('dabbir_stripe_secret_key_sandbox','dabbir_stripe_webhook_secret_sandbox');" | tr -d '\r\n')"
          [[ "$count" == 2 ]] || { echo "ERROR: expected 2 Mumbai Vault secrets, got $count"; exit 32; }
          echo 'PASS DABBIR_STRIPE_SANDBOX_SECRET_MIGRATION target=mumbai vault_secrets=2 live_key=not_touched values=masked'
