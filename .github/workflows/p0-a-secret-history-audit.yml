name: P0-A Secret History Audit

on:
  pull_request:
    paths:
      - '.github/workflows/p0-a-secret-history-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-history-secret-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify frozen base is reachable
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 1796df7fa7eab418157ecc7531313f0af0e73ebf^{commit}
          git merge-base --is-ancestor 1796df7fa7eab418157ecc7531313f0af0e73ebf HEAD

      - name: Run redacted Gitleaks full-history and tree scans
        id: scan
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p p0-a-evidence
          docker pull ghcr.io/gitleaks/gitleaks:v8.28.0

          docker run --rm -v "$GITHUB_WORKSPACE:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 \
            git --redact=100 --report-format json --report-path /repo/p0-a-evidence/gitleaks-history-report.json /repo
          history_status=$?

          docker run --rm -v "$GITHUB_WORKSPACE:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 \
            dir --redact=100 --report-format json --report-path /repo/p0-a-evidence/gitleaks-tree-report.json /repo
          tree_status=$?

          printf '{"base_sha":"%s","head_sha":"%s","history_status":%d,"tree_status":%d,"redaction":"100%%"}\n' \
            '1796df7fa7eab418157ecc7531313f0af0e73ebf' "$GITHUB_SHA" "$history_status" "$tree_status" \
            > p0-a-evidence/scan-summary.json

          echo "history_status=$history_status" >> "$GITHUB_OUTPUT"
          echo "tree_status=$tree_status" >> "$GITHUB_OUTPUT"

      - name: Upload redacted evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-a-secret-audit-${{ github.sha }}
          path: p0-a-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce zero untriaged findings
        if: always()
        shell: bash
        env:
          HISTORY_STATUS: ${{ steps.scan.outputs.history_status }}
          TREE_STATUS: ${{ steps.scan.outputs.tree_status }}
        run: |
          set -euo pipefail
          test "$HISTORY_STATUS" = '0'
          test "$TREE_STATUS" = '0'
