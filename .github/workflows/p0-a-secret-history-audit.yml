name: P0-A Secret History Audit

on:
  pull_request:
    paths:
      - '.github/workflows/p0-a-secret-history-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-history-secret-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout frozen tree with complete history
        uses: actions/checkout@v4
        with:
          ref: 1796df7fa7eab418157ecc7531313f0af0e73ebf
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact frozen SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '1796df7fa7eab418157ecc7531313f0af0e73ebf'
          git cat-file -e 1796df7fa7eab418157ecc7531313f0af0e73ebf^{commit}

      - name: Run redacted Gitleaks full-history and frozen-tree scans
        id: scan
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p p0-a-evidence
          docker pull ghcr.io/gitleaks/gitleaks:v8.28.0
          docker run --rm ghcr.io/gitleaks/gitleaks:v8.28.0 version > p0-a-evidence/gitleaks-version.txt

          history_status=0
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 \
            git --log-opts="--all" --redact=100 --report-format json \
            --report-path /repo/p0-a-evidence/gitleaks-history-report.json /repo \
            || history_status=$?
          test -f p0-a-evidence/gitleaks-history-report.json || printf '[]\n' > p0-a-evidence/gitleaks-history-report.json

          tree_status=0
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 \
            dir --redact=100 --report-format json \
            --report-path /repo/p0-a-evidence/gitleaks-tree-report.json /repo \
            || tree_status=$?
          test -f p0-a-evidence/gitleaks-tree-report.json || printf '[]\n' > p0-a-evidence/gitleaks-tree-report.json

          history_count="$(jq 'length' p0-a-evidence/gitleaks-history-report.json)"
          tree_count="$(jq 'length' p0-a-evidence/gitleaks-tree-report.json)"
          history_sha256="$(sha256sum p0-a-evidence/gitleaks-history-report.json | awk '{print $1}')"
          tree_sha256="$(sha256sum p0-a-evidence/gitleaks-tree-report.json | awk '{print $1}')"

          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg frozen_sha '1796df7fa7eab418157ecc7531313f0af0e73ebf' \
            --arg scanned_sha "$(git rev-parse HEAD)" \
            --arg history_sha256 "$history_sha256" \
            --arg tree_sha256 "$tree_sha256" \
            --argjson history_status "$history_status" \
            --argjson tree_status "$tree_status" \
            --argjson history_findings "$history_count" \
            --argjson tree_findings "$tree_count" \
            '{repo:$repo,frozen_sha:$frozen_sha,scanned_sha:$scanned_sha,history_scope:"git log -p --all",history_status:$history_status,tree_status:$tree_status,history_findings:$history_findings,tree_findings:$tree_findings,redaction:"100%",history_report_sha256:$history_sha256,tree_report_sha256:$tree_sha256}' \
            > p0-a-evidence/scan-summary.json

          echo "history_status=$history_status" >> "$GITHUB_OUTPUT"
          echo "tree_status=$tree_status" >> "$GITHUB_OUTPUT"
          echo "history_count=$history_count" >> "$GITHUB_OUTPUT"
          echo "tree_count=$tree_count" >> "$GITHUB_OUTPUT"

      - name: Verify candidate credentials without exporting raw values
        id: verify
        if: steps.scan.outputs.history_count != '0' || steps.scan.outputs.tree_count != '0'
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p p0-a-evidence /tmp/p0-a-trufflehog
          chmod 700 /tmp/p0-a-trufflehog
          docker pull trufflesecurity/trufflehog:3.97.4
          docker image inspect trufflesecurity/trufflehog:3.97.4 --format '{{index .RepoDigests 0}}' > p0-a-evidence/trufflehog-image-digest.txt

          verify_status=0
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" trufflesecurity/trufflehog:3.97.4 \
            git file:///repo --json --results=verified,unknown \
            > /tmp/p0-a-trufflehog/raw.jsonl 2> /tmp/p0-a-trufflehog/stderr.log \
            || verify_status=$?

          if [ -s /tmp/p0-a-trufflehog/raw.jsonl ]; then
            jq -s '[.[] | {
              verified:(.Verified // false),
              detector:(.DetectorName // "UNKNOWN"),
              decoder:(.DecoderName // "UNKNOWN"),
              commit:(.SourceMetadata.Data.Git.commit // null),
              file:(.SourceMetadata.Data.Git.file // null),
              line:(.SourceMetadata.Data.Git.line // null),
              has_verification_error:(.VerificationError != null)
            }]' /tmp/p0-a-trufflehog/raw.jsonl > p0-a-evidence/trufflehog-sanitized.json
          else
            printf '[]\n' > p0-a-evidence/trufflehog-sanitized.json
          fi

          verified_count="$(jq '[.[] | select(.verified == true)] | length' p0-a-evidence/trufflehog-sanitized.json)"
          unknown_count="$(jq '[.[] | select(.verified != true)] | length' p0-a-evidence/trufflehog-sanitized.json)"
          jq -n \
            --arg version '3.97.4' \
            --argjson scanner_status "$verify_status" \
            --argjson verified "$verified_count" \
            --argjson unknown "$unknown_count" \
            '{scanner:"trufflehog",version:$version,scanner_status:$scanner_status,verified_findings:$verified,unknown_findings:$unknown,raw_output_persisted:false}' \
            > p0-a-evidence/trufflehog-summary.json

          rm -rf /tmp/p0-a-trufflehog
          echo "verify_status=$verify_status" >> "$GITHUB_OUTPUT"
          echo "verified_count=$verified_count" >> "$GITHUB_OUTPUT"
          echo "unknown_count=$unknown_count" >> "$GITHUB_OUTPUT"

      - name: Upload redacted evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-a-secret-audit-${{ github.sha }}
          path: p0-a-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce zero untriaged findings
        if: always()
        shell: bash
        env:
          HISTORY_STATUS: ${{ steps.scan.outputs.history_status }}
          TREE_STATUS: ${{ steps.scan.outputs.tree_status }}
          HISTORY_COUNT: ${{ steps.scan.outputs.history_count }}
          TREE_COUNT: ${{ steps.scan.outputs.tree_count }}
          VERIFY_STATUS: ${{ steps.verify.outputs.verify_status }}
          VERIFIED_COUNT: ${{ steps.verify.outputs.verified_count }}
          UNKNOWN_COUNT: ${{ steps.verify.outputs.unknown_count }}
        run: |
          set -euo pipefail
          test "$HISTORY_STATUS" = '0'
          test "$TREE_STATUS" = '0'
          test "$HISTORY_COUNT" = '0'
          test "$TREE_COUNT" = '0'
          if [ -n "${VERIFY_STATUS:-}" ]; then test "$VERIFY_STATUS" = '0'; fi
          if [ -n "${VERIFIED_COUNT:-}" ]; then test "$VERIFIED_COUNT" = '0'; fi
          if [ -n "${UNKNOWN_COUNT:-}" ]; then test "$UNKNOWN_COUNT" = '0'; fi
