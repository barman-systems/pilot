name: DABBIR WhatsApp Secret Restore Probe

on:
  push:
    branches: [ops/dabbir-whatsapp-secret-restore-probe]

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DABBIR_SECRET: ${{ secrets.DABBIR_WHATSAPP_APP_SECRET }}
      PILOT_SECRET: ${{ secrets.PILOT_WHATSAPP_APP_SECRET }}
      META_SECRET: ${{ secrets.META_APP_SECRET }}
      FACEBOOK_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
      DABBIR_VERIFY: ${{ secrets.DABBIR_WHATSAPP_VERIFY_TOKEN }}
      PILOT_VERIFY: ${{ secrets.PILOT_WHATSAPP_VERIFY_TOKEN }}
      GENERIC_VERIFY: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
      VERCEL_TOKEN_PRIMARY: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TOKEN_BARMAN: ${{ secrets.BARMAN_VERCEL_TOKEN }}
      PROJECT_ID: prj_HCTFdQo8Vc7FvZRdJ37H7KFYwpUq
      TEAM_ID: team_pwfKq8jHuyW1XFVSZirAJiId
    steps:
      - name: Presence-only secret probe and encrypted restore
        shell: bash
        run: |
          set -euo pipefail

          APP_SECRET="${DABBIR_SECRET:-${PILOT_SECRET:-${META_SECRET:-${FACEBOOK_SECRET:-}}}}"
          VERIFY_TOKEN="${DABBIR_VERIFY:-${PILOT_VERIFY:-${GENERIC_VERIFY:-}}}"
          VERCEL_TOKEN_EFFECTIVE="${VERCEL_TOKEN_PRIMARY:-${VERCEL_TOKEN_BARMAN:-}}"

          if [ -n "$APP_SECRET" ]; then echo "app_secret=present"; else echo "app_secret=missing"; fi
          if [ -n "$VERIFY_TOKEN" ]; then echo "verify_token=present"; else echo "verify_token=missing"; fi
          if [ -n "$VERCEL_TOKEN_EFFECTIVE" ]; then echo "vercel_token=present"; else echo "vercel_token=missing"; fi

          if [ -z "$APP_SECRET" ] || [ -z "$VERCEL_TOKEN_EFFECTIVE" ]; then
            echo "restore=not_possible_from_github_secrets"
            exit 0
          fi

          export APP_SECRET VERIFY_TOKEN
          APP_PAYLOAD="$(python - <<'PY'
          import json, os
          print(json.dumps({
            'key': 'DABBIR_WHATSAPP_APP_SECRET',
            'value': os.environ['APP_SECRET'],
            'type': 'encrypted',
            'target': ['production', 'preview'],
            'comment': 'Restored from retained GitHub secret without exposing the value'
          }))
          PY
          )"

          STATUS="$(curl -sS -o /tmp/vercel-app-secret-response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN_EFFECTIVE" \
            -H 'Content-Type: application/json' \
            --data "$APP_PAYLOAD" \
            "https://api.vercel.com/v10/projects/${PROJECT_ID}/env?upsert=true&teamId=${TEAM_ID}")"

          if [[ "$STATUS" =~ ^2 ]]; then
            echo "app_secret_restore=success"
          else
            echo "app_secret_restore=failed_http_${STATUS}"
            exit 1
          fi

          if [ -n "$VERIFY_TOKEN" ]; then
            VERIFY_PAYLOAD="$(python - <<'PY'
          import json, os
          print(json.dumps({
            'key': 'DABBIR_WHATSAPP_VERIFY_TOKEN',
            'value': os.environ['VERIFY_TOKEN'],
            'type': 'encrypted',
            'target': ['production', 'preview'],
            'comment': 'Restored from retained GitHub secret without exposing the value'
          }))
          PY
            )"
            VERIFY_STATUS="$(curl -sS -o /tmp/vercel-verify-response.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN_EFFECTIVE" \
              -H 'Content-Type: application/json' \
              --data "$VERIFY_PAYLOAD" \
              "https://api.vercel.com/v10/projects/${PROJECT_ID}/env?upsert=true&teamId=${TEAM_ID}")"
            if [[ "$VERIFY_STATUS" =~ ^2 ]]; then
              echo "verify_token_restore=success"
            else
              echo "verify_token_restore=failed_http_${VERIFY_STATUS}"
              exit 1
            fi
          else
            echo "verify_token_restore=skipped_missing_source"
          fi
