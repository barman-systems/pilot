name: Booking lifecycle regression
on:
  pull_request:
    paths:
      - 'api/**'
      - 'test/dabbir-booking-lifecycle*.test.mjs'
      - 'scripts/qa-booking-lifecycle-browser.mjs'
      - 'scripts/qa-webkit-sidebar-navigation.mjs'
      - '.github/workflows/booking-lifecycle-regression.yml'
permissions:
  contents: read
jobs:
  browser:
    name: Booking lifecycle browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Lifecycle and authenticated API regressions
        run: node --test test/dabbir-booking-lifecycle*.test.mjs
      - name: Install pinned isolated browser verifier
        run: |
          # Playwright installs its own pinned Chromium/WebKit builds. The hosted
          # runner's unrelated Google Chrome apt source can be temporarily
          # inconsistent and must not prevent installing Ubuntu browser deps.
          for source in /etc/apt/sources.list.d/*; do
            if [ -f "$source" ] && grep -q 'dl.google.com/linux/chrome-stable/deb' "$source"; then
              sudo rm -f "$source"
            fi
          done
          npm install --prefix "$RUNNER_TEMP/booking-playwright" --no-audit --no-fund --ignore-scripts playwright@1.63.0
          node "$RUNNER_TEMP/booking-playwright/node_modules/playwright/cli.js" install --with-deps chromium webkit
      - name: Production-pinned WebKit sidebar navigation regression
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/navigation-playwright/node_modules/playwright
          BOOKING_BROWSER_OUTPUT: booking-browser-evidence
        run: |
          npm install --prefix "$RUNNER_TEMP/navigation-playwright" --no-audit --no-fund --ignore-scripts playwright@1.62.1
          node "$PLAYWRIGHT_PATH/cli.js" install webkit
          node scripts/build-dabbir-ui-bundles.mjs
          node scripts/qa-webkit-sidebar-navigation.mjs
      - name: iPhone and iPad browser matrix over real served UI
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/booking-playwright/node_modules/playwright
          BOOKING_BROWSER_OUTPUT: booking-browser-evidence
        run: node scripts/qa-booking-lifecycle-browser.mjs
      - name: First appointment activation and retry on iPhone and iPad
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/booking-playwright/node_modules/playwright
          BOOKING_BROWSER_OUTPUT: booking-browser-evidence
        run: node scripts/qa-activation-booking-browser.mjs
      - name: Owner knowledge modal with active onboarding overlay
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/booking-playwright/node_modules/playwright
          BOOKING_BROWSER_OUTPUT: booking-browser-evidence
        run: node scripts/qa-understanding-knowledge-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: booking-lifecycle-browser-${{ github.run_id }}
          path: booking-browser-evidence/
          retention-days: 7
          if-no-files-found: warn
