name: DABBIR Supabase env normalize once

on:
  push:
    branches:
      - chore/dabbir-fail-closed-supabase-origin-20260902

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/dabbir-fail-closed-supabase-origin-20260902
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Normalize missing-env behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          changed = []
          replacements = {
              "String(process.env.SUPABASE_URL).replace": "String(process.env.SUPABASE_URL || '').replace",
              "String(process.env.SUPABASE_AUTH_URL || process.env.SUPABASE_URL).replace": "String(process.env.SUPABASE_AUTH_URL || process.env.SUPABASE_URL || '').replace",
              "String(process.env.SUPABASE_DATA_URL || process.env.SUPABASE_URL).replace": "String(process.env.SUPABASE_DATA_URL || process.env.SUPABASE_URL || '').replace",
          }
          for path in sorted(Path('api').rglob('*.js')):
              source = path.read_text()
              updated = source
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != source:
                  path.write_text(updated)
                  changed.append(str(path))
          print('Normalized:')
          for item in changed:
              print(item)
          PY
          node --test test/dabbir-no-retired-supabase-origin.test.mjs
          if grep -RIn --include='*.js' 'String(process.env.SUPABASE_URL).replace' api; then exit 1; fi
          if grep -RIn --include='*.js' -E 'spohjzrsymsmzsseygtw|sb_publishable_WPxhwNf08BW1FgBptkinWg_3j75O4O3' api; then exit 1; fi
          while IFS= read -r file; do node --check "$file"; done < <(grep -RIl --include='*.js' -E 'SUPABASE_(AUTH_URL|DATA_URL|URL|PUBLISHABLE_KEY)' api | sort)
      - name: Commit normalization
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api
          git commit -m 'chore(dabbir): normalize fail-closed Supabase env handling'
          git push origin HEAD:chore/dabbir-fail-closed-supabase-origin-20260902
