name: Dabbir Trigger dev proof
on:
  push:
    branches:
      - feat/langfuse-trigger-observability-pilot
    paths:
      - '.github/workflows/dabbir-trigger-dev-proof.yml'
      - 'integrations/trigger/**'
permissions:
  contents: read
jobs:
  prove-trigger-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: prj_HCTFdQo8Vc7FvZRdJ37H7KFYwpUq
      VERCEL_TEAM_ID: team_pwfKq8jHuyW1XFVSZirAJiId
      VERCEL_TEAM_SLUG: nd56cm4j5v-3619s-projects
      TRIGGER_PROJECT_REF: proj_xjuzxmngkrrookqpenll
      TRIGGER_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pull Preview secrets from Vercel without printing values
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo 'VERCEL_TOKEN unavailable'; exit 2; }
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_TEAM_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          if ! npx --yes vercel@latest env pull /tmp/dabbir-preview.env --environment=preview --scope="$VERCEL_TEAM_SLUG" --token="$VERCEL_TOKEN" >/tmp/vercel-env-pull.log 2>&1; then
            echo 'Vercel Preview env pull failed:'
            sed -E 's/(token|secret|key)[=:][^[:space:]]+ /\1=[REDACTED] /Ig; s/(tr_(dev|prod|stg|pat)_[A-Za-z0-9_-]+)/[REDACTED_TRIGGER_KEY]/g; s/(sk-lf-[A-Za-z0-9_-]+)/[REDACTED_LANGFUSE_SECRET]/g' /tmp/vercel-env-pull.log | tail -60
            exit 2
          fi
          chmod 600 /tmp/dabbir-preview.env
          set -a
          . /tmp/dabbir-preview.env
          set +a
          test -n "${TRIGGER_SECRET_KEY:-}" || { echo 'TRIGGER_SECRET_KEY missing in Preview'; exit 3; }
          test -n "${LANGFUSE_PUBLIC_KEY:-}" || { echo 'LANGFUSE_PUBLIC_KEY missing in Preview'; exit 3; }
          test -n "${LANGFUSE_SECRET_KEY:-}" || { echo 'LANGFUSE_SECRET_KEY missing in Preview'; exit 3; }
          test -n "${LANGFUSE_BASE_URL:-}" || { echo 'LANGFUSE_BASE_URL missing in Preview'; exit 3; }
          {
            echo "TRIGGER_SECRET_KEY<<EOF"
            printf '%s\n' "$TRIGGER_SECRET_KEY"
            echo "EOF"
            echo "LANGFUSE_PUBLIC_KEY<<EOF"
            printf '%s\n' "$LANGFUSE_PUBLIC_KEY"
            echo "EOF"
            echo "LANGFUSE_SECRET_KEY<<EOF"
            printf '%s\n' "$LANGFUSE_SECRET_KEY"
            echo "EOF"
            echo "LANGFUSE_BASE_URL<<EOF"
            printf '%s\n' "$LANGFUSE_BASE_URL"
            echo "EOF"
            echo 'DABBIR_LANGFUSE_ENABLED=1'
          } >> "$GITHUB_ENV"
          rm -f /tmp/dabbir-preview.env /tmp/vercel-env-pull.log
      - name: Install isolated Trigger package
        run: npm install --prefix integrations/trigger --ignore-scripts --no-audit --no-fund
      - name: Start Trigger dev worker and prove one synthetic run
        shell: bash
        run: |
          set -euo pipefail
          cd integrations/trigger
          npm run dev >/tmp/trigger-dev.log 2>&1 &
          dev_pid=$!
          cleanup() { kill "$dev_pid" 2>/dev/null || true; rm -f /tmp/trigger-dev.log; }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 30); do
            if ! kill -0 "$dev_pid" 2>/dev/null; then
              echo 'Trigger dev worker exited before becoming ready.'
              sed -E 's/(tr_(dev|prod|stg|pat)_[A-Za-z0-9_-]+)/[REDACTED_TRIGGER_KEY]/g; s/(sk-lf-[A-Za-z0-9_-]+)/[REDACTED_LANGFUSE_SECRET]/g' /tmp/trigger-dev.log | tail -80
              exit 4
            fi
            if grep -Eqi 'task|ready|registered|listening|connected' /tmp/trigger-dev.log; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1 || { echo 'Trigger dev worker readiness not observed.'; exit 5; }

          payload='{"version":1,"traceId":"0123456789abcdef0123456789abcdef","spanId":"0123456789abcdef","timestampMs":1788635200000,"environment":"preview","outcome":"VERIFIED_SUCCESS","failureClass":null,"provider":"vercel-ai-gateway","model":"google/gemini-3.7-flash","actualCostUsd":0,"promptTokens":0,"completionTokens":0,"attempts":1}'
          response=$(curl --fail-with-body --silent --show-error --max-time 10 \
            -X POST "https://api.trigger.dev/api/v1/tasks/dabbir-export-ai-budget-observation/trigger" \
            -H "Authorization: Bearer $TRIGGER_SECRET_KEY" \
            -H 'Content-Type: application/json' \
            --data "{\"payload\":$payload,\"options\":{\"idempotencyKey\":\"dabbir-ci-proof-${GITHUB_RUN_ID}\",\"ttl\":\"1h\"}}")
          run_id=$(printf '%s' "$response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s); if(!/^run_[A-Za-z0-9_-]+$/.test(x.id||'')) process.exit(2); process.stdout.write(x.id)})")
          echo 'Synthetic Trigger run accepted.'

          state=''
          for _ in $(seq 1 40); do
            run=$(curl --fail-with-body --silent --show-error --max-time 10 \
              -H "Authorization: Bearer $TRIGGER_SECRET_KEY" \
              "https://api.trigger.dev/api/v3/runs/$run_id")
            state=$(printf '%s' "$run" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s); process.stdout.write(String(x.status||'UNKNOWN'))})")
            case "$state" in
              COMPLETED) echo 'Trigger run COMPLETED and worker executed.'; exit 0 ;;
              FAILED|CRASHED|INTERRUPTED|SYSTEM_FAILURE|CANCELED|CANCELLED) echo "Trigger run terminal failure: $state"; exit 6 ;;
            esac
            sleep 2
          done
          echo "Trigger run did not finish within proof window; last state=$state"
          exit 7
