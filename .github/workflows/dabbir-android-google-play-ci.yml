name: DABBIR Android Google Play CI

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'api/_google-play-iap-core.js'
      - 'api/mobile/iap/**'
      - 'supabase/migrations/**'
      - 'delete-account.html'
      - 'privacy.html'
      - 'vercel.json'
      - 'compliance/google-play-data-safety-candidate.json'
      - 'scripts/dabbir-google-play-preflight.mjs'
      - 'test/dabbir-google-play-iap.test.mjs'
      - '.github/workflows/dabbir-android-google-play-ci.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'api/_google-play-iap-core.js'
      - 'api/mobile/iap/**'
      - 'supabase/migrations/**'
      - 'delete-account.html'
      - 'privacy.html'
      - 'vercel.json'
      - 'compliance/google-play-data-safety-candidate.json'
      - 'scripts/dabbir-google-play-preflight.mjs'
      - 'test/dabbir-google-play-iap.test.mjs'
      - '.github/workflows/dabbir-android-google-play-ci.yml'

permissions:
  contents: read

concurrency:
  group: dabbir-android-google-play-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  play-static:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run Google Play static preflight
        run: node scripts/dabbir-google-play-preflight.mjs
      - name: Run Google Play server verification tests
        run: node --test test/dabbir-google-play-iap.test.mjs
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Expo doctor
        working-directory: mobile
        run: npx expo-doctor
      - name: TypeScript
        working-directory: mobile
        run: npx tsc --noEmit
      - name: Validate Android Expo config
        working-directory: mobile
        run: |
          npx expo config --type public --json > /tmp/dabbir-android-expo-config.json
          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('/tmp/dabbir-android-expo-config.json', 'utf8'));
          if (config?.android?.package !== 'com.barmansystems.dabbir') throw new Error('ANDROID_PACKAGE_MISMATCH');
          NODE
      - name: Upload Google Play preflight evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dabbir-google-play-static-evidence
          path: |
            /tmp/dabbir-android-expo-config.json
            compliance/google-play-data-safety-candidate.json
          if-no-files-found: warn
          retention-days: 30

  android-native-bundle-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund
      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Verify generated Android API 36 configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -R "36" android/gradle.properties android/build.gradle android/app/build.gradle >/tmp/dabbir-api36-evidence.txt || {
            echo 'Generated Android project does not expose API 36 configuration evidence.' >&2
            exit 31
          }
          grep -R "com.barmansystems.dabbir" android/app/build.gradle android/app/src/main/AndroidManifest.xml >>/tmp/dabbir-api36-evidence.txt || {
            echo 'Generated Android package evidence missing.' >&2
            exit 32
          }
      - name: Use verified official Gradle release artifact
        shell: bash
        run: |
          set -euo pipefail
          # services.gradle.org returned repeated 504s before compilation.
          # Same publisher/version/bytes: https://gradle.org/release-checksums/
          python3 - <<'PY_GRADLE'
          from pathlib import Path
          wrapper = Path('android/gradle/wrapper/gradle-wrapper.properties')
          text = wrapper.read_text()
          expected = r'distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip'
          release = r'distributionUrl=https\://github.com/gradle/gradle-distributions/releases/download/v9.3.1/gradle-9.3.1-bin.zip'
          checksum = 'distributionSha256Sum=b266d5ff6b90eada6dc3b20cb090e3731302e553a27c5d3e4df1f0d76beaff06'
          assert expected in text, 'Review the generated Gradle version before changing its distribution source'
          checksums = [line for line in text.splitlines() if line.startswith('distributionSha256Sum=')]
          assert not checksums or checksums == [checksum], 'Unexpected Gradle distribution checksum'
          text = text.replace(expected, release)
          if not checksums:
              text = text.rstrip() + '\n' + checksum + '\n'
          wrapper.write_text(text)
          PY_GRADLE
      - name: Compile Release Android App Bundle
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew :app:bundleRelease --no-daemon --stacktrace
      - name: Record Android bundle evidence
        shell: bash
        run: |
          set -euo pipefail
          bundle="$(find android/app/build/outputs/bundle/release -name '*.aab' -type f | head -n 1)"
          [[ -n "${bundle}" && -s "${bundle}" ]] || { echo 'Release AAB compile artifact not found.' >&2; exit 33; }
          sha256sum "${bundle}" > /tmp/dabbir-android-bundle-sha256.txt
          printf 'commit=%s\nartifact=%s\n' "${GITHUB_SHA}" "${bundle}" >> /tmp/dabbir-android-bundle-sha256.txt
      - name: Upload Android compile evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dabbir-android-native-compile-evidence
          path: |
            mobile/android/app/build/outputs/bundle/release/*.aab
            /tmp/dabbir-api36-evidence.txt
            /tmp/dabbir-android-bundle-sha256.txt
          if-no-files-found: warn
          retention-days: 14
