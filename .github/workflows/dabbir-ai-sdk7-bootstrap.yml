name: DABBIR AI SDK 7 bootstrap

on:
  push:
    branches:
      - feat/dabbir-intelligence-flywheel-v1
    paths:
      - .github/workflows/dabbir-ai-sdk7-bootstrap.yml

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dabbir-intelligence-flywheel-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Upgrade AI SDK production line
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact \
            ai@7.0.62 \
            @ai-sdk/openai-compatible@3.0.44 \
            @ai-sdk/otel@1.0.62 \
            @ai-sdk/workflow@1.0.62 \
            workflow@4.8.5 \
            zod@4.5.4
      - name: Update version contract
        run: |
          cat > test/ai-sdk-version-contract.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const pkg = JSON.parse(fs.readFileSync(new URL('../package.json', import.meta.url), 'utf8'));
          const lock = JSON.parse(fs.readFileSync(new URL('../package-lock.json', import.meta.url), 'utf8'));
          const packages = lock.packages || {};

          test('DABBIR stays on the stable AI SDK 7 + Workflow 4 production line', () => {
            const expected={
              ai:'7.0.62',
              '@ai-sdk/openai-compatible':'3.0.44',
              '@ai-sdk/otel':'1.0.62',
              '@ai-sdk/workflow':'1.0.62',
              workflow:'4.8.5',
              zod:'4.5.4',
            };
            for (const [name,version] of Object.entries(expected)) {
              assert.equal(pkg.dependencies?.[name],version);
              assert.equal(packages[`node_modules/${name}`]?.version,version);
            }
          });

          test('OpenAI-compatible adapter resolves a single provider protocol line', () => {
            const compatible=packages['node_modules/@ai-sdk/openai-compatible'];
            const rootProvider=packages['node_modules/@ai-sdk/provider'];
            assert.ok(compatible);
            assert.ok(rootProvider);
            assert.ok(compatible.dependencies?.['@ai-sdk/provider']);
            assert.equal(packages['node_modules/@ai-sdk/openai-compatible/node_modules/@ai-sdk/provider'], undefined);
          });

          test('WorkflowAgent remains on stable Workflow 4 rather than Workflow 5 beta', () => {
            const workflowAgent=packages['node_modules/@ai-sdk/workflow'];
            assert.ok(workflowAgent);
            assert.equal(packages['node_modules/workflow']?.version,'4.8.5');
            assert.equal(packages['node_modules/workflow']?.version.includes('beta'),false);
          });
          EOF
      - name: Remove one-shot bootstrap workflow
        run: rm .github/workflows/dabbir-ai-sdk7-bootstrap.yml
      - name: Commit generated lockfile
        run: |
          git config user.name dabbir-release-guardian
          git config user.email dabbir-release-guardian@users.noreply.github.com
          git add package.json package-lock.json test/ai-sdk-version-contract.test.mjs .github/workflows/dabbir-ai-sdk7-bootstrap.yml
          git commit -m "chore(ai): move DABBIR to stable AI SDK 7 production line"
          git push origin HEAD:feat/dabbir-intelligence-flywheel-v1
