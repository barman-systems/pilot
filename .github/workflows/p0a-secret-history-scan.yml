name: P0-A Secret History Scan

on:
  pull_request:
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout full history without persisted credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan current tree and git history with redaction
        shell: bash
        run: |
          set -euo pipefail
          image=ghcr.io/gitleaks/gitleaks:v8.24.3
          docker pull "$image" >/dev/null
          docker run --rm -v "$PWD:/repo" -w /repo "$image" \
            dir /repo --redact --no-banner --exit-code 0 \
            --report-format json --report-path /repo/.gitleaks-current.json
          docker run --rm -v "$PWD:/repo" -w /repo "$image" \
            detect --source /repo --redact --no-banner --exit-code 0 \
            --report-format json --report-path /repo/.gitleaks-history.json
          node <<'NODE'
          const fs=require('fs');
          const read=p=>{try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch{return []}};
          const current=read('.gitleaks-current.json');
          const history=read('.gitleaks-history.json');
          const summarize=rows=>{
            const grouped=new Map();
            for(const r of rows){
              const key=`${r.RuleID||'unknown'}|${r.File||'unknown'}`;
              if(!grouped.has(key))grouped.set(key,{rule_id:r.RuleID||'unknown',file:r.File||'unknown',count:0,commits:new Set()});
              const g=grouped.get(key);g.count++;
              if(r.Commit)g.commits.add(String(r.Commit).slice(0,12));
            }
            return [...grouped.values()].map(g=>({rule_id:g.rule_id,file:g.file,count:g.count,commits:[...g.commits].slice(0,5)})).sort((a,b)=>b.count-a.count||a.file.localeCompare(b.file));
          };
          console.log(`P0A_CURRENT_FINDINGS=${current.length}`);
          console.log(`P0A_HISTORY_FINDINGS=${history.length}`);
          console.log('P0A_CURRENT_METADATA='+JSON.stringify(summarize(current)));
          console.log('P0A_HISTORY_METADATA='+JSON.stringify(summarize(history)));
          fs.rmSync('.gitleaks-current.json',{force:true});
          fs.rmSync('.gitleaks-history.json',{force:true});
          if(current.length||history.length)process.exit(1);
          NODE
