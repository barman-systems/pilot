name: P0-A Secret History Scan

on:
  pull_request:
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0a-secret-history-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  P0A_SECRET_BASELINE: docs/audits/DABBIR_P0A_SECRET_REVIEW_BASELINE.json

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout complete Git history without persisted credentials
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate redacted current and explicit all-ref history reports
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p0-a-evidence
          image=ghcr.io/gitleaks/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
          docker pull "$image" >/dev/null
          printf '%s\n' "$image" > p0-a-evidence/gitleaks-image.txt

          docker run --rm -v "$PWD:/repo" -w /repo "$image" \
            dir /repo --redact=100 --no-banner --exit-code 0 \
            --report-format json --report-path /repo/.gitleaks-current.json

          docker run --rm -v "$PWD:/repo" -w /repo "$image" \
            git --log-opts="--all" /repo --redact=100 --no-banner --exit-code 0 \
            --report-format json --report-path /repo/.gitleaks-history.json

          cp .gitleaks-current.json p0-a-evidence/gitleaks-current-report.json
          cp .gitleaks-history.json p0-a-evidence/gitleaks-history-report.json
          current_count="$(jq 'length' .gitleaks-current.json)"
          history_count="$(jq 'length' .gitleaks-history.json)"
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg sha "$GITHUB_SHA" \
            --arg history_scope 'git log -p --all' \
            --argjson current_findings "$current_count" \
            --argjson history_findings "$history_count" \
            '{repository:$repo,exact_head_sha:$sha,history_scope:$history_scope,current_findings:$current_findings,history_findings:$history_findings,redaction:"100%",credential_values_persisted:false}' \
            > p0-a-evidence/scan-summary.json
          echo "current_count=$current_count" >> "$GITHUB_OUTPUT"
          echo "history_count=$history_count" >> "$GITHUB_OUTPUT"

      - name: Verify candidate credentials without persisting raw values
        id: verify
        if: steps.scan.outputs.current_count != '0' || steps.scan.outputs.history_count != '0'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p0a-trufflehog
          chmod 700 /tmp/p0a-trufflehog
          image=trufflesecurity/trufflehog:3.97.4
          docker pull "$image" >/dev/null
          docker image inspect "$image" --format '{{index .RepoDigests 0}}' > p0-a-evidence/trufflehog-image-digest.txt

          status=0
          docker run --rm -v "$PWD:/repo:ro" "$image" \
            git file:///repo --json --results=verified,unknown \
            > /tmp/p0a-trufflehog/raw.jsonl 2>/tmp/p0a-trufflehog/stderr.log || status=$?

          if [ -s /tmp/p0a-trufflehog/raw.jsonl ]; then
            jq -s '[.[] | {
              verified:(.Verified // false),
              detector:(.DetectorName // "UNKNOWN"),
              decoder:(.DecoderName // "UNKNOWN"),
              commit:(.SourceMetadata.Data.Git.commit // null),
              file:(.SourceMetadata.Data.Git.file // null),
              line:(.SourceMetadata.Data.Git.line // null),
              has_verification_error:(.VerificationError != null)
            }]' /tmp/p0a-trufflehog/raw.jsonl > p0-a-evidence/trufflehog-sanitized.json
          else
            printf '[]\n' > p0-a-evidence/trufflehog-sanitized.json
          fi

          verified_count="$(jq '[.[] | select(.verified == true)] | length' p0-a-evidence/trufflehog-sanitized.json)"
          unknown_count="$(jq '[.[] | select(.verified != true)] | length' p0-a-evidence/trufflehog-sanitized.json)"
          jq -n --argjson scanner_status "$status" --argjson verified "$verified_count" --argjson unknown "$unknown_count" \
            '{scanner:"trufflehog",version:"3.97.4",scanner_status:$scanner_status,verified_findings:$verified,unknown_findings:$unknown,raw_output_persisted:false}' \
            > p0-a-evidence/trufflehog-summary.json
          rm -rf /tmp/p0a-trufflehog
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "verified_count=$verified_count" >> "$GITHUB_OUTPUT"
          echo "unknown_count=$unknown_count" >> "$GITHUB_OUTPUT"

      - name: Upload redacted machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0a-secret-history-${{ github.sha }}
          path: p0-a-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Require no live or unverifiable credential candidate
        if: always()
        shell: bash
        env:
          VERIFY_STATUS: ${{ steps.verify.outputs.status }}
          VERIFIED_COUNT: ${{ steps.verify.outputs.verified_count }}
          UNKNOWN_COUNT: ${{ steps.verify.outputs.unknown_count }}
        run: |
          set -euo pipefail
          if [ -n "${VERIFY_STATUS:-}" ]; then test "$VERIFY_STATUS" = '0'; fi
          if [ -n "${VERIFIED_COUNT:-}" ]; then test "$VERIFIED_COUNT" = '0'; fi
          if [ -n "${UNKNOWN_COUNT:-}" ]; then test "$UNKNOWN_COUNT" = '0'; fi

      - name: Require exact reviewed fingerprint baseline
        if: always()
        run: node scripts/p0a-secret-baseline-gate.mjs "$P0A_SECRET_BASELINE"
