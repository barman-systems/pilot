name: P0-A Secret History Scan

on:
  pull_request:
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout full history without persisted credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan current tree and git history with redaction
        shell: bash
        run: |
          set -euo pipefail
          image=ghcr.io/gitleaks/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
          docker pull "$image" >/dev/null
          docker run --rm -v "$PWD:/repo" -w /repo "$image" \
            dir /repo --redact --no-banner --exit-code 0 \
            --report-format json --report-path /repo/.gitleaks-current.json
          docker run --rm -v "$PWD:/repo" -w /repo "$image" \
            detect --source /repo --redact --no-banner --exit-code 0 \
            --report-format json --report-path /repo/.gitleaks-history.json
          node <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const read=p=>{try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch{return []}};
          const current=read('.gitleaks-current.json');
          const history=read('.gitleaks-history.json');
          const cleanPath=p=>String(p||'unknown').replace(/^\/repo\//,'');
          const sanitize=rows=>rows.map(r=>({rule_id:r.RuleID||'unknown',file:cleanPath(r.File),start_line:Number(r.StartLine)||null,end_line:Number(r.EndLine)||null,commit:r.Commit?String(r.Commit).slice(0,12):null}));
          const sha256=value=>crypto.createHash('sha256').update(String(value)).digest('hex');
          const fileDigest=file=>{try{return sha256(fs.readFileSync(file))}catch{return null}};
          const fingerprint=(r,mode)=>{
            const file=cleanPath(r.File), line=Number(r.StartLine)||0, rule=r.RuleID||'unknown';
            const anchor=mode==='current'?fileDigest(file):(r.Commit?String(r.Commit):'NO_COMMIT');
            return sha256(JSON.stringify([mode,rule,file,line,anchor]));
          };
          const summarize=rows=>{
            const grouped=new Map();
            for(const r of sanitize(rows)){
              const key=`${r.rule_id}|${r.file}`;
              if(!grouped.has(key))grouped.set(key,{rule_id:r.rule_id,file:r.file,count:0,lines:new Set(),commits:new Set()});
              const g=grouped.get(key);g.count++;
              if(r.start_line)g.lines.add(r.start_line);
              if(r.commit)g.commits.add(r.commit);
            }
            return [...grouped.values()].map(g=>({rule_id:g.rule_id,file:g.file,count:g.count,lines:[...g.lines].sort((a,b)=>a-b).slice(0,20),commits:[...g.commits].slice(0,5)})).sort((a,b)=>b.count-a.count||a.file.localeCompare(b.file));
          };
          function pathClass(file){
            if(file.startsWith('test/')||file.includes('/test/')||/\.test\.[cm]?[jt]sx?$/.test(file))return 'TEST';
            if(file.startsWith('docs/'))return 'DOC';
            if(file.includes('/migrations/')||file.startsWith('database/migrations/')||file.startsWith('supabase/migrations/'))return 'MIGRATION';
            if(file.startsWith('.github/'))return 'WORKFLOW';
            if(file.startsWith('api/')||/^workers\/[^/]+\/api\//.test(file)||file.startsWith('supabase/functions/')||file.startsWith('infra/runtime/'))return 'RUNTIME';
            if(file.startsWith('apps/'))return 'APP';
            return 'OTHER';
          }
          function entropy(s){
            if(!s)return 0; const m=new Map(); for(const c of s)m.set(c,(m.get(c)||0)+1); let h=0; for(const n of m.values()){const p=n/s.length;h-=p*Math.log2(p)} return Math.round(h*100)/100;
          }
          function stripStrings(line){
            let out='',quote=null,escaped=false;
            for(const c of String(line||'')){
              if(quote){
                if(escaped){escaped=false;continue}
                if(c==='\\'){escaped=true;continue}
                if(c===quote){out+=' <STR> ';quote=null}
                continue;
              }
              if(c==='\''||c==='"'||c==='`'){quote=c;continue}
              out+=c;
            }
            if(quote)out+=' <STR> ';
            return out;
          }
          function tokensOnly(line){
            const stripped=stripStrings(line);
            return [...stripped.matchAll(/[A-Za-z_$][A-Za-z0-9_$]*/g)].map(m=>m[0]).filter(x=>x!=='STR').slice(0,40);
          }
          function safeContext(file,lineNo){
            let lines=[];try{lines=fs.readFileSync(file,'utf8').split(/\r?\n/)}catch{return []}
            const out=[];
            for(let offset=-2;offset<=2;offset++){
              const index=lineNo-1+offset;if(index<0||index>=lines.length)continue;
              out.push({offset,tokens:tokensOnly(lines[index])});
            }
            return out;
          }
          function structural(line){
            const stripped=stripStrings(line);
            const declaration=stripped.match(/\b(?:const|let|var)\s+([A-Za-z_$][A-Za-z0-9_$]*)/)?.[1]
              || stripped.match(/^\s*([A-Za-z_][A-Za-z0-9_]*)\s*=/)?.[1]
              || null;
            const env_names=[...stripped.matchAll(/process\.env\.([A-Z0-9_]+)/g)].map(m=>m[1]).slice(0,5);
            const upper=String(declaration||'').toUpperCase();
            return {
              identifier:declaration,
              env_names,
              identifier_flags:{
                key:upper.includes('KEY'),token:upper.includes('TOKEN'),secret:upper.includes('SECRET'),password:upper.includes('PASS'),
                public:upper.includes('PUBLIC')||upper.includes('PUBLISHABLE')||upper.includes('ANON'),
                supabase:upper.includes('SUPABASE'),shopify:upper.includes('SHOPIFY'),stripe:upper.includes('STRIPE'),resend:upper.includes('RESEND'),vercel:upper.includes('VERCEL')
              },
              code_flags:{authorization:/\bauthorization\b/i.test(stripped),bearer:/\bBearer\b/.test(stripped),fetch:/\bfetch\s*\(/.test(stripped),hash:/(?:createHash|createHmac|subtle\.digest|sha256)/i.test(stripped)}
            };
          }
          function classify(r){
            const file=cleanPath(r.File), lineNo=Number(r.StartLine)||0;
            let line=''; try{line=fs.readFileSync(file,'utf8').split(/\r?\n/)[Math.max(0,lineNo-1)]||''}catch{}
            const cls=pathClass(file);
            const env_reference=/(?:process\.env|Deno\.env|getenv\s*\(|os\.environ|secrets\.|env\s*\[)/i.test(line);
            const placeholder_marker=/(?:test|fake|dummy|placeholder|example|sample|mock|fixture|not[_ -]?real|redacted|local|changeme)/i.test(line);
            const quoted_literal=/(?:'[^']{8,}'|"[^"]{8,}"|`[^`]{8,}`)/.test(line);
            const start=Math.max(0,(Number(r.StartColumn)||1)-1), end=Math.max(start,Number(r.EndColumn)||start);
            const span=line.slice(start,end);
            const runtime=cls==='RUNTIME'||cls==='APP';
            let disposition='REVIEW';
            if(cls==='TEST'&&placeholder_marker)disposition='LIKELY_TEST_FIXTURE';
            else if(cls==='TEST')disposition='TEST_REVIEW';
            else if(cls==='DOC')disposition='DOC_REVIEW';
            else if(cls==='MIGRATION')disposition='MIGRATION_REVIEW';
            else if(runtime&&env_reference&&!quoted_literal)disposition='RUNTIME_ENV_REFERENCE_REVIEW';
            else if(runtime)disposition='RUNTIME_LITERAL_REVIEW';
            return {rule_id:r.RuleID||'unknown',file,start_line:lineNo,path_class:cls,env_reference,placeholder_marker,quoted_literal,matched_span_length:span.length,matched_span_entropy:entropy(span),structure:structural(line),context_tokens:safeContext(file,lineNo),disposition};
          }
          console.log(`P0A_CURRENT_FINDINGS=${current.length}`);
          console.log(`P0A_HISTORY_FINDINGS=${history.length}`);
          console.log('P0A_CURRENT_METADATA='+JSON.stringify(summarize(current)));
          console.log('P0A_HISTORY_METADATA='+JSON.stringify(summarize(history)));
          console.log('P0A_CURRENT_CLASSIFICATION='+JSON.stringify(current.map(classify)));
          console.log('P0A_CURRENT_FINGERPRINTS='+JSON.stringify(current.map(r=>fingerprint(r,'current')).sort()));
          console.log('P0A_HISTORY_FINGERPRINTS='+JSON.stringify(history.map(r=>fingerprint(r,'history')).sort()));
          fs.rmSync('.gitleaks-current.json',{force:true});
          fs.rmSync('.gitleaks-history.json',{force:true});
          if(current.length||history.length)process.exit(1);
          NODE
