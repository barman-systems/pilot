name: P0-A Secret History Scan

on:
  pull_request:
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0a-secret-history-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  P0A_SECRET_BASELINE: docs/audits/DABBIR_P0A_SECRET_REVIEW_BASELINE.json

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout full history without persisted credentials
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate redacted current and history reports
        shell: bash
        run: |
          set -euo pipefail
          image=ghcr.io/gitleaks/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
          docker pull "$image" >/dev/null
          docker run --rm -v "$PWD:/repo" -w /repo "$image" \
            dir /repo --redact --no-banner --exit-code 0 \
            --report-format json --report-path /repo/.gitleaks-current.json
          docker run --rm -v "$PWD:/repo" -w /repo "$image" \
            detect --source /repo --redact --no-banner --exit-code 0 \
            --report-format json --report-path /repo/.gitleaks-history.json

      - name: Require exact reviewed fingerprint baseline
        run: node scripts/p0a-secret-baseline-gate.mjs "$P0A_SECRET_BASELINE"
