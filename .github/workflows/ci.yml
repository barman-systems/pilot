name: DABBIR CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, dabbir/isolated-export]

permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: read

jobs:
  test:
    name: ${{ github.event_name == 'pull_request' && 'candidate-ci' || 'ci-non-pr' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check:syntax
      - name: Audit production dependencies
        run: npm run audit:prod
      - name: Enforce Production database change discipline
        shell: bash
        env:
          DABBIR_DB_GATE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          DABBIR_DB_GATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${DABBIR_DB_GATE_BASE_SHA}" ]; then
            DABBIR_DB_GATE_BASE_SHA="$(git rev-parse HEAD^)"
            export DABBIR_DB_GATE_BASE_SHA
          fi
          node scripts/dabbir-production-db-change-gate.mjs
      - name: Enforce Supabase advisor regression gate
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_PROJECT_REF: fphpoysqdsceniwduxjq
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
          DABBIR_ADVISOR_BASELINE_PATH: config/supabase-advisor-baseline.json
          DABBIR_DB_GATE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          DABBIR_DB_GATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/dabbir-supabase-advisors-gate.mjs
      - name: Run DABBIR tests
        run: npm test
      - name: Reject committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(sk_live_[A-Za-z0-9_-]{16,}|sb_secret_[A-Za-z0-9._-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=[[:space:]]*[^$[:space:]]+|VERCEL_TOKEN[[:space:]]*=[[:space:]]*[^$[:space:]]+|(DABBIR|PILOT)_WHATSAPP_APP_SECRET[[:space:]]*=[[:space:]]*[^$[:space:]]+)' -- . ':(exclude).github/workflows/ci.yml'; then
            echo 'Potential secret material detected in committed source.'
            exit 1
          fi
          echo 'Committed-source secret pattern scan PASS'
      - name: Require terminal mobile release gates before merge
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/dabbir-required-pr-gates.mjs

  migration-deploy:
    name: DABBIR Migration Deploy
    needs: test
    if: github.event_name == 'push' && github.repository == 'barman-systems/pilot' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact protected main commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use locked Node runtime
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Deploy reviewed migrations and prove exact Production drift
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DABBIR_PROJECT_REF: fphpoysqdsceniwduxjq
          DABBIR_MIGRATION_CUTOVER_VERSION: '20260915124900'
        run: bash scripts/dabbir-migration-deploy.sh
      - name: Upload non-secret migration proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dabbir-migration-deploy-proof
          path: |
            migration-source-proof.txt
            migration-drift-proof.txt
            repo-migration-manifest.tsv
          if-no-files-found: warn
          retention-days: 14
