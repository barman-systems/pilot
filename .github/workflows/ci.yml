name: DABBIR CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check DABBIR product intelligence syntax
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(
            api/_dabbir-conversation*.js
            api/_dabbir-v3*.js
            api/_dabbir-understanding*.js
            api/_dabbir-semantic*.js
            api/_dabbir-whatsapp*.js
            api/dabbir-ai.js
          )
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do node --check "$file"; done
      - name: Run DABBIR intelligence and customer-behavior tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(
            test/dabbir-conversation-v3-*.test.mjs
            test/dabbir-v3-*.test.mjs
            test/dabbir-conversation-runtime-*.test.mjs
            test/dabbir-conversation-single-snapshot.test.mjs
            test/dabbir-understanding-*.test.mjs
            test/dabbir-semantic-*.test.mjs
            test/dabbir-whatsapp-understanding-*.test.mjs
            test/dabbir-whatsapp-service-*.test.mjs
            test/dabbir-booking-*.test.mjs
          )
          test "${#files[@]}" -gt 0
          printf 'DABBIR_INTELLIGENCE_TEST_FILES=%s\n' "${#files[@]}"
          node --test "${files[@]}"
      - name: Bootstrap old security gate for this cutover only
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/dabbir-required-pr-gates.mjs
