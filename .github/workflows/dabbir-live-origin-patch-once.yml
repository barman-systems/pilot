name: DABBIR Live Origin Patch Once

on:
  push:
    branches: [fix/dabbir-live-origin-release-gates-20260902]
    paths:
      - '.github/workflows/dabbir-live-origin-patch-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/dabbir-live-origin-release-gates-20260902
          fetch-depth: 2
      - name: Pin authoritative production truth
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          files = [
              Path('.github/workflows/dabbir-ai-customer-journey.yml'),
              Path('.github/workflows/dabbir-owner-away-production.yml'),
              Path('.github/workflows/dabbir-bar12-readiness.yml'),
          ]
          needle = '${{ vars.DABBIR_PRODUCTION_ORIGIN }}'
          canonical = 'https://dabbir.bmalman.com'
          for path in files:
              text = path.read_text()
              text = text.replace(needle, canonical)
              if path.name == 'dabbir-owner-away-production.yml':
                  text = text.replace('SUPABASE_PROJECT_REF: spohjzrsymsmzsseygtw', 'SUPABASE_PROJECT_REF: fphpoysqdsceniwduxjq')
              path.write_text(text)
          for path in files:
              text = path.read_text()
              assert needle not in text, path
              assert canonical in text, path
          owner = files[1].read_text()
          assert 'SUPABASE_PROJECT_REF: fphpoysqdsceniwduxjq' in owner
          assert 'SUPABASE_PROJECT_REF: spohjzrsymsmzsseygtw' not in owner
          PY
      - name: Commit one-shot patch and retire patcher
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/dabbir-live-origin-patch-once.yml
          git config user.name 'barmanai-runtime'
          git config user.email 'barmanai-runtime@users.noreply.github.com'
          git add .github/workflows/dabbir-ai-customer-journey.yml .github/workflows/dabbir-owner-away-production.yml .github/workflows/dabbir-bar12-readiness.yml .github/workflows/dabbir-live-origin-patch-once.yml
          git commit -m 'fix(release): pin DABBIR live origin across production gates'
          git push origin HEAD:fix/dabbir-live-origin-release-gates-20260902
