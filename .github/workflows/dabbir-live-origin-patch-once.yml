name: DABBIR Live Origin Variable Once

on:
  push:
    branches: [fix/dabbir-live-origin-release-gates-20260902]
    paths:
      - '.github/workflows/dabbir-live-origin-patch-once.yml'

permissions:
  contents: read
  actions: write

jobs:
  set-variable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VARIABLE_NAME: DABBIR_PRODUCTION_ORIGIN
      VARIABLE_VALUE: https://dabbir.bmalman.com
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create or update canonical production variable
        shell: bash
        run: |
          set -euo pipefail
          API="repos/${GITHUB_REPOSITORY}/actions/variables/${VARIABLE_NAME}"
          if gh api "$API" >/dev/null 2>&1; then
            gh api --method PATCH "$API" -f name="$VARIABLE_NAME" -f value="$VARIABLE_VALUE" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/variables" -f name="$VARIABLE_NAME" -f value="$VARIABLE_VALUE" >/dev/null
          fi
          actual="$(gh api "$API" --jq '.value')"
          test "$actual" = "$VARIABLE_VALUE"
          echo "DABBIR_PRODUCTION_ORIGIN_VERIFIED=$actual"
