name: DABBIR AWS Orphan Bucket Audit Once

on:
  pull_request:
    paths:
      - '.github/workflows/dabbir-aws-orphan-bucket-audit-once.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/dabbir-aws-orphan-bucket-audit-once.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: dabbir-aws-orphan-bucket-audit-once
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prove audit is read-only on PR
        shell: bash
        run: |
          set -euo pipefail
          file='.github/workflows/dabbir-aws-orphan-bucket-audit-once.yml'
          sed -n '/- name: Capture value-free bucket ownership evidence/,$p' "$file" > /tmp/audit-body.yml
          ! grep -Eq 'aws[[:space:]]+(s3(api)?[[:space:]].*(delete-|put-|delete-object|delete-bucket)|cloudformation[[:space:]]+(delete-stack|update-stack|create-stack)|iam[[:space:]].*(delete-|put-|update-)|rds[[:space:]].*(delete-|modify-)|backup[[:space:]].*delete-)' /tmp/audit-body.yml

  audit:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    env:
      AWS_REGION: me-central-1
      EXPECTED_ACCOUNT: '388699644093'
      ROLE_ARN: arn:aws:iam::388699644093:role/DabbirGithubDeployRole
      EVIDENCE_DIR: dabbir-aws-orphan-bucket-audit
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Assert exact main execution context
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Configure existing DABBIR AWS OIDC session
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: dabbir-orphan-bucket-audit-${{ github.run_id }}

      - name: Capture value-free bucket ownership evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR" /tmp/dabbir-orphan-audit
          chmod 700 /tmp/dabbir-orphan-audit

          account="$(aws sts get-caller-identity --query Account --output text)"
          test "$account" = "$EXPECTED_ACCOUNT"

          aws s3api list-buckets --output json \
            | jq '[.Buckets[] | select((.Name // "") | test("^dabbir-";"i")) | {bucket:.Name,creation_date:.CreationDate}] | sort_by(.bucket)' \
            > "$EVIDENCE_DIR/dabbir-buckets.json"

          printf '[]\n' > "$EVIDENCE_DIR/bucket-metadata.json"
          while IFS= read -r bucket; do
            test -n "$bucket" || continue
            region="$(aws s3api get-bucket-location --bucket "$bucket" --query 'LocationConstraint' --output text 2>/dev/null || printf 'UNKNOWN')"
            versioning="$(aws s3api get-bucket-versioning --bucket "$bucket" --query 'Status' --output text 2>/dev/null || printf 'UNKNOWN')"
            object_count="$(aws s3api list-objects-v2 --bucket "$bucket" --query 'KeyCount' --output text 2>/dev/null || printf 'UNKNOWN')"

            versions_status=0
            raw="$(aws s3api list-object-versions --bucket "$bucket" --output json 2>/dev/null)" || versions_status=$?
            versions='null'
            delete_markers='null'
            if [ "$versions_status" = '0' ]; then
              versions="$(printf '%s' "$raw" | jq '[.Versions[]?] | length')"
              delete_markers="$(printf '%s' "$raw" | jq '[.DeleteMarkers[]?] | length')"
            fi

            tags_status=0
            tags_raw="$(aws s3api get-bucket-tagging --bucket "$bucket" --output json 2>/dev/null)" || tags_status=$?
            if [ "$tags_status" = '0' ]; then
              printf '%s' "$tags_raw" | jq '[.TagSet[]? | {Key,Value}]' > /tmp/dabbir-orphan-audit/tags.json
            else
              printf '[]\n' > /tmp/dabbir-orphan-audit/tags.json
            fi

            jq --arg bucket "$bucket" --arg region "$region" --arg versioning "$versioning" --arg object_count "$object_count" \
              --argjson versions_status "$versions_status" --argjson versions "$versions" --argjson delete_markers "$delete_markers" \
              --argjson tags_status "$tags_status" --slurpfile tags /tmp/dabbir-orphan-audit/tags.json \
              '. + [{bucket:$bucket,region:$region,versioning:$versioning,object_count:$object_count,versions_status:$versions_status,versions:$versions,delete_markers:$delete_markers,tags_status:$tags_status,tags:$tags[0]}]' \
              "$EVIDENCE_DIR/bucket-metadata.json" > /tmp/dabbir-orphan-audit/buckets-next.json
            mv /tmp/dabbir-orphan-audit/buckets-next.json "$EVIDENCE_DIR/bucket-metadata.json"
          done < <(jq -r '.[].bucket' "$EVIDENCE_DIR/dabbir-buckets.json")

          aws cloudformation list-stacks --region "$AWS_REGION" --output json \
            | jq '[.StackSummaries[] | select((.StackName // "") | startswith("dabbir-")) | {StackId,StackName,StackStatus,CreationTime,DeletionTime:(.DeletionTime // null)}]' \
            > "$EVIDENCE_DIR/dabbir-stack-history.json"

          printf '[]\n' > "$EVIDENCE_DIR/historical-s3-stack-resources.json"
          while IFS= read -r stack_id; do
            test -n "$stack_id" || continue
            status=0
            aws cloudformation list-stack-resources --region "$AWS_REGION" --stack-name "$stack_id" --output json \
              > /tmp/dabbir-orphan-audit/resources.json 2>/dev/null || status=$?
            if [ "$status" != '0' ]; then
              continue
            fi
            jq --arg stack_id "$stack_id" '[.StackResourceSummaries[]? | select(.ResourceType == "AWS::S3::Bucket") | {StackId:$stack_id,LogicalResourceId,PhysicalResourceId,ResourceStatus}]' \
              /tmp/dabbir-orphan-audit/resources.json > /tmp/dabbir-orphan-audit/stack-s3.json
            jq -s 'add' "$EVIDENCE_DIR/historical-s3-stack-resources.json" /tmp/dabbir-orphan-audit/stack-s3.json \
              > /tmp/dabbir-orphan-audit/all-s3.json
            mv /tmp/dabbir-orphan-audit/all-s3.json "$EVIDENCE_DIR/historical-s3-stack-resources.json"
          done < <(jq -r '.[].StackId' "$EVIDENCE_DIR/dabbir-stack-history.json")

          python3 - <<'PY'
          import json
          buckets=json.load(open('dabbir-aws-orphan-bucket-audit/bucket-metadata.json'))
          hist=json.load(open('dabbir-aws-orphan-bucket-audit/historical-s3-stack-resources.json'))
          by_bucket={}
          for r in hist:
              b=r.get('PhysicalResourceId')
              if b:
                  by_bucket.setdefault(b,[]).append(r)
          rows=[]
          for b in buckets:
              tags={str(x.get('Key')):str(x.get('Value')) for x in b.get('tags',[])}
              matches=by_bucket.get(b['bucket'],[])
              cloudformation_tagged=any(k.startswith('aws:cloudformation:') for k in tags)
              dabbir_tagged=any('dabbir' in (k+' '+v).lower() for k,v in tags.items())
              empty=(str(b.get('object_count'))=='0' and b.get('versions') in (0,None) and b.get('delete_markers') in (0,None))
              rows.append({
                  'bucket':b['bucket'],
                  'historical_stack_matches':matches,
                  'historically_owned_by_dabbir_stack':len(matches)>0,
                  'cloudformation_tagged':cloudformation_tagged,
                  'dabbir_tagged':dabbir_tagged,
                  'empty_at_audit':empty,
              })
          json.dump(rows,open('dabbir-aws-orphan-bucket-audit/ownership-verdicts.json','w'),indent=2,sort_keys=True)
          PY

          jq -n --arg sha "$GITHUB_SHA" --arg account "$account" --arg region "$AWS_REGION" \
            --argjson bucket_count "$(jq 'length' "$EVIDENCE_DIR/dabbir-buckets.json")" \
            --argjson historical_s3_matches "$(jq 'length' "$EVIDENCE_DIR/historical-s3-stack-resources.json")" \
            '{repo_exact_sha:$sha,account:$account,region:$region,dabbir_bucket_count:$bucket_count,historical_s3_stack_resource_count:$historical_s3_matches,credential_values_read:false,mutation_performed:false}' \
            > "$EVIDENCE_DIR/summary.json"

          rm -rf /tmp/dabbir-orphan-audit

      - name: Upload read-only ownership evidence
        uses: actions/upload-artifact@v4
        with:
          name: dabbir-aws-orphan-bucket-audit-${{ github.sha }}
          path: dabbir-aws-orphan-bucket-audit/
          if-no-files-found: error
          retention-days: 90
