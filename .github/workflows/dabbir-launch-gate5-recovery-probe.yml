name: DABBIR Launch Gate 5 Recovery Probe

on:
  push:
    branches:
      - recovery/launch-gate-5-proof-20260907
    paths:
      - .github/workflows/dabbir-launch-gate5-recovery-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROJECT_REF: fphpoysqdsceniwduxjq
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
    steps:
      - name: Probe backup and clone capability without mutation
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="${SUPABASE_MANAGEMENT_TOKEN:-${SUPABASE_ACCESS_TOKEN:-}}"
          if [ -z "$TOKEN" ]; then
            echo 'SUPABASE_MANAGEMENT_TOKEN_MISSING'
            exit 2
          fi
          auth=(-H "Authorization: Bearer $TOKEN" -H 'Accept: application/json')

          backups_file="$(mktemp)"
          backups_status="$(curl --silent --show-error --output "$backups_file" --write-out '%{http_code}' "${auth[@]}" "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/backups")"
          echo "BACKUPS_HTTP=$backups_status"
          if [ "$backups_status" != '200' ]; then
            jq -c '{message:(.message // .error // "unknown")}' "$backups_file" 2>/dev/null || true
            exit 3
          fi
          jq -c '{physical_backup_count: ([.[]? | select((.status // "") == "COMPLETED" or (.status // "") == "completed")] | length), latest_backup: ([.[]? | select((.status // "") == "COMPLETED" or (.status // "") == "completed")] | sort_by(.completed_at // .inserted_at // .created_at // "") | last | {id, status, completed_at, inserted_at, created_at})}' "$backups_file"

          clone_file="$(mktemp)"
          clone_status="$(curl --silent --show-error --output "$clone_file" --write-out '%{http_code}' "${auth[@]}" "https://api.supabase.com/platform/database/${PROJECT_REF}/clone")"
          echo "CLONE_CAPABILITY_HTTP=$clone_status"
          if [ "$clone_status" = '200' ]; then
            jq -c '{clone_endpoint_accessible:true,pitr_enabled:(.pitr_enabled // null),backup_count:((.backups // .physical_backups // []) | length),latest_backup:((.backups // .physical_backups // []) | sort_by(.completed_at // .inserted_at // .created_at // "") | last | {id,status,completed_at,inserted_at,created_at})}' "$clone_file" 2>/dev/null || echo 'CLONE_ENDPOINT_ACCESSIBLE_RESPONSE_SHAPE_UNKNOWN'
          else
            jq -c '{clone_endpoint_accessible:false,message:(.message // .error // "unknown")}' "$clone_file" 2>/dev/null || true
          fi

          status_file="$(mktemp)"
          status_http="$(curl --silent --show-error --output "$status_file" --write-out '%{http_code}' "${auth[@]}" "https://api.supabase.com/platform/database/${PROJECT_REF}/clone/status")"
          echo "CLONE_STATUS_HTTP=$status_http"
          if [ "$status_http" = '200' ]; then
            jq -c '{clone_status_endpoint_accessible:true,status:(.status // .state // null)}' "$status_file" 2>/dev/null || true
          fi
