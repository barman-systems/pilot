name: Temporary Cloudflare Workers AI patch

on:
  push:
    branches:
      - feat/cloudflare-workers-ai

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[cloudflare-patch-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cloudflare-workers-ai
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply Cloudflare Workers AI provider patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          core_path = Path('api/_ai-core.js')
          core = core_path.read_text()

          old = "const GROQ_ENDPOINT = 'https://api.groq.com/openai/v1/chat/completions';\nconst GATEWAY_ENDPOINT = 'https://ai-gateway.vercel.sh/v1/chat/completions';\nconst DEFAULT_GEMINI_MODEL = 'gemini-3.7-flash';\nconst DEFAULT_MODEL = 'openai/gpt-oss-20b';"
          new = "const GROQ_ENDPOINT = 'https://api.groq.com/openai/v1/chat/completions';\nconst GATEWAY_ENDPOINT = 'https://ai-gateway.vercel.sh/v1/chat/completions';\nconst DEFAULT_GEMINI_MODEL = 'gemini-3.7-flash';\nconst DEFAULT_MODEL = 'openai/gpt-oss-20b';\nconst DEFAULT_CLOUDFLARE_MODEL = '@cf/zai-org/glm-4.7-flash';\nconst cloudflareEndpoint = env => `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(String(env.CLOUDFLARE_ACCOUNT_ID || ''))}/ai/v1/chat/completions`;"
          if old not in core:
              raise SystemExit('core constants anchor not found')
          core = core.replace(old, new, 1)

          old = "  if (env.GROQ_API_KEY) {\n    return {\n      provider: 'groq',\n      endpoint: GROQ_ENDPOINT,\n      model: String(env.DABBIR_AI_MODEL || DEFAULT_MODEL),\n      configured: true,\n      auth_mode: 'API_KEY',\n      cost_mode: 'FREE_TIER_ONLY',\n    };\n  }\n\n  const gatewayCredential"
          new = "  if (env.GROQ_API_KEY) {\n    return {\n      provider: 'groq',\n      endpoint: GROQ_ENDPOINT,\n      model: String(env.DABBIR_AI_MODEL || DEFAULT_MODEL),\n      configured: true,\n      auth_mode: 'API_KEY',\n      cost_mode: 'FREE_TIER_ONLY',\n    };\n  }\n\n  if (env.CLOUDFLARE_API_TOKEN && env.CLOUDFLARE_ACCOUNT_ID) {\n    return {\n      provider: 'cloudflare-workers-ai',\n      endpoint: cloudflareEndpoint(env),\n      model: String(env.DABBIR_CLOUDFLARE_MODEL || DEFAULT_CLOUDFLARE_MODEL),\n      configured: true,\n      auth_mode: 'API_TOKEN',\n      cost_mode: 'FREE_TIER_FIRST',\n    };\n  }\n\n  const gatewayCredential"
          if old not in core:
              raise SystemExit('core config anchor not found')
          core = core.replace(old, new, 1)

          old = "  const config = getDABBIRAiConfig(env);\n  const geminiKey = String(env.GEMINI_API_KEY || '');\n  const groqKey = String(env.GROQ_API_KEY || '');\n  const messages = ["
          new = "  const config = getDABBIRAiConfig(env);\n  const geminiKey = String(env.GEMINI_API_KEY || '');\n  const groqKey = String(env.GROQ_API_KEY || '');\n  const cloudflareToken = String(env.CLOUDFLARE_API_TOKEN || '');\n  const cloudflareAccountId = String(env.CLOUDFLARE_ACCOUNT_ID || '');\n  const cloudflareReady = Boolean(cloudflareToken && cloudflareAccountId);\n  const messages = ["
          if old not in core:
              raise SystemExit('core credential anchor not found')
          core = core.replace(old, new, 1)

          core = core.replace("if (groqKey || env.VERCEL_ENV) {", "if (groqKey || cloudflareReady || env.VERCEL_ENV) {", 2)

          start = core.find("  if (!groqKey && env.VERCEL_ENV) {")
          if start < 0:
              raise SystemExit('core tail start anchor not found')
          replacement = r'''  if (groqKey) {
    try {
      const { response, payload } = await callOpenAiCompatible({ endpoint: GROQ_ENDPOINT, credential: groqKey, model: config.model, messages, fetchImpl, timeoutMs: 5000 });
      if (response.ok) return finalizeReply({ reply: String(payload?.choices?.[0]?.message?.content || '').trim(), input, language, config, model: String(payload?.model || config.model) });
      if (cloudflareReady || env.VERCEL_ENV) {
        const { GROQ_API_KEY: _groqKey, DABBIR_AI_MODEL: _groqModel, DABBIR_GROQ_MODEL: _groqOperatorModel, ...fallbackEnv } = env;
        return generateDABBIRAiReply({ project: normalizedProject, message: input, language, businessContext, history, env: fallbackEnv, fetchImpl, oidcGetter });
      }
      return { ok: false, state: response.status === 429 ? 'RATE_LIMITED' : 'PROVIDER_ERROR', error: `groq_http_${response.status}`, provider: config.provider, model: config.model, auth_mode: config.auth_mode, cost_mode: config.cost_mode };
    } catch (error) {
      if (cloudflareReady || env.VERCEL_ENV) {
        const { GROQ_API_KEY: _groqKey, DABBIR_AI_MODEL: _groqModel, DABBIR_GROQ_MODEL: _groqOperatorModel, ...fallbackEnv } = env;
        return generateDABBIRAiReply({ project: normalizedProject, message: input, language, businessContext, history, env: fallbackEnv, fetchImpl, oidcGetter });
      }
      return { ok: false, state: error?.name === 'AbortError' ? 'TIMEOUT' : 'PROVIDER_ERROR', error: error?.name === 'AbortError' ? 'groq_timeout' : 'groq_network_error', provider: config.provider, model: config.model, auth_mode: config.auth_mode, cost_mode: config.cost_mode };
    }
  }

  if (cloudflareReady) {
    try {
      const { response, payload } = await callOpenAiCompatible({ endpoint: cloudflareEndpoint(env), credential: cloudflareToken, model: config.model, messages, fetchImpl, timeoutMs: 5000 });
      if (response.ok) return finalizeReply({ reply: String(payload?.choices?.[0]?.message?.content || '').trim(), input, language, config, model: String(payload?.model || config.model) });
      if (env.VERCEL_ENV) {
        const { CLOUDFLARE_API_TOKEN: _cloudflareToken, CLOUDFLARE_ACCOUNT_ID: _cloudflareAccountId, DABBIR_CLOUDFLARE_MODEL: _cloudflareModel, ...fallbackEnv } = env;
        return generateDABBIRAiReply({ project: normalizedProject, message: input, language, businessContext, history, env: fallbackEnv, fetchImpl, oidcGetter });
      }
      return { ok: false, state: response.status === 429 ? 'RATE_LIMITED' : 'PROVIDER_ERROR', error: `cloudflare_http_${response.status}`, provider: config.provider, model: config.model, auth_mode: config.auth_mode, cost_mode: config.cost_mode };
    } catch (error) {
      if (env.VERCEL_ENV) {
        const { CLOUDFLARE_API_TOKEN: _cloudflareToken, CLOUDFLARE_ACCOUNT_ID: _cloudflareAccountId, DABBIR_CLOUDFLARE_MODEL: _cloudflareModel, ...fallbackEnv } = env;
        return generateDABBIRAiReply({ project: normalizedProject, message: input, language, businessContext, history, env: fallbackEnv, fetchImpl, oidcGetter });
      }
      return { ok: false, state: error?.name === 'AbortError' ? 'TIMEOUT' : 'PROVIDER_ERROR', error: error?.name === 'AbortError' ? 'cloudflare_timeout' : 'cloudflare_network_error', provider: config.provider, model: config.model, auth_mode: config.auth_mode, cost_mode: config.cost_mode };
    }
  }

  if (env.VERCEL_ENV) {
    const gatewayAuth = await resolveGatewayCredential(env, oidcGetter);
    if (!gatewayAuth?.credential) return { ok: false, state: 'UNCONFIGURED', error: 'gateway_credential_missing', provider: config.provider, model: config.model, auth_mode: 'MISSING', cost_mode: config.cost_mode };

    const result = await callGatewayBoundedFallback({ credential: gatewayAuth.credential, primaryModel: config.model, messages, fetchImpl });
    if (!result.ok) {
      return {
        ok: false,
        state: result.status === 429 ? 'RATE_LIMITED' : result.error === 'gateway_timeout' ? 'TIMEOUT' : 'PROVIDER_ERROR',
        error: result.error,
        provider: config.provider,
        model: result.model,
        auth_mode: gatewayAuth.auth_mode,
        cost_mode: config.cost_mode,
      };
    }
    return finalizeReply({ reply: String(result.payload?.choices?.[0]?.message?.content || '').trim(), input, language, config, authMode: gatewayAuth.auth_mode, model: result.model });
  }

  return { ok: false, state: 'UNCONFIGURED', error: 'groq_api_key_missing', provider: config.provider, model: config.model, auth_mode: config.auth_mode, cost_mode: config.cost_mode };
}'''
          core = core[:start] + replacement + "\n"
          core_path.write_text(core)

          agent_path = Path('api/_dabbir-autonomous-agent.js')
          agent = agent_path.read_text()
          old = "export const DIRECT_GROQ_MODEL=process.env.DABBIR_GROQ_MODEL||'openai/gpt-oss-20b';"
          new = old + "\nexport const DIRECT_CLOUDFLARE_MODEL=process.env.DABBIR_CLOUDFLARE_MODEL||'@cf/zai-org/glm-4.7-flash';"
          if old not in agent:
              raise SystemExit('agent model constant anchor not found')
          agent = agent.replace(old, new, 1)

          old = "  if(env.GROQ_API_KEY){\n    const provider=createOpenAICompatible({name:'dabbirGroq',baseURL:'https://api.groq.com/openai/v1',apiKey:env.GROQ_API_KEY});\n    candidates.push({name:'groq-direct',modelId:env.DABBIR_GROQ_MODEL||DIRECT_GROQ_MODEL,model:provider.chatModel(env.DABBIR_GROQ_MODEL||DIRECT_GROQ_MODEL)});\n  }\n  candidates.push({name:'vercel-gateway'"
          new = "  if(env.GROQ_API_KEY){\n    const provider=createOpenAICompatible({name:'dabbirGroq',baseURL:'https://api.groq.com/openai/v1',apiKey:env.GROQ_API_KEY});\n    candidates.push({name:'groq-direct',modelId:env.DABBIR_GROQ_MODEL||DIRECT_GROQ_MODEL,model:provider.chatModel(env.DABBIR_GROQ_MODEL||DIRECT_GROQ_MODEL)});\n  }\n  if(env.CLOUDFLARE_API_TOKEN&&env.CLOUDFLARE_ACCOUNT_ID){\n    const modelId=env.DABBIR_CLOUDFLARE_MODEL||DIRECT_CLOUDFLARE_MODEL;\n    const provider=createOpenAICompatible({name:'dabbirCloudflareWorkersAi',baseURL:`https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(String(env.CLOUDFLARE_ACCOUNT_ID))}/ai/v1`,apiKey:env.CLOUDFLARE_API_TOKEN});\n    candidates.push({name:'cloudflare-workers-ai',modelId,model:provider.chatModel(modelId)});\n  }\n  candidates.push({name:'vercel-gateway'"
          if old not in agent:
              raise SystemExit('agent provider anchor not found')
          agent = agent.replace(old, new, 1)
          agent_path.write_text(agent)

          test_path = Path('test/dabbir-cloudflare-ai.test.mjs')
          test_path.write_text(r'''import assert from 'node:assert/strict';
import test from 'node:test';
import { generateDABBIRAiReply, getDABBIRAiConfig } from '../api/_ai-core.js';
import { DIRECT_CLOUDFLARE_MODEL, operatorModelCandidates } from '../api/_dabbir-autonomous-agent.js';

test('Cloudflare Workers AI config uses GLM-4.7-Flash through the OpenAI-compatible endpoint',()=>{
  const config=getDABBIRAiConfig({CLOUDFLARE_API_TOKEN:'cf-token',CLOUDFLARE_ACCOUNT_ID:'account-123'});
  assert.equal(config.provider,'cloudflare-workers-ai');
  assert.equal(config.model,'@cf/zai-org/glm-4.7-flash');
  assert.equal(config.endpoint,'https://api.cloudflare.com/client/v4/accounts/account-123/ai/v1/chat/completions');
  assert.equal(config.cost_mode,'FREE_TIER_FIRST');
});

test('Cloudflare Workers AI can serve a grounded DABBIR reply',async()=>{
  let call;
  const result=await generateDABBIRAiReply({
    project:'dabbir_businesses',message:'مرحبا',language:'ar',businessContext:'Business name: Test',
    env:{CLOUDFLARE_API_TOKEN:'cf-token',CLOUDFLARE_ACCOUNT_ID:'account-123'},
    fetchImpl:async(url,options)=>{call={url:String(url),options};return new Response(JSON.stringify({model:'@cf/zai-org/glm-4.7-flash',choices:[{message:{content:'أهلًا، كيف أساعدك؟'}}]}),{status:200,headers:{'content-type':'application/json'}})}
  });
  assert.equal(result.ok,true);
  assert.equal(result.provider,'cloudflare-workers-ai');
  assert.equal(call.url,'https://api.cloudflare.com/client/v4/accounts/account-123/ai/v1/chat/completions');
  assert.equal(call.options.headers.authorization,'Bearer cf-token');
  const body=JSON.parse(call.options.body);
  assert.equal(body.model,'@cf/zai-org/glm-4.7-flash');
});

test('Groq rate limit falls through to Cloudflare Workers AI before the gateway',async()=>{
  const calls=[];
  const result=await generateDABBIRAiReply({
    project:'dabbir_businesses',message:'مرحبا',language:'ar',
    env:{GROQ_API_KEY:'groq-token',CLOUDFLARE_API_TOKEN:'cf-token',CLOUDFLARE_ACCOUNT_ID:'account-123'},
    fetchImpl:async(url)=>{calls.push(String(url));if(String(url).includes('api.groq.com'))return new Response('{}',{status:429});return new Response(JSON.stringify({choices:[{message:{content:'تم'}}]}),{status:200,headers:{'content-type':'application/json'}})}
  });
  assert.equal(result.ok,true);
  assert.equal(result.provider,'cloudflare-workers-ai');
  assert.equal(calls.length,2);
  assert.match(calls[0],/api\.groq\.com/);
  assert.match(calls[1],/api\.cloudflare\.com/);
});

test('autonomous operator places Cloudflare after direct free providers and before Vercel gateway',()=>{
  const candidates=operatorModelCandidates({GEMINI_API_KEY:'gemini',GROQ_API_KEY:'groq',CLOUDFLARE_API_TOKEN:'cf-token',CLOUDFLARE_ACCOUNT_ID:'account-123'});
  assert.deepEqual(candidates.map(item=>item.name),['gemini-direct','groq-direct','cloudflare-workers-ai','vercel-gateway']);
  assert.equal(candidates[2].modelId,DIRECT_CLOUDFLARE_MODEL);
});
''')
          PY
      - name: Syntax and tests
        run: |
          npm run check:syntax
          npm test
      - name: Commit tested patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "DABBIR automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/temp-cloudflare-workers-ai-patch.yml
          git add api/_ai-core.js api/_dabbir-autonomous-agent.js test/dabbir-cloudflare-ai.test.mjs
