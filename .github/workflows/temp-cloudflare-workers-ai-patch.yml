name: Temporary Cloudflare Workers AI patch

on:
  push:
    branches:
      - feat/cloudflare-workers-ai

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cloudflare-workers-ai
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: python3 scripts/temp-cloudflare-patch.py
      - run: npm run check:syntax
      - run: npm test
      - name: Commit tested integration
        run: |
          git config user.name "DABBIR automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/temp-cloudflare-workers-ai-patch.yml scripts/temp-cloudflare-patch.py
          git add api/_ai-core.js api/_dabbir-autonomous-agent.js test/dabbir-cloudflare-ai.test.mjs
          git commit -m "feat(ai): add Cloudflare Workers AI fallback"
          git push origin HEAD:feat/cloudflare-workers-ai
