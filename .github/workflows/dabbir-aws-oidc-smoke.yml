name: DABBIR AWS OIDC Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dabbir-aws-oidc-smoke.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  verify-oidc:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Capture safe OIDC claims
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p0a-live-aws-evidence
          response="$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
          token="$(printf '%s' "$response" | jq -r '.value')"
          TOKEN="$token" python3 - <<'PY'
          import os, json, base64
          token=os.environ['TOKEN']
          payload=token.split('.')[1]
          payload += '=' * (-len(payload) % 4)
          claims=json.loads(base64.urlsafe_b64decode(payload))
          safe={k:claims.get(k) for k in ['iss','aud','sub','repository','repository_owner','environment','ref','workflow_ref','event_name','iat','exp','nbf']}
          json.dump(safe,open('p0a-live-aws-evidence/oidc-claims.json','w'),indent=2,sort_keys=True)
          print(json.dumps(safe, sort_keys=True))
          PY
          unset token response

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::388699644093:role/DabbirGithubDeployRole
          aws-region: me-central-1
          role-session-name: dabbir-oidc-smoke-${{ github.run_id }}

      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity >/dev/null
          test "$AWS_REGION" = 'me-central-1'

      - name: Capture and evaluate live IAM trust policy
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          aws iam get-role --role-name DabbirGithubDeployRole --output json > "$tmp"
          jq '{Role:{RoleName:.Role.RoleName,Arn:.Role.Arn,AssumeRolePolicyDocument:.Role.AssumeRolePolicyDocument,MaxSessionDuration:.Role.MaxSessionDuration,PermissionsBoundary:(.Role.PermissionsBoundary // null)}}' \
            "$tmp" > p0a-live-aws-evidence/trust-policy.json

          python3 - <<'PY'
          import json,sys
          claims=json.load(open('p0a-live-aws-evidence/oidc-claims.json'))
          role=json.load(open('p0a-live-aws-evidence/trust-policy.json'))['Role']
          stmts=role['AssumeRolePolicyDocument'].get('Statement',[])
          if isinstance(stmts,dict): stmts=[stmts]
          provider_suffix='oidc-provider/token.actions.githubusercontent.com'
          principals=[]; auds=[]; subs=[]
          for s in stmts:
            p=(s.get('Principal') or {}).get('Federated')
            principals += p if isinstance(p,list) else [p] if p else []
            for op in ('StringEquals','StringLike'):
              cond=(s.get('Condition') or {}).get(op) or {}
              a=cond.get('token.actions.githubusercontent.com:aud',[])
              q=cond.get('token.actions.githubusercontent.com:sub',[])
              auds += a if isinstance(a,list) else [a] if a else []
              subs += q if isinstance(q,list) else [q] if q else []
          wildcard=any(any(ch in str(v) for ch in '*?[') for v in subs)
          current_sub=claims.get('sub')
          result={
            'issuer_exact':claims.get('iss')=='https://token.actions.githubusercontent.com',
            'claim_audience_exact':claims.get('aud')=='sts.amazonaws.com' or claims.get('aud')==['sts.amazonaws.com'],
            'claim_repository_exact':claims.get('repository')=='barman-systems/pilot',
            'claim_environment_exact':claims.get('environment')=='production',
            'principal_github_oidc':any(str(x).endswith(provider_suffix) for x in principals),
            'trust_audience_exact':len(set(map(str,auds)))==1 and str(auds[0])=='sts.amazonaws.com',
            'current_subject_explicitly_allowed':current_sub in subs,
            'subject_has_wildcard':wildcard,
            'subject_count':len(set(map(str,subs))),
            'legacy_environment_only_present':'repo:barman-systems@319497139/pilot@1346817686:environment:production' in subs,
            'max_session_duration':role.get('MaxSessionDuration'),
            'max_session_reasonable':isinstance(role.get('MaxSessionDuration'),int) and role.get('MaxSessionDuration')<=3600,
            'permissions_boundary_present':role.get('PermissionsBoundary') is not None,
          }
          result['pass']=all([
            result['issuer_exact'],result['claim_audience_exact'],result['claim_repository_exact'],result['claim_environment_exact'],
            result['principal_github_oidc'],result['trust_audience_exact'],result['current_subject_explicitly_allowed'],
            not result['subject_has_wildcard'],result['max_session_reasonable']
          ])
          json.dump(result,open('p0a-live-aws-evidence/trust-evaluation.json','w'),indent=2,sort_keys=True)
          if not result['pass']: sys.exit(1)
          PY

      - name: Upload safe live trust evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0a-live-aws-trust-${{ github.sha }}
          path: p0a-live-aws-evidence/
          if-no-files-found: error
          retention-days: 30
