name: DABBIR Actions Lock Refresh

on:
  push:
    branches:
      - feat/dabbir-actions-whatsapp-agent
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/dabbir-actions-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/dabbir-actions-whatsapp-agent
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Refresh lockfile deterministically
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'build: refresh package lock for Vercel functions'
          git push origin HEAD:feat/dabbir-actions-whatsapp-agent
