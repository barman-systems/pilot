name: DABBIR Mumbai Preview Probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dabbir-mumbai-preview-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: prj_HCTFdQo8Vc7FvZRdJ37H7KFYwpUq
      VERCEL_TEAM_ID: team_pwfKq8jHuyW1XFVSZirAJiId
      CUTOVER_BRANCH: dabbir-mumbai-cutover-20260902
      TARGET_REF: fphpoysqdsceniwduxjq
    steps:
      - name: Build and inspect Mumbai preview
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || exit 10
          echo "::add-mask::$VERCEL_TOKEN"
          body="$(jq -nc --arg project "$VERCEL_PROJECT_ID" --arg ref "$CUTOVER_BRANCH" '{name:"dabbir",project:$project,gitSource:{type:"github",org:"barman-systems",repo:"pilot",ref:$ref},projectSettings:{commandForIgnoringBuildStep:"exit 1"}}')"
          status="$(curl -sS -o "$RUNNER_TEMP/deploy.json" -w '%{http_code}' -X POST "https://api.vercel.com/v13/deployments?forceNew=1&teamId=${VERCEL_TEAM_ID}" -H "Authorization: Bearer ${VERCEL_TOKEN}" -H 'Content-Type: application/json' --data-binary "$body")"
          [[ "$status" =~ ^2 ]] || { echo "create_status=$status"; jq -r '.error.code // .code // empty, .error.message // .message // empty' "$RUNNER_TEMP/deploy.json"; exit 20; }
          id="$(jq -r '.id // empty' "$RUNNER_TEMP/deploy.json")"
          url="$(jq -r '.url // empty' "$RUNNER_TEMP/deploy.json")"
          echo "preview_id=$id"
          ready=0
          for _ in $(seq 1 120); do
            d="$(curl -fsS "https://api.vercel.com/v13/deployments/${id}?teamId=${VERCEL_TEAM_ID}" -H "Authorization: Bearer ${VERCEL_TOKEN}")"
            state="$(jq -r '.readyState // .status // empty' <<<"$d")"
            case "$state" in READY) ready=1; break ;; ERROR|CANCELED) echo "preview_state=$state"; jq -r '.errorCode // .errorMessage // .errorLink // empty' <<<"$d"; exit 21 ;; esac
            sleep 3
          done
          [[ "$ready" == 1 ]] || exit 22
          echo "PASS: preview READY https://${url}"
          http="$(curl -sS -o "$RUNNER_TEMP/cap.json" -w '%{http_code}' "https://${url}/api/qa-capability")"
          echo "capability_http=$http"
          if [[ "$http" == 200 ]]; then
            jq -e --arg ref "$TARGET_REF" '.ok==true and .supabase_project_ref==$ref and .server_admin_configured==true and .calendar_storage_configured==true' "$RUNNER_TEMP/cap.json" >/dev/null || { echo 'ERROR: preview runtime not bound to Mumbai'; exit 23; }
            echo 'PASS: preview runtime confirmed Mumbai.'
          else
            echo 'PREVIEW_READY_BUT_PROTECTED'
            exit 24
          fi
