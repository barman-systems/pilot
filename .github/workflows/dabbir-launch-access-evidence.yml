name: DABBIR Launch Access Evidence
on:
  push:
    branches: [ops/launch-access-evidence-20260905]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
    steps:
      - name: Diagnose backup HTTP rejection with identical credentials
        shell: python
        run: |
          import os,json,urllib.request,urllib.error,subprocess,tempfile
          url="https://api.supabase.com/v1/projects/fphpoysqdsceniwduxjq/database/backups"
          secrets=[os.environ.get(k,"") for k in ("SUPABASE_ACCESS_TOKEN","SUPABASE_MANAGEMENT_TOKEN")]
          def summarize(status,body,headers):
            try:
              d=json.loads(body)
              if status==200:return {"status":status,"backup_count":len(d.get("backups",[])),"pitr_enabled":d.get("pitr_enabled"),"latest_completed":max([str(b.get("completed_at","")) for b in d.get("backups",[])],default="")}
              safe={k:d[k] for k in ("message","error","code") if k in d and isinstance(d[k],(str,int))}
              msg=json.dumps(safe)
            except Exception:msg=body[:1200]
            for token in secrets:
              if token:msg=msg.replace(token,"[REDACTED]")
            return {"status":status,"error_body":msg[:1200],"server":headers.get("server"),"content_type":headers.get("content-type")}
          for name in ("SUPABASE_ACCESS_TOKEN","SUPABASE_MANAGEMENT_TOKEN"):
            token=os.environ.get(name,"")
            if not token:
              print(json.dumps({"credential_source":name,"present":False}));continue
            for ua in (None,"curl/8.5.0"):
              h={"Authorization":"Bearer "+token}
              if ua:h["User-Agent"]=ua
              try:
                with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=25) as r:
                  result=summarize(r.status,r.read().decode(),r.headers)
              except urllib.error.HTTPError as e:result=summarize(e.code,e.read().decode(),e.headers)
              except Exception as e:result={"error":type(e).__name__}
              print(json.dumps({"credential_source":name,"client":"urllib","user_agent":ua or "Python-urllib/default",**result}))
            with tempfile.NamedTemporaryFile() as conf, tempfile.NamedTemporaryFile() as out:
              conf.write(('header = "Authorization: Bearer '+token+'"\n').encode());conf.flush()
              p=subprocess.run(["curl","--config",conf.name,"--silent","--show-error","--max-time","25","--output",out.name,"--write-out","%{http_code}",url],capture_output=True,text=True)
              result=summarize(int(p.stdout or 0),out.read().decode(),{})
              print(json.dumps({"credential_source":name,"client":"curl",**result}))
