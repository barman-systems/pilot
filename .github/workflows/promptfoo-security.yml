name: DABBIR Promptfoo Security

on:
  workflow_dispatch:

# Frozen from automatic PR execution by owner directive on 2026-09-15.
permissions:
  contents: read

jobs:
  promptfoo-security:
    name: promptfoo-security-manual
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run manual Promptfoo safety evaluation
        env:
          PROMPTFOO_DISABLE_TELEMETRY: '1'
          PROMPTFOO_DISABLE_UPDATE: '1'
        run: |
          set -euo pipefail
          npx --yes promptfoo@latest eval \
            -c security/promptfoo/promptfooconfig.yaml \
            --no-cache \
            -o promptfoo-results.json
