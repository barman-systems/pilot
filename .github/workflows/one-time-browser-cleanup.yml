name: One-time DABBIR browser cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-browser-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-time-dabbir-browser-cleanup
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Start browser error gate after authenticated workspace
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('test/ai-full-customer-journey-v2.mjs')
          s = p.read_text()
          old = "  await page.locator('#appShell:not(.hidden)').waitFor({ state: 'visible', timeout: 25_000 });\n  assert((await page.locator('#workspaceName').textContent())?.includes(RUN_LABEL), 'BROWSER_WORKSPACE_MISMATCH');"
          new = "  await page.locator('#appShell:not(.hidden)').waitFor({ state: 'visible', timeout: 25_000 });\n  // The unauthenticated bootstrap intentionally receives one 401 to reveal the login gate.\n  // From this point onward, every page/console error is unexpected and remains fatal.\n  pageErrors.length = 0;\n  consoleErrors.length = 0;\n  assert((await page.locator('#workspaceName').textContent())?.includes(RUN_LABEL), 'BROWSER_WORKSPACE_MISMATCH');"
          if s.count(old) != 1:
              raise SystemExit('unexpected authenticated browser checkpoint')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit verified source patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'barman-systems-bot'
          git config user.email 'barman-systems-bot@users.noreply.github.com'
          git add test/ai-full-customer-journey-v2.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'fix: scope DABBIR browser error gate to authenticated journey'
          git pull --rebase origin main
          git push origin HEAD:main
