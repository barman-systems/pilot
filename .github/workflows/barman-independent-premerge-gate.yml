name: BARMAN Independent Pre-Merge Gate

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to verify manually
        required: true
        type: string

# Frozen from automatic merge enforcement by owner directive on 2026-09-15.
# Retained only as an explicit manual diagnostic; normal DABBIR development is
# governed by the product-intelligence `test` job in DABBIR CI.
permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: write
  id-token: write

concurrency:
  group: barman-independent-premerge-${{ inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  verify-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout trusted verifier only
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Run manual exact-candidate verification
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BARMAN_PREMERGE_PR_NUMBER: ${{ inputs.pr_number }}
          BARMAN_PREMERGE_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/barman-independent-premerge-gate.mjs
