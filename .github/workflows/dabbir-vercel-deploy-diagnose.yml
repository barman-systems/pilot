name: DABBIR Vercel Deployment Diagnose

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dabbir-vercel-deploy-diagnose.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: prj_HCTFdQo8Vc7FvZRdJ37H7KFYwpUq
      VERCEL_TEAM_ID: team_pwfKq8jHuyW1XFVSZirAJiId
    steps:
      - name: Diagnose Vercel deployment gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo 'BLOCKED: VERCEL_TOKEN_NOT_CONFIGURED'; exit 10; }
          echo "::add-mask::$VERCEL_TOKEN"

          body="$(jq -nc --arg project "$VERCEL_PROJECT_ID" '{name:"dabbir",project:$project,target:"preview",gitSource:{type:"github",org:"barman-systems",repo:"pilot",ref:"main"}}')"
          status="$(curl -sS -o "$RUNNER_TEMP/vercel.json" -w '%{http_code}' -X POST "https://api.vercel.com/v13/deployments?forceNew=1&teamId=${VERCEL_TEAM_ID}" -H "Authorization: Bearer ${VERCEL_TOKEN}" -H 'Content-Type: application/json' --data-binary "$body")"
          echo "Vercel deployment HTTP status: $status"
          jq -r 'if .error then "error.code="+(.error.code//"UNKNOWN")+"\nerror.message="+(.error.message//"UNKNOWN") else "deployment.id="+(.id//"UNKNOWN")+"\nstate="+(.readyState//.status//"UNKNOWN") end' "$RUNNER_TEMP/vercel.json"
          if [[ "$status" == 200 || "$status" == 201 ]]; then
            echo 'PASS: direct Vercel deployment API is available.'
          else
            exit 20
          fi
