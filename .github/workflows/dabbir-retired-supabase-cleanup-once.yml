name: DABBIR retired Supabase cleanup once

on:
  push:
    branches:
      - chore/dabbir-fail-closed-supabase-origin-20260902

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/dabbir-fail-closed-supabase-origin-20260902
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Remove retired Sydney fallbacks from runtime source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          old_url = 'https://spohjzrsymsmzsseygtw.supabase.co'
          old_key = 'sb_publishable_WPxhwNf08BW1FgBptkinWg_3j75O4O3'
          changed = []
          for path in sorted(Path('api').rglob('*.js')):
              source = path.read_text()
              updated = source.replace("'" + old_url + "'", "''").replace('"' + old_url + '"', '""')
              updated = updated.replace("'" + old_key + "'", "''").replace('"' + old_key + '"', '""')
              # Retire the old constant when its only purpose was the removed fallback.
              updated = re.sub(r"^const LEGACY_SUPABASE_URL\s*=\s*['\"]{2};\s*\n", '', updated, flags=re.M)
              updated = re.sub(r"\s*\|\|\s*LEGACY_SUPABASE_URL", '', updated)
              updated = updated.replace('This keeps Sydney Auth out of the hot request path.', 'This keeps remote Auth out of the hot request path.')
              if updated != source:
                  path.write_text(updated)
                  changed.append(str(path))

          test_path = Path('test/dabbir-no-retired-supabase-origin.test.mjs')
          test_path.write_text("""import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';

          const root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '..');
          const apiRoot = path.join(root, 'api');
          const retiredRef = 'spohjzrsymsmzsseygtw';
          const retiredPublishableKey = 'sb_publishable_WPxhwNf08BW1FgBptkinWg_3j75O4O3';

          function jsFiles(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap(entry => {
              const full = path.join(dir, entry.name);
              return entry.isDirectory() ? jsFiles(full) : entry.isFile() && entry.name.endsWith('.js') ? [full] : [];
            });
          }

          test('runtime API cannot silently fall back to the retired Sydney Supabase project', () => {
            const offenders = [];
            for (const file of jsFiles(apiRoot)) {
              const source = fs.readFileSync(file, 'utf8');
              if (source.includes(retiredRef) || source.includes(retiredPublishableKey)) {
                offenders.push(path.relative(root, file));
              }
            }
            assert.deepEqual(offenders, []);
          });

          test('auth core has no legacy Supabase origin constant', () => {
            const source = fs.readFileSync(path.join(apiRoot, '_auth-core.js'), 'utf8');
            assert.doesNotMatch(source, /LEGACY_SUPABASE_URL/);
            assert.match(source, /process\.env\.SUPABASE_AUTH_URL\s*\|\|\s*process\.env\.SUPABASE_URL/);
            assert.match(source, /process\.env\.SUPABASE_DATA_URL\s*\|\|\s*process\.env\.SUPABASE_URL/);
          });
          """.replace(/^          /gm, ''))

          print('Changed runtime files:')
          for item in changed:
              print(item)
          PY
      - name: Validate cleanup source and regression guard
        shell: bash
        run: |
          node --test test/dabbir-no-retired-supabase-origin.test.mjs
          while IFS= read -r file; do node --check "$file"; done < <(grep -RIl --include='*.js' -E 'SUPABASE_(AUTH_URL|DATA_URL|URL|PUBLISHABLE_KEY)' api | sort)
          if grep -RIn --include='*.js' -E 'spohjzrsymsmzsseygtw|sb_publishable_WPxhwNf08BW1FgBptkinWg_3j75O4O3' api; then
            echo 'Retired Supabase runtime reference remains' >&2
            exit 1
          fi
      - name: Commit branch cleanup
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No cleanup changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api test/dabbir-no-retired-supabase-origin.test.mjs
          git commit -m 'fix(dabbir): fail closed instead of falling back to retired Sydney Supabase'
          git push origin HEAD:chore/dabbir-fail-closed-supabase-origin-20260902
