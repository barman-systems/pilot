name: DABBIR Wave 0.7 Recovery Export

on:
  push:
    branches: [recovery/wave-0-7-export-20260904]
    paths:
      - .github/workflows/dabbir-wave-0-7-recovery-export.yml
      - recovery/wave-0-7/recovery-public.crt
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dabbir-wave-0-7-recovery-export
  cancel-in-progress: false

jobs:
  export:
    name: Encrypted read-only recovery export
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJECT_REF: fphpoysqdsceniwduxjq
      VERCEL_PROJECT_ID: prj_HCTFdQo8Vc7FvZRdJ37H7KFYwpUq
      VERCEL_TEAM_ID: team_pwfKq8jHuyW1XFVSZirAJiId
      SUPABASE_ACCESS_TOKEN_PRIMARY: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_ACCESS_TOKEN_SECONDARY: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
      VERCEL_TOKEN_VALUE: ${{ secrets.VERCEL_TOKEN }}
      SOURCE_DATABASE_URL_VALUE: ${{ secrets.SOURCE_DATABASE_URL }}
      DABBIR_DATABASE_URL_VALUE: ${{ secrets.DABBIR_DATABASE_URL }}
      SUPABASE_DATABASE_URL_VALUE: ${{ secrets.SUPABASE_DATABASE_URL }}
      DATABASE_URL_VALUE: ${{ secrets.DATABASE_URL }}
      SUPABASE_DB_PASSWORD_VALUE: ${{ secrets.SUPABASE_DB_PASSWORD }}
      DABBIR_DB_PASSWORD_VALUE: ${{ secrets.DABBIR_DB_PASSWORD }}
      SUPABASE_DATABASE_PASSWORD_VALUE: ${{ secrets.SUPABASE_DATABASE_PASSWORD }}
      POSTGRES_PASSWORD_VALUE: ${{ secrets.POSTGRES_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare non-sensitive capability record
        shell: bash
        run: |
          set -euo pipefail
          set +x
          mkdir -p "$RUNNER_TEMP/dabbir-private" wave-0-7-output
          chmod 700 "$RUNNER_TEMP/dabbir-private"
          jq -n \
            --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg project_ref "$PROJECT_REF" \
            --argjson supabase_access_token "$([ -n "${SUPABASE_ACCESS_TOKEN_PRIMARY:-}${SUPABASE_ACCESS_TOKEN_SECONDARY:-}" ] && echo true || echo false)" \
            --argjson vercel_token "$([ -n "${VERCEL_TOKEN_VALUE:-}" ] && echo true || echo false)" \
            --argjson direct_database_url "$([ -n "${SOURCE_DATABASE_URL_VALUE:-}${DABBIR_DATABASE_URL_VALUE:-}${SUPABASE_DATABASE_URL_VALUE:-}${DATABASE_URL_VALUE:-}" ] && echo true || echo false)" \
            --argjson database_password "$([ -n "${SUPABASE_DB_PASSWORD_VALUE:-}${DABBIR_DB_PASSWORD_VALUE:-}${SUPABASE_DATABASE_PASSWORD_VALUE:-}${POSTGRES_PASSWORD_VALUE:-}" ] && echo true || echo false)" \
            '{created_at:$created_at,project_ref:$project_ref,capabilities:{supabase_management_token:$supabase_access_token,vercel_token:$vercel_token,direct_database_url:$direct_database_url,database_password:$database_password}}' \
            > wave-0-7-output/capability.json

      - name: Query project-specific managed backup metadata
        shell: bash
        run: |
          set -euo pipefail
          set +x
          TOKEN="${SUPABASE_ACCESS_TOKEN_PRIMARY:-${SUPABASE_ACCESS_TOKEN_SECONDARY:-}}"
          if [ -z "$TOKEN" ]; then
            jq -n --arg project_ref "$PROJECT_REF" '{project_ref:$project_ref,status:"UNAVAILABLE_WITH_CURRENT_PERMISSION",reason:"management_token_unavailable"}' > wave-0-7-output/supabase-managed-backups.json
            exit 0
          fi
          echo "::add-mask::$TOKEN"
          HTTP_STATUS="$(curl --silent --show-error --output "$RUNNER_TEMP/supabase-backups.raw.json" --write-out '%{http_code}' -H "Authorization: Bearer $TOKEN" "https://api.supabase.com/v1/projects/$PROJECT_REF/database/backups")"
          if [ "$HTTP_STATUS" != "200" ]; then
            jq -n --arg project_ref "$PROJECT_REF" --arg http_status "$HTTP_STATUS" '{project_ref:$project_ref,status:"UNAVAILABLE_WITH_CURRENT_PERMISSION",http_status:$http_status}' > wave-0-7-output/supabase-managed-backups.json
            exit 0
          fi
          jq --arg project_ref "$PROJECT_REF" '
            def safe_backup: {
              id:(.id // null), status:(.status // null),
              inserted_at:(.inserted_at // null), created_at:(.created_at // null),
              started_at:(.started_at // null), completed_at:(.completed_at // null),
              is_physical_backup:(.is_physical_backup // null), backup_type:(.backup_type // .type // null)
            };
            {
              project_ref:$project_ref, status:"VERIFIED_FROM_MANAGEMENT_API",
              response_keys:(keys | sort),
              pitr_enabled:(if has("pitr_enabled") then .pitr_enabled elif has("pitrEnabled") then .pitrEnabled else null end),
              walg_enabled:(if has("walg_enabled") then .walg_enabled elif has("walgEnabled") then .walgEnabled else null end),
              retention_days:(.retention_days // .retentionDays // null),
              earliest_recovery_point:(.earliest_recovery_point // .earliestRecoveryPoint // null),
              latest_recovery_point:(.latest_recovery_point // .latestRecoveryPoint // null),
              backups:(if type == "array" then map(safe_backup) elif (.backups|type) == "array" then (.backups|map(safe_backup)) else [] end)
            }
          ' "$RUNNER_TEMP/supabase-backups.raw.json" > wave-0-7-output/supabase-managed-backups.json
          rm -f "$RUNNER_TEMP/supabase-backups.raw.json"

      - name: Query Vercel environment names and scopes
        shell: bash
        run: |
          set -euo pipefail
          set +x
          if [ -z "${VERCEL_TOKEN_VALUE:-}" ]; then
            jq -n '{status:"UNAVAILABLE_WITH_CURRENT_PERMISSION",reason:"vercel_token_unavailable",variables:[]}' > wave-0-7-output/vercel-environment-scopes.json
            exit 0
          fi
          echo "::add-mask::$VERCEL_TOKEN_VALUE"
          URL="https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?decrypt=false&limit=100&teamId=$VERCEL_TEAM_ID"
          HTTP_STATUS="$(curl --silent --show-error --output "$RUNNER_TEMP/vercel-env.raw.json" --write-out '%{http_code}' -H "Authorization: Bearer $VERCEL_TOKEN_VALUE" "$URL")"
          if [ "$HTTP_STATUS" != "200" ]; then
            jq -n --arg http_status "$HTTP_STATUS" '{status:"UNAVAILABLE_WITH_CURRENT_PERMISSION",http_status:$http_status,variables:[]}' > wave-0-7-output/vercel-environment-scopes.json
            exit 0
          fi
          jq '{
            status:"VERIFIED_FROM_VERCEL_API",
            variables:[.envs[]? | {name:.key,target:(.target // []),branch_restriction:(.gitBranch // null),type:(.type // null)}] | sort_by(.name,.target),
            pagination:{count:(.envs|length),next:(.pagination.next // null)}
          }' "$RUNNER_TEMP/vercel-env.raw.json" > wave-0-7-output/vercel-environment-scopes.json
          rm -f "$RUNNER_TEMP/vercel-env.raw.json"

      - name: Export and encrypt live database with read-only session
        id: database_export
        shell: bash
        run: |
          set -euo pipefail
          set +x
          DB_URL=""
          DB_SOURCE=""
          for candidate in \
            SOURCE_DATABASE_URL_VALUE \
            DABBIR_DATABASE_URL_VALUE \
            SUPABASE_DATABASE_URL_VALUE \
            DATABASE_URL_VALUE
          do
            value="${!candidate:-}"
            if [ -n "$value" ]; then
              DB_URL="$value"
              DB_SOURCE="${candidate%_VALUE}"
              break
            fi
          done
          if [ -z "$DB_URL" ]; then
            PASSWORD=""
            for candidate in \
              SUPABASE_DB_PASSWORD_VALUE \
              DABBIR_DB_PASSWORD_VALUE \
              SUPABASE_DATABASE_PASSWORD_VALUE \
              POSTGRES_PASSWORD_VALUE
            do
              value="${!candidate:-}"
              if [ -n "$value" ]; then
                PASSWORD="$value"
                DB_SOURCE="${candidate%_VALUE}+session_pooler"
                break
              fi
            done
            if [ -n "$PASSWORD" ]; then
              ENCODED_PASSWORD="$(PASSWORD_VALUE="$PASSWORD" python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["PASSWORD_VALUE"], safe=""))')"
              DB_URL="postgresql://postgres.${PROJECT_REF}:${ENCODED_PASSWORD}@aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require"
              unset PASSWORD ENCODED_PASSWORD
            fi
          fi
          if [ -z "$DB_URL" ]; then
            jq -n '{status:"BLOCKED",reason:"no_database_url_or_password_secret_available"}' > wave-0-7-output/database-export-status.json
            exit 0
          fi
          echo "::add-mask::$DB_URL"
          export PGOPTIONS='-c default_transaction_read_only=on -c statement_timeout=0'
          docker pull postgres:17-alpine >/dev/null
          if ! docker run --rm -e DATABASE_URL="$DB_URL" -e PGOPTIONS="$PGOPTIONS" postgres:17-alpine sh -c 'psql "$DATABASE_URL" --no-psqlrc --set ON_ERROR_STOP=1 -Atqc "select current_database(), current_setting('"'"'transaction_read_only'"'"');"' > "$RUNNER_TEMP/database-connectivity.txt"; then
            jq -n --arg source "$DB_SOURCE" '{status:"BLOCKED",reason:"database_connectivity_failed",credential_source:$source}' > wave-0-7-output/database-export-status.json
            exit 0
          fi
          grep -q '|on$' "$RUNNER_TEMP/database-connectivity.txt"
          PRIVATE_DIR="$RUNNER_TEMP/dabbir-private"
          docker run --rm -e DATABASE_URL="$DB_URL" -e PGOPTIONS="$PGOPTIONS" -v "$PRIVATE_DIR:/out" postgres:17-alpine sh -c 'pg_dump "$DATABASE_URL" --format=custom --compress=9 --schema-only --no-owner --file=/out/dabbir-schema.dump'
          docker run --rm -e DATABASE_URL="$DB_URL" -e PGOPTIONS="$PGOPTIONS" -v "$PRIVATE_DIR:/out" postgres:17-alpine sh -c 'pg_dump "$DATABASE_URL" --format=custom --compress=9 --data-only --no-owner --disable-triggers --file=/out/dabbir-data.dump'
          docker run --rm -v "$PRIVATE_DIR:/out" postgres:17-alpine sh -c 'pg_restore --list /out/dabbir-schema.dump > /out/schema.list && pg_restore --list /out/dabbir-data.dump > /out/data.list'
          SCHEMA_SIZE="$(stat -c %s "$PRIVATE_DIR/dabbir-schema.dump")"
          DATA_SIZE="$(stat -c %s "$PRIVATE_DIR/dabbir-data.dump")"
          SCHEMA_SHA="$(sha256sum "$PRIVATE_DIR/dabbir-schema.dump" | awk '{print $1}')"
          DATA_SHA="$(sha256sum "$PRIVATE_DIR/dabbir-data.dump" | awk '{print $1}')"
          SCHEMA_ITEMS="$(grep -cE 'TABLE|FUNCTION|TRIGGER|POLICY|INDEX|CONSTRAINT|TYPE|SCHEMA|SEQUENCE|VIEW' "$PRIVATE_DIR/schema.list" || true)"
          DATA_ITEMS="$(grep -cE 'TABLE DATA|SEQUENCE SET|BLOB' "$PRIVATE_DIR/data.list" || true)"
          openssl cms -encrypt -binary -aes-256-cbc -in "$PRIVATE_DIR/dabbir-schema.dump" -outform DER -out wave-0-7-output/dabbir-schema.dump.cms recovery/wave-0-7/recovery-public.crt
          openssl cms -encrypt -binary -aes-256-cbc -in "$PRIVATE_DIR/dabbir-data.dump" -outform DER -out wave-0-7-output/dabbir-data.dump.cms recovery/wave-0-7/recovery-public.crt
          jq -n \
            --arg status "VERIFIED" --arg format "PostgreSQL custom format; CMS encrypted (AES-256-CBC/RSA recipient)" \
            --arg credential_source "$DB_SOURCE" \
            --arg schema_sha256 "$SCHEMA_SHA" --arg data_sha256 "$DATA_SHA" \
            --argjson schema_size "$SCHEMA_SIZE" --argjson data_size "$DATA_SIZE" \
            --argjson schema_listing_items "$SCHEMA_ITEMS" --argjson data_listing_items "$DATA_ITEMS" \
            '{status:$status,format:$format,read_only_session:true,credential_source:$credential_source,schema:{plaintext_size:$schema_size,plaintext_sha256:$schema_sha256,listing_items:$schema_listing_items},data:{plaintext_size:$data_size,plaintext_sha256:$data_sha256,listing_items:$data_listing_items}}' \
            > wave-0-7-output/database-export-status.json
          sha256sum wave-0-7-output/*.cms > wave-0-7-output/encrypted-artifact-checksums.sha256
          rm -f "$PRIVATE_DIR/dabbir-schema.dump" "$PRIVATE_DIR/dabbir-data.dump" "$PRIVATE_DIR/schema.list" "$PRIVATE_DIR/data.list" "$RUNNER_TEMP/database-connectivity.txt"
          unset DB_URL

      - name: Record artifact manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find wave-0-7-output -maxdepth 1 -type f -printf '%f\t%s\n' | sort > wave-0-7-output/artifact-file-sizes.tsv
          sha256sum wave-0-7-output/* | sort -k2 > wave-0-7-output/artifact-files.sha256

      - name: Upload recovery evidence and encrypted dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dabbir-wave-0-7-recovery-export-${{ github.run_id }}
          path: wave-0-7-output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
