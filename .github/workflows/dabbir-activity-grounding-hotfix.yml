name: DABBIR Activity Grounding Hotfix

on:
  push:
    branches:
      - fix/whatsapp-activity-grounding-hours-v1

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: fix/whatsapp-activity-grounding-hours-v1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Apply deterministic patch
        run: python3 scripts/dabbir-activity-grounding-hotfix.py
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Targeted regression tests
        run: node --test test/dabbir-service-facts.test.mjs test/dabbir-repeat-booking-memory-confirmation.test.mjs test/dabbir-operating-hours-grounding-contract.test.mjs
      - name: Full verification
        run: |
          npm test
          npm run check:syntax
          npm run dabbir:build
      - name: Commit verified hotfix
        run: |
          git rm .github/workflows/dabbir-activity-grounding-hotfix.yml scripts/dabbir-activity-grounding-hotfix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api test supabase/migrations
          git commit -m 'fix(ai): enforce activity facts and operating hours'
          git push origin HEAD:fix/whatsapp-activity-grounding-hours-v1
