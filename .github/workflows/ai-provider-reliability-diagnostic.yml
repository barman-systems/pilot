name: AI Provider Reliability Diagnostic
on:
  pull_request:
    paths:
      - 'api/**'
      - 'test/**'
      - 'scripts/check-ai-provider-authority.mjs'
      - 'config/ai-provider-authority-registry.json'
      - 'supabase/migrations/20260914194000_dabbir_ai_provider_reliability_authority_v1.sql'
      - '.github/workflows/ai-provider-reliability-diagnostic.yml'
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci --ignore-scripts
      - name: transport authority
        run: node --test test/dabbir-ai-provider-reliability.test.mjs
      - name: postgres distributed authority
        run: node --test test/dabbir-ai-provider-reliability-db.test.mjs
      - name: collect bypass scan
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {checkProviderAuthority} from './scripts/check-ai-provider-authority.mjs';
          const result=checkProviderAuthority();
          fs.writeFileSync('provider-authority-errors.txt',result.errors.join('\n')+'\n');
          NODE
      - name: upload bypass diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: provider-authority-errors
          path: provider-authority-errors.txt
          if-no-files-found: error
          retention-days: 1
      - name: repository bypass scan complete
        run: node scripts/check-ai-provider-authority.mjs
      - name: bypass mutation detection
        run: node --test test/dabbir-ai-provider-authority-guard.test.mjs
      - name: whatsapp meter regression
        run: node --test test/dabbir-ai-customer-metering.test.mjs
      - name: tool agent regression
        run: node --test test/barman-tool-agent-structured-output.test.mjs
      - name: existing ai core regressions
        run: node --test test/dabbir-gemini-ai.test.mjs test/dabbir-cloudflare-ai.test.mjs test/dabbir-v3-live-provider-fallback.test.mjs
