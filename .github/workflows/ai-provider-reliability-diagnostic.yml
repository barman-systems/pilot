name: AI Provider Reliability Diagnostic
on:
  pull_request:
    paths:
      - 'api/**'
      - 'test/**'
      - 'scripts/check-ai-provider-authority.mjs'
      - 'config/ai-provider-authority-registry.json'
      - 'supabase/migrations/20260914194000_dabbir_ai_provider_reliability_authority_v1.sql'
      - '.github/workflows/ai-provider-reliability-diagnostic.yml'
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci --ignore-scripts
      - name: transport authority
        run: node --test test/dabbir-ai-provider-reliability.test.mjs
      - name: postgres distributed authority
        run: node --test test/dabbir-ai-provider-reliability-db.test.mjs
      - name: repository bypass scan
        run: node scripts/check-ai-provider-authority.mjs
      - name: bypass mutation detection
        run: node --test test/dabbir-ai-provider-authority-guard.test.mjs
      - name: meter regressions
        run: node --test test/dabbir-ai-customer-metering.test.mjs
      - name: tool agent regression
        run: node --test test/barman-tool-agent-structured-output.test.mjs
      - name: legacy core - Gemini
        run: node --test test/dabbir-gemini-ai.test.mjs
      - name: legacy core - Cloudflare
        run: node --test test/dabbir-cloudflare-ai.test.mjs
      - name: V3 - gateway structured request
        run: node --test --test-name-pattern='V3 Gateway fallback requests' test/dabbir-v3-live-provider-fallback.test.mjs
      - name: V3 - four attempt fallback
        run: node --test --test-name-pattern='live provider shape reaches' test/dabbir-v3-live-provider-fallback.test.mjs
      - name: V3 - fifth request guard
        run: node --test --test-name-pattern='invalid HTTP-200 Gateway semantics' test/dabbir-v3-live-provider-fallback.test.mjs
