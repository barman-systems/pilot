name: AI Provider Reliability Diagnostic
on:
  pull_request:
    paths:
      - 'api/**'
      - 'test/**'
      - 'scripts/check-ai-provider-authority.mjs'
      - 'config/ai-provider-authority-registry.json'
      - 'supabase/migrations/20260914194000_dabbir_ai_provider_reliability_authority_v1.sql'
      - '.github/workflows/ai-provider-reliability-diagnostic.yml'
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci --ignore-scripts
      - name: transport authority
        run: node --test test/dabbir-ai-provider-reliability.test.mjs
      - name: postgres distributed authority
        run: node --test test/dabbir-ai-provider-reliability-db.test.mjs
      - name: repository bypass scan
        run: node scripts/check-ai-provider-authority.mjs
      - name: bypass mutation detection
        run: node --test test/dabbir-ai-provider-authority-guard.test.mjs
      - name: meter - direct success telemetry
        run: node --test --test-name-pattern='synthetic provider telemetry' test/dabbir-ai-customer-metering.test.mjs
      - name: meter - shared 429 cooldown
        run: node --test --test-name-pattern='shared 429 cooldown' test/dabbir-ai-customer-metering.test.mjs
      - name: meter - billing and static contracts
        run: node --test --test-name-pattern='gateway cost|numeric zero|WhatsApp AI routes|meter preserves|authoritative ledger' test/dabbir-ai-customer-metering.test.mjs
      - name: meter - failed diagnostics privacy
        run: node --test --test-name-pattern='failed provider diagnostics' test/dabbir-ai-customer-metering.test.mjs
      - name: tool agent regression
        run: node --test test/barman-tool-agent-structured-output.test.mjs
      - name: existing ai core regressions
        run: node --test test/dabbir-gemini-ai.test.mjs test/dabbir-cloudflare-ai.test.mjs test/dabbir-v3-live-provider-fallback.test.mjs
