name: DABBIR public identifier cleanup

on:
  push:
    branches:
      - rename/dabbir-public-cleanup

permissions:
  contents: write

jobs:
  clean:
    if: ${{ !contains(github.event.head_commit.message, '[dabbir-public-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: rename/dabbir-public-cleanup

      - name: Remove public PILOT identifiers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          roots = [Path('index.html'), Path('team.html'), Path('translation-preview.html'), Path('api'), Path('test')]
          replacements = [
              ('pilot_lang', 'dabbir_lang'),
              ('data-pilot-', 'data-dabbir-'),
              ('dataset.pilot', 'dataset.dabbir'),
              ('pilot-store', 'dabbir-store'),
              ('pilotPulse', 'dabbirPulse'),
              ('pilotSending', 'dabbirSending'),
              ('pilot-local-', 'dabbir-local-'),
              ('pilot-typing-', 'dabbir-typing-'),
              ('pilotFastSendMessage', 'dabbirFastSendMessage'),
              ('pilotRecovery', 'dabbirRecovery'),
              ('x-pilot-', 'x-dabbir-'),
          ]
          public_surface_files = {
              Path('index.html'),
              Path('team.html'),
              Path('translation-preview.html'),
              Path('api/app.js'),
              Path('api/auth/recovery-ui.js'),
          }
          suffixes = {'.js','.mjs','.html','.css','.ts','.tsx','.jsx'}
          changed=[]
          candidates=[]
          for root in roots:
              if root.is_file(): candidates.append(root)
              elif root.is_dir(): candidates.extend(p for p in root.rglob('*') if p.is_file())
          for path in candidates:
              if path.suffix.lower() not in suffixes: continue
              text=path.read_text(encoding='utf-8')
              new=text
              for old,repl in replacements:
                  new=new.replace(old,repl)
              if path in public_surface_files:
                  new=new.replace('pilot','dabbir').replace('Pilot','DABBIR')
                  new=new.replace('>P</div><div><b>DABBIR', '>D</div><div><b>DABBIR')
              if new != text:
                  path.write_text(new,encoding='utf-8')
                  changed.append(str(path))
          print('Changed files:')
          print('\n'.join(changed) or 'none')

          remaining=[]
          for path in public_surface_files:
              if path.exists() and 'pilot' in path.read_text(encoding='utf-8').lower():
                  remaining.append(str(path))
          if remaining:
              raise SystemExit('Legacy public PILOT identifiers remain in: ' + ', '.join(remaining))
          PY

      - name: Verify tests
        run: npm test

      - name: Commit verified cleanup
        shell: bash
        run: |
          git config user.name "barmanai"
          git config user.email "actions@users.noreply.github.com"
          git add index.html team.html translation-preview.html api test
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "[dabbir-public-cleanup] remove legacy public PILOT identifiers"
          git push origin HEAD:rename/dabbir-public-cleanup
