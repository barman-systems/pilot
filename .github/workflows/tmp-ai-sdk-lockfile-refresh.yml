name: Temporary AI SDK Lockfile Refresh

on:
  push:
    branches:
      - fix/ai-sdk-v6-provider-compat

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/ai-sdk-v6-provider-compat
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Regenerate lockfile only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already synchronized'
            exit 0
          fi
          git config user.name 'dabbir-lockfile-bot'
          git config user.email 'dabbir-lockfile-bot@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(ai): regenerate lockfile for AI SDK v6 compatibility'
          git push origin HEAD:fix/ai-sdk-v6-provider-compat
