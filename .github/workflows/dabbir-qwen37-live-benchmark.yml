name: DABBIR Qwen3.7 Live Benchmark
# Isolated benchmark workflow; never promotes or mutates Production routing.

on:
  workflow_dispatch:
  push:
    branches:
      - feat/qwen37-bonsai-intelligence-benchmark-20260914
    paths:
      - 'api/_dabbir-qwen37-benchmark.js'
      - 'api/dabbir-qwen37-benchmark.js'
      - 'api/_dabbir-cognitive-probe.js'
      - 'api/_dabbir-semantic-interpreter.js'
      - 'api/_ai-core.js'
      - 'test/dabbir-qwen37-live-benchmark.mjs'
      - '.github/workflows/dabbir-qwen37-live-benchmark.yml'

permissions:
  contents: read
  id-token: write

jobs:
  qwen37-live-benchmark:
    name: Protected Qwen3.7 cognitive benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      QWEN37_BENCHMARK_ORIGIN: https://dabbir-git-feat-qwen37-bonsai-549b7c-nd56cm4j5v-3619s-projects.vercel.app
      EXPECTED_BENCHMARK_SHA: ${{ github.sha }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      QWEN37_BENCHMARK_REPORT_PATH: dabbir-qwen37-live-benchmark.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Prepare protected preview access
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            echo 'QWEN37_BENCHMARK_PROTECTION=automation_bypass'
            exit 0
          fi
          response="$(mktemp)"
          status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}" || true)"
          if [ "$status" != '200' ]; then
            echo "TRUSTED_OIDC_REQUEST_FAILED_HTTP_${status:-000}"
            exit 2
          fi
          token="$(jq -r '.value // empty' "$response")"
          if [ -z "$token" ]; then
            echo 'TRUSTED_OIDC_TOKEN_EMPTY'
            exit 2
          fi
          echo "::add-mask::$token"
          echo "VERCEL_TRUSTED_OIDC_TOKEN=$token" >> "$GITHUB_ENV"
          echo 'QWEN37_BENCHMARK_PROTECTION=trusted_oidc'
      - name: Run real Qwen3.7 benchmark on protected preview
        run: node test/dabbir-qwen37-live-benchmark.mjs
      - name: Publish benchmark summary
        if: always()
        shell: bash
        run: |
          if [ -f "$QWEN37_BENCHMARK_REPORT_PATH" ]; then
            echo '## DABBIR Qwen3.7 Live Benchmark' >> "$GITHUB_STEP_SUMMARY"
            echo "**Expected SHA:** $EXPECTED_BENCHMARK_SHA" >> "$GITHUB_STEP_SUMMARY"
            echo "**Verdict:** $(jq -r '.verdict' "$QWEN37_BENCHMARK_REPORT_PATH")" >> "$GITHUB_STEP_SUMMARY"
            echo "**Scenarios:** $(jq -r '.aggregate.scenario_passed|tostring' "$QWEN37_BENCHMARK_REPORT_PATH")/$(jq -r '.aggregate.scenario_total|tostring' "$QWEN37_BENCHMARK_REPORT_PATH")" >> "$GITHUB_STEP_SUMMARY"
            echo "**Provider calls:** $(jq -r '.aggregate.provider_calls' "$QWEN37_BENCHMARK_REPORT_PATH")" >> "$GITHUB_STEP_SUMMARY"
            echo "**Input tokens:** $(jq -r '.aggregate.input_tokens' "$QWEN37_BENCHMARK_REPORT_PATH")" >> "$GITHUB_STEP_SUMMARY"
            echo "**Output tokens:** $(jq -r '.aggregate.output_tokens' "$QWEN37_BENCHMARK_REPORT_PATH")" >> "$GITHUB_STEP_SUMMARY"
            echo "**Reasoning tokens:** $(jq -r '.aggregate.reasoning_tokens' "$QWEN37_BENCHMARK_REPORT_PATH")" >> "$GITHUB_STEP_SUMMARY"
            echo "**Average provider latency ms:** $(jq -r '.aggregate.avg_provider_latency_ms' "$QWEN37_BENCHMARK_REPORT_PATH")" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload Qwen3.7 benchmark evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dabbir-qwen37-live-benchmark-evidence
          path: dabbir-qwen37-live-benchmark.json
          if-no-files-found: warn
          retention-days: 7
