name: Branch Cognitive Gate Patcher

on:
  push:
    branches:
      - fix/customer-journey-determinism-guardian

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message != 'fix(qa): stabilize cognitive journey gate' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/customer-journey-determinism-guardian
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Apply and verify exact journey gate patch
        run: |
          python3 scripts/branch-cognitive-gate-patch.py
          node --check test/ai-full-customer-journey-v2.mjs
          node --test test/dabbir-cognitive-gate.test.mjs test/dabbir-release-guardian-baseline.test.mjs
      - name: Commit patched journey and remove one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'dabbir-qa-patcher'
          git config user.email 'dabbir-qa-patcher@users.noreply.github.com'
          git add test/ai-full-customer-journey-v2.mjs
          git rm .github/workflows/branch-cognitive-gate-patcher.yml scripts/branch-cognitive-gate-patch.py
          git commit -m 'fix(qa): stabilize cognitive journey gate'
          git push origin HEAD:fix/customer-journey-determinism-guardian
