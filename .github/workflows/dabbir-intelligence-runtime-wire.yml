name: DABBIR intelligence dependency repair

on:
  push:
    branches:
      - feat/dabbir-intelligence-flywheel-v1
    paths:
      - .github/workflows/dabbir-intelligence-runtime-wire.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dabbir-intelligence-flywheel-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Remove unused vulnerable Workflow runtime line
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          package_path=Path('package.json')
          package=json.loads(package_path.read_text())
          deps=package.get('dependencies',{})
          for name in ('@ai-sdk/workflow','workflow','@ai-sdk/otel'):
              deps.pop(name,None)
          package_path.write_text(json.dumps(package,indent=2,ensure_ascii=False)+'\n')

          Path('test/ai-sdk-version-contract.test.mjs').write_text("""import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const pkg = JSON.parse(fs.readFileSync(new URL('../package.json', import.meta.url), 'utf8'));
          const lock = JSON.parse(fs.readFileSync(new URL('../package-lock.json', import.meta.url), 'utf8'));
          const packages = lock.packages || {};

          test('DABBIR stays on the stable AI SDK 7 production line', () => {
            const expected={
              ai:'7.0.62',
              '@ai-sdk/openai-compatible':'3.0.44',
              zod:'4.5.4',
            };
            for (const [name,version] of Object.entries(expected)) {
              assert.equal(pkg.dependencies?.[name],version);
              assert.equal(packages[`node_modules/${name}`]?.version,version);
            }
          });

          test('OpenAI-compatible adapter resolves a single provider protocol line', () => {
            const compatible=packages['node_modules/@ai-sdk/openai-compatible'];
            const rootProvider=packages['node_modules/@ai-sdk/provider'];
            assert.ok(compatible);
            assert.ok(rootProvider);
            assert.ok(compatible.dependencies?.['@ai-sdk/provider']);
            assert.equal(packages['node_modules/@ai-sdk/openai-compatible/node_modules/@ai-sdk/provider'], undefined);
          });

          test('WorkflowAgent is not shipped until its stable dependency graph passes the production audit', () => {
            assert.equal(pkg.dependencies?.['@ai-sdk/workflow'],undefined);
            assert.equal(pkg.dependencies?.workflow,undefined);
            assert.equal(packages['node_modules/@ai-sdk/workflow'],undefined);
            assert.equal(packages['node_modules/workflow'],undefined);
          });

          test('unused AI telemetry integration is not shipped as a dead production dependency', () => {
            assert.equal(pkg.dependencies?.['@ai-sdk/otel'],undefined);
            assert.equal(packages['node_modules/@ai-sdk/otel'],undefined);
          });
          """.replace('          ',''))
          PY
      - name: Regenerate lock without force
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify clean production graph and full gates
        run: |
          npm ci --ignore-scripts
          npm run audit:prod
          npm test
          npm run check:syntax
          npm run dabbir:build
      - name: Commit verified repair and remove one-shot workflow
        run: |
          rm .github/workflows/dabbir-intelligence-runtime-wire.yml
          git config user.name dabbir-release-guardian
          git config user.email dabbir-release-guardian@users.noreply.github.com
          git add package.json package-lock.json test/ai-sdk-version-contract.test.mjs .github/workflows/dabbir-intelligence-runtime-wire.yml
          git commit -m "fix(ai): remove unused vulnerable workflow runtime"
          git push origin HEAD:feat/dabbir-intelligence-flywheel-v1
