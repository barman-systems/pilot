name: Booking lifecycle source audit
on:
  push:
    branches: [fix/booking-lifecycle-all-activities-20260906]
    paths: [.github/workflows/booking-lifecycle-source-audit.yml]
permissions:
  contents: read
jobs:
  tracked-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: |
          mkdir -p source-audit
          git rev-parse HEAD > source-audit/commit.txt
          git archive --format=tar.gz HEAD > source-audit/source.tar.gz
          sha256sum source-audit/source.tar.gz > source-audit/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: booking-lifecycle-tracked-source
          path: source-audit/
          retention-days: 1
          if-no-files-found: error
