name: Booking lifecycle patch apply
on:
  push:
    branches: [fix/booking-lifecycle-all-activities-20260906]
    paths:
      - '.github/workflows/booking-lifecycle-source-audit.yml'
      - '.github/booking-patches/**'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/booking-lifecycle-all-activities-20260906
          fetch-depth: 0
          persist-credentials: true
      - name: Apply reviewed lifecycle patches
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/booking-patches/.ready || exit 0
          shopt -s nullglob
          patches=(.github/booking-patches/*.patch)
          ((${#patches[@]})) || exit 1
          git config user.name 'barmanai'
          git config user.email 'alcaptain2014@gmail.com'
          for patch in "${patches[@]}"; do
            if ! git apply --check "$patch"; then
              printf '%s\n' "$patch" > .github/booking-patch-failure.txt
              git add .github/booking-patch-failure.txt
              git commit -m 'chore(booking): record patch apply blocker'
              git push origin HEAD:fix/booking-lifecycle-all-activities-20260906
              exit 1
            fi
            git apply "$patch"
          done
          rm -rf .github/booking-patches .github/booking-patch-failure.txt
          git add -A
          git diff --cached --check
          git commit -m 'fix(bookings): separate active work from resolved history'
          git push origin HEAD:fix/booking-lifecycle-all-activities-20260906
