name: Booking lifecycle patch apply
on:
  push:
    branches: [fix/booking-lifecycle-all-activities-20260906]
    paths:
      - '.github/workflows/booking-lifecycle-source-audit.yml'
      - '.github/booking-lifecycle.patch'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/booking-lifecycle-all-activities-20260906
          fetch-depth: 0
          persist-credentials: true
      - name: Apply reviewed lifecycle patch
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/booking-lifecycle.patch || exit 0
          git apply --check .github/booking-lifecycle.patch
          git apply .github/booking-lifecycle.patch
          rm -f .github/booking-lifecycle.patch
          git config user.name 'barmanai'
          git config user.email 'alcaptain2014@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(bookings): separate active work from resolved history'
          git push origin HEAD:fix/booking-lifecycle-all-activities-20260906
