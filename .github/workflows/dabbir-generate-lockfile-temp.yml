name: DABBIR Generate Lockfile Temp

on:
  pull_request:
  push:
    branches: [chore/dabbir-dependency-reproducibility-20260827]

permissions:
  contents: read

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Generate npm lockfile deterministically
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Emit compressed lockfile evidence
        shell: bash
        run: |
          set -euo pipefail
          echo 'DABBIR_LOCKFILE_GZIP_BASE64_START'
          gzip -c package-lock.json | base64 -w0
          echo
          echo 'DABBIR_LOCKFILE_GZIP_BASE64_END'
