name: DABBIR Full Git History Secret Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/dabbir-git-history-secret-audit.mjs'
      - '.github/workflows/dabbir-history-secret-audit.yml'
      - 'test/dabbir-git-history-secret-audit.test.mjs'

permissions:
  contents: read

jobs:
  audit:
    name: full-history-secret-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout protected main history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Use locked Node runtime
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Fetch every reachable branch, tag and pull-request head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --prune --no-tags origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*' \
            '+refs/pull/*/head:refs/remotes/pull/*'
      - name: Scan full reachable Git history without printing secret values
        run: node .github/scripts/dabbir-git-history-secret-audit.mjs --output history-secret-audit.json
      - name: Upload redacted audit result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dabbir-history-secret-audit
          path: history-secret-audit.json
          if-no-files-found: error
          retention-days: 30
