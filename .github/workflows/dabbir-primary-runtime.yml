name: DABBIR primary runtime conversion

on:
  push:
    branches:
      - rename/pilot-to-dabbir

permissions:
  contents: write

jobs:
  convert:
    if: ${{ !contains(github.event.head_commit.message, '[dabbir-primary-runtime]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: rename/pilot-to-dabbir

      - name: Make DABBIR endpoints authoritative
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          pairs = [
              ('api/pilot-runtime.js', 'api/dabbir-runtime.js'),
              ('api/pilot-ai.js', 'api/dabbir-ai.js'),
              ('api/pilot-whatsapp-webhook.js', 'api/dabbir-whatsapp-webhook.js'),
          ]

          for legacy, primary in pairs:
              legacy_path = Path(legacy)
              primary_path = Path(primary)
              impl = legacy_path.read_text(encoding='utf-8')
              impl = impl.replace("service: 'pilot-ai'", "service: 'dabbir-ai'")
              impl = impl.replace('PRODUCTION_PILOT', 'PRODUCTION_DABBIR')
              impl = impl.replace('PREVIEW_PILOT', 'PREVIEW_DABBIR')
              primary_path.write_text(impl, encoding='utf-8')
              legacy_path.write_text(
                  f"export {{ default }} from './{primary_path.name}';\nexport * from './{primary_path.name}';\n",
                  encoding='utf-8'
              )

          # Move all test expectations and imports to the DABBIR-primary endpoint names.
          for path in Path('test').glob('*.mjs'):
              text = path.read_text(encoding='utf-8')
              new = text.replace('pilot-runtime', 'dabbir-runtime')
              new = new.replace('pilot-ai', 'dabbir-ai')
              new = new.replace('pilot-whatsapp-webhook', 'dabbir-whatsapp-webhook')
              if new != text:
                  path.write_text(new, encoding='utf-8')

          # Remove visible legacy logo letter from product surfaces.
          for name in ['index.html', 'team.html', 'translation-preview.html']:
              path = Path(name)
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              text = text.replace('<div class="logo">P</div>', '<div class="logo">D</div>')
              text = text.replace('<div class="pilotRecoveryLogo">P</div>', '<div class="pilotRecoveryLogo">D</div>')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Verify full test suite
        run: npm test

      - name: Commit verified conversion
        shell: bash
        run: |
          git config user.name "barmanai"
          git config user.email "actions@users.noreply.github.com"
          git add api test index.html team.html translation-preview.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "[dabbir-primary-runtime] make DABBIR runtime authoritative"
          git push origin HEAD:rename/pilot-to-dabbir
