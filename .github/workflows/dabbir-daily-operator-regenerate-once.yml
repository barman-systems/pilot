name: DABBIR Daily Operator Regenerate Once

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/dabbir-daily-operator-regenerate-once.yml'

permissions:
  contents: read

jobs:
  regenerate:
    name: Regenerate today's Daily Operator V5 report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_pwfKq8jHuyW1XFVSZirAJiId
      VERCEL_PROJECT_ID: prj_HCTFdQo8Vc7FvZRdJ37H7KFYwpUq
      CRON_PATH: /api/dabbir-daily-operator-cron
      CRON_SCHEDULE: '15 5 * * *'
    steps:
      - name: Verify deployed production cron
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo 'VERCEL_TOKEN_MISSING'; exit 2; }
          project_url="https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_TEAM_ID}"
          curl --fail-with-body --silent --show-error \
            "$project_url" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H 'Accept: application/json' > project.json
          jq -e --arg path "$CRON_PATH" --arg schedule "$CRON_SCHEDULE" '
            (.crons.disabledAt == null) and
            any(.crons.definitions[]?; .path == $path and .schedule == $schedule)
          ' project.json >/dev/null
          echo 'DAILY_OPERATOR_CRON_VERIFIED'
      - name: Trigger deployed production cron once
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.vercel.com/v1/projects/${VERCEL_PROJECT_ID}/crons/run?teamId=${VERCEL_TEAM_ID}"
          payload="$(jq -nc --arg path "$CRON_PATH" --arg schedule "$CRON_SCHEDULE" '{path:$path,schedule:$schedule}')"
          curl --fail-with-body --silent --show-error \
            -X POST "$endpoint" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$payload" > invocation.json
          jq -e '.invocationAt | numbers' invocation.json >/dev/null
          echo 'DAILY_OPERATOR_CRON_TRIGGERED'
