name: DABBIR Daily Operator Regenerate Once

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/dabbir-daily-operator-regenerate-once.yml'

permissions:
  contents: read

jobs:
  regenerate:
    name: Regenerate today's Daily Operator V5 report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_pwfKq8jHuyW1XFVSZirAJiId
      VERCEL_PROJECT_ID: prj_HCTFdQo8Vc7FvZRdJ37H7KFYwpUq
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify configured production cron
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo 'VERCEL_TOKEN_MISSING'; exit 2; }
          npx --yes vercel@58.4.4 crons list --format=json --token "$VERCEL_TOKEN" > crons.json
          jq -e '.[] | select(.path == "/api/dabbir-daily-operator-cron")' crons.json >/dev/null
          echo 'DAILY_OPERATOR_CRON_VERIFIED'
      - name: Trigger deployed production cron once
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@58.4.4 crons run /api/dabbir-daily-operator-cron --token "$VERCEL_TOKEN"
          echo 'DAILY_OPERATOR_CRON_TRIGGERED'
