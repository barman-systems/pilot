name: DABBIR Mobile CI

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'api/mobile/**'
      - '.github/workflows/dabbir-mobile-ci.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'api/mobile/**'

permissions:
  contents: read

jobs:
  mobile-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Expo doctor
        run: npx expo-doctor@latest
      - name: TypeScript
        run: npm run typecheck
      - name: Validate Expo config
        env:
          DABBIR_IOS_BUNDLE_ID: com.barmansystems.dabbir
          DABBIR_IOS_BUILD_NUMBER: '1'
        run: npx expo config --type public >/tmp/dabbir-expo-config.json
