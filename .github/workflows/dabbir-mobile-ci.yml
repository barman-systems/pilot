name: DABBIR Mobile CI

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'api/mobile/**'
      - 'api/_apple-iap-core.js'
      - 'api/apple/**'
      - 'supabase/migrations/*dabbir_apple*'
      - 'supabase/migrations/*dabbir_*account_deletion*'
      - 'scripts/dabbir-app-store-preflight.mjs'
      - 'test/dabbir-app-store-preflight.test.mjs'
      - 'privacy.html'
      - 'terms.html'
      - 'support.html'
      - 'vercel.json'
      - '.github/workflows/dabbir-mobile-ci.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'api/mobile/**'
      - 'api/_apple-iap-core.js'
      - 'api/apple/**'
      - 'supabase/migrations/*dabbir_apple*'
      - 'supabase/migrations/*dabbir_*account_deletion*'
      - 'scripts/dabbir-app-store-preflight.mjs'
      - 'test/dabbir-app-store-preflight.test.mjs'
      - 'privacy.html'
      - 'terms.html'
      - 'support.html'
      - 'vercel.json'
      - '.github/workflows/dabbir-mobile-ci.yml'

permissions:
  contents: read

jobs:
  mobile-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
      - name: Run App Store static preflight
        working-directory: .
        env:
          DABBIR_APP_STORE_PREFLIGHT_REPORT_PATH: dabbir-app-store-preflight-report.json
        run: node scripts/dabbir-app-store-preflight.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Expo doctor
        run: npx expo-doctor@latest
      - name: TypeScript
        run: npm run typecheck
      - name: Validate Expo config
        env:
          DABBIR_IOS_BUNDLE_ID: com.barmansystems.dabbir
          DABBIR_IOS_BUILD_NUMBER: '1'
        run: npx expo config --type public >/tmp/dabbir-expo-config.json
      - name: Upload App Store preflight evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dabbir-app-store-preflight-evidence
          path: dabbir-app-store-preflight-report.json
          if-no-files-found: warn
          retention-days: 14

  ios-native-compile:
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    env:
      DABBIR_IOS_BUNDLE_ID: com.barmansystems.dabbir
      DABBIR_IOS_BUILD_NUMBER: '1'
      EXPO_PUBLIC_DABBIR_API_BASE_URL: https://dabbir-git-main-nd56cm4j5v-3619s-projects.vercel.app
      EXPO_PUBLIC_IOS_IAP_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
      - name: Verify Xcode 26 toolchain
        shell: bash
        run: |
          xcodebuild -version
          XCODE_MAJOR="$(xcodebuild -version | awk '/Xcode/{split($2,v,"."); print v[1]}')"
          test "${XCODE_MAJOR}" -ge 26
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean --no-install
      - name: Install CocoaPods
        working-directory: mobile/ios
        run: pod install
      - name: Resolve workspace and shared scheme
        shell: bash
        run: |
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "${WORKSPACE}"
          SCHEME="$(xcodebuild -workspace "${WORKSPACE}" -list -json | python3 -c 'import json,sys; data=json.load(sys.stdin); schemes=data.get("workspace",{}).get("schemes",[]); print(schemes[0] if schemes else "")')"
          test -n "${SCHEME}"
          printf 'DABBIR_XCODE_WORKSPACE=%s\nDABBIR_XCODE_SCHEME=%s\n' "${WORKSPACE}" "${SCHEME}" >> "$GITHUB_ENV"
      - name: Compile Release for iOS Simulator without signing
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -workspace "${DABBIR_XCODE_WORKSPACE}" \
            -scheme "${DABBIR_XCODE_SCHEME}" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee /tmp/dabbir-xcodebuild-simulator.log
      - name: Compile Release for generic iOS device without signing
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -workspace "${DABBIR_XCODE_WORKSPACE}" \
            -scheme "${DABBIR_XCODE_SCHEME}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build | tee /tmp/dabbir-xcodebuild-device.log
      - name: Record native compile evidence
        if: success()
        shell: bash
        run: |
          {
            echo "xcode=$(xcodebuild -version | tr '\n' ' ')"
            echo "iphoneos_sdk=$(xcrun --sdk iphoneos --show-sdk-version)"
            echo "iphonesimulator_sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)"
            echo "workspace=${DABBIR_XCODE_WORKSPACE}"
            echo "scheme=${DABBIR_XCODE_SCHEME}"
            echo "sha=${GITHUB_SHA}"
            echo "simulator_release_compile=PASS"
            echo "generic_device_release_compile=PASS"
            echo "code_signing=DISABLED_FOR_COMPILE_GATE"
          } > /tmp/dabbir-ios-native-compile-evidence.txt
      - name: Upload native compile evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dabbir-ios-native-compile-evidence
          path: |
            /tmp/dabbir-ios-native-compile-evidence.txt
            /tmp/dabbir-xcodebuild-simulator.log
            /tmp/dabbir-xcodebuild-device.log
          if-no-files-found: warn
          retention-days: 7
