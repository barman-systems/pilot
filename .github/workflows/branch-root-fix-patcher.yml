name: Branch root fix patcher
on:
  push:
    branches: [fix/gateway-ar-latency-punctuation-root]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {ref: fix/gateway-ar-latency-punctuation-root}
      - name: Apply source fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('api/_dabbir-semantic-engine-core.js')
          s=p.read_text()
          old="return acknowledge&&known.length?(en?'Got it: ':'تمام، ')+known.join('، ')+'. '+question:question;"
          new="return acknowledge&&known.length?(en?'Got it: ':'تمام، ')+known.join(en?', ':'، ')+'. '+question:question;"
          assert old in s
          p.write_text(s.replace(old,new,1))
          t=Path('test/dabbir-goal-driven-planner.test.mjs')
          x=t.read_text()
          marker="test('an actually pending unanswered field stays coherent instead of jumping around the form',()=>{"
          assert marker in x
          test="""test('English grounded acknowledgement uses English punctuation at composition source',()=>{\n  const state=baseState({language:'en',missing_fields:['vehicle'],clarification_entity:'vehicle',\n    entities:{service:fact('svc'),branch:fact('branch','DATABASE_FACT',1),date:fact('2026-09-12'),time:fact('09:00')},cognition:{pending_field:'vehicle'}});\n  const r=plan(state,null,null,'I want to book tomorrow at 9am');\n  assert.doesNotMatch(r.decision.reply,/،/);\n});\n\n"""
          t.write_text(x.replace(marker,test+marker,1))
          PY
      - run: node --test test/dabbir-goal-driven-planner.test.mjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api/_dabbir-semantic-engine-core.js test/dabbir-goal-driven-planner.test.mjs
          git commit -m 'fix(brain): compose punctuation by conversation language'
          git push
