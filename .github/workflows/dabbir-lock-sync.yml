name: DABBIR Lock Sync Retired

# This workflow is intentionally inert. The one-time deterministic lockfile
# synchronization completed on 2026-08-28. Keeping it non-triggering avoids
# a self-modifying release pipeline while preserving the audit trail in Git.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'DABBIR root lockfile synchronization is complete; no mutation performed.'
