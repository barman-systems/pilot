name: DABBIR P0-A Secret History Audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dabbir-p0a-secret-history-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout complete history without persisted credentials
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Inventory workflow credential names and OIDC usage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p0-a-evidence
          node scripts/dabbir-p0a-workflow-credential-inventory.mjs p0-a-evidence/workflow-credential-inventory.json

      - name: Scan current tree and all fetched history with pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p0-a-evidence /tmp/dabbir-p0a-gitleaks
          chmod 700 /tmp/dabbir-p0a-gitleaks
          image='ghcr.io/gitleaks/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055'
          docker pull "$image" >/dev/null
          printf '%s\n' "$image" > p0-a-evidence/gitleaks-image.txt

          # Raw scanner reports are ephemeral and never printed or uploaded. The sanitizer
          # hashes candidate values before discarding them, so dispositions can be bound
          # deterministically without turning CI logs/artifacts into an exfiltration path.
          docker run --rm -v "$PWD:/repo" -w /repo "$image" \
            dir /repo --no-banner --exit-code 0 \
            --report-format json --report-path /repo/.gitleaks-current.raw.json \
            > /tmp/dabbir-p0a-gitleaks/current.log 2>&1
          docker run --rm -v "$PWD:/repo" -w /repo "$image" \
            git --log-opts='--all' /repo --no-banner --exit-code 0 \
            --report-format json --report-path /repo/.gitleaks-history.raw.json \
            > /tmp/dabbir-p0a-gitleaks/history.log 2>&1

          node scripts/dabbir-p0a-secret-sanitize.mjs gitleaks-current .gitleaks-current.raw.json p0-a-evidence/gitleaks-current-sanitized.json
          node scripts/dabbir-p0a-secret-sanitize.mjs gitleaks-history .gitleaks-history.raw.json p0-a-evidence/gitleaks-history-sanitized.json
          rm -f .gitleaks-current.raw.json .gitleaks-history.raw.json
          rm -rf /tmp/dabbir-p0a-gitleaks

      - name: Independently verify candidate credentials with pinned TruffleHog version
        id: trufflehog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dabbir-p0a-trufflehog p0-a-evidence
          chmod 700 /tmp/dabbir-p0a-trufflehog
          image='trufflesecurity/trufflehog:3.97.4'
          docker pull "$image" >/dev/null
          docker image inspect "$image" --format '{{index .RepoDigests 0}}' > p0-a-evidence/trufflehog-image-digest.txt
          status=0
          docker run --rm -v "$PWD:/repo:ro" "$image" git file:///repo --json --results=verified,unknown \
            > /tmp/dabbir-p0a-trufflehog/raw.jsonl 2>/tmp/dabbir-p0a-trufflehog/stderr.log || status=$?
          node scripts/dabbir-p0a-secret-sanitize.mjs trufflehog /tmp/dabbir-p0a-trufflehog/raw.jsonl p0-a-evidence/trufflehog-sanitized.json
          jq --argjson scanner_status "$status" '. + {scanner_status:$scanner_status,scanner:"trufflehog",version:"3.97.4"}' \
            p0-a-evidence/trufflehog-sanitized.json > p0-a-evidence/trufflehog-sanitized.tmp
          mv p0-a-evidence/trufflehog-sanitized.tmp p0-a-evidence/trufflehog-sanitized.json
          rm -rf /tmp/dabbir-p0a-trufflehog

      - name: Resolve candidate digests against reviewed dispositions
        shell: bash
        run: |
          set -euo pipefail
          status=0
          node scripts/dabbir-p0a-secret-disposition.mjs \
            p0-a-evidence/gitleaks-current-sanitized.json \
            p0-a-evidence/gitleaks-history-sanitized.json \
            config/p0a-secret-dispositions.json \
            p0-a-evidence/secret-disposition-summary.json || status=$?
          echo "$status" > p0-a-evidence/disposition-status.txt

      - name: Emit value-free scan summary
        shell: bash
        run: |
          set -euo pipefail
          current="$(jq '.count' p0-a-evidence/gitleaks-current-sanitized.json)"
          history="$(jq '.count' p0-a-evidence/gitleaks-history-sanitized.json)"
          verified="$(jq '.verified_count' p0-a-evidence/trufflehog-sanitized.json)"
          unknown="$(jq '.unknown_count' p0-a-evidence/trufflehog-sanitized.json)"
          scanner_status="$(jq '.scanner_status' p0-a-evidence/trufflehog-sanitized.json)"
          unresolved="$(jq '.unresolved_count' p0-a-evidence/secret-disposition-summary.json)"
          disposition_verdict="$(jq -r '.verdict' p0-a-evidence/secret-disposition-summary.json)"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg exact_head_sha "$GITHUB_SHA" \
            --arg disposition_verdict "$disposition_verdict" \
            --argjson gitleaks_current "$current" \
            --argjson gitleaks_history "$history" \
            --argjson trufflehog_verified "$verified" \
            --argjson trufflehog_unknown "$unknown" \
            --argjson trufflehog_status "$scanner_status" \
            --argjson unresolved_count "$unresolved" \
            '{schema:"dabbir.p0a.secret_history_summary.v2",repository:$repository,exact_head_sha:$exact_head_sha,values_included:false,gitleaks_current:$gitleaks_current,gitleaks_history:$gitleaks_history,trufflehog_verified:$trufflehog_verified,trufflehog_unknown:$trufflehog_unknown,trufflehog_status:$trufflehog_status,disposition_verdict:$disposition_verdict,unresolved_count:$unresolved_count}' \
            > p0-a-evidence/scan-summary.json
          cat p0-a-evidence/scan-summary.json

      - name: Upload sanitized machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dabbir-p0a-secret-history-${{ github.sha }}
          path: p0-a-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed on verified, unknown, scanner, or undisposed candidates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s p0-a-evidence/scan-summary.json
          verified="$(jq '.trufflehog_verified' p0-a-evidence/scan-summary.json)"
          unknown="$(jq '.trufflehog_unknown' p0-a-evidence/scan-summary.json)"
          scanner_status="$(jq '.trufflehog_status' p0-a-evidence/scan-summary.json)"
          unresolved="$(jq '.unresolved_count' p0-a-evidence/scan-summary.json)"
          if [ "$scanner_status" != '0' ] || [ "$verified" != '0' ] || [ "$unknown" != '0' ] || [ "$unresolved" != '0' ]; then
            echo "P0A_SECRET_HISTORY=REVIEW_REQUIRED verified=$verified unknown=$unknown scanner_status=$scanner_status unresolved=$unresolved"
            exit 1
          fi
          echo 'P0A_SECRET_HISTORY=PASS unresolved=0 verified=0 unknown=0'
