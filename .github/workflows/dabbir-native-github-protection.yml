name: DABBIR Native GitHub Protection Bootstrap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dabbir-native-github-protection.yml'

permissions:
  contents: read

jobs:
  protect-main:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_ADMIN_TOKEN: ${{ secrets.DABBIR_GITHUB_ADMIN_TOKEN }}
    steps:
      - name: Require GitHub admin credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_ADMIN_TOKEN:-}" ]; then
            echo '::error::DABBIR_GITHUB_ADMIN_TOKEN is not configured; refusing to report native branch protection as applied.'
            exit 1
          fi

      - name: Apply native protection to main
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/main/protection"
          body='{"required_status_checks":{"strict":true,"contexts":["test","BARMAN Independent Pre-Merge Gate"]},"enforce_admins":true,"required_pull_request_reviews":{"dismiss_stale_reviews":false,"require_code_owner_reviews":false,"required_approving_review_count":0,"require_last_push_approval":false,"bypass_pull_request_allowances":{"users":[],"teams":[],"apps":[]}},"restrictions":null,"required_linear_history":true,"allow_force_pushes":false,"allow_deletions":false,"block_creations":true,"required_conversation_resolution":true,"lock_branch":false,"allow_fork_syncing":false}'

          curl --silent --show-error --fail-with-body \
            --request PUT \
            --header "Authorization: Bearer ${GH_ADMIN_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            --data "$body" \
            "$API" >/dev/null

      - name: Verify native protection
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/main/protection"
          verified="$(curl --silent --show-error --fail-with-body \
            --header "Authorization: Bearer ${GH_ADMIN_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$API")"

          VERIFIED="$verified" node <<'NODE'
          const protection = JSON.parse(process.env.VERIFIED || '{}');
          const required = protection?.required_status_checks || {};
          const contexts = required.contexts || [];
          if (required.strict !== true) throw new Error('Required status checks are not strict against current main');
          if (!contexts.includes('test')) throw new Error('DABBIR CI test context is not required');
          if (!contexts.includes('BARMAN Independent Pre-Merge Gate')) throw new Error('BARMAN Independent Pre-Merge Gate is not required');
          if (protection?.enforce_admins?.enabled !== true) throw new Error('Admin enforcement is not enabled');
          if (protection?.required_linear_history?.enabled !== true) throw new Error('Linear history is not required');
          if (protection?.allow_force_pushes?.enabled === true) throw new Error('Force pushes remain enabled');
          if (protection?.allow_deletions?.enabled === true) throw new Error('Branch deletion remains enabled');
          if (protection?.required_conversation_resolution?.enabled !== true) throw new Error('Conversation resolution is not required');

          const reviews = protection?.required_pull_request_reviews;
          if (!reviews) throw new Error('Pull request protection is missing');
          if (reviews.require_code_owner_reviews === true) throw new Error('Owner/code-owner approval gate must remain disabled');
          if ((reviews.required_approving_review_count ?? 0) !== 0) throw new Error('Human approval count must remain zero');
          if (reviews.require_last_push_approval === true) throw new Error('Last-push owner approval gate must remain disabled');

          console.log('DABBIR native GitHub main protection verified with independent pre-merge enforcement and no owner approval gate.');
          NODE

# BARMAN activation refresh after secure admin secret provisioning: 2026-09-02
# GitHub native agents trust-boundary hardening: 2026-09-14
