name: DABBIR P0-A Secret Finding Triage

on:
  push:
    branches:
      - audit/p0a-agent-runtime-hardening-v1
    paths:
      - .github/workflows/p0a-secret-triage.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  FROZEN_SHA: 1796df7fa7eab418157ecc7531313f0af0e73ebf
  AUDIT_BRANCH: audit/p0a-agent-runtime-hardening-v1
  EVIDENCE_ROOT: evidence/p0a/1796df7fa7eab418157ecc7531313f0af0e73ebf/pilot

jobs:
  triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout frozen history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.FROZEN_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '${RUNNER_TEMP}'/gitleaks.tar.gz' | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks

      - name: Build redacted triage evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/raw" "$RUNNER_TEMP/triage"
          set +e
          "$RUNNER_TEMP/bin/gitleaks" dir . --report-format=json --report-path="$RUNNER_TEMP/raw/tree.json" --exit-code=42 >/dev/null 2>/dev/null
          tree_status=$?
          "$RUNNER_TEMP/bin/gitleaks" git . --log-opts='--all' --report-format=json --report-path="$RUNNER_TEMP/raw/history.json" --exit-code=42 >/dev/null 2>/dev/null
          history_status=$?
          set -e
          export TREE_STATUS="$tree_status" HISTORY_STATUS="$history_status"
          RAW="$RUNNER_TEMP/raw" OUT="$RUNNER_TEMP/triage" python3 - <<'PY'
          import json,os,pathlib,hashlib,re,collections
          raw=pathlib.Path(os.environ['RAW']); out=pathlib.Path(os.environ['OUT'])
          def load(name):
              p=raw/name
              if not p.exists() or not p.read_text(errors='ignore').strip(): return []
              return json.loads(p.read_text())
          markers=('test','testing','fake','dummy','example','placeholder','sample','mock','fixture','canary','not-a-real','not_real','localdev','localhost')
          def item(x,scope):
              secret=str(x.get('Secret') or '')
              match=str(x.get('Match') or '')
              if secret: match=match.replace(secret,'[REDACTED]')
              else: match='[REDACTED_MATCH]'
              match=' '.join(match.split())[:500]
              s_lower=secret.lower(); f=str(x.get('File') or '').lower()
              synthetic_marker=next((m for m in markers if m in s_lower),None)
              test_path=bool(re.search(r'(^|/)(test|tests|fixture|fixtures|__tests__)(/|$)|\.test\.|\.spec\.',f))
              if synthetic_marker and test_path:
                  cls='SYNTHETIC_STRONG'; reason='synthetic marker in candidate plus test/fixture path'
              elif synthetic_marker:
                  cls='SYNTHETIC_POSSIBLE'; reason='synthetic marker in candidate'
              elif test_path:
                  cls='NEEDS_REVIEW_TEST_CONTEXT'; reason='test path alone is not sufficient to prove non-secret'
              else:
                  cls='NEEDS_REVIEW'; reason='no safe automatic false-positive proof'
              return {'secret_sha256':hashlib.sha256(secret.encode()).hexdigest() if secret else None,'candidate_length':len(secret),
                      'scope':scope,'rule_id':x.get('RuleID'),'file':x.get('File'),'start_line':x.get('StartLine'),
                      'commit':x.get('Commit') or None,'date':x.get('Date') or None,'redacted_context':match,
                      'classification':cls,'reason':reason}
          all_items=[item(x,'WORKING_TREE') for x in load('tree.json')]+[item(x,'FULL_FETCHED_HISTORY') for x in load('history.json')]
          groups={}
          for x in all_items:
              h=x['secret_sha256'] or ('empty:'+str(len(groups)))
              g=groups.setdefault(h,{'secret_sha256':x['secret_sha256'],'candidate_length':x['candidate_length'],'occurrences':[],'classifications':set()})
              g['occurrences'].append({k:v for k,v in x.items() if k not in ('secret_sha256','candidate_length')}); g['classifications'].add(x['classification'])
          severity_order=['NEEDS_REVIEW','NEEDS_REVIEW_TEST_CONTEXT','SYNTHETIC_POSSIBLE','SYNTHETIC_STRONG']; rows=[]
          for g in groups.values():
              g['classification']=next((c for c in severity_order if c in g['classifications']),'NEEDS_REVIEW'); del g['classifications']; rows.append(g)
          rows.sort(key=lambda x:(x['classification'],x['secret_sha256'] or ''))
          counts=collections.Counter(x['classification'] for x in rows)
          scanner_error=int(os.environ['TREE_STATUS']) not in (0,42) or int(os.environ['HISTORY_STATUS']) not in (0,42)
          unresolved=sum(v for k,v in counts.items() if k!='SYNTHETIC_STRONG')
          summary={'state':'FAIL' if scanner_error or unresolved else 'PASS','frozen_sha':os.environ['FROZEN_SHA'],'raw_hit_count':len(all_items),
                   'unique_candidate_count':len(rows),'classification_counts':dict(counts),'unresolved_unique_candidates':unresolved,
                   'scanner_error':scanner_error,'secret_values_persisted':False,
                   'policy':'Only SYNTHETIC_STRONG may be auto-cleared; every other unique candidate requires documented human/security disposition.'}
          (out/'secret-triage.json').write_text(json.dumps(rows,indent=2,sort_keys=True)+'\n')
          (out/'secret-triage-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          PY
          rm -rf "$RUNNER_TEMP/raw"

      - name: Upload redacted triage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pilot-p0a-secret-triage
          path: ${{ runner.temp }}/triage
          if-no-files-found: error
          retention-days: 30

  persist:
    needs: triage
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.AUDIT_BRANCH }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pilot-p0a-secret-triage
          path: ${{ runner.temp }}/triage
      - name: Persist sanitized triage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT"
          cp -f "$RUNNER_TEMP/triage/"*.json "$EVIDENCE_ROOT/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$EVIDENCE_ROOT"
          if ! git diff --cached --quiet; then
            git commit -m 'evidence(p0a): add redacted secret triage [skip ci]'
            git push origin "HEAD:$AUDIT_BRANCH"
          fi
