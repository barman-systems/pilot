name: P0-A Historical Finding Classifier

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify historical findings using redacted metadata only
        shell: bash
        run: |
          set -euo pipefail
          image=ghcr.io/gitleaks/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
          docker run --rm -v "$PWD:/repo" -w /repo "$image" detect --source /repo --redact --no-banner --exit-code 0 --report-format json --report-path /repo/.gitleaks-history.json >/dev/null
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const rows=JSON.parse(fs.readFileSync('.gitleaks-history.json','utf8'));
          const clean=p=>String(p||'').replace(/^\/repo\//,'');
          const strip=s=>{let o='',q=null,e=false;for(const c of String(s||'')){if(q){if(e){e=false;continue}if(c==='\\'){e=true;continue}if(c===q){o+=' <STR> ';q=null}continue}if(c==='\''||c==='"'||c==='`'){q=c;continue}o+=c}return o};
          const tokens=s=>[...strip(s).matchAll(/[A-Za-z_$][A-Za-z0-9_$]*/g)].map(m=>m[0]).filter(x=>x!=='STR').slice(0,30);
          const pathClass=f=>f.startsWith('test/')||f.includes('/test/')||/\.test\.[cm]?[jt]sx?$/.test(f)?'TEST':f.startsWith('docs/')?'DOC':f.includes('/migrations/')||f.startsWith('supabase/migrations/')?'MIGRATION':f.startsWith('.github/')?'WORKFLOW':f.startsWith('api/')||f.startsWith('scripts/')||f.startsWith('supabase/functions/')?'RUNTIME_OR_SCRIPT':'OTHER';
          const entropy=s=>{if(!s)return 0;const m=new Map();for(const c of s)m.set(c,(m.get(c)||0)+1);let h=0;for(const n of m.values()){const p=n/s.length;h-=p*Math.log2(p)}return Math.round(h*100)/100};
          const getLines=(commit,file)=>{try{return cp.execFileSync('git',['show',`${commit}:${file}`],{encoding:'utf8',maxBuffer:2_000_000}).split(/\r?\n/)}catch{return []}};
          const classify=r=>{
            const file=clean(r.File),commit=String(r.Commit||''),lineNo=Number(r.StartLine)||0,lines=getLines(commit,file),line=lines[lineNo-1]||'';
            const start=Math.max(0,(Number(r.StartColumn)||1)-1),end=Math.max(start,Number(r.EndColumn)||start),span=line.slice(start,end),stripped=strip(line);
            const identifier=stripped.match(/\b(?:const|let|var)\s+([A-Za-z_$][A-Za-z0-9_$]*)/)?.[1]||stripped.match(/^\s*([A-Za-z_][A-Za-z0-9_]*)\s*=/)?.[1]||null;
            const upper=String(identifier||'').toUpperCase();
            return {rule:r.RuleID||'unknown',file,path_class:pathClass(file),identifier,identifier_flags:{key:upper.includes('KEY'),token:upper.includes('TOKEN'),secret:upper.includes('SECRET'),public:upper.includes('PUBLIC')||upper.includes('ANON')||upper.includes('PUBLISHABLE'),supabase:upper.includes('SUPABASE'),stripe:upper.includes('STRIPE'),resend:upper.includes('RESEND')},span_shape:{length:span.length,entropy:entropy(span),test_marker:/(?:test|fixture|dummy|fake|sample|local|ci|example|redacted|changeme)/i.test(span),known_secret_prefix:/^(?:sk-|ghp_|github_pat_|sb_secret_|xox[baprs]-|AKIA|AIza)/.test(span),jwt:span.split('.').length===3,hex:/^[0-9a-f]{32,}$/i.test(span),uuid:/^[0-9a-f]{8}-[0-9a-f-]{27,}$/i.test(span),url:/^https?:\/\//i.test(span)},code_flags:{env:/(?:process\.env|secrets\.|getenv|os\.environ)/i.test(stripped),authorization:/\bauthorization\b/i.test(stripped),bearer:/\bBearer\b/.test(stripped),fetch:/\bfetch\s*\(/.test(stripped)},context:[-1,0,1].map(offset=>({offset,tokens:tokens(lines[lineNo-1+offset]||'')})),commit:commit.slice(0,12)};
          };
          const safe=rows.map(classify),groups=new Map();
          for(const x of safe){const key=JSON.stringify([x.rule,x.file,x.path_class,x.identifier,x.identifier_flags,x.span_shape,x.code_flags,x.context]);if(!groups.has(key))groups.set(key,{...x,count:0,commits:[]});const g=groups.get(key);g.count++;if(g.commits.length<8&&!g.commits.includes(x.commit))g.commits.push(x.commit);delete g.commit;}
          console.log('P0A_HISTORY_SAFE_GROUPS='+JSON.stringify([...groups.values()].sort((a,b)=>b.count-a.count||a.file.localeCompare(b.file))));
          fs.rmSync('.gitleaks-history.json',{force:true});
          NODE
