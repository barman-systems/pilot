name: DABBIR Autonomous Source Control

on:
  workflow_dispatch:
    inputs:
      objective_key:
        description: DABBIR objective key
        required: true
        type: string
      patch_b64:
        description: Base64 encoded unified diff generated by BARMAN Executive OS
        required: true
        type: string
      changed_paths_classification:
        description: WEB or MOBILE
        required: true
        type: choice
        options: [WEB, MOBILE]
      mobile_required:
        description: Require mobile gates
        required: true
        default: false
        type: boolean
  repository_dispatch:
    types: [dabbir_source_control]
  push:
    branches:
      - 'barman/source-control-canary/**'

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read

concurrency:
  group: dabbir-source-control-${{ inputs.objective_key || github.event.client_payload.objective_key || github.run_id }}
  cancel-in-progress: false

jobs:
  bounded-change:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OBJECTIVE_KEY: ${{ inputs.objective_key || github.event.client_payload.objective_key || 'DABBIR_SOURCE_CONTROL_CANARY' }}
      PATCH_B64: ${{ inputs.patch_b64 || github.event.client_payload.patch_b64 || '' }}
      PATH_CLASS: ${{ inputs.changed_paths_classification || github.event.client_payload.changed_paths_classification || 'WEB' }}
      MOBILE_REQUIRED: ${{ inputs.mobile_required || github.event.client_payload.mobile_required || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Validate autonomous contract
        shell: bash
        run: |
          set -euo pipefail
          [[ "$OBJECTIVE_KEY" == DABBIR_* ]] || { echo 'Only DABBIR objectives are allowed'; exit 1; }
          [[ "$PATH_CLASS" == WEB || "$PATH_CLASS" == MOBILE ]] || { echo 'Unknown path classification'; exit 1; }
          if [[ "$GITHUB_EVENT_NAME" != push ]]; then
            [[ -n "$PATCH_B64" ]] || { echo 'Patch is required'; exit 1; }
          fi

      - name: Prepare and validate bounded change
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$GITHUB_REF_NAME" == barman/source-control-canary/* ]] || { echo 'Push canary is branch-scoped'; exit 1; }
            mkdir -p docs/runtime-evidence
            receipt="docs/runtime-evidence/barman-source-control-canary-${GITHUB_RUN_ID}.txt"
            printf '%s\n' \
              'BARMAN Executive OS source-control canary' \
              "run_id=${GITHUB_RUN_ID}" \
              "source_sha=${GITHUB_SHA}" \
              'direct_main_push=false' \
              'merge_bypass=false' > "$receipt"
          else
            printf '%s' "$PATCH_B64" | base64 --decode > /tmp/barman.patch
            test -s /tmp/barman.patch
            git apply --check /tmp/barman.patch
            git apply /tmp/barman.patch
          fi

          # Intent-to-add makes newly created files visible to git diff without staging content.
          git add -N .
          mapfile -t files < <(git diff --name-only)
          ((${#files[@]} > 0)) || { echo 'Candidate produced no changes'; exit 1; }
          printf '%s\n' "${files[@]}" | tee /tmp/changed-files.txt

          # Autonomous code changes are deliberately narrow. Sensitive/operational surfaces
          # stay owner- or separately-governed and cannot be changed by this workflow.
          if grep -Eq '^(\.github/|infra/|supabase/migrations/|supabase/config\.toml$|.*(^|/)(stripe|payment|payments|billing|kyc|otp|legal|secrets?)(/|\.|$))' /tmp/changed-files.txt; then
            echo 'Sensitive or governance path blocked from autonomous source-control writes.'
            exit 1
          fi

          if [[ "$PATH_CLASS" == WEB ]] && grep -Eq '^(mobile/|ios/|android/)' /tmp/changed-files.txt; then
            echo 'WEB classification cannot modify mobile/native paths.'
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Verify candidate before publishing branch
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run check:syntax
          npm test

      - name: Commit bounded candidate branch
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          safe_key=$(printf '%s' "$OBJECTIVE_KEY" | tr '[:upper:]_' '[:lower:]-' | tr -cd 'a-z0-9-')
          branch="barman/ceo/${safe_key}-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name 'BARMAN Executive OS'
          git config user.email 'barman-executive-os@users.noreply.github.com'
          git add -A
          git commit -m "fix(dabbir): autonomous bounded repair for ${OBJECTIVE_KEY}"
          git push origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open governed pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.publish.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          BARMAN Executive OS bounded source-control candidate.

          Objective: $OBJECTIVE_KEY
          Path classification: $PATH_CLASS
          Mobile gates required: $MOBILE_REQUIRED
          Direct main push: forbidden
          Merge bypass: forbidden
          Contract: DABBIR_BARMAN_SOURCE_CONTROL_V1

          Candidate verification was executed inside the autonomous workflow before publication.
          Merge remains governed separately and is never bypassed by this workflow.
          EOF
          )
          url=$(gh pr create --base main --head "$BRANCH" --title "fix(dabbir): ${OBJECTIVE_KEY}" --body "$body")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"

      - name: Emit machine receipt
        shell: bash
        env:
          BRANCH: ${{ steps.publish.outputs.branch }}
          HEAD_SHA: ${{ steps.publish.outputs.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          printf '%s\n' \
            "contract=DABBIR_BARMAN_SOURCE_CONTROL_V1" \
            "objective_key=$OBJECTIVE_KEY" \
            "branch=$BRANCH" \
            "head_sha=$HEAD_SHA" \
            "pr_number=$PR_NUMBER" \
            "pr_url=$PR_URL" \
            "direct_main_push=false" \
            "merge_bypass=false"
