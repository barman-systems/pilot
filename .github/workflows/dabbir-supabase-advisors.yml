name: DABBIR Supabase Advisors Watch

on:
  workflow_dispatch:

# Frozen from automatic execution by owner directive on 2026-09-15.
permissions:
  contents: read

jobs:
  advisors:
    name: supabase-advisors-manual
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_PROJECT_REF: fphpoysqdsceniwduxjq
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
      DABBIR_FORCE_ADVISORS: '1'
      DABBIR_ADVISOR_BASELINE_PATH: config/supabase-advisor-baseline.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Run manual Supabase advisor diagnostic
        run: node scripts/dabbir-supabase-advisors-gate.mjs
