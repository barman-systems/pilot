name: One-time DABBIR source patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-source-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-time-dabbir-source-patch
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Synchronize async operations assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('test/ai-full-customer-journey-v2.mjs')
          s = p.read_text()
          old = "  await page.locator('#screen-operations.active').waitFor({ state: 'visible', timeout: 10_000 });\n  assert((await page.locator('#opsBody').textContent())?.includes('AI Journey Product'), 'BROWSER_PRODUCT_MISSING');"
          new = "  await page.locator('#screen-operations.active').waitFor({ state: 'visible', timeout: 10_000 });\n  await page.locator('#opsBody').filter({ hasText: 'AI Journey Product' }).waitFor({ state: 'visible', timeout: 15_000 });\n  assert((await page.locator('#opsBody').textContent())?.includes('AI Journey Product'), 'BROWSER_PRODUCT_MISSING');"
          if s.count(old) != 1:
              raise SystemExit('unexpected operations verification state')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit source repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'barman-systems-bot'
          git config user.email 'barman-systems-bot@users.noreply.github.com'
          git add test/ai-full-customer-journey-v2.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'fix: wait for DABBIR operations data before assertion'
          git pull --rebase origin main
          git push origin HEAD:main
