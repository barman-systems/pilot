name: DABBIR AI Full Customer Journey
# Real production journey on push/schedule; capacity is manual-only and remains fail-closed.

on:
  workflow_dispatch:
    inputs:
      run_capacity:
        description: 'Run production AI/runtime capacity after a successful full journey'
        required: false
        default: false
        type: boolean
      production_capacity_ack:
        description: 'For production capacity, enter exactly ALLOW_CAPACITY_LOAD_ON_PRODUCTION'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'test/ai-full-customer-journey-v2.mjs'
      - 'test/dabbir-capacity-load.mjs'
      - 'test/dabbir-activity-regression.test.mjs'
      - '.github/workflows/dabbir-ai-customer-journey.yml'
      - 'supabase/migrations/*dabbir*'
      - 'supabase/functions/barman-qa-suite-runner/**'
      - 'db/dabbir*.sql'
      - 'api/auth/**'
      - 'api/team/**'
      - 'api/chat*.js'
      - 'api/translate.js'
      - 'api/dabbir-runtime*.js'
      - 'api/owner-operations*.js'
      - 'api/service-operations*.js'
      - 'api/activity-*.js'
      - 'api/owner-action-center*.js'
      - 'api/business-profile*.js'
      - 'api/app*.js'
      - 'api/brand-ui.js'
      - 'api/timezone-ui.js'
      - 'api/dabbir-approved-icon.js'
      - 'index.html'
      - 'team.html'
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read
  id-token: write

# Never cancel a trusted production journey because another qualifying commit arrived.
# A single group also prevents two production journeys/capacity sequences from overlapping.
concurrency:
  group: dabbir-ai-full-customer-journey
  cancel-in-progress: false

jobs:
  full-customer-journey:
    name: Real owner + customer + employee + AI journey
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PRODUCTION_ORIGIN: ${{ vars.DABBIR_PRODUCTION_ORIGIN }}
      SUPABASE_PROJECT_REF: spohjzrsymsmzsseygtw
      JOURNEY_REPORT_PATH: dabbir-ai-customer-journey-report.json
    steps:
      - name: Require canonical DABBIR production origin
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${PRODUCTION_ORIGIN:-}" =~ ^https://[^/]+$ ]]; then
            echo 'DABBIR_PRODUCTION_ORIGIN must be configured as the canonical public HTTPS origin.'
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install WebKit journey runner
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps webkit
      - name: Run AI full customer journey against production
        run: node test/ai-full-customer-journey-v2.mjs
      - name: Publish journey summary
        if: always()
        shell: bash
        run: |
          if [ -f dabbir-ai-customer-journey-report.json ]; then
            echo '## DABBIR AI Full Customer Journey' >> "$GITHUB_STEP_SUMMARY"
            echo "**Verdict:** $(jq -r '.verdict' dabbir-ai-customer-journey-report.json)" >> "$GITHUB_STEP_SUMMARY"
            echo "**Required failures:** $(jq -r '.required_failures' dabbir-ai-customer-journey-report.json)" >> "$GITHUB_STEP_SUMMARY"
            echo '| Step | Status | Duration ms | Detail |' >> "$GITHUB_STEP_SUMMARY"
            echo '|---|---:|---:|---|' >> "$GITHUB_STEP_SUMMARY"
            jq -r '.steps[] | "| \(.name) | \(.status) | \(.duration_ms // 0) | \((.detail // "") | gsub("\\|"; "\\|")) |"' dabbir-ai-customer-journey-report.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload journey evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dabbir-ai-customer-journey-evidence
          path: |
            dabbir-ai-customer-journey-report.json
            dabbir-ai-customer-journey-screenshot.png
          if-no-files-found: warn
          retention-days: 14

  ai-capacity:
    name: AI capacity — manual production gate
    needs: full-customer-journey
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_capacity == true && needs.full-customer-journey.result == 'success' && inputs.production_capacity_ack == 'ALLOW_CAPACITY_LOAD_ON_PRODUCTION' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRODUCTION_ORIGIN: ${{ vars.DABBIR_PRODUCTION_ORIGIN }}
      SUPABASE_PROJECT_REF: spohjzrsymsmzsseygtw
      PRODUCTION_CAPACITY_LOAD_ACK: ${{ inputs.production_capacity_ack }}
      CUSTOMER_COUNT: '300'
      RUN_RUNTIME: 'false'
      RUN_AI: 'true'
      AI_STAGES: '1,2,5,10,20,40,60,100'
      CAPACITY_REPORT_PATH: dabbir-ai-capacity-report.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Run clean AI concurrency test
        run: node test/dabbir-capacity-load.mjs
      - name: Publish AI capacity summary
        if: always()
        shell: bash
        run: |
          if [ -f dabbir-ai-capacity-report.json ]; then
            echo '## DABBIR AI Capacity' >> "$GITHUB_STEP_SUMMARY"
            echo "**AI concurrency passed:** $(jq -r '.capacity.ai_concurrency' dabbir-ai-capacity-report.json)" >> "$GITHUB_STEP_SUMMARY"
            echo '| Concurrent | Error rate | AI reply rate | p95 ms | Pass |' >> "$GITHUB_STEP_SUMMARY"
            echo '|---:|---:|---:|---:|---:|' >> "$GITHUB_STEP_SUMMARY"
            jq -r '.ai_stages[] | "| \(.concurrency) | \(.error_rate) | \(.ai_reply_rate // 0) | \(.p95_ms) | \(.pass) |"' dabbir-ai-capacity-report.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload AI capacity evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dabbir-ai-capacity-evidence
          path: dabbir-ai-capacity-report.json
          if-no-files-found: warn
          retention-days: 14

  runtime-capacity-1000:
    name: Runtime capacity — manual 1000-customer gate
    needs: ai-capacity
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_capacity == true && needs.ai-capacity.result == 'success' && inputs.production_capacity_ack == 'ALLOW_CAPACITY_LOAD_ON_PRODUCTION' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRODUCTION_ORIGIN: ${{ vars.DABBIR_PRODUCTION_ORIGIN }}
      SUPABASE_PROJECT_REF: spohjzrsymsmzsseygtw
      PRODUCTION_CAPACITY_LOAD_ACK: ${{ inputs.production_capacity_ack }}
      CUSTOMER_COUNT: '1000'
      RUN_RUNTIME: 'true'
      RUN_AI: 'false'
      RUNTIME_STAGES: '1,5,10,20,30,40,50,75,100,125,150,175,200,225,250,500,750,1000'
      CAPACITY_REPORT_PATH: dabbir-runtime-capacity-report.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Run 1000-customer runtime capacity test
        run: node test/dabbir-capacity-load.mjs
      - name: Publish runtime capacity summary
        if: always()
        shell: bash
        run: |
          if [ -f dabbir-runtime-capacity-report.json ]; then
            echo '## DABBIR Runtime Capacity' >> "$GITHUB_STEP_SUMMARY"
            echo "**Customers created:** $(jq -r '.customer_count' dabbir-runtime-capacity-report.json)" >> "$GITHUB_STEP_SUMMARY"
            echo "**Strict UX concurrency:** $(jq -r '.capacity.infrastructure_stable_concurrency' dabbir-runtime-capacity-report.json)" >> "$GITHUB_STEP_SUMMARY"
            echo "**Available concurrency:** $(jq -r '.capacity.infrastructure_available_concurrency' dabbir-runtime-capacity-report.json)" >> "$GITHUB_STEP_SUMMARY"
            echo '| Concurrent | Error rate | p95 ms | p99 ms | Stable | Available |' >> "$GITHUB_STEP_SUMMARY"
            echo '|---:|---:|---:|---:|---:|---:|' >> "$GITHUB_STEP_SUMMARY"
            jq -r '.runtime_stages[] | "| \(.concurrency) | \(.error_rate) | \(.p95_ms) | \(.p99_ms) | \(.stable) | \(.available) |"' dabbir-runtime-capacity-report.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload runtime capacity evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dabbir-runtime-capacity-evidence
          path: dabbir-runtime-capacity-report.json
          if-no-files-found: warn
          retention-days: 14
