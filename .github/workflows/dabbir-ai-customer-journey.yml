name: DABBIR AI Full Customer Journey
# Canonical main-only production journey. During protected prelaunch the exact Vercel Production release is verified through trusted OIDC. QA identities are created in the Mumbai Supabase production project.

on:
  workflow_dispatch:
    inputs:
      run_capacity:
        description: 'Run production AI/runtime capacity after a successful public-production full journey'
        required: false
        default: false
        type: boolean
      production_capacity_ack:
        description: 'For production capacity, enter exactly ALLOW_CAPACITY_LOAD_ON_PRODUCTION'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'vercel-ignore-if-unaffected.sh'
      - 'test/ai-full-customer-journey-v2.mjs'
      - 'test/run-ai-full-customer-journey-en.mjs'
      - 'test/dabbir-cross-tenant-isolation.mjs'
      - 'test/dabbir-protected-full-journey-preload.mjs'
      - 'test/dabbir-protected-journey-access.test.mjs'
      - 'test/dabbir-authorized-journey-workflow.test.mjs'
      - 'test/dabbir-mumbai-qa-routing.test.mjs'
      - 'test/support/dabbir-protected-journey-access.mjs'
      - 'test/dabbir-capacity-load.mjs'
      - 'test/dabbir-activity-regression.test.mjs'
      - 'scripts/dabbir-production-origin-gate.mjs'
      - 'config/barman-integration-contract.json'
      - '.github/workflows/dabbir-ai-customer-journey.yml'
      - '.github/scripts/dabbir-bar12-*'
      - 'test/dabbir-bar12-*'
      - 'supabase/migrations/*dabbir*'
      - 'supabase/functions/barman-qa-suite-runner/**'
      - 'supabase/functions/dabbir-qa-suite-runner/**'
      - 'db/dabbir*.sql'
      - 'api/**'
      - 'api/auth/**'
      - 'api/team/**'
      - 'api/chat*.js'
      - 'api/translate.js'
      - 'api/dabbir-runtime*.js'
      - 'api/owner-operations*.js'
      - 'api/service-operations*.js'
      - 'api/activity-*.js'
      - 'api/owner-action-center*.js'
      - 'api/business-profile*.js'
      - 'api/app*.js'
      - 'api/brand-ui.js'
      - 'api/timezone-ui.js'
      - 'api/dabbir-approved-icon.js'
      - 'index.html'
      - 'team.html'
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: dabbir-ai-full-customer-journey
  cancel-in-progress: false

jobs:
  full-customer-journey:
    name: Production owner + customer + employee + AI journey
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      PUBLIC_PRODUCTION_ORIGIN: ${{ vars.DABBIR_PRODUCTION_ORIGIN }}
      PRODUCTION_ORIGIN: ${{ vars.DABBIR_PRODUCTION_ORIGIN }}
      PROTECTED_QA_ORIGIN: https://dabbir-nd56cm4j5v-3619s-projects.vercel.app
      SUPABASE_PROJECT_REF: fphpoysqdsceniwduxjq
      JOURNEY_REPORT_PATH: dabbir-ai-customer-journey-report.json
      ISOLATION_REPORT_PATH: dabbir-cross-tenant-isolation-report.json
      EXPECTED_VERCEL_PROJECT_ID: prj_HCTFdQo8Vc7FvZRdJ37H7KFYwpUq
      EXPECTED_GIT_PROVIDER: github
      EXPECTED_GIT_REPOSITORY: barman-systems/pilot
    outputs:
      production_ready: ${{ steps.launch-gate.outputs.ready }}
      production_state: ${{ steps.launch-gate.outputs.state }}
      journey_ready: ${{ steps.journey-mode.outputs.ready }}
      journey_mode: ${{ steps.journey-mode.outputs.mode }}
      verified_production_sha: ${{ steps.release-before.outputs.sha }}
      verified_deployment_id: ${{ steps.release-before.outputs.deployment }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Require authoritative main workflow identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_REPOSITORY" = 'barman-systems/pilot'
          test "$GITHUB_WORKFLOW_REF" = 'barman-systems/pilot/.github/workflows/dabbir-ai-customer-journey.yml@refs/heads/main'
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "AUTHORIZED_MAIN_JOURNEY_SHA=$GITHUB_SHA"

      - name: Classify canonical public DABBIR production origin
        id: launch-gate
        run: node scripts/dabbir-production-origin-gate.mjs

      - name: Resolve public or protected-prelaunch journey mode
        id: journey-mode
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.launch-gate.outputs.ready }}" = 'true' ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'mode=public' >> "$GITHUB_OUTPUT"
            echo 'state=PUBLIC_PRODUCTION_READY' >> "$GITHUB_OUTPUT"
            echo 'JOURNEY_MODE_PUBLIC'
            exit 0
          fi
          if [ "${{ steps.launch-gate.outputs.state }}" != 'BLOCKED_PRELAUNCH' ]; then
            echo "UNEXPECTED_PRODUCTION_GATE_STATE=${{ steps.launch-gate.outputs.state }}"
            exit 2
          fi
          echo "PRODUCTION_ORIGIN=${PROTECTED_QA_ORIGIN}" >> "$GITHUB_ENV"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo 'mode=protected' >> "$GITHUB_OUTPUT"
          echo 'state=PROTECTED_PRELAUNCH' >> "$GITHUB_OUTPUT"
          echo 'JOURNEY_MODE_PROTECTED_PRELAUNCH'

      - name: Prepare trusted Vercel access for protected prelaunch
        id: protected-access
        if: steps.journey-mode.outputs.mode == 'protected'
        shell: bash
        run: |
          set -euo pipefail
          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          request_token="${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          test -n "$request_url"
          test -n "$request_token"
          oidc_response="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${request_token}" "$request_url")"
          oidc_token="$(printf '%s' "$oidc_response" | jq -r '.value // empty')"
          test -n "$oidc_token"
          echo "::add-mask::$oidc_token"
          probe_body="$(mktemp)"
          probe_status="$(curl --silent --show-error --output "$probe_body" --write-out '%{http_code}' -H "x-vercel-trusted-oidc-idp-token: ${oidc_token}" -H 'accept: text/html' "$PROTECTED_QA_ORIGIN/")"
          if [ "$probe_status" != '200' ] || ! grep -qi 'DABBIR' "$probe_body"; then
            echo "VERCEL_TRUSTED_OIDC_REJECTED_HTTP_${probe_status}"
            exit 4
          fi
          echo "VERCEL_TRUSTED_OIDC_TOKEN=$oidc_token" >> "$GITHUB_ENV"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo 'TRUSTED_VERCEL_OIDC_READY'

      - name: Lock exact Production release before journey
        id: release-before
        if: steps.journey-mode.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          auth_args=()
          if [ "${{ steps.journey-mode.outputs.mode }}" = 'protected' ]; then
            test -n "${VERCEL_TRUSTED_OIDC_TOKEN:-}"
            auth_args+=( -H "x-vercel-trusted-oidc-idp-token: ${VERCEL_TRUSTED_OIDC_TOKEN}" )
          fi
          body=''; sha=''; deployment=''
          for attempt in $(seq 1 60); do
            body="$(curl --silent --show-error "${auth_args[@]}" -H 'accept: application/json' "${PRODUCTION_ORIGIN}/api/release-evidence?t=$(date +%s%N)" || true)"
            sha="$(printf '%s' "$body" | jq -r '.commit_sha // empty' 2>/dev/null || true)"
            deployment="$(printf '%s' "$body" | jq -r '.deployment_id // empty' 2>/dev/null || true)"
            environment="$(printf '%s' "$body" | jq -r '.environment // empty' 2>/dev/null || true)"
            project_id="$(printf '%s' "$body" | jq -r '.project_id // empty' 2>/dev/null || true)"
            git_provider="$(printf '%s' "$body" | jq -r '.git_provider // empty' 2>/dev/null || true)"
            repository="$(printf '%s' "$body" | jq -r '.repository // empty' 2>/dev/null || true)"
            ok="$(printf '%s' "$body" | jq -r '.ok // false' 2>/dev/null || true)"
            if [ "$ok" = 'true' ] && [ "$sha" = "$GITHUB_SHA" ] && [ "$environment" = 'production' ] && [ "$project_id" = "$EXPECTED_VERCEL_PROJECT_ID" ] && [ "$git_provider" = "$EXPECTED_GIT_PROVIDER" ] && [ "$repository" = "$EXPECTED_GIT_REPOSITORY" ] && [[ "$deployment" == dpl_* ]]; then break; fi
            sha=''; deployment=''; sleep 5
          done
          if [ -z "$sha" ]; then
            echo "EXACT_PRODUCTION_RELEASE_UNVERIFIED expected_sha=$GITHUB_SHA body=${body:0:500}"
            exit 3
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "deployment=$deployment" >> "$GITHUB_OUTPUT"
          echo "LOCKED_EXACT_PRODUCTION_SHA=$sha deployment=$deployment"

      - name: Install WebKit journey runner
        if: steps.journey-mode.outputs.ready == 'true'
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps webkit

      - name: Run AI full customer journey against exact Production
        if: steps.journey-mode.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.journey-mode.outputs.mode }}" = 'protected' ]; then
            node --import ./test/dabbir-protected-full-journey-preload.mjs test/ai-full-customer-journey-v2.mjs
          else
            node test/ai-full-customer-journey-v2.mjs
          fi

      - name: Run English iPhone WebKit owner journey against exact Production
        if: steps.journey-mode.outputs.ready == 'true'
        shell: bash
        env:
          JOURNEY_REPORT_PATH: dabbir-ai-customer-journey-report-en.json
        run: |
          set -euo pipefail
          if [ "${{ steps.journey-mode.outputs.mode }}" = 'protected' ]; then
            node --import ./test/dabbir-protected-full-journey-preload.mjs test/run-ai-full-customer-journey-en.mjs
          else
            node test/run-ai-full-customer-journey-en.mjs
          fi
          test -s dabbir-ai-customer-journey-report-en.json
          jq -e '.verdict == "PASS" and .required_failures == 0 and any(.steps[]; .name == "25_mobile_webkit_owner_journey" and .status == "PASS")' dabbir-ai-customer-journey-report-en.json >/dev/null
          echo 'ENGLISH_IPHONE_WEBKIT_JOURNEY_PASS'

      - name: Run cross-tenant and WhatsApp isolation attack
        if: steps.journey-mode.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.journey-mode.outputs.mode }}" = 'protected' ]; then
            node --import ./test/dabbir-protected-full-journey-preload.mjs test/dabbir-cross-tenant-isolation.mjs
          else
            node test/dabbir-cross-tenant-isolation.mjs
          fi
          test -f "$ISOLATION_REPORT_PATH"
          jq -e '.verdict == "PASS" and .required_failures == 0 and (.checks | length) >= 9' "$ISOLATION_REPORT_PATH" >/dev/null
          echo "CROSS_TENANT_ISOLATION_PASS checks=$(jq -r '.checks | length' "$ISOLATION_REPORT_PATH")"

      - name: Require a real full-journey PASS
        if: steps.journey-mode.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f "$JOURNEY_REPORT_PATH"
          jq -e '.verdict == "PASS" and .required_failures == 0 and (.steps | length) > 10' "$JOURNEY_REPORT_PATH" >/dev/null
          echo "FULL_JOURNEY_PASS steps=$(jq -r '.steps | length' "$JOURNEY_REPORT_PATH")"

      - name: Prove Production release did not move during journey
        id: release-after
        if: ${{ always() && steps.release-before.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          auth_args=()
          if [ "${{ steps.journey-mode.outputs.mode }}" = 'protected' ]; then
            test -n "${VERCEL_TRUSTED_OIDC_TOKEN:-}"
            auth_args+=( -H "x-vercel-trusted-oidc-idp-token: ${VERCEL_TRUSTED_OIDC_TOKEN}" )
          fi
          body=''; sha=''; deployment=''
          for attempt in $(seq 1 12); do
            body="$(curl --silent --show-error "${auth_args[@]}" -H 'accept: application/json' "${PRODUCTION_ORIGIN}/api/release-evidence?t=$(date +%s%N)" || true)"
            sha="$(printf '%s' "$body" | jq -r '.commit_sha // empty' 2>/dev/null || true)"
            deployment="$(printf '%s' "$body" | jq -r '.deployment_id // empty' 2>/dev/null || true)"
            environment="$(printf '%s' "$body" | jq -r '.environment // empty' 2>/dev/null || true)"
            project_id="$(printf '%s' "$body" | jq -r '.project_id // empty' 2>/dev/null || true)"
            git_provider="$(printf '%s' "$body" | jq -r '.git_provider // empty' 2>/dev/null || true)"
            repository="$(printf '%s' "$body" | jq -r '.repository // empty' 2>/dev/null || true)"
            if [ "$sha" = "$GITHUB_SHA" ] && [ "$sha" = "${{ steps.release-before.outputs.sha }}" ] && [ "$deployment" = "${{ steps.release-before.outputs.deployment }}" ] && [ "$environment" = 'production' ] && [ "$project_id" = "$EXPECTED_VERCEL_PROJECT_ID" ] && [ "$git_provider" = "$EXPECTED_GIT_PROVIDER" ] && [ "$repository" = "$EXPECTED_GIT_REPOSITORY" ]; then break; fi
            sha=''; deployment=''; sleep 5
          done
          if [ -z "$sha" ]; then
            echo "EXACT_PRODUCTION_RELEASE_DRIFT_OR_UNAVAILABLE expected_sha=$GITHUB_SHA body=${body:0:500}"
            exit 3
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "deployment=$deployment" >> "$GITHUB_OUTPUT"
          echo "STABLE_EXACT_PRODUCTION_SHA=$sha deployment=$deployment"

      - name: Upload full journey evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dabbir-ai-full-customer-journey-evidence
          path: |
            dabbir-ai-customer-journey-report.json
            dabbir-ai-customer-journey-report-en.json
            dabbir-ai-customer-journey-screenshot.png
            dabbir-cross-tenant-isolation-report.json
          if-no-files-found: warn
          retention-days: 14

  ai-capacity:
    name: AI capacity — manual public-production gate
    needs: full-customer-journey
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_capacity == true && needs.full-customer-journey.result == 'success' && needs.full-customer-journey.outputs.production_ready == 'true' && inputs.production_capacity_ack == 'ALLOW_CAPACITY_LOAD_ON_PRODUCTION' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRODUCTION_ORIGIN: ${{ vars.DABBIR_PRODUCTION_ORIGIN }}
      SUPABASE_PROJECT_REF: fphpoysqdsceniwduxjq
      CAPACITY_TARGET: production
      CAPACITY_PRODUCTION_ACK: ${{ inputs.production_capacity_ack }}
      CUSTOMER_COUNT: '300'
      RUN_RUNTIME: 'false'
      RUN_AI: 'true'
      AI_STAGES: '1,2,5,10,20,40,60,100'
      CAPACITY_REPORT_PATH: dabbir-ai-capacity-report.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node test/dabbir-capacity-load.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: dabbir-ai-capacity-evidence
          path: dabbir-ai-capacity-report.json
          if-no-files-found: warn
          retention-days: 14

  runtime-capacity-1000:
    name: Runtime capacity — manual public-production 1000-customer gate
    needs: [full-customer-journey, ai-capacity]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_capacity == true && needs.ai-capacity.result == 'success' && needs.full-customer-journey.outputs.production_ready == 'true' && inputs.production_capacity_ack == 'ALLOW_CAPACITY_LOAD_ON_PRODUCTION' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRODUCTION_ORIGIN: ${{ vars.DABBIR_PRODUCTION_ORIGIN }}
      SUPABASE_PROJECT_REF: fphpoysqdsceniwduxjq
      CAPACITY_TARGET: production
      CAPACITY_PRODUCTION_ACK: ${{ inputs.production_capacity_ack }}
      CUSTOMER_COUNT: '1000'
      RUN_RUNTIME: 'true'
      RUN_AI: 'false'
      RUNTIME_STAGES: '1,5,10,20,30,40,50,75,100,125,150,175,200,225,250,500,750,1000'
      CAPACITY_REPORT_PATH: dabbir-runtime-capacity-report.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node test/dabbir-capacity-load.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: dabbir-runtime-capacity-evidence
          path: dabbir-runtime-capacity-report.json
          if-no-files-found: warn
          retention-days: 14
