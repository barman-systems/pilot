name: DABBIR Lockfile Integrity

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dabbir-lockfile-generator.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Verify package lock matches package manifest
        shell: bash
        run: |
          cp package-lock.json /tmp/package-lock.before.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          cmp -s /tmp/package-lock.before.json package-lock.json || {
            echo 'package-lock.json drift detected; regenerate and commit the lockfile.'
            git diff -- package-lock.json
            exit 1
          }
      - name: Verify clean install from committed lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
