name: QA AI Gateway Cron Run

on:
  push:
    branches:
      - qa/ai-gateway-cron-run-20260907
    paths:
      - .github/workflows/qa-ai-gateway-cron-run.yml

permissions:
  contents: read

jobs:
  run-production-cron:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: prj_HCTFdQo8Vc7FvZRdJ37H7KFYwpUq
      VERCEL_TEAM_ID: team_pwfKq8jHuyW1XFVSZirAJiId
      PRODUCTION_HOST: dabbir.bmalman.com
    steps:
      - name: Invoke exact Production reconciliation route securely
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          echo "::add-mask::$VERCEL_TOKEN"

          env_json="$(curl -fsS "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?decrypt=true&teamId=${VERCEL_TEAM_ID}" -H "Authorization: Bearer ${VERCEL_TOKEN}")"
          cron_secret="$(jq -r '[.envs[] | select(.key=="CRON_SECRET" and ((.target // []) | index("production"))) | .value] | unique | if length==1 then .[0] else empty end' <<<"$env_json")"
          test -n "$cron_secret"
          echo "::add-mask::$cron_secret"

          status="$(curl -sS -o /tmp/reconcile.json -w '%{http_code}' \
            -H "Authorization: Bearer ${cron_secret}" \
            "https://${PRODUCTION_HOST}/api/dabbir-ai-billing-reconcile-cron")"
          cat /tmp/reconcile.json | jq -c '{ok,error,dates,businesses,models,total_microusd}'
          test "$status" = '200'
          jq -e '.ok == true' /tmp/reconcile.json >/dev/null
