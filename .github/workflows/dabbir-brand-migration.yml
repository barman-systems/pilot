name: DABBIR brand migration

on:
  push:
    branches:
      - rename/pilot-to-dabbir

permissions:
  contents: write

jobs:
  migrate-brand:
    if: ${{ !contains(github.event.head_commit.message, '[dabbir-brand-migration]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: rename/pilot-to-dabbir

      - name: Replace PILOT brand references safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          allowed = {'.js','.mjs','.cjs','.json','.html','.md','.sql','.yml','.yaml','.txt','.css','.ts','.tsx','.jsx'}
          skip_parts = {'.git','node_modules','.vercel'}

          replacements = [
              ('PILOT', 'DABBIR'),
              ('Pilot', 'DABBIR'),
              ('/api/pilot-ai', '/api/dabbir-ai'),
              ('/api/pilot-runtime', '/api/dabbir-runtime'),
              ('/api/pilot-whatsapp-webhook', '/api/dabbir-whatsapp-webhook'),
              ('"name": "pilot"', '"name": "dabbir"'),
          ]

          changed = []
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in allowed:
                  continue
              if any(part in skip_parts for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = text
              for old, repl in replacements:
                  new = new.replace(old, repl)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))

          print(f'Updated {len(changed)} files')
          for p in changed:
              print(p)
          PY

      - name: Add DABBIR primary API aliases
        shell: bash
        run: |
          cat > api/dabbir-ai.js <<'EOF'
          export { default } from './pilot-ai.js';
          export * from './pilot-ai.js';
          EOF
          cat > api/dabbir-runtime.js <<'EOF'
          export { default } from './pilot-runtime.js';
          export * from './pilot-runtime.js';
          EOF

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "barmanai"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "[dabbir-brand-migration] make DABBIR the primary product identity"
          git push origin HEAD:rename/pilot-to-dabbir
