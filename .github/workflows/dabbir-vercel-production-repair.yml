name: DABBIR Vercel Production Repair

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_PROJECT_ID: prj_HCTFdQo8Vc7FvZRdJ37H7KFYwpUq
  VERCEL_TEAM_ID: team_pwfKq8jHuyW1XFVSZirAJiId
  DABBIR_PRODUCTION_ORIGIN: https://dabbir.bmalman.com

jobs:
  exact-main-production:
    name: Repair exact main Production deployment
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact main history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require trusted exact-main context
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test -n "${VERCEL_TOKEN:-}" || { echo 'VERCEL_TOKEN_NOT_CONFIGURED'; exit 2; }
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo 'DABBIR_EXACT_MAIN_CONTEXT_VERIFIED'

      - name: Read authoritative Production baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
            "$DABBIR_PRODUCTION_ORIGIN/api/release-evidence" || true)"
          test "$status" = '200' || { echo "PRODUCTION_RELEASE_EVIDENCE_HTTP_$status"; exit 1; }
          jq -e --arg project "$VERCEL_PROJECT_ID" \
            '.ok == true and .environment == "production" and .git_ref == "main" and .project_id == $project and .git_provider == "github" and .repository == "barman-systems/pilot"' \
            "$body" >/dev/null
          baseline_sha="$(jq -r '.commit_sha // empty' "$body")"
          [[ "$baseline_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'PRODUCTION_BASELINE_SHA_INVALID'; exit 1; }
          echo "sha=$baseline_sha" >> "$GITHUB_OUTPUT"
          echo "DABBIR_PRODUCTION_BASELINE sha=$baseline_sha"

      - name: Determine whether main changes require a web deployment
        id: impact
        shell: bash
        env:
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
          VERCEL_GIT_COMMIT_REF: main
          VERCEL_GIT_PREVIOUS_SHA: ${{ steps.baseline.outputs.sha }}
        run: |
          set -u
          set +e
          bash ./vercel-ignore-if-unaffected.sh
          rc=$?
          set -e
          if [ "$rc" = '0' ]; then
            echo 'required=false' >> "$GITHUB_OUTPUT"
            echo 'DABBIR_PRODUCTION_DEPLOYMENT_NOT_REQUIRED'
            exit 0
          fi
          if [ "$rc" = '1' ]; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
            echo 'DABBIR_PRODUCTION_DEPLOYMENT_REQUIRED'
            exit 0
          fi
          echo "VERCEL_IGNORE_CONTRACT_INVALID_EXIT_$rc"
          exit 1

      - name: Allow native Vercel Git integration to win first
        if: steps.impact.outputs.required == 'true'
        id: native
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 120))
          while [ "$SECONDS" -lt "$deadline" ]; do
            body="$(mktemp)"
            status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
              "$DABBIR_PRODUCTION_ORIGIN/api/release-evidence" || true)"
            if [ "$status" = '200' ] && jq -e --arg sha "$EXPECTED_SHA" --arg project "$VERCEL_PROJECT_ID" \
              '.ok == true and .commit_sha == $sha and .environment == "production" and .git_ref == "main" and .project_id == $project and .git_provider == "github" and .repository == "barman-systems/pilot"' \
              "$body" >/dev/null 2>&1; then
              echo 'ready=true' >> "$GITHUB_OUTPUT"
              echo 'DABBIR_NATIVE_GIT_PRODUCTION_READY'
              exit 0
            fi
            sleep 10
          done
          echo 'ready=false' >> "$GITHUB_OUTPUT"
          echo 'DABBIR_NATIVE_GIT_PRODUCTION_MISSED_EXACT_SHA'

      - name: Create exact Git-source Production deployment only when native Git missed it
        if: steps.impact.outputs.required == 'true' && steps.native.outputs.ready != 'true'
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -n --arg sha "$EXPECTED_SHA" '{
            name:"dabbir",
            target:"production",
            gitSource:{type:"github",org:"barman-systems",repo:"pilot",ref:"main",sha:$sha},
            meta:{dabbir_release_repair:"exact-main-git-source",dabbir_expected_sha:$sha}
          }')"
          response="$(mktemp)"
          status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            -X POST "https://api.vercel.com/v13/deployments?forceNew=1&teamId=${VERCEL_TEAM_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$payload" || true)"
          case "$status" in
            200|201) ;;
            *) cat "$response"; echo "VERCEL_EXACT_GIT_DEPLOY_CREATE_HTTP_$status"; exit 1 ;;
          esac
          deployment_id="$(jq -r '.id // empty' "$response")"
          [[ "$deployment_id" =~ ^dpl_[A-Za-z0-9]+$ ]] || { cat "$response"; echo 'VERCEL_DEPLOYMENT_ID_INVALID'; exit 1; }
          response_sha="$(jq -r '.meta.githubCommitSha // .gitSource.sha // empty' "$response")"
          if [ -n "$response_sha" ] && [ "$response_sha" != "$EXPECTED_SHA" ]; then
            echo "VERCEL_DEPLOYMENT_SHA_MISMATCH expected=$EXPECTED_SHA actual=$response_sha"
            exit 1
          fi
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "DABBIR_EXACT_GIT_PRODUCTION_DEPLOYMENT_CREATED id=$deployment_id sha=$EXPECTED_SHA"

      - name: Wait for exact Git-source deployment to become READY
        if: steps.repair.outputs.deployment_id != ''
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.repair.outputs.deployment_id }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          while [ "$SECONDS" -lt "$deadline" ]; do
            body="$(mktemp)"
            status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v13/deployments/${DEPLOYMENT_ID}?teamId=${VERCEL_TEAM_ID}" || true)"
            if [ "$status" != '200' ]; then
              echo "VERCEL_DEPLOYMENT_READ_HTTP_$status"
              sleep 10
              continue
            fi
            state="$(jq -r '.readyState // .state // empty' "$body")"
            case "$state" in
              READY)
                jq -e --arg sha "$EXPECTED_SHA" \
                  '(.meta.githubCommitSha == $sha or .gitSource.sha == $sha or .meta.dabbir_expected_sha == $sha) and (.target == "production")' \
                  "$body" >/dev/null
                echo "DABBIR_EXACT_GIT_PRODUCTION_READY id=$DEPLOYMENT_ID sha=$EXPECTED_SHA"
                exit 0
                ;;
              ERROR|CANCELED|CANCELLED)
                cat "$body"
                echo "VERCEL_DEPLOYMENT_TERMINAL_$state"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo 'VERCEL_DEPLOYMENT_READY_TIMEOUT'
          exit 1

      - name: Verify public Production exact release evidence
        if: steps.impact.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 180))
          while [ "$SECONDS" -lt "$deadline" ]; do
            body="$(mktemp)"
            status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
              "$DABBIR_PRODUCTION_ORIGIN/api/release-evidence" || true)"
            if [ "$status" = '200' ] && jq -e --arg sha "$EXPECTED_SHA" --arg project "$VERCEL_PROJECT_ID" \
              '.ok == true and .commit_sha == $sha and .environment == "production" and .git_ref == "main" and .project_id == $project and .git_provider == "github" and .repository == "barman-systems/pilot" and (.deployment_id | startswith("dpl_"))' \
              "$body" >/dev/null 2>&1; then
              deployment_id="$(jq -r '.deployment_id' "$body")"
              echo "DABBIR_EXACT_PRODUCTION_RELEASE_VERIFIED sha=$EXPECTED_SHA deployment=$deployment_id"
              exit 0
            fi
            sleep 10
          done
          echo "DABBIR_EXACT_PRODUCTION_RELEASE_NOT_VERIFIED sha=$EXPECTED_SHA"
          exit 1
