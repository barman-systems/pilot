name: P0-A Sensitive Literal Classifier

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Emit safe semantic metadata only
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const file='api/auth/owner-otp.js',lineNo=34;
          const lines=fs.readFileSync(file,'utf8').split(/\r?\n/);
          const raw=lines[lineNo-1]||'';
          const entropy=s=>{if(!s)return 0;const m=new Map();for(const c of s)m.set(c,(m.get(c)||0)+1);let h=0;for(const n of m.values()){const p=n/s.length;h-=p*Math.log2(p)}return Math.round(h*100)/100};
          const literals=[];const re=/'([^'\\]*(?:\\.[^'\\]*)*)'|"([^"\\]*(?:\\.[^"\\]*)*)"|`([^`\\]*(?:\\.[^`\\]*)*)`/g;let m;
          while((m=re.exec(raw))){const s=m[1]??m[2]??m[3]??'';literals.push(s)}
          const headers=new Map([
            ['cache-control','CACHE_CONTROL'],['content-security-policy','CONTENT_SECURITY_POLICY'],['cross-origin-opener-policy','COOP'],['cross-origin-resource-policy','CORP'],['permissions-policy','PERMISSIONS_POLICY'],['referrer-policy','REFERRER_POLICY'],['strict-transport-security','HSTS'],['x-content-type-options','X_CONTENT_TYPE_OPTIONS'],['x-frame-options','X_FRAME_OPTIONS'],['access-control-allow-origin','CORS_ORIGIN'],['access-control-allow-headers','CORS_HEADERS'],['access-control-allow-methods','CORS_METHODS'],['allow','ALLOW']
          ]);
          const shape=s=>({length:s.length,entropy:entropy(s),known_header:headers.get(s.toLowerCase())||null,has_whitespace:/\s/.test(s),is_url:/^https?:\/\//i.test(s),is_uuid:/^[0-9a-f]{8}-[0-9a-f-]{27,}$/i.test(s),is_hex:/^[0-9a-f]{32,}$/i.test(s),jwt_shape:s.split('.').length===3,known_secret_prefix:/^(?:sk-|ghp_|github_pat_|sb_secret_|xox[baprs]-|AKIA|AIza)/.test(s),policy_syntax:/[;=(),*'\s]/.test(s),credential_words:/(?:secret|password|bearer|authorization|private[_-]?key)/i.test(s)});
          const strip=s=>s.replace(/'([^'\\]*(?:\\.[^'\\]*)*)'|"([^"\\]*(?:\\.[^"\\]*)*)"|`([^`\\]*(?:\\.[^`\\]*)*)`/g,' <STR> ');
          const tokens=s=>[...strip(s).matchAll(/[A-Za-z_$][A-Za-z0-9_$]*/g)].map(x=>x[0]).filter(x=>x!=='STR').slice(0,50);
          console.log('P0A_OWNER_OTP_SAFE_SEMANTICS='+JSON.stringify({file,line:lineNo,set_header:/\bsetHeader\s*\(/.test(raw),literal_count:literals.length,literals:literals.map(shape),context:[-3,-2,-1,0,1,2,3].map(offset=>({offset,tokens:tokens(lines[lineNo-1+offset]||'')}))}));
          NODE
