name: DABBIR P0-A Secret Disposition

on:
  push:
    branches:
      - audit/p0a-agent-runtime-hardening-v1
    paths:
      - .github/workflows/p0a-secret-disposition.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  EVIDENCE_ROOT: evidence/p0a/1796df7fa7eab418157ecc7531313f0af0e73ebf/pilot

jobs:
  disposition:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: audit/p0a-agent-runtime-hardening-v1
          fetch-depth: 1
      - name: Produce deterministic safe dispositions from redacted evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$EVIDENCE_ROOT" python3 - <<'PY'
          import json,os,pathlib,collections
          root=pathlib.Path(os.environ['ROOT'])
          items=json.loads((root/'secret-triage.json').read_text())
          out=[]
          for item in items:
              occ=item.get('occurrences') or []
              text=' '.join(str(o.get('redacted_context') or '') for o in occ)
              files=sorted({str(o.get('file')) for o in occ if o.get('file')})
              rules=sorted({str(o.get('rule_id')) for o in occ if o.get('rule_id')})
              scope_current=any(o.get('scope')=='WORKING_TREE' for o in occ)
              if item.get('classification')=='SYNTHETIC_STRONG':
                  disposition='SYNTHETIC_FIXTURE'; severity='INFO'; action='No rotation. Keep scanner coverage so fixture remains explicitly synthetic.'
              elif any(k in text for k in ('SUPABASE_PUBLISHABLE_KEY','retiredPublishableKey','PUBLISHABLE_KEY')):
                  disposition='PUBLIC_CONFIG'; severity='INFO'; action='No rotation required as a secret. Preserve RLS/security boundaries and do not substitute service-role credentials.'
              elif 'PUBLIC_STOREFRONT_TOKEN' in text:
                  disposition='PUBLIC_CONFIG'; severity='INFO'; action='No secret rotation required. Ensure it remains explicitly public Storefront access and not a private Storefront token.'
              elif any(k in text for k in ('_sha256','SHA256','sha256')):
                  disposition='NON_SECRET_HASH'; severity='INFO'; action='No rotation; hash/digest only. Never add the preimage to evidence.'
              elif all(('test/' in f or '/test/' in f or '.test.' in f or '/fixtures/' in f) for f in files) and 'idempotencyKey' in text:
                  disposition='TEST_IDENTIFIER'; severity='INFO'; action='No rotation; keep confined to tests/fixtures.'
              elif 'x-dabbir-owner-auth' in text:
                  disposition='ROTATION_OR_PROOF_REQUIRED'; severity='HIGH'; action='Prove the literal is non-credential or remove hardcoded auth fallback, rotate/revoke any matching live credential, and regression-test owner auth fail-closed behavior.'
              elif 'jwt' in rules:
                  disposition='ROTATION_OR_PROOF_REQUIRED'; severity='HIGH'; action='Treat as potentially live historical bearer credential until issuer/audience/expiry or revocation evidence proves otherwise; rotate/revoke if applicable.'
              elif 'serviceKey' in text:
                  disposition='ROTATION_OR_PROOF_REQUIRED'; severity='HIGH'; action='Prove this documentation value is synthetic/hash-only; otherwise remove from current tree/history exposure and rotate/revoke matching credential.'
              else:
                  disposition='MANUAL_SECURITY_REVIEW'; severity='MEDIUM'; action='Classify by credential semantics; if it can authenticate or authorize, rotate/revoke and remove hardcoded value. False-positive closure requires explicit evidence.'
              out.append({'fingerprint_sha256':item.get('secret_sha256'),'candidate_length':item.get('candidate_length'),'files':files,'rules':rules,'present_in_frozen_tree':scope_current,'disposition':disposition,'severity':severity,'owner':'Security/Platform','remediation':action})
          unresolved=[x for x in out if x['disposition'] in ('ROTATION_OR_PROOF_REQUIRED','MANUAL_SECURITY_REVIEW')]
          counts=collections.Counter(x['disposition'] for x in out)
          summary={'state':'FAIL' if unresolved else 'PASS','candidate_count':len(out),'disposition_counts':dict(counts),'unresolved_count':len(unresolved),'unresolved_fingerprints':[x['fingerprint_sha256'] for x in unresolved],'secret_values_persisted':False,'source':'secret-triage.json'}
          (root/'secret-disposition.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          (root/'secret-disposition-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$EVIDENCE_ROOT/secret-disposition.json" "$EVIDENCE_ROOT/secret-disposition-summary.json"
          if ! git diff --cached --quiet; then
            git commit -m 'evidence(p0a): classify redacted secret findings [skip ci]'
            git push origin HEAD:audit/p0a-agent-runtime-hardening-v1
          fi
