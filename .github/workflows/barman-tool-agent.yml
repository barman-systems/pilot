name: BARMAN Persistent Tool Agent

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  id-token: write
  contents: write
  pull-requests: write
  actions: write
  checks: read

concurrency:
  group: barman-persistent-tool-agent
  cancel-in-progress: false

jobs:
  execute:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Wait for exact Production broker on push wake-up
        if: github.event_name == 'push'
        env:
          BARMAN_EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/wait-dabbir-production-sha.mjs
      - name: Execute one BARMAN tool-agent command
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/barman-tool-agent.mjs
