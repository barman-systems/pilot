name: DABBIR MFA Login Gate Patch

on:
  push:
    branches:
      - fix/dabbir-mfa-login-gate-20260828
    paths:
      - '.github/workflows/dabbir-mfa-login-gate-patch.yml'
      - 'scripts/patch-dabbir-mfa-login-gate.mjs'
      - 'index.html'
      - 'test/ai-full-customer-journey-v2.mjs'

permissions:
  contents: write

concurrency:
  group: dabbir-mfa-login-gate-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/dabbir-mfa-login-gate-20260828
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Apply deterministic MFA login repair once
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'id="mfaGate"' index.html; then
            echo 'DABBIR_MFA_LOGIN_GATE_ALREADY_PATCHED'
            exit 0
          fi
          node scripts/patch-dabbir-mfa-login-gate.mjs
          grep -q 'id="mfaGate"' index.html
          grep -q "'/api/auth/mfa-status'" index.html
          grep -q "browserJourney(mfaFactorId, mfaSecret)" test/ai-full-customer-journey-v2.mjs
      - name: Commit generated product changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html test/ai-full-customer-journey-v2.mjs; then
            echo 'NO_GENERATED_CHANGES'
            exit 0
          fi
          git config user.name 'barmanai'
          git config user.email 'alcaptain2014@gmail.com'
          git add index.html test/ai-full-customer-journey-v2.mjs
          git commit -m 'DABBIR auth: complete MFA login in web UI and WebKit journey'
          git push origin HEAD:fix/dabbir-mfa-login-gate-20260828
