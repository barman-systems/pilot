name: One-time DABBIR cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-dabbir-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-time-dabbir-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Repair async operations verification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          test = Path('test/ai-full-customer-journey-v2.mjs')
          source = test.read_text()
          old = '''  await page.locator('#screen-operations.active').waitFor({ state: 'visible', timeout: 10_000 });
  assert((await page.locator('#opsBody').textContent())?.includes('AI Journey Product'), 'BROWSER_PRODUCT_MISSING');'''
          new = '''  await page.locator('#screen-operations.active').waitFor({ state: 'visible', timeout: 10_000 });
  await page.locator('#opsBody').filter({ hasText: 'AI Journey Product' }).waitFor({ state: 'visible', timeout: 15_000 });
  assert((await page.locator('#opsBody').textContent())?.includes('AI Journey Product'), 'BROWSER_PRODUCT_MISSING');'''
          assert source.count(old) == 1, 'unexpected operations verification state'
          test.write_text(source.replace(old, new))
          PY

      - name: Commit verified source repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code --quiet && exit 0
          git config user.name 'barman-systems-bot'
          git config user.email 'barman-systems-bot@users.noreply.github.com'
          git add test/ai-full-customer-journey-v2.mjs
          git commit -m 'fix: wait for DABBIR operations data before assertion'
          git pull --rebase origin main
          git push origin HEAD:main
