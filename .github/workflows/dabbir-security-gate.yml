name: DABBIR Security Gate

on:
  workflow_dispatch:

# Frozen from automatic execution by owner directive on 2026-09-15.
# Retained only as a manual diagnostic. It does not participate in merges.
permissions:
  contents: read

jobs:
  security-gate:
    name: tenant privacy and security diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DABBIR_SECURITY_GATE_BASE_SHA: ''
      DABBIR_SECURITY_GATE_HEAD_SHA: ${{ github.sha }}
      DABBIR_SECURITY_GATE_REPORT: dabbir-security-gate-report.json
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run manual repository security diagnostic
        run: node scripts/dabbir-security-gate.mjs
