name: DABBIR Security Gate

on:
  workflow_dispatch:

# Frozen from automatic execution by owner directive on 2026-09-15.
# Retained only for explicit manual diagnostics. It is not a merge gate.
permissions:
  contents: read

jobs:
  security-gate:
    name: tenant privacy and security diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DABBIR_SECURITY_GATE_BASE_SHA: ''
      DABBIR_SECURITY_GATE_HEAD_SHA: ${{ github.sha }}
      DABBIR_SECURITY_GATE_REPORT: dabbir-security-gate-report.json
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run manual repository security diagnostic
        run: node scripts/dabbir-security-gate.mjs
      - name: Run security regression contracts
        run: >-
          node --test
          test/dabbir-security-gate.test.mjs
          test/dabbir-bar16-privacy-recovery-contract.test.mjs
          test/dabbir-storage-tenant-isolation-contract.test.mjs
          test/dabbir-whatsapp-ai-closed-loop-hardening.test.mjs
          test/dabbir-whatsapp-multibranch-outbound-safety.test.mjs
          test/dabbir-whatsapp-voice-notes-ai-v1.test.mjs
