name: Patch BARMAN Telegram Route Once

on:
  push:
    branches:
      - fix/barman-telegram-runtime-route-20260902
    paths:
      - '.github/workflows/patch-barman-telegram-route-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/barman-telegram-runtime-route-20260902
      - name: Patch Telegram route and regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          core = Path('api/_barman-executive-core.js')
          source = core.read_text()
          old = 'select=chat_id&order=created_at.desc&limit=1'
          new = 'select=chat_id&order=received_at.desc&limit=1'
          if source.count(old) != 1:
              raise SystemExit('TELEGRAM_ROUTE_TARGET_NOT_UNIQUE')
          core.write_text(source.replace(old, new, 1))

          test = Path('test/barman-executive-runtime.test.mjs')
          text = test.read_text()
          marker = "const vercel=JSON.parse(fs.readFileSync(new URL('../vercel.json',import.meta.url),'utf8'));\n"
          if marker not in text:
              raise SystemExit('TEST_MARKER_NOT_FOUND')
          insert = marker + "const executiveCore=fs.readFileSync(new URL('../api/_barman-executive-core.js',import.meta.url),'utf8');\n"
          text = text.replace(marker, insert, 1)
          anchor = "test('signed bridge rejects tampering and old requests',()=>{\n"
          regression = "test('Telegram completion routing uses the real received_at ledger column',()=>{\n  assert.match(executiveCore,/barman_telegram_updates\\?command_id=.*order=received_at\\.desc/);\n  assert.doesNotMatch(executiveCore,/barman_telegram_updates\\?command_id=.*order=created_at\\.desc/);\n});\n\n"
          if anchor not in text:
              raise SystemExit('TEST_ANCHOR_NOT_FOUND')
          test.write_text(text.replace(anchor, regression + anchor, 1))
          PY
          git diff --check
          grep -q 'order=received_at.desc' api/_barman-executive-core.js
          ! grep -q 'order=created_at.desc' api/_barman-executive-core.js
      - name: Commit fix and remove patch helper
        shell: bash
        run: |
          git config user.name 'barmanai'
          git config user.email 'alcaptain2014@gmail.com'
          git rm .github/workflows/patch-barman-telegram-route-once.yml
          git add api/_barman-executive-core.js test/barman-executive-runtime.test.mjs
          git commit -m 'Fix BARMAN Telegram completion routing'
          git push origin HEAD:fix/barman-telegram-runtime-route-20260902
