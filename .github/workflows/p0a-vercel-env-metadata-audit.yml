name: P0-A Vercel Env Metadata Audit

on:
  push:
    branches: [audit/agent-runtime-hardening-p0a]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0a-vercel-env-metadata-audit
  cancel-in-progress: false

jobs:
  metadata-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      P0A_VERCEL_ENV_REPORT: p0a-vercel-env-metadata.json
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Audit Vercel environment metadata without values
        id: audit
        continue-on-error: true
        run: node scripts/p0a-vercel-env-metadata-audit.mjs
      - name: Publish value-free audit summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$P0A_VERCEL_ENV_REPORT" ]; then
            echo '### P0-A Vercel Env Metadata Audit' >> "$GITHUB_STEP_SUMMARY"
            echo '- Verdict: **NO REPORT / FAIL-CLOSED**' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          verdict="$(jq -r '.verdict' "$P0A_VERCEL_ENV_REPORT")"
          findings="$(jq -r '.findings | length' "$P0A_VERCEL_ENV_REPORT")"
          echo '### P0-A Vercel Env Metadata Audit' >> "$GITHUB_STEP_SUMMARY"
          echo "- Verdict: **${verdict}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Findings: ${findings}" >> "$GITHUB_STEP_SUMMARY"
          echo '- Secret values emitted: **NO**' >> "$GITHUB_STEP_SUMMARY"
          jq -r '.projects[] | "- \(.name): \(.environment_count // 0) metadata rows"' "$P0A_VERCEL_ENV_REPORT" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload value-free metadata evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0a-vercel-env-metadata
          path: p0a-vercel-env-metadata.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce fail-closed verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$P0A_VERCEL_ENV_REPORT"
          test "$(jq -r '.verdict' "$P0A_VERCEL_ENV_REPORT")" = PASS
