<body>
<div id="loading" class="loading">DABBIR</div>
<section id="authGate" class="authWrap hidden">
  <div class="authCard">
    <div class="brand"><div class="logo">P</div><div><b>DABBIR</b><br><small id="authTag"></small></div></div>
    <h1 id="authTitle"></h1><p id="authDesc"></p>
    <div class="authTabs"><button id="loginTab" class="on"></button><button id="signupTab"></button></div>
    <form id="authForm">
      <div class="field"><label id="emailLabel"></label><input id="authEmail" type="email" autocomplete="email" required></div>
      <div class="field"><label id="passwordLabel"></label><input id="authPassword" type="password" autocomplete="current-password" minlength="8" required></div>
      <button class="primary wide" id="authSubmit" type="submit"></button>
    </form>
    <div class="authMsg" id="authMsg" role="status" aria-live="polite"></div>
    <div class="row space" style="margin-top:10px"><span class="muted">العربية / English</span><div class="lang"><button id="authAr" type="button">عربي</button><button id="authEn" type="button">EN</button></div></div>
  </div>
</section>
<section id="onboardingGate" class="authWrap hidden">
  <form class="authCard" id="businessForm">
    <div class="brand"><div class="logo">P</div><div><b>DABBIR</b><br><small id="setupTag"></small></div></div>
    <h1 id="setupTitle"></h1><p id="setupDesc"></p>
    <div class="field"><label id="businessNameLabel"></label><input id="businessName" maxlength="120" required></div>
    <div class="field"><label id="businessTypeLabel"></label><select id="businessType"><option value="clinic"></option><option value="store"></option><option value="creator"></option><option value="salon"></option><option value="real_estate"></option><option value="services"></option><option value="other"></option></select></div>
    <button class="primary wide" id="setupSubmit" type="submit"></button>
    <div class="authMsg" id="setupMsg" role="status" aria-live="polite"></div>
  </form>
</section>
<div id="appShell" class="shell hidden">
<aside class="side" id="side">
  <div class="brand"><div class="logo">P</div><div><b>DABBIR</b><br><small id="brandTag"></small></div></div>
  <div class="workspace"><b id="workspaceName"></b><span id="workspaceState"></span></div>
  <nav class="nav" id="nav">
    <button class="navBtn active" data-screen="dashboard">⌂ <span data-label="dashboard"></span></button>
    <button class="navBtn" data-screen="conversations">◉ <span data-label="conversations"></span></button>
    <button class="navBtn" data-screen="appointments">□ <span data-label="appointments"></span></button>
    <button class="navBtn" data-screen="customers">♙ <span data-label="customers"></span></button>
    <button class="navBtn" data-screen="tasks">✓ <span data-label="tasks"></span></button>
    <button class="navBtn" data-screen="automations">↻ <span data-label="automations"></span></button>
    <button class="navBtn" data-screen="analytics">▥ <span data-label="analytics"></span></button>
    <button class="navBtn" data-screen="integrations">⌘ <span data-label="integrations"></span></button>
    <button class="navBtn" data-screen="notifications">◇ <span data-label="notifications"></span></button>
    <button class="navBtn" data-screen="settings">⚙ <span data-label="settings"></span></button>
    <button class="navBtn" data-screen="help">? <span data-label="help"></span></button>
  </nav>
  <div class="sideFoot"><a class="secondary" href="/team.html" style="display:block;text-align:center;text-decoration:none" id="teamLink"></a></div>
</aside>
<main class="main">
<header class="top"><div class="row"><button class="mobileMenu" id="menuBtn">☰</button><div><div class="pageTitle" id="pageTitle"></div><span class="statusChip" id="runtimeChip"></span></div></div><div class="topActions"><div class="lang"><button id="arBtn">عربي</button><button id="enBtn">EN</button></div></div></header>
<div class="content">
<section class="screen active" id="screen-dashboard"><div class="hero"><div><h1 id="dashTitle"></h1><p id="dashDesc"></p></div></div><div class="cards" id="dashCards"></div><div class="grid2"><div class="card"><div class="sectionHead"><h2 id="attentionTitle"></h2></div><div class="list" id="attentionList"></div></div><div class="card"><div class="sectionHead"><h2 id="aiTitle"></h2><span class="badge green">AI</span></div><div id="aiStatus"></div></div></div></section>
<section class="screen" id="screen-conversations"><div class="hero"><div><h1 id="convTitle"></h1><p id="convDesc"></p></div><button class="primary" id="newChatBtn"></button></div><div class="chatGrid"><aside class="chatList" id="chatList"></aside><section class="chatPanel"><div class="chatHead"><div class="grow"><b id="chatName"></b><div class="muted" id="chatState"></div></div><button class="secondary" id="translateAll"></button></div><div class="messages" id="messages"></div><div class="compose"><input id="composer"><button class="send" id="sendBtn">↑</button></div></section></div><div class="truth" id="webTruth"></div></section>
<section class="screen" id="screen-appointments"><div class="hero"><div><h1 id="apptTitle"></h1><p id="apptDesc"></p></div><button class="primary" id="newApptBtn"></button></div><div class="table" id="appointmentsTable"></div></section>
<section class="screen" id="screen-customers"><div class="hero"><div><h1 id="custTitle"></h1><p id="custDesc"></p></div></div><div class="table" id="customersTable"></div></section>
<section class="screen" id="screen-tasks"><div class="hero"><div><h1 id="tasksTitle"></h1><p id="tasksDesc"></p></div><button class="secondary" id="followupBtn"></button></div><div class="grid2"><div class="card"><div class="sectionHead"><h2 id="handoffTitle"></h2></div><div class="list" id="handoffList"></div></div><div class="card"><div class="sectionHead"><h2 id="followupsTitle"></h2></div><div class="list" id="followupList"></div></div></div></section>
<section class="screen" id="screen-automations"><div class="hero"><div><h1 id="autoTitle"></h1><p id="autoDesc"></p></div></div><div class="card"><div class="list" id="automationList"></div></div></section>
<section class="screen" id="screen-analytics"><div class="hero"><div><h1 id="analyticsTitle"></h1><p id="analyticsDesc"></p></div></div><div class="cards" id="analyticsCards"></div></section>
<section class="screen" id="screen-integrations"><div class="hero"><div><h1 id="integrationTitle"></h1><p id="integrationDesc"></p></div></div><div class="integrationGrid" id="integrationGrid"></div><div class="truth" id="integrationTruth"></div></section>
<section class="screen" id="screen-notifications"><div class="hero"><div><h1 id="noticeTitle"></h1><p id="noticeDesc"></p></div></div><div class="card"><div class="list" id="noticeList"></div></div></section>
<section class="screen" id="screen-settings"><div class="hero"><div><h1 id="settingsTitle"></h1><p id="settingsDesc"></p></div></div><div class="card"><div class="list" id="settingsList"></div><button class="secondary wide" id="logoutBtn"></button></div></section>
<section class="screen" id="screen-help"><div class="hero"><div><h1 id="helpTitle"></h1><p id="helpDesc"></p></div></div><div class="integrationGrid"><div class="integration"><h3 id="helpRuntimeTitle"></h3><p id="helpRuntimeDesc"></p></div><div class="integration"><h3 id="helpWhatsTitle"></h3><p id="helpWhatsDesc"></p></div></div></section>
</div></main></div>
<nav class="bottomNav" id="bottomNav"><button data-screen="dashboard" class="active">⌂<br><span data-label="dashboard"></span></button><button data-screen="conversations">◉<br><span data-label="conversations"></span></button><button data-screen="appointments">□<br><span data-label="appointments"></span></button><button data-screen="tasks">✓<br><span data-label="tasks"></span></button><button data-screen="settings">⚙<br><span data-label="settings"></span></button></nav>
<div class="modal" id="newChatModal" role="dialog" aria-modal="true"><form class="modalBox" id="newChatForm"><h3 id="newChatTitle"></h3><div class="field"><label id="customerNameLabel"></label><input id="newCustomerName" maxlength="120" required></div><div class="modalActions"><button type="button" class="secondary modalClose"></button><button class="primary" id="createChatBtn" type="submit"></button></div></form></div>
<div class="modal" id="appointmentModal" role="dialog" aria-modal="true"><form class="modalBox" id="appointmentForm"><h3 id="newApptTitle"></h3><div class="field"><label id="apptCustomerLabel"></label><input id="apptCustomer" maxlength="120" required></div><div class="field"><label id="apptTimeLabel"></label><input id="apptTime" type="datetime-local" required></div><div class="modalActions"><button type="button" class="secondary modalClose"></button><button class="primary" id="saveApptBtn" type="submit"></button></div></form></div>

$('#newApptBtn').onclick=()=>$('#appointmentModal').classList.add('open');$('#appointmentForm').onsubmit=async e=>{e.preventDefault();const {r,j}=await api('/api/dabbir-runtime',{method:'POST',body:JSON.stringify({action:'create_appointment',business_id:workspace.business.id,customer_name:$('#apptCustomer').value,starts_at:new Date($('#apptTime').value).toISOString()})});if(!r.ok||!j.ok){toast(j.error||T().invalid);return}$('#appointmentModal').classList.remove('open');$('#appointmentForm').reset();toast(T().saved);await loadRuntime(workspace.business.id,selectedConversationId)};
function renderCustomers(){const t=T(),rows=workspace.customers||[];$('#customersTable').innerHTML=`<div class="tr head"><span>${esc(t.customer)}</span><span>${esc(t.status)}</span><span>${esc(t.time)}</span></div>`+(rows.length?rows.map(c=>`<div class="tr"><b>${esc(c.display_name)}</b><span>${esc(c.lead_status)}</span><span>${esc(fmt(c.created_at))}</span></div>`).join(''):`<div class="empty">${esc(t.noCustomers)}</div>`)}
function renderTasks(){const t=T(),handoffs=workspace.handoffs||[],followups=workspace.followups||[];$('#handoffList').innerHTML=handoffs.length?handoffs.map(h=>`<div class="item"><div class="grow"><b>${esc(h.route_class)}</b><small>${esc(h.reason||h.summary||'')}</small></div><span class="badge yellow">${esc(h.state)}</span></div>`).join(''):empty(t.noHandoffs);$('#followupList').innerHTML=followups.length?followups.map(f=>`<div class="item"><div class="grow"><b>${esc(f.reason)}</b><small>${esc(f.due_at?fmt(f.due_at):f.status)}</small></div><span class="badge blue">${esc(f.status)}</span></div>`).join(''):empty(t.noFollowups);$('#automationList').innerHTML=$('#followupList').innerHTML}
$('#followupBtn').onclick=async()=>{if(!selectedConversationId){toast(T().noChats);return}const due=new Date(Date.now()+24*60*60*1000).toISOString();const {r,j}=await api('/api/dabbir-runtime',{method:'POST',body:JSON.stringify({action:'create_followup',business_id:workspace.business.id,conversation_id:selectedConversationId,reason:'customer_followup',due_at:due})});if(!r.ok||!j.ok){toast(j.error||T().invalid);return}toast(T().followupSaved);await loadRuntime(workspace.business.id,selectedConversationId);showScreen('tasks')};
function renderAnalytics(){const t=T(),msgs=workspace.messages||[];const data=[[t.activeChats,(workspace.conversations||[]).length],[t.aiMessages,msgs.filter(m=>m.sender_type==='ai').length],[t.customersCount,(workspace.customers||[]).length],[t.humanHandoffs,(workspace.handoffs||[]).length]];$('#analyticsCards').innerHTML=data.map(([a,b])=>`<div class="card metric"><span>${esc(a)}</span><strong>${b}</strong></div>`).join('')}
function renderIntegrations(){const t=T(),ai=workspace.ai||{};const cards=[[t.webChannel,t.webChannelDesc,t.operational,'green'],[t.aiIntegration,t.aiIntegrationDesc,ai.configured?t.operational:t.notOperational,ai.configured?'green':'red'],[t.whatsapp,t.whatsappDesc,t.notOperational,'red'],[t.instagram,t.instagramDesc,t.unverified,'yellow'],[t.teamIntegration,t.teamIntegrationDesc,t.operational,'green']];$('#integrationGrid').innerHTML=cards.map(([a,b,c,d])=>`<div class="integration"><div class="row space"><h3>${esc(a)}</h3><span class="badge ${d}">${esc(c)}</span></div><p>${esc(b)}</p></div>`).join('')}
function renderNotices(){const t=T(),items=[];(workspace.handoffs||[]).forEach(h=>items.push({a:h.route_class,b:h.reason||h.state}));if(workspace.whatsapp?.state!=='OPERATIONAL')items.push({a:t.whatsapp,b:t.whatsappDesc});$('#noticeList').innerHTML=items.length?items.map(x=>`<div class="item"><div class="grow"><b>${esc(x.a)}</b><small>${esc(x.b)}</small></div></div>`).join(''):empty(t.noNotices)}
function renderSettings(){const t=T();$('#settingsList').innerHTML=`<div class="item"><div class="grow"><b>${esc(t.business)}</b><small>${esc(workspace.business?.name||'')}</small></div></div><div class="item"><div class="grow"><b>${esc(t.role)}</b><small>${esc(workspace.membership?.role||'')}</small></div></div><div class="item"><div class="grow"><b>${esc(t.emailAddress)}</b><small>${esc(workspace.user?.email||'')}</small></div></div>`}
function renderAll(){if(!workspace?.business)return;$('#workspaceName').textContent=workspace.business.name;$('#workspaceState').textContent=T().operational;$('#pageTitle').textContent=T()[current]||T().dashboard;renderDashboard();renderChats();renderAppointments();renderCustomers();renderTasks();renderAnalytics();renderIntegrations();renderNotices();renderSettings()}
$('#logoutBtn').onclick=async()=>{await api('/api/auth/logout',{method:'POST',body:'{}'});workspace=null;showGate('auth')};$$('.modalClose').forEach(b=>b.onclick=()=>b.closest('.modal').classList.remove('open'));$$('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open')}));
function externalVerified(){return false}
applyLang();boot();
</script>
</body>
</html>
