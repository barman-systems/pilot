<!doctype html>
<html data-dabbir-theme="web" lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D1426">
<title>DABBIR — مشغّل أعمالك الذكي</title>
<link rel="stylesheet" href="/dabbir-design-tokens.css?v=ui-authority-v1">

<link rel="stylesheet" href="/dabbir-web.css?v=ui-authority-v2">
</head>
<body>
<div id="loading" class="loading">DABBIR</div>

<section id="authGate" class="authWrap hidden">
  <div class="authCard">
	    <div class="brand"><div class="logo"><img src="/dabbir-app-icon.png" alt="DABBIR"></div><div><b>DABBIR | دبّر</b><br><small id="authTag"></small></div></div>
	    <h1 id="authTitle"></h1><p id="authDesc"></p>
    <div class="authTabs" role="tablist"><button id="loginTab" class="on" type="button" role="tab" aria-selected="true"></button><button id="signupTab" type="button" role="tab" aria-selected="false"></button></div>
    <form id="authForm">
      <div class="field"><label id="emailLabel" for="authEmail"></label><input id="authEmail" type="email" dir="ltr" autocapitalize="none" spellcheck="false" autocomplete="email" required></div>
      <div class="field"><label id="passwordLabel" for="authPassword"></label><input id="authPassword" type="password" autocomplete="current-password" minlength="8" aria-describedby="authHint" required></div>
      <button class="primary wide" id="authSubmit" type="submit"></button>
    </form>
    <div class="authMsg" id="authMsg" role="status" aria-live="polite"></div>
    <p id="authHint" class="authHint"></p>
    <nav class="authLegal" aria-label="Legal links"><span id="authLegalPrefix"></span><a id="privacyLink" href="/privacy"></a><a id="termsLink" href="/terms"></a><a id="supportLink" href="/support"></a></nav>
    <div class="row space authLanguageRow"><span class="muted">العربية / English</span><div class="lang"><button id="authAr" type="button">عربي</button><button id="authEn" type="button">EN</button></div></div>
  </div>
</section>

<section id="onboardingGate" class="authWrap hidden">
  <form class="authCard" id="businessForm">
    <div class="brand"><div class="logo"><img src="/dabbir-app-icon.png" alt="DABBIR"></div><div><b>DABBIR | دبّر</b><br><small id="setupTag"></small></div></div>
    <h1 id="setupTitle"></h1><p id="setupDesc"></p>
    <ol class="onboardingProgress" aria-label="Setup progress"><li class="done"><strong id="setupStepAccount"></strong><span id="setupStepAccountDesc"></span></li><li class="current" aria-current="step"><strong id="setupStepBusiness"></strong><span id="setupStepBusinessDesc"></span></li></ol>
    <div class="field"><label id="businessNameLabel" for="businessName"></label><input id="businessName" maxlength="120" required></div>
    <div class="field"><label id="businessTypeLabel" for="businessType"></label><select id="businessType"><option value="clinic"></option><option value="store"></option><option value="creator"></option><option value="salon"></option><option value="real_estate"></option><option value="services"></option><option value="car_wash"></option><option value="other"></option></select></div>
    <button class="primary wide" id="setupSubmit" type="submit"></button>
    <div class="authMsg" id="setupMsg" role="status" aria-live="polite"></div>
  </form>
</section>

<div id="appShell" class="shell hidden">
<aside class="side" id="side">
  <div class="brand"><div class="logo"><img src="/dabbir-app-icon.png" alt="DABBIR"></div><div><b>DABBIR</b><br><small id="brandTag"></small></div></div>
  <div class="workspace"><b id="workspaceName"></b><span id="workspaceState"></span></div>
  <nav class="nav" id="nav">
    <button class="navBtn active" data-screen="dashboard"><span class="navIcon">⌂</span><span data-label="dashboard"></span></button>
    <button class="navBtn" data-screen="conversations"><span class="navIcon">◉</span><span data-label="conversations"></span></button>
    <button class="navBtn" data-screen="appointments"><span class="navIcon">□</span><span data-label="appointments"></span></button>
    <button class="navBtn" data-screen="customers"><span class="navIcon">♙</span><span data-label="customers"></span></button>
    <button class="navBtn" data-screen="more"><span class="navIcon">•••</span><span data-label="more"></span></button>
  </nav>
  <div class="sideFoot"><a class="secondary" href="/team.html" id="teamLink"></a></div>
</aside>

<main class="main">
<header class="top">
  <div class="row"><button class="mobileMenu" id="menuBtn">☰</button><div><div class="pageTitle" id="pageTitle"></div><span class="statusChip" id="runtimeChip"></span></div></div>
  <div class="topActions"><div class="lang"><button id="arBtn">عربي</button><button id="enBtn">EN</button></div></div>
</header>

<div class="content">
<section class="screen active" id="screen-dashboard">
  <div class="hero"><div><div class="eyebrow" id="todayEyebrow"></div><h1 id="dashTitle"></h1><p id="dashDesc"></p></div></div>
  <div class="cards" id="dashCards"></div>
  <div class="todayGrid">
    <div class="card"><div class="sectionHead"><h2 id="attentionTitle"></h2><span class="badge yellow" id="attentionCount">0</span></div><div class="list" id="attentionList"></div></div>
    <div class="card"><div class="sectionHead"><h2 id="quickTitle"></h2></div><div class="quickActions"><button class="quickAction" id="quickChat"><b id="quickChatTitle"></b><span id="quickChatDesc"></span></button><button class="quickAction" id="quickAppt"><b id="quickApptTitle"></b><span id="quickApptDesc"></span></button></div></div>
  </div>
  <div class="setupCard" id="setupCard"><h3 id="setupProgressTitle"></h3><p id="setupProgressDesc"></p><div class="setupSteps" id="setupSteps"></div></div>
</section>

<section class="screen" id="screen-conversations">
  <div class="hero"><div><h1 id="convTitle"></h1><p id="convDesc"></p></div><button class="primary" id="newChatBtn"></button></div>
  <div class="chatGrid"><aside class="chatList" id="chatList"></aside><section class="chatPanel"><div class="chatHead"><div class="grow"><b id="chatName"></b><div class="muted" id="chatState"></div></div><button class="secondary" id="translateAll"></button></div><div class="messages" id="messages"></div><div class="compose"><input id="composer"><button class="send" id="sendBtn">↑</button></div></section></div>
  <div class="truth" id="webTruth"></div>
</section>

<section class="screen" id="screen-appointments"><div class="hero"><div><h1 id="apptTitle"></h1><p id="apptDesc"></p></div><button class="primary" id="newApptBtn"></button></div><div class="table" id="appointmentsTable"></div></section>
<section class="screen" id="screen-customers"><div class="hero"><div><h1 id="custTitle"></h1><p id="custDesc"></p></div></div><div class="table" id="customersTable"></div></section>

<section class="screen" id="screen-more">
  <div class="hero"><div><h1 id="moreTitle"></h1><p id="moreDesc"></p></div></div>
  <div class="moreGrid">
    <button class="moreCard" data-screen="tasks"><h3 id="moreTasksTitle"></h3><p id="moreTasksDesc"></p></button>
    <button class="moreCard" data-screen="analytics"><h3 id="moreAnalyticsTitle"></h3><p id="moreAnalyticsDesc"></p></button>
    <button class="moreCard" data-screen="integrations"><h3 id="moreIntegrationsTitle"></h3><p id="moreIntegrationsDesc"></p></button>
    <button class="moreCard" data-screen="automations"><h3 id="moreAutomationsTitle"></h3><p id="moreAutomationsDesc"></p></button>
    <button class="moreCard" data-screen="notifications"><h3 id="moreNoticesTitle"></h3><p id="moreNoticesDesc"></p></button>
    <button class="moreCard" data-screen="settings"><h3 id="moreSettingsTitle"></h3><p id="moreSettingsDesc"></p></button>
    <button class="moreCard" data-screen="help"><h3 id="moreHelpTitle"></h3><p id="moreHelpDesc"></p></button>
  </div>
</section>

<section class="screen" id="screen-tasks"><div class="hero"><div><h1 id="tasksTitle"></h1><p id="tasksDesc"></p></div><button class="secondary" id="followupBtn"></button></div><div class="todayGrid"><div class="card"><div class="sectionHead"><h2 id="handoffTitle"></h2></div><div class="list" id="handoffList"></div></div><div class="card"><div class="sectionHead"><h2 id="followupsTitle"></h2></div><div class="list" id="followupList"></div></div></div></section>

<section class="screen" id="screen-analytics"><div class="hero"><div><h1 id="analyticsTitle"></h1><p id="analyticsDesc"></p></div></div><div class="cards" id="analyticsCards"></div></section>
<section class="screen" id="screen-integrations"><div class="hero"><div><h1 id="integrationTitle"></h1><p id="integrationDesc"></p></div></div><div class="integrationGrid" id="integrationGrid"></div><div class="truth" id="integrationTruth"></div></section>
<section class="screen" id="screen-notifications"><div class="hero"><div><h1 id="noticeTitle"></h1><p id="noticeDesc"></p></div></div><div class="card"><div class="list" id="noticeList"></div></div></section>
<section class="screen" id="screen-settings"><div class="hero"><div><h1 id="settingsTitle"></h1><p id="settingsDesc"></p></div></div><div class="card"><div class="list" id="settingsList"></div><button class="secondary wide" id="logoutBtn"></button></div></section>
<section class="screen" id="screen-help"><div class="hero"><div><h1 id="helpTitle"></h1><p id="helpDesc"></p></div></div><div class="integrationGrid"><div class="integration"><h3 id="helpRuntimeTitle"></h3><p id="helpRuntimeDesc"></p></div><div class="integration"><h3 id="helpWhatsTitle"></h3><p id="helpWhatsDesc"></p></div></div></section>
</div>
</main>
</div>

    retryReady:'راجعت القائمة. يمكنك الآن محاولة الإنشاء مجددًا.',failed:'تعذر تجهيز النشاط. تحقق من البيانات وحاول مرة أخرى.'

$('#newApptBtn').onclick=()=>openModal('#appointmentModal','#apptCustomer');$('#appointmentForm').onsubmit=async e=>{e.preventDefault();const btn=$('#saveApptBtn'),idle=T().save;btn.disabled=true;btn.textContent=T().savingWorking;try{const {r,j}=await api('/api/dabbir-runtime',{method:'POST',body:JSON.stringify({action:'create_appointment',business_id:workspace.business.id,customer_name:$('#apptCustomer').value.trim(),starts_at:new Date($('#apptTime').value).toISOString()})});if(!r.ok||!j.ok){toast(j.error||T().invalid);return}window.__dabbirTrackUx?.('appointment_created');closeModal($('#appointmentModal'));$('#appointmentForm').reset();toast(T().saved);await loadRuntime(workspace.business.id,selectedConversationId)}finally{btn.disabled=false;btn.textContent=idle}};
function renderCustomers(){const t=T(),rows=workspace.customers||[];$('#customersTable').innerHTML=`<div class="tr head"><span>${esc(t.customer)}</span><span>${esc(t.status)}</span><span>${esc(t.time)}</span></div>`+(rows.length?rows.map(c=>`<div class="tr"><b>${esc(c.display_name)}</b><span>${esc(c.lead_status)}</span><span>${esc(fmt(c.created_at))}</span></div>`).join(''):`<div class="empty">${esc(t.noCustomers)}</div>`)}
function renderTasks(){const t=T(),handoffs=workspace.handoffs||[],followups=workspace.followups||[];$('#handoffList').innerHTML=handoffs.length?handoffs.map(h=>`<div class="item"><div class="grow"><b>${esc(executionLabel(h.route_class))}</b><small>${esc(executionLabel(h.reason||h.summary||''))}</small></div><span class="badge ${completedHandoff(h.state)?'green':'yellow'}">${esc(executionLabel(h.state))}</span></div>`).join(''):empty(t.noHandoffs);$('#followupList').innerHTML=followups.length?followups.map(f=>`<div class="item"><div class="grow"><b>${esc(executionLabel(f.reason))}</b><small>${esc(f.due_at?fmt(f.due_at):f.status)}</small></div><span class="badge blue">${esc(executionLabel(f.status))}</span></div>`).join(''):empty(t.noFollowups);$('#automationList').innerHTML=$('#followupList').innerHTML}
$('#followupBtn').onclick=async()=>{if(!selectedConversationId){toast(T().noChats);return}const due=new Date(Date.now()+24*60*60*1000).toISOString();const {r,j}=await api('/api/dabbir-runtime',{method:'POST',body:JSON.stringify({action:'create_followup',business_id:workspace.business.id,conversation_id:selectedConversationId,reason:'customer_followup',due_at:due})});if(!r.ok||!j.ok){toast(j.error||T().invalid);return}toast(T().followupSaved);await loadRuntime(workspace.business.id,selectedConversationId);showScreen('tasks')};
function renderAnalytics(){const t=T(),msgs=workspace.messages||[];const data=[[t.activeChats,(workspace.conversations||[]).length],[t.aiMessages,msgs.filter(m=>m.sender_type==='ai').length],[t.customersCount,(workspace.customers||[]).length],[t.humanHandoffs,(workspace.handoffs||[]).length]];$('#analyticsCards').innerHTML=data.map(([a,b])=>`<div class="card metric"><span>${esc(a)}</span><strong>${b}</strong></div>`).join('')}
function renderIntegrations(){const t=T(),ai=workspace.ai||{};const cards=[[t.webChannel,t.webChannelDesc,t.operational,'green'],[t.aiIntegration,t.aiIntegrationDesc,ai.configured?t.operational:t.notOperational,ai.configured?'green':'red'],[t.whatsapp,t.whatsappDesc,t.notOperational,'red'],[t.instagram,t.instagramDesc,t.unverified,'yellow'],[t.teamIntegration,t.teamIntegrationDesc,t.operational,'green']];$('#integrationGrid').innerHTML=cards.map(([a,b,c,d])=>`<div class="integration"><div class="row space"><h3>${esc(a)}</h3><span class="badge ${d}">${esc(c)}</span></div><p>${esc(b)}</p></div>`).join('')}
function renderNotices(){const t=T(),items=[],now=Date.now(),day=now+86400000;(workspace.handoffs||[]).filter(h=>!completedHandoff(h.state)).forEach(h=>items.push({a:h.route_class,b:h.reason||h.state,type:'handoffs'}));const upcoming=(workspace.appointments||[]).filter(a=>{const start=new Date(a.starts_at).getTime();return start>=now&&start<=day});if(upcoming.length)items.push({a:t.appointments,b:t.upcomingNotice+' '+upcoming.length,type:'appointments'});if(workspace.whatsapp?.state!=='OPERATIONAL')items.push({a:t.whatsapp,b:t.whatsappDesc,type:'channel_issues'});$('#noticeList').innerHTML=items.length?items.map(x=>`<div class="item" data-notice-type="${esc(x.type)}"><div class="grow"><b>${esc(executionLabel(x.a))}</b><small>${esc(executionLabel(x.b))}</small></div></div>`).join(''):empty(t.noNotices)}
function renderSettings(){const t=T();$('#settingsList').innerHTML=`<div class="item"><div class="grow"><b>${esc(t.business)}</b><small>${esc(workspace.business?.name||'')}</small></div></div><div class="item"><div class="grow"><b>${esc(t.role)}</b><small>${esc(executionLabel(workspace.membership?.role||''))}</small></div></div><div class="item"><div class="grow"><b>${esc(t.emailAddress)}</b><small>${esc(workspace.user?.email||'')}</small></div></div>`}
function renderAll(){if(!workspace?.business)return;$('#workspaceName').textContent=workspace.business.name;$('#workspaceState').textContent=T().operational;$('#pageTitle').textContent=T()[current]||T().dashboard;renderDashboard();renderChats();renderAppointments();renderCustomers();renderTasks();renderAnalytics();renderIntegrations();renderNotices();renderSettings()}
$('#logoutBtn').onclick=async()=>{const ok=window.__dabbirConfirm?await window.__dabbirConfirm({title:T().logoutConfirmTitle,body:T().logoutConfirmBody}):window.confirm(T().logoutConfirmTitle);if(!ok)return;await api('/api/auth/logout',{method:'POST',body:'{}'});workspace=null;showGate('auth')};$$('.modalClose').forEach(b=>b.onclick=()=>closeModal(b.closest('.modal')));$$('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeModal(m)}));document.addEventListener('keydown',e=>{if(e.key==='Escape')$$('.modal.open').forEach(closeModal)});
function externalVerified(){return false}
applyLang();boot();
</script>
</body>
