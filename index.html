<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0b">
<title>DABBIR — حوّل طلبات WhatsApp إلى حجوزات غسيل مؤكدة</title>
<style>
:root{color-scheme:dark;--bg:#08090a;--panel:#111315;--panel2:#171a1d;--line:#2a2e33;--text:#f7f8f9;--muted:#979da5;--accent:#d7ff5f;--green:#8ce6a1;--yellow:#ffd87a;--red:#ffaaa9;--blue:#9bcaff;--r:18px;--shadow:0 22px 70px #0008}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -20%,#20252b 0,#0c0e10 34%,var(--bg) 66%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}
button,input,select{font:inherit}button,input,select,a{min-height:44px}button{cursor:pointer;transition:transform .16s cubic-bezier(.23,1,.32,1),opacity .16s}button:active:not(:disabled){transform:scale(.97)}button:disabled{cursor:progress;opacity:.66}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}a{color:inherit}.hidden{display:none!important}
.loading{min-height:100vh;display:grid;place-items:center;color:var(--muted);letter-spacing:.12em}.loading:after{content:"";position:absolute;width:42px;height:3px;margin-top:52px;border-radius:999px;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:loadingSweep 1s linear infinite}@keyframes loadingSweep{from{transform:translateX(-80%)}to{transform:translateX(80%)}}
.authWrap{min-height:100vh;display:grid;place-items:center;padding:22px}.authCard{width:min(460px,100%);padding:24px;border:1px solid var(--line);border-radius:24px;background:#111315e8;box-shadow:var(--shadow)}
.brand{display:flex;gap:11px;align-items:center}.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#2e246b,#245fd6 55%,#38c8d9);border:1px solid #617dff66;font-weight:950;color:white;overflow:hidden}.logo img{width:100%;height:100%;display:block;object-fit:contain}.brand small,.muted{color:var(--muted)}
.authCard h1{font-size:24px;margin:22px 0 6px}.authCard p{color:var(--muted);font-size:12px;line-height:1.7}.field{margin-top:13px}.field label{display:block;color:var(--muted);font-size:10px;margin-bottom:6px}.field input,.field select{width:100%;border:1px solid var(--line);background:#181b1f;color:#fff;border-radius:12px;padding:11px}
.preSignupValue{margin-top:18px;padding:15px;border:1px solid #4b5e29;border-radius:16px;background:linear-gradient(145deg,#202a16,#131914)}.preSignupValue b{display:block;font-size:14px;line-height:1.55}.preSignupValue p{margin:6px 0 11px!important;color:#bdc9b8!important}.preSignupValue a{text-decoration:none;display:flex}.preSignupTruth{display:block;margin-top:8px;color:var(--muted);font-size:9px;line-height:1.6}
.row{display:flex;align-items:center;gap:9px}.space{justify-content:space-between}.primary,.secondary,.navBtn,.iconBtn{border-radius:12px;font-weight:850}.primary{border:0;background:var(--accent);color:#10130b;padding:11px 14px}.secondary{border:1px solid var(--line);background:#181b1f;color:#fff;padding:10px 13px}.ghost{border:0;background:transparent;color:var(--muted);padding:8px}.wide{width:100%;margin-top:16px}
.authTabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:#171a1d;border:1px solid var(--line);padding:4px;border-radius:13px;margin-top:18px}.authTabs button{border:0;background:transparent;color:var(--muted);border-radius:10px}.authTabs button.on{background:#30343a;color:#fff}.authMsg{min-height:28px;margin-top:10px;color:var(--yellow);font-size:11px}.authHint{margin:8px 0 0!important;font-size:10px!important}.authLegal{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;color:var(--muted);font-size:10px}.authLegal a{color:var(--blue);min-height:30px;display:inline-flex;align-items:center}.authLegal a:hover{text-decoration:underline}.onboardingProgress{display:grid;grid-template-columns:1fr 1fr;gap:8px;list-style:none;padding:0;margin:18px 0 4px}.onboardingProgress li{border:1px solid var(--line);background:#171a1d;color:var(--muted);border-radius:12px;padding:9px 10px;font-size:9px}.onboardingProgress li.done{border-color:#355d42;background:#12251a;color:var(--green)}.onboardingProgress li.current{border-color:#65772f;color:#fff}.onboardingProgress strong{display:block;font-size:10px;margin-bottom:2px}
.shell{min-height:100vh;display:grid;grid-template-columns:218px 1fr}.side{position:sticky;top:0;height:100vh;border-inline-end:1px solid var(--line);background:#0d0f10f2;padding:17px 12px;display:flex;flex-direction:column;z-index:20}.workspace{margin:16px 3px 12px;padding:11px;border:1px solid var(--line);border-radius:14px;background:#15181b}.workspace b{font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.workspace span{font-size:9px;color:var(--green)}.nav{display:flex;flex-direction:column;gap:4px}.navBtn{border:0;background:transparent;color:#aeb3ba;text-align:start;padding:12px;display:flex;gap:10px;align-items:center}.navBtn.active,.navBtn:hover{background:#1b1e22;color:#fff}.navBtn.active{box-shadow:inset -3px 0 0 var(--accent)}html[dir=ltr] .navBtn.active{box-shadow:inset 3px 0 0 var(--accent)}.navIcon{width:20px;text-align:center}.sideFoot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}
.main{min-width:0}.top{position:sticky;top:0;z-index:15;height:67px;padding:0 22px;border-bottom:1px solid #1e2226;background:#08090ada;backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:space-between}.pageTitle{font-size:15px;font-weight:900}.statusChip,.badge{display:inline-flex;align-items:center;border-radius:999px;font-size:9px;font-weight:900;padding:5px 8px}.statusChip,.green{background:#14331e;color:var(--green)}.yellow{background:#3a3014;color:var(--yellow)}.red{background:#3b1717;color:var(--red)}.gray{background:#25282d;color:#c5cad0}.blue{background:#15283a;color:var(--blue)}.topActions{display:flex;align-items:center;gap:8px}.lang{display:flex;border:1px solid var(--line);background:#15171a;border-radius:12px;padding:3px}.lang button{border:0;background:transparent;color:var(--muted);border-radius:9px;padding:6px 9px;min-height:34px}.lang button.on{background:#30343a;color:#fff}
.content{max-width:1180px;margin:auto;padding:24px 22px 96px}.screen{display:none}.screen.active{display:block}.hero{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}.hero h1{font-size:27px;margin:0 0 5px}.hero p{font-size:12px;line-height:1.6;color:var(--muted);margin:0}.eyebrow{font-size:10px;color:var(--accent);font-weight:900;margin-bottom:5px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.card{border:1px solid var(--line);background:linear-gradient(180deg,#15181b,#101214);border-radius:var(--r);padding:15px}.metric span{font-size:10px;color:var(--muted)}.metric strong{font-size:25px;display:block;margin-top:7px}
.todayGrid{display:grid;grid-template-columns:1.2fr .8fr;gap:12px;margin-top:12px}.sectionHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.sectionHead h2{font-size:13px;margin:0}.list{display:flex;flex-direction:column;gap:8px}.item{border:1px solid #272c31;background:#171a1d;border-radius:13px;padding:11px;display:flex;gap:9px;align-items:center}.item.actionable{cursor:pointer}.item .grow{flex:1;min-width:0}.item b{font-size:11px;display:block}.item small{color:var(--muted);font-size:9px}.empty{border:1px dashed #31363c;border-radius:14px;padding:22px;text-align:center;color:var(--muted);font-size:11px}
.quickActions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.quickAction{border:1px solid var(--line);background:#171a1d;color:#fff;border-radius:14px;text-align:start;padding:14px}.quickAction b{display:block;font-size:11px;margin-bottom:4px}.quickAction span{font-size:9px;color:var(--muted)}
.setupCard{border:1px solid #4a3e1d;background:linear-gradient(180deg,#2b2617,#19170f);border-radius:16px;padding:14px}.setupCard h3{margin:0 0 6px;font-size:12px}.setupCard p{margin:0;color:#d9c995;font-size:10px;line-height:1.6}.setupSteps{display:flex;flex-direction:column;gap:7px;margin-top:10px}.setupStep{display:flex;gap:8px;align-items:center;font-size:10px}.dot{width:8px;height:8px;border-radius:50%;background:var(--yellow)}.dot.ok{background:var(--green)}
.chatGrid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:12px;min-height:590px}.chatList,.chatPanel{border:1px solid var(--line);background:#111315;border-radius:18px;overflow:hidden}.chatList{padding:10px}.chatContact{padding:11px;border-radius:12px;margin-top:6px;cursor:pointer}.chatContact.active{background:#1e2226}.chatContact b{font-size:11px;display:block}.chatContact span{font-size:9px;color:var(--muted)}.chatPanel{display:flex;flex-direction:column}.chatHead{padding:12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}.chatHead .grow{flex:1}.messages{flex:1;overflow:auto;padding:15px;min-height:420px}.msgrow{display:flex;flex-direction:column;margin:9px 0}.msgrow.customer{align-items:flex-start}.msgrow.ai,.msgrow.human{align-items:flex-end}.bubble{max-width:82%;border:1px solid #2b3036;background:#1a1d21;border-radius:16px;padding:10px 11px}.ai .bubble,.human .bubble{background:#252c1d;border-color:#414d2a}.bubble .body{font-size:11px;line-height:1.65;white-space:pre-wrap}.bubble .original{margin-top:7px;padding-top:7px;border-top:1px solid #ffffff15;color:#9da3ab;font-size:9px}.meta{margin-top:5px;color:#858b93;font-size:8px;display:flex;gap:7px;align-items:center;justify-content:flex-end}.meta button{border:0;background:transparent;color:var(--blue);min-height:30px;font-size:9px}.compose{display:flex;gap:7px;border-top:1px solid var(--line);padding:10px}.compose input{flex:1;border:1px solid var(--line);background:#191c20;color:#fff;border-radius:13px;padding:10px}.send{width:48px;border:0;background:var(--accent);color:#111;border-radius:12px}
.table{border:1px solid var(--line);border-radius:16px;overflow:auto}.tr{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px;padding:12px;border-bottom:1px solid #24282d;min-width:550px;font-size:10px}.tr:last-child{border-bottom:0}.tr.head{background:#15181b;color:var(--muted)}
.moreGrid,.integrationGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.moreCard,.integration{border:1px solid var(--line);background:#15181b;border-radius:16px;padding:14px}.moreCard{cursor:pointer;text-align:start;color:#fff}.moreCard h3,.integration h3{font-size:12px;margin:0}.moreCard p,.integration p{font-size:10px;line-height:1.6;color:var(--muted);margin-bottom:0}.truth{margin-top:12px;border:1px solid #4c4022;background:#2b2516;border-radius:14px;padding:11px;font-size:9px;color:#f4d991}
.modal{display:none;position:fixed;inset:0;z-index:40;background:#000a;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.modalBox{width:min(480px,100%);background:#131518;border:1px solid #343940;border-radius:22px;padding:18px;box-shadow:var(--shadow)}.modalBox h3{margin:0 0 10px;font-size:15px}.modalActions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,15px);background:#f6f7f8;color:#111;padding:10px 13px;border-radius:11px;font-size:10px;font-weight:900;opacity:0;transition:.2s;z-index:60;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
.mobileMenu{display:none}.bottomNav{display:none}
@media(max-width:920px){.shell{grid-template-columns:1fr}.side{position:fixed;inset-block:0;inset-inline-start:0;width:260px;transform:translateX(-110%);transition:.2s;box-shadow:var(--shadow)}html[dir=rtl] .side{transform:translateX(110%)}.side.open{transform:translateX(0)!important}.mobileMenu{display:block;border:1px solid var(--line);background:#171a1d;color:#fff;border-radius:12px;width:44px;height:44px}.cards{grid-template-columns:repeat(2,1fr)}.todayGrid{grid-template-columns:1fr}.chatGrid{grid-template-columns:230px 1fr}}
@media(max-width:700px){button,input,select,a{min-height:48px}.top{padding:0 11px}.content{padding:16px 11px 98px}.hero{align-items:stretch}.hero h1{font-size:23px}.hero>.primary,.hero>.secondary{white-space:nowrap}.cards{grid-template-columns:repeat(2,1fr);gap:8px}.quickActions,.moreGrid,.integrationGrid{grid-template-columns:1fr}.chatGrid{display:block}.chatList{max-height:180px;overflow:auto;margin-bottom:10px}.bottomNav{position:fixed;display:grid;grid-template-columns:repeat(5,1fr);bottom:0;left:0;right:0;z-index:18;background:#0e1012f6;border-top:1px solid var(--line);padding:5px 5px calc(5px + env(safe-area-inset-bottom))}.bottomNav button{border:0;background:transparent;color:#9298a1;font-size:8px;border-radius:10px}.bottomNav button.active{color:var(--accent);background:#1a1e16}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="loading" class="loading">DABBIR</div>

<section id="authGate" class="authWrap hidden">
  <div class="authCard">
	    <div class="brand"><div class="logo"><img src="/dabbir-app-icon.png" alt="DABBIR"></div><div><b>DABBIR | دبّر</b><br><small id="authTag"></small></div></div>
	    <div class="preSignupValue"><b id="demoFirstTitle"></b><p id="demoFirstDesc"></p><a class="primary" id="demoFirstCta" href="/try"></a><span class="preSignupTruth" id="demoFirstTruth">التجربة لا ترسل رسائل لعملائك. ربط واتساب يحتاج موافقتك.</span></div>
	    <h1 id="authTitle"></h1><p id="authDesc"></p>
    <div class="authTabs" role="tablist"><button id="loginTab" class="on" type="button" role="tab" aria-selected="true"></button><button id="signupTab" type="button" role="tab" aria-selected="false"></button></div>
    <form id="authForm">
      <div class="field"><label id="emailLabel" for="authEmail"></label><input id="authEmail" type="email" dir="ltr" autocapitalize="none" spellcheck="false" autocomplete="email" required></div>
      <div class="field"><label id="passwordLabel" for="authPassword"></label><input id="authPassword" type="password" autocomplete="current-password" minlength="8" aria-describedby="authHint" required></div>
      <button class="primary wide" id="authSubmit" type="submit"></button>
    </form>
    <div class="authMsg" id="authMsg" role="status" aria-live="polite"></div>
    <p id="authHint" class="authHint"></p>
    <nav class="authLegal" aria-label="Legal links"><span id="authLegalPrefix"></span><a id="privacyLink" href="/privacy"></a><a id="termsLink" href="/terms"></a><a id="supportLink" href="/support"></a></nav>
    <div class="row space" style="margin-top:10px"><span class="muted">العربية / English</span><div class="lang"><button id="authAr" type="button">عربي</button><button id="authEn" type="button">EN</button></div></div>
  </div>
</section>

<section id="onboardingGate" class="authWrap hidden">
  <form class="authCard" id="businessForm">
    <div class="brand"><div class="logo"><img src="/dabbir-app-icon.png" alt="DABBIR"></div><div><b>DABBIR | دبّر</b><br><small id="setupTag"></small></div></div>
    <h1 id="setupTitle"></h1><p id="setupDesc"></p>
    <ol class="onboardingProgress" aria-label="Setup progress"><li class="done"><strong id="setupStepAccount"></strong><span id="setupStepAccountDesc"></span></li><li class="current" aria-current="step"><strong id="setupStepBusiness"></strong><span id="setupStepBusinessDesc"></span></li></ol>
    <div class="field"><label id="businessNameLabel" for="businessName"></label><input id="businessName" maxlength="120" required></div>
    <div class="field"><label id="businessTypeLabel" for="businessType"></label><select id="businessType"><option value="clinic"></option><option value="store"></option><option value="creator"></option><option value="salon"></option><option value="real_estate"></option><option value="services"></option><option value="car_wash"></option><option value="other"></option></select></div>
    <button class="primary wide" id="setupSubmit" type="submit"></button>
    <div class="authMsg" id="setupMsg" role="status" aria-live="polite"></div>
  </form>
</section>

<div id="appShell" class="shell hidden">
<aside class="side" id="side">
  <div class="brand"><div class="logo"><img src="/dabbir-app-icon.png" alt="DABBIR"></div><div><b>DABBIR</b><br><small id="brandTag"></small></div></div>
  <div class="workspace"><b id="workspaceName"></b><span id="workspaceState"></span></div>
  <nav class="nav" id="nav">
    <button class="navBtn active" data-screen="dashboard"><span class="navIcon">⌂</span><span data-label="dashboard"></span></button>
    <button class="navBtn" data-screen="conversations"><span class="navIcon">◉</span><span data-label="conversations"></span></button>
    <button class="navBtn" data-screen="appointments"><span class="navIcon">□</span><span data-label="appointments"></span></button>
    <button class="navBtn" data-screen="customers"><span class="navIcon">♙</span><span data-label="customers"></span></button>
    <button class="navBtn" data-screen="more"><span class="navIcon">•••</span><span data-label="more"></span></button>
  </nav>
  <div class="sideFoot"><a class="secondary" href="/team.html" style="display:block;text-align:center;text-decoration:none" id="teamLink"></a></div>
</aside>

<main class="main">
<header class="top">
  <div class="row"><button class="mobileMenu" id="menuBtn">☰</button><div><div class="pageTitle" id="pageTitle"></div><span class="statusChip" id="runtimeChip"></span></div></div>
  <div class="topActions"><div class="lang"><button id="arBtn">عربي</button><button id="enBtn">EN</button></div></div>
</header>

<div class="content">
<section class="screen active" id="screen-dashboard">
  <div class="hero"><div><div class="eyebrow" id="todayEyebrow"></div><h1 id="dashTitle"></h1><p id="dashDesc"></p></div></div>
  <div class="cards" id="dashCards"></div>
  <div class="todayGrid">
    <div class="card"><div class="sectionHead"><h2 id="attentionTitle"></h2><span class="badge yellow" id="attentionCount">0</span></div><div class="list" id="attentionList"></div></div>
    <div class="card"><div class="sectionHead"><h2 id="quickTitle"></h2></div><div class="quickActions"><button class="quickAction" id="quickChat"><b id="quickChatTitle"></b><span id="quickChatDesc"></span></button><button class="quickAction" id="quickAppt"><b id="quickApptTitle"></b><span id="quickApptDesc"></span></button></div></div>
  </div>
  <div class="setupCard" id="setupCard" style="margin-top:12px"><h3 id="setupProgressTitle"></h3><p id="setupProgressDesc"></p><div class="setupSteps" id="setupSteps"></div></div>
</section>

<section class="screen" id="screen-conversations">
  <div class="hero"><div><h1 id="convTitle"></h1><p id="convDesc"></p></div><button class="primary" id="newChatBtn"></button></div>
  <div class="chatGrid"><aside class="chatList" id="chatList"></aside><section class="chatPanel"><div class="chatHead"><div class="grow"><b id="chatName"></b><div class="muted" id="chatState"></div></div><button class="secondary" id="translateAll"></button></div><div class="messages" id="messages"></div><div class="compose"><input id="composer"><button class="send" id="sendBtn">↑</button></div></section></div>
  <div class="truth" id="webTruth"></div>
</section>

<section class="screen" id="screen-appointments"><div class="hero"><div><h1 id="apptTitle"></h1><p id="apptDesc"></p></div><button class="primary" id="newApptBtn"></button></div><div class="table" id="appointmentsTable"></div></section>
<section class="screen" id="screen-customers"><div class="hero"><div><h1 id="custTitle"></h1><p id="custDesc"></p></div></div><div class="table" id="customersTable"></div></section>

<section class="screen" id="screen-more">
  <div class="hero"><div><h1 id="moreTitle"></h1><p id="moreDesc"></p></div></div>
  <div class="moreGrid">
    <button class="moreCard" data-screen="tasks"><h3 id="moreTasksTitle"></h3><p id="moreTasksDesc"></p></button>
    <button class="moreCard" data-screen="analytics"><h3 id="moreAnalyticsTitle"></h3><p id="moreAnalyticsDesc"></p></button>
    <button class="moreCard" data-screen="integrations"><h3 id="moreIntegrationsTitle"></h3><p id="moreIntegrationsDesc"></p></button>
    <button class="moreCard" data-screen="automations"><h3 id="moreAutomationsTitle"></h3><p id="moreAutomationsDesc"></p></button>
    <button class="moreCard" data-screen="notifications"><h3 id="moreNoticesTitle"></h3><p id="moreNoticesDesc"></p></button>
    <button class="moreCard" data-screen="settings"><h3 id="moreSettingsTitle"></h3><p id="moreSettingsDesc"></p></button>
    <button class="moreCard" data-screen="help"><h3 id="moreHelpTitle"></h3><p id="moreHelpDesc"></p></button>
  </div>
</section>

<section class="screen" id="screen-tasks"><div class="hero"><div><h1 id="tasksTitle"></h1><p id="tasksDesc"></p></div><button class="secondary" id="followupBtn"></button></div><div class="todayGrid"><div class="card"><div class="sectionHead"><h2 id="handoffTitle"></h2></div><div class="list" id="handoffList"></div></div><div class="card"><div class="sectionHead"><h2 id="followupsTitle"></h2></div><div class="list" id="followupList"></div></div></div></section>
<section class="screen" id="screen-automations"><div class="hero"><div><h1 id="autoTitle"></h1><p id="autoDesc"></p></div></div><div class="card"><div class="list" id="automationList"></div></div></section>
<section class="screen" id="screen-analytics"><div class="hero"><div><h1 id="analyticsTitle"></h1><p id="analyticsDesc"></p></div></div><div class="cards" id="analyticsCards"></div></section>
<section class="screen" id="screen-integrations"><div class="hero"><div><h1 id="integrationTitle"></h1><p id="integrationDesc"></p></div></div><div class="integrationGrid" id="integrationGrid"></div><div class="truth" id="integrationTruth"></div></section>
<section class="screen" id="screen-notifications"><div class="hero"><div><h1 id="noticeTitle"></h1><p id="noticeDesc"></p></div></div><div class="card"><div class="list" id="noticeList"></div></div></section>
<section class="screen" id="screen-settings"><div class="hero"><div><h1 id="settingsTitle"></h1><p id="settingsDesc"></p></div></div><div class="card"><div class="list" id="settingsList"></div><button class="secondary wide" id="logoutBtn"></button></div></section>
<section class="screen" id="screen-help"><div class="hero"><div><h1 id="helpTitle"></h1><p id="helpDesc"></p></div></div><div class="integrationGrid"><div class="integration"><h3 id="helpRuntimeTitle"></h3><p id="helpRuntimeDesc"></p></div><div class="integration"><h3 id="helpWhatsTitle"></h3><p id="helpWhatsDesc"></p></div></div></section>
</div>
</main>
</div>

<nav class="bottomNav" id="bottomNav">

async function boot(){applyLang();const {r,j}=await api('/api/dabbir-runtime');if(r.status===401){workspace=null;showGate('auth');return}if(!r.ok||!j.ok){workspace=null;showGate('auth');$('#authMsg').textContent=j.error||T().invalid;return}if(j.needs_onboarding){workspace=j;showGate('onboarding');return}workspace=j;selectedConversationId=j.selected_conversation_id||null;showGate('app');renderAll()}
async function loadRuntime(businessId,conversationId){const q=new URLSearchParams();if(businessId)q.set('business_id',businessId);if(conversationId)q.set('conversation_id',conversationId);const {r,j}=await api('/api/dabbir-runtime?'+q.toString());if(r.status===401){workspace=null;showGate('auth');toast(T().authRequired);return}if(!r.ok||!j.ok){toast(j.error||T().invalid);return}workspace=j;selectedConversationId=j.selected_conversation_id||conversationId||null;showGate('app');renderAll()}
function showScreen(name){current=name;$$('.screen').forEach(s=>s.classList.toggle('active',s.id==='screen-'+name));$$('[data-screen]').forEach(b=>b.classList.toggle('active',b.dataset.screen===name));$('#pageTitle').textContent=T()[name]||name;$('#side').classList.remove('open')}
$$('[data-screen]').forEach(b=>b.onclick=()=>showScreen(b.dataset.screen));$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
function empty(text){return `<div class="empty">${esc(text)}</div>`}
function selectedConversation(){return (workspace?.conversations||[]).find(c=>c.id===selectedConversationId)||null}
function customerName(customerId){return (workspace?.customers||[]).find(c=>c.id===customerId)?.display_name||T().customer}
function renderDashboard(){const t=T(),convs=workspace.conversations||[],appts=workspace.appointments||[],customers=workspace.customers||[],handoffs=(workspace.handoffs||[]).filter(h=>!['RESOLVED','CLOSED'].includes(String(h.state).toUpperCase())),followups=(workspace.followups||[]).filter(f=>!['completed','cancelled','sent'].includes(String(f.status).toLowerCase()));
$('#dashCards').innerHTML=[[t.activeChats,convs.length],[t.todayAppointments,appts.length],[t.customersCount,customers.length],[t.needsAttention,handoffs.length+followups.length]].map(([a,b])=>`<div class="card metric"><span>${esc(a)}</span><strong>${b}</strong></div>`).join('');
const attention=[...handoffs.map(h=>({title:h.route_class||t.handoffs,sub:h.reason||h.state,badge:h.state})),...followups.map(f=>({title:t.followups,sub:f.reason||f.status,badge:f.status}))];$('#attentionCount').textContent=attention.length;$('#attentionList').innerHTML=attention.length?attention.slice(0,6).map(x=>`<div class="item actionable" data-screen="tasks"><div class="grow"><b>${esc(x.title)}</b><small>${esc(x.sub)}</small></div><span class="badge yellow">${esc(x.badge||'')}</span></div>`).join(''):empty(t.noAttention);$$('#attentionList [data-screen]').forEach(b=>b.onclick=()=>showScreen('tasks'));
const ai=workspace.ai||{},whatsOk=workspace.whatsapp?.state==='OPERATIONAL';$('#setupSteps').innerHTML=`<div class="setupStep"><span class="dot ok"></span><span>${esc(t.setupAccount)}</span></div><div class="setupStep"><span class="dot ${ai.configured?'ok':''}"></span><span>${esc(t.setupAI)} — ${esc(ai.configured?t.operational:t.notOperational)}</span></div><div class="setupStep"><span class="dot ${whatsOk?'ok':''}"></span><span>${esc(t.setupWhats)}${whatsOk?' — '+esc(t.operational):''}</span></div>`}
function openModal(id,focusId){const modal=$(id);if(!modal)return;modal._returnFocus=document.activeElement;modal.classList.add('open');setTimeout(()=>$(focusId)?.focus(),0)}function closeModal(modal){if(!modal)return;modal.classList.remove('open');modal._returnFocus?.focus?.()}
$('#quickChat').onclick=()=>openModal('#newChatModal','#newCustomerName');$('#quickAppt').onclick=()=>openModal('#appointmentModal','#apptCustomer');
function renderChats(){const t=T(),convs=workspace.conversations||[];$('#chatList').innerHTML=convs.length?convs.map(c=>`<div class="chatContact ${c.id===selectedConversationId?'active':''}" data-cid="${esc(c.id)}"><b>${esc(customerName(c.customer_id))}</b><span>${esc(c.state)}</span></div>`).join(''):empty(t.noChats);$$('[data-cid]').forEach(el=>el.onclick=()=>loadRuntime(workspace.business.id,el.dataset.cid));const c=selectedConversation();$('#chatName').textContent=c?customerName(c.customer_id):t.noChats;$('#chatState').textContent=c?c.state:'';renderMessages()}
function renderMessages(){const t=T(),msgs=workspace?.messages||[];$('#messages').innerHTML=msgs.length?msgs.map(m=>{const tr=translations.get(m.id),shown=tr||m.body;return `<div class="msgrow ${esc(m.sender_type)}"><div class="bubble"><div class="body">${esc(shown)}</div>${tr?`<div class="original">${esc(m.body)}</div>`:''}<div class="meta"><span>${esc(fmt(m.created_at))}</span><button data-mid="${esc(m.id)}">${esc(t.translate)}</button></div></div></div>`}).join(''):empty(t.noChats);$$('[data-mid]').forEach(b=>b.onclick=()=>translateMessages([b.dataset.mid]));const box=$('#messages');box.scrollTop=box.scrollHeight}
async function translateMessages(ids){if(!workspace?.business?.id)return;const messages=(workspace.messages||[]).filter(m=>ids.includes(m.id)).map(m=>({id:m.id,text:m.body}));if(!messages.length)return;const {r,j}=await api('/api/translate',{method:'POST',body:JSON.stringify({business_id:workspace.business.id,targetLanguage:lang,messages})});if(!r.ok||!j.ok){toast(j.error||T().invalid);return}(j.translations||[]).forEach(x=>translations.set(String(x.id),String(x.text)));renderMessages()}
$('#translateAll').onclick=async()=>{if(translationMode){translationMode=false;translations.clear();applyLang();return}translationMode=true;await translateMessages((workspace.messages||[]).map(m=>m.id));applyLang()};
async function sendMessage(){const input=$('#composer'),text=input.value.trim(),btn=$('#sendBtn');if(!text||!selectedConversationId||btn.disabled)return;btn.disabled=true;const {r,j}=await api('/api/dabbir-runtime',{method:'POST',body:JSON.stringify({action:'send_message',business_id:workspace.business.id,conversation_id:selectedConversationId,message:text})});btn.disabled=false;if(!r.ok||!j.ok){toast(j.error||T().sendFailed);await loadRuntime(workspace.business.id,selectedConversationId);return}input.value='';translations.clear();translationMode=false;await loadRuntime(workspace.business.id,selectedConversationId)}
$('#sendBtn').onclick=sendMessage;$('#composer').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
$('#newChatBtn').onclick=()=>openModal('#newChatModal','#newCustomerName');$('#newChatForm').onsubmit=async e=>{e.preventDefault();const btn=$('#createChatBtn'),idle=T().create;btn.disabled=true;btn.textContent=T().creating;try{const {r,j}=await api('/api/dabbir-runtime',{method:'POST',body:JSON.stringify({action:'start_conversation',business_id:workspace.business.id,display_name:$('#newCustomerName').value.trim()})});if(!r.ok||!j.ok){toast(j.error||T().invalid);return}window.__dabbirTrackUx?.('conversation_created');closeModal($('#newChatModal'));$('#newCustomerName').value='';await loadRuntime(workspace.business.id,j.conversation.id);showScreen('conversations')}finally{btn.disabled=false;btn.textContent=idle}};
function renderAppointments(){const t=T(),rows=workspace.appointments||[];$('#appointmentsTable').innerHTML=`<div class="tr head"><span>${esc(t.customer)}</span><span>${esc(t.time)}</span><span>${esc(t.status)}</span></div>`+(rows.length?rows.map(a=>`<div class="tr"><b>${esc(customerName(a.customer_id))}</b><span>${esc(fmt(a.starts_at))}</span><span>${esc(a.status)}</span></div>`).join(''):`<div class="empty">${esc(t.noAppointments)}</div>`)}
$('#newApptBtn').onclick=()=>openModal('#appointmentModal','#apptCustomer');$('#appointmentForm').onsubmit=async e=>{e.preventDefault();const btn=$('#saveApptBtn'),idle=T().save;btn.disabled=true;btn.textContent=T().savingWorking;try{const {r,j}=await api('/api/dabbir-runtime',{method:'POST',body:JSON.stringify({action:'create_appointment',business_id:workspace.business.id,customer_name:$('#apptCustomer').value.trim(),starts_at:new Date($('#apptTime').value).toISOString()})});if(!r.ok||!j.ok){toast(j.error||T().invalid);return}window.__dabbirTrackUx?.('appointment_created');closeModal($('#appointmentModal'));$('#appointmentForm').reset();toast(T().saved);await loadRuntime(workspace.business.id,selectedConversationId)}finally{btn.disabled=false;btn.textContent=idle}};
function renderCustomers(){const t=T(),rows=workspace.customers||[];$('#customersTable').innerHTML=`<div class="tr head"><span>${esc(t.customer)}</span><span>${esc(t.status)}</span><span>${esc(t.time)}</span></div>`+(rows.length?rows.map(c=>`<div class="tr"><b>${esc(c.display_name)}</b><span>${esc(c.lead_status)}</span><span>${esc(fmt(c.created_at))}</span></div>`).join(''):`<div class="empty">${esc(t.noCustomers)}</div>`)}
function renderTasks(){const t=T(),handoffs=workspace.handoffs||[],followups=workspace.followups||[];$('#handoffList').innerHTML=handoffs.length?handoffs.map(h=>`<div class="item"><div class="grow"><b>${esc(h.route_class)}</b><small>${esc(h.reason||h.summary||'')}</small></div><span class="badge yellow">${esc(h.state)}</span></div>`).join(''):empty(t.noHandoffs);$('#followupList').innerHTML=followups.length?followups.map(f=>`<div class="item"><div class="grow"><b>${esc(f.reason)}</b><small>${esc(f.due_at?fmt(f.due_at):f.status)}</small></div><span class="badge blue">${esc(f.status)}</span></div>`).join(''):empty(t.noFollowups);$('#automationList').innerHTML=$('#followupList').innerHTML}
$('#followupBtn').onclick=async()=>{if(!selectedConversationId){toast(T().noChats);return}const due=new Date(Date.now()+24*60*60*1000).toISOString();const {r,j}=await api('/api/dabbir-runtime',{method:'POST',body:JSON.stringify({action:'create_followup',business_id:workspace.business.id,conversation_id:selectedConversationId,reason:'customer_followup',due_at:due})});if(!r.ok||!j.ok){toast(j.error||T().invalid);return}toast(T().followupSaved);await loadRuntime(workspace.business.id,selectedConversationId);showScreen('tasks')};
function renderAnalytics(){const t=T(),msgs=workspace.messages||[];const data=[[t.activeChats,(workspace.conversations||[]).length],[t.aiMessages,msgs.filter(m=>m.sender_type==='ai').length],[t.customersCount,(workspace.customers||[]).length],[t.humanHandoffs,(workspace.handoffs||[]).length]];$('#analyticsCards').innerHTML=data.map(([a,b])=>`<div class="card metric"><span>${esc(a)}</span><strong>${b}</strong></div>`).join('')}
function renderIntegrations(){const t=T(),ai=workspace.ai||{};const cards=[[t.webChannel,t.webChannelDesc,t.operational,'green'],[t.aiIntegration,t.aiIntegrationDesc,ai.configured?t.operational:t.notOperational,ai.configured?'green':'red'],[t.whatsapp,t.whatsappDesc,t.notOperational,'red'],[t.instagram,t.instagramDesc,t.unverified,'yellow'],[t.teamIntegration,t.teamIntegrationDesc,t.operational,'green']];$('#integrationGrid').innerHTML=cards.map(([a,b,c,d])=>`<div class="integration"><div class="row space"><h3>${esc(a)}</h3><span class="badge ${d}">${esc(c)}</span></div><p>${esc(b)}</p></div>`).join('')}
function renderNotices(){const t=T(),items=[],now=Date.now(),day=now+86400000;(workspace.handoffs||[]).forEach(h=>items.push({a:h.route_class,b:h.reason||h.state,type:'handoffs'}));const upcoming=(workspace.appointments||[]).filter(a=>{const start=new Date(a.starts_at).getTime();return start>=now&&start<=day});if(upcoming.length)items.push({a:t.appointments,b:t.upcomingNotice+' '+upcoming.length,type:'appointments'});if(workspace.whatsapp?.state!=='OPERATIONAL')items.push({a:t.whatsapp,b:t.whatsappDesc,type:'channel_issues'});$('#noticeList').innerHTML=items.length?items.map(x=>`<div class="item" data-notice-type="${esc(x.type)}"><div class="grow"><b>${esc(x.a)}</b><small>${esc(x.b)}</small></div></div>`).join(''):empty(t.noNotices)}
function renderSettings(){const t=T();$('#settingsList').innerHTML=`<div class="item"><div class="grow"><b>${esc(t.business)}</b><small>${esc(workspace.business?.name||'')}</small></div></div><div class="item"><div class="grow"><b>${esc(t.role)}</b><small>${esc(workspace.membership?.role||'')}</small></div></div><div class="item"><div class="grow"><b>${esc(t.emailAddress)}</b><small>${esc(workspace.user?.email||'')}</small></div></div>`}
function renderAll(){if(!workspace?.business)return;$('#workspaceName').textContent=workspace.business.name;$('#workspaceState').textContent=T().operational;$('#pageTitle').textContent=T()[current]||T().dashboard;renderDashboard();renderChats();renderAppointments();renderCustomers();renderTasks();renderAnalytics();renderIntegrations();renderNotices();renderSettings()}
$('#logoutBtn').onclick=async()=>{const ok=window.__dabbirConfirm?await window.__dabbirConfirm({title:T().logoutConfirmTitle,body:T().logoutConfirmBody}):window.confirm(T().logoutConfirmTitle);if(!ok)return;await api('/api/auth/logout',{method:'POST',body:'{}'});workspace=null;showGate('auth')};$$('.modalClose').forEach(b=>b.onclick=()=>closeModal(b.closest('.modal')));$$('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeModal(m)}));document.addEventListener('keydown',e=>{if(e.key==='Escape')$$('.modal.open').forEach(closeModal)});
function externalVerified(){return false}
applyLang();boot();
</script>
</body>
</html>
