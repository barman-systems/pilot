<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0b">
<title>DABBIR | حالة الطلب</title>
<style>
:root{color-scheme:dark;--bg:#08090a;--panel:#121416;--line:#2b3036;--text:#f7f8f9;--muted:#939aa3;--accent:#d7ff5f}.wrap{min-height:100vh;display:grid;place-items:center;padding:22px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -15%,#22282e 0,#0d0f11 38%,var(--bg) 70%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}.card{width:min(520px,100%);border:1px solid var(--line);background:linear-gradient(180deg,#16191c,#101214);border-radius:24px;padding:22px}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#2e246b,#245fd6 55%,#38c8d9);font-weight:950}.brand small{color:var(--muted)}h1{font-size:23px;margin:24px 0 7px}.lead{color:var(--muted);font-size:11px;line-height:1.7;margin:0}.status{margin-top:18px;border:1px solid #40502e;background:#192117;border-radius:18px;padding:16px}.status span{display:block;color:#b8c1aa;font-size:9px}.status strong{display:block;color:var(--accent);font-size:22px;margin-top:5px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.meta div{border:1px solid var(--line);background:#111315;border-radius:14px;padding:11px}.meta span{display:block;color:var(--muted);font-size:8px}.meta b{display:block;font-size:11px;margin-top:5px}.foot{margin:15px 0 0;color:var(--muted);font-size:9px;line-height:1.65}.error{border-color:#563333;background:#231616}.error strong{color:#ffb2b2}.loading{color:var(--muted);padding:24px 0;text-align:center;font-size:11px}@media(max-width:520px){.card{padding:18px;border-radius:20px}.meta{grid-template-columns:1fr}h1{font-size:21px}}
</style>
</head>
<body>
<main class="wrap"><section class="card" aria-live="polite"><div class="brand"><div class="logo">D</div><div><b>DABBIR | دبّر</b><br><small id="brandSub">حالة الطلب</small></div></div><div id="content" class="loading">جاري التحقق من الحالة…</div></section></main>
<script>
(()=>{
  const q=new URLSearchParams(location.search);const token=String(q.get('token')||'').trim();
  const isAr=!String(navigator.language||'ar').toLowerCase().startsWith('en');document.documentElement.lang=isAr?'ar':'en';document.documentElement.dir=isAr?'rtl':'ltr';
  const copy=isAr?{sub:'حالة الطلب',loading:'جاري التحقق من الحالة…',title:'متابعة طلبك',desc:'هذه الصفحة تعرض حالة الطلب فقط، ولا تحتاج إلى تسجيل دخول.',status:'الحالة الآن',amount:'القيمة',updated:'آخر تحديث',created:'تاريخ الطلب',notFound:'تعذر العثور على الطلب',notFoundDesc:'تأكد أن الرابط كامل وصحيح، أو اطلب رابطًا جديدًا من النشاط.',privacy:'يعرض دبّر أقل قدر من المعلومات اللازمة لمتابعة الحالة.'}:{sub:'Order status',loading:'Checking status…',title:'Track your order',desc:'This page shows order status only. No sign-in is required.',status:'Current status',amount:'Amount',updated:'Last updated',created:'Created',notFound:'Order not found',notFoundDesc:'Check that the full link is correct, or ask the business for a new link.',privacy:'DABBIR shows only the minimum information needed to track status.'};
  const labels={new:["جديد","New"],confirmed:["مؤكد","Confirmed"],preparing:["قيد التجهيز","Preparing"],ready:["جاهز","Ready"],received:["تم الاستلام","Received"],washing:["قيد الغسيل","Washing"],inspection:["قيد الفحص","Inspection"],waiting_approval:["بانتظار الموافقة","Waiting for approval"],waiting_parts:["بانتظار قطع","Waiting for parts"],in_progress:["تحت العمل","In progress"],delivered:["تم التسليم","Delivered"],completed:["مكتمل","Complete"],cancelled:["ملغي","Cancelled"]};
  const el=document.querySelector('#content');document.querySelector('#brandSub').textContent=copy.sub;el.textContent=copy.loading;
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtDate=v=>{try{return new Intl.DateTimeFormat(isAr?'ar-AE':'en-AE',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Dubai'}).format(new Date(v))}catch{return '—'}};
  const fmtMoney=v=>{try{return new Intl.NumberFormat(isAr?'ar-AE':'en-AE',{minimumFractionDigits:0,maximumFractionDigits:2}).format(Number(v||0))+' '+(isAr?'د.إ':'AED')}catch{return '—'}};
  function fail(){el.className='status error';el.innerHTML='<span>'+esc(copy.title)+'</span><strong>'+esc(copy.notFound)+'</strong><p class="lead">'+esc(copy.notFoundDesc)+'</p>'}
  async function load(){
    if(!/^[0-9a-f-]{36}$/i.test(token))return fail();
    try{
      const response=await fetch('/api/public-order-status?token='+encodeURIComponent(token),{headers:{accept:'application/json'},cache:'no-store'});
      const payload=await response.json().catch(()=>null);const row=payload?.status;if(!response.ok||!payload?.ok||!row)return fail();
      const state=String(row.workflow_status||'new');const label=(labels[state]||[state,state])[isAr?0:1];
      el.className='';el.innerHTML='<h1>'+esc(row.business_name||copy.title)+'</h1><p class="lead">'+esc(copy.desc)+'</p><div class="status"><span>'+esc(copy.status)+'</span><strong>'+esc(label)+'</strong></div><div class="meta">'+(Number(row.total_aed||0)>0?'<div><span>'+esc(copy.amount)+'</span><b>'+esc(fmtMoney(row.total_aed))+'</b></div>':'')+'<div><span>'+esc(copy.updated)+'</span><b>'+esc(fmtDate(row.workflow_updated_at))+'</b></div><div><span>'+esc(copy.created)+'</span><b>'+esc(fmtDate(row.created_at))+'</b></div></div><p class="foot">'+esc(copy.privacy)+'</p>';
    }catch{return fail()}
  }
  load();
})();
</script>
</body>
</html>
