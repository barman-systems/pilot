AWSTemplateFormatVersion: '2010-09-09'
Description: DABBIR GitHub OIDC bootstrap for AWS UAE deployments

Parameters:
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ''
    Description: Existing GitHub Actions OIDC provider ARN. Leave empty only when this account does not already have token.actions.githubusercontent.com configured.

Conditions:
  CreateGitHubOidcProvider: !Equals [!Ref ExistingGitHubOidcProviderArn, '']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateGitHubOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: App
          Value: DABBIR
        - Key: Purpose
          Value: GitHubOIDC

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: DabbirGithubDeployRole
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateGitHubOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref OidcSubjectCondition
      Policies:
        - PolicyName: DabbirUaeCloudFormationDeployment
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStackResources
                Resource: '*'
              - Effect: Allow
                Action:
                  - ec2:*
                  - rds:*
                  - s3:*
                  - ecr:*
                  - ecs:*
                  - logs:*
                  - elasticloadbalancing:*
                  - application-autoscaling:*
                  - secretsmanager:*
                Resource: '*'
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PassRole
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/dabbir-*
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/Dabbir*

Outputs:
  GitHubOidcProviderArn:
    Value: !If
      - CreateGitHubOidcProvider
      - !Ref GitHubOidcProvider
      - !Ref ExistingGitHubOidcProviderArn
  GitHubDeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
  RequiredGitHubSecretName:
    Value: AWS_DABBIR_DEPLOY_ROLE_ARN
  RequiredGitHubSecretValue:
    Value: !GetAtt GitHubDeployRole.Arn

