<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PILOT Translation Preview</title><style>body{margin:0;background:#090a0b;color:#f7f7f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}.w{max-width:440px;margin:auto;padding:20px 14px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{font-weight:900}.switch button,.all{border:1px solid #30343a;background:#191b1f;color:#fff;border-radius:11px;padding:8px 10px;font-weight:800}.switch button.on{background:#30343a}.phone{background:#111315;border:1px solid #2b2f34;border-radius:26px;overflow:hidden;box-shadow:0 25px 70px #0008}header{padding:15px;border-bottom:1px solid #282c31}.h1{font-size:14px;font-weight:900}.sub{font-size:10px;color:#90969f;margin-top:3px}.all{width:100%;margin-top:12px}.all.active{background:#d7ff5f;color:#10120d}.chat{padding:16px 12px;min-height:440px}.row{display:flex;flex-direction:column;margin:10px 0}.row.in{align-items:flex-start}.row.out{align-items:flex-end}.b{max-width:85%;background:#1a1d21;border:1px solid #2b3036;padding:10px;border-radius:16px}.out .b{background:#252c1d;border-color:#414d2a}.txt{font-size:13px;line-height:1.5}.orig{display:none;border-top:1px solid #ffffff18;margin-top:7px;padding-top:7px;color:#a5abb3;font-size:10px}.b.t .orig{display:block}.foot{margin-top:6px;text-align:end;font-size:9px;color:#858b93}.one{border:0;background:transparent;color:#8ec5ff;font-weight:800}.note{text-align:center;color:#7f858d;font-size:9px;margin-top:12px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#f5f6f7;color:#111;padding:9px 12px;border-radius:10px;font-size:10px;font-weight:900;display:none}</style></head><body><div class="w"><div class="top"><div class="brand">PILOT</div><div class="switch"><button id="ar" class="on">عربي</button><button id="en">EN</button></div></div><section class="phone"><header><div class="h1" id="title">ترجمة المحادثة</div><div class="sub" id="sub">معاينة تجريبية — النص الأصلي محفوظ</div><button class="all" id="all">文 ترجمة المحادثة للعربية</button></header><main class="chat" id="chat"></main></section><div class="note" id="note">بيانات تجريبية فقط — لا يتم حفظ الرسائل.</div></div><div class="toast" id="toast"></div><script>const data=[{id:'1',side:'in',text:'Hello, I would like to book an appointment tomorrow after 4 PM.',fb:{ar:'مرحبًا، أود حجز موعد غدًا بعد الساعة 4 مساءً.',en:'Hello, I would like to book an appointment tomorrow after 4 PM.'}},{id:'2',side:'out',text:'أكيد. عندنا موعد متاح الساعة 5:30 مساءً. هل يناسبك؟',fb:{ar:'أكيد. عندنا موعد متاح الساعة 5:30 مساءً. هل يناسبك؟',en:'Absolutely. We have an available slot at 5:30 PM. Does that work for you?'}},{id:'3',side:'in',text:'Yes, 5:30 works. Can you send me the location too?',fb:{ar:'نعم، الساعة 5:30 مناسبة. هل يمكنك إرسال الموقع أيضًا؟',en:'Yes, 5:30 works. Can you send me the location too?'}}];let lang='ar',allOn=false;const $=s=>document.querySelector(s);function show(a,e){const t=$('#toast');t.textContent=lang==='ar'?a:e;t.style.display='block';setTimeout(()=>t.style.display='none',1500)}function render(){const c=$('#chat');c.innerHTML='';data.forEach(m=>{const r=document.createElement('div');r.className='row '+m.side;r.dataset.id=m.id;r.innerHTML='<div class="b"><div class="txt"></div><div class="orig"></div><div class="foot"><button class="one">'+(lang==='ar'?'ترجمة':'Translate')+'</button></div></div>';r.querySelector('.txt').textContent=m.text;c.appendChild(r)});document.querySelectorAll('.one').forEach(b=>b.onclick=()=>one(b.closest('.row').dataset.id))}async function request(items,target){try{const r=await fetch('/api/translate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({targetLanguage:target,messages:items.map(m=>({id:m.id,text:m.original||m.text}))})});const j=await r.json();if(!r.ok||!j.ok)throw 0;return j.translations}catch(e){show('خدمة الذكاء غير متاحة الآن؛ استخدمت ترجمة المعاينة','AI service unavailable; preview translation used');return items.map(m=>({id:m.id,text:m.fb[target]}))}}function apply(m,text){const r=document.querySelector('[data-id="'+m.id+'"]'),b=r.querySelector('.b');if(!m.original)m.original=m.text;m.text=text;r.querySelector('.txt').textContent=text;r.querySelector('.orig').textContent=(lang==='ar'?'الأصل: ':'Original: ')+m.original;b.classList.add('t')}function restore(m){if(!m.original)return;const r=document.querySelector('[data-id="'+m.id+'"]');m.text=m.original;r.querySelector('.txt').textContent=m.original;r.querySelector('.orig').textContent='';r.querySelector('.b').classList.remove('t')}async function one(id){const m=data.find(x=>x.id===id),r=document.querySelector('[data-id="'+id+'"]');if(r.querySelector('.b').classList.contains('t')){restore(m);return}const out=await request([m],lang);apply(m,out[0].text)}$('#all').onclick=async()=>{if(allOn){data.forEach(restore);allOn=false;ui();return}const out=await request(data,lang),map=new Map(out.map(x=>[x.id,x.text]));data.forEach(m=>apply(m,map.get(m.id)||m.text));allOn=true;ui();show('تمت ترجمة المحادثة','Conversation translated')};function set(l){lang=l;document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';$('#ar').classList.toggle('on',l==='ar');$('#en').classList.toggle('on',l==='en');data.forEach(restore);allOn=false;render();ui()}function ui(){const a=lang==='ar';$('#title').textContent=a?'ترجمة المحادثة':'Conversation translation';$('#sub').textContent=a?'معاينة تجريبية — النص الأصلي محفوظ':'Synthetic preview — original text preserved';$('#note').textContent=a?'بيانات تجريبية فقط — لا يتم حفظ الرسائل.':'Synthetic data only — messages are not persisted.';$('#all').textContent=allOn?(a?'إظهار النص الأصلي':'Show original text'):(a?'文 ترجمة المحادثة للعربية':'文 Translate conversation to English');$('#all').classList.toggle('active',allOn)}$('#ar').onclick=()=>set('ar');$('#en').onclick=()=>set('en');render();ui();</script></body></html>
